<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard.com</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-area {
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 46px;
            letter-spacing: 5px;
            text-shadow:
                0 0 8px #00ff66,
                0 0 20px #00ff66,
                0 0 40px #00e5ff;
        }

        #score-container {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-bottom: 15px;
            font-size: 19px;
            font-weight: bold;
        }

        #game-wrapper {
            border: 3px solid #00ff66;
            padding: 8px;
            background: #050505;
            box-shadow:
                0 0 10px #00ff66,
                0 0 30px rgba(0,255,102,0.25);
        }

        canvas {
            display: block;
            background: #000;
        }

        #controls {
            margin-top: 12px;
            color: #777;
            font-size: 14px;
        }

        #panic-button,
        #home-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }

        #panic-button {
            background: #050505;
            color: #00ff66;
            border: 2px solid #00ff66;
            box-shadow: 0 0 10px rgba(0,255,102,0.3);
        }

        #panic-button:hover {
            background: #00ff66;
            color: #000;
        }

        #home-button {
            background: #050505;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 10px rgba(0,229,255,0.3);
            margin-left: 8px;
        }

        #home-button:hover {
            background: #00e5ff;
            color: #000;
        }

        #game-over {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        #game-over h2 {
            margin: 0 0 20px;
            font-size: 58px;
            color: #ff1744;
            text-shadow:
                0 0 10px #ff1744,
                0 0 30px #ff1744;
        }

        #game-over p {
            font-size: 22px;
            margin: 7px;
        }

        #retry-button {
            margin-top: 25px;
            padding: 13px 35px;
            font-size: 20px;
            font-weight: bold;
            background: #050505;
            color: white;
            border: 2px solid #00ff66;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0,255,102,0.4);
        }

        #retry-button:hover {
            background: #00ff66;
            color: black;
        }
    </style>
</head>

<body>

    <div id="game-area">

        <h1>Flashcard.com</h1>

        <div id="score-container">
            <div>Score: <span id="score">0</span></div>
            <div>High Score: <span id="high-score">0</span></div>
        </div>

        <div id="game-wrapper">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <div id="controls">
            Arrow Keys or WASD to move
        </div>

        <a href="flashcards.html" id="panic-button">
            PANIC
        </a>

        <a href="index.html" id="home-button">
            HOME
        </a>

    </div>

    <div id="game-over">

        <h2>GAME OVER</h2>

        <p>
            Score:
            <span id="final-score">0</span>
        </p>

        <p>
            High Score:
            <span id="final-high">0</span>
        </p>

        <button id="retry-button">
            RETRY
        </button>

    </div>

    <script>
        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");

        const scoreElement =
            document.getElementById("score");

        const highScoreElement =
            document.getElementById("high-score");

        const gameOverScreen =
            document.getElementById("game-over");

        const finalScore =
            document.getElementById("final-score");

        const finalHigh =
            document.getElementById("final-high");

        const retryButton =
            document.getElementById("retry-button");

        const gridSize = 20;

        const tileCount =
            canvas.width / gridSize;

        const maxObstacles = 6;
        const maxPortals = 4;

        let snake;
        let fruits;
        let obstacles;
        let portals;

        let dx;
        let dy;

        let score;
        let highScore =
            Number(
                localStorage.getItem(
                    "snakeHighScore"
                )
            ) || 0;

        let gameInterval;
        let rPresses = 0;
        let rTimer;

        highScoreElement.innerText =
            highScore;

        function startGame() {

            clearInterval(gameInterval);

            gameInterval =
                setInterval(
                    update,
                    Math.max(
                        65,
                        140 - score * 3
                    )
                );
        }

        function resetGame() {

            snake = [
                { x: 15, y: 15 },
                { x: 14, y: 15 },
                { x: 13, y: 15 }
            ];

            fruits = [];
            obstacles = [];
            portals = [];

            dx = 1;
            dy = 0;

            score = 0;

            scoreElement.innerText =
                score;

            gameOverScreen.style.display =
                "none";

            generatePortals();

            populateFruits();

            generateObstacles();

            draw();

            startGame();
        }

        function update() {

            moveSnake();

            if (
                checkObstacleCollision()
            ) {
                endGame();
                return;
            }

            checkPortalCollision();

            checkFoodCollision();

            draw();
        }

        function moveSnake() {

            let nextX =
                snake[0].x + dx;

            let nextY =
                snake[0].y + dy;

            if (nextX < 0) {
                nextX =
                    tileCount - 1;
            }

            if (nextX >= tileCount) {
                nextX = 0;
            }

            if (nextY < 0) {
                nextY =
                    tileCount - 1;
            }

            if (nextY >= tileCount) {
                nextY = 0;
            }

            snake.unshift({
                x: nextX,
                y: nextY
            });

            snake.pop();
        }

        function draw() {

            ctx.fillStyle = "#000";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawGrid();

            obstacles.forEach(obs => {

                ctx.fillStyle =
                    "#777";

                ctx.shadowColor =
                    "#777";

                ctx.shadowBlur = 12;

                ctx.fillRect(
                    obs.x * gridSize,
                    obs.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            ctx.shadowBlur = 0;

            portals.forEach(portal => {

                ctx.fillStyle =
                    "#050505";

                ctx.fillRect(
                    portal.x * gridSize,
                    portal.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );

                ctx.strokeStyle =
                    "#00e5ff";

                ctx.lineWidth = 3;

                ctx.shadowColor =
                    "#00e5ff";

                ctx.shadowBlur = 15;

                ctx.strokeRect(
                    portal.x * gridSize + 2,
                    portal.y * gridSize + 2,
                    gridSize - 6,
                    gridSize - 6
                );
            });

            ctx.shadowBlur = 0;

            fruits.forEach(fruit => {

                ctx.fillStyle =
                    "#ff1744";

                ctx.shadowColor =
                    "#ff1744";

                ctx.shadowBlur = 15;

                ctx.beginPath();

                ctx.arc(
                    fruit.x * gridSize + 9,
                    fruit.y * gridSize + 9,
                    7,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            });

            ctx.shadowBlur = 0;

            snake.forEach(
                (part, index) => {

                    if (index === 0) {
                        ctx.fillStyle =
                            "#00ff66";

                        ctx.shadowColor =
                            "#00ff66";

                        ctx.shadowBlur = 15;
                    } else {
                        ctx.fillStyle =
                            "#00b84f";

                        ctx.shadowColor =
                            "#00ff66";

                        ctx.shadowBlur = 8;
                    }

                    ctx.fillRect(
                        part.x * gridSize,
                        part.y * gridSize,
                        gridSize - 2,
                        gridSize - 2
                    );
                }
            );

            ctx.shadowBlur = 0;
        }

        function drawGrid() {

            ctx.strokeStyle =
                "rgba(0,229,255,0.05)";

            ctx.lineWidth = 1;

            for (
                let x = 0;
                x <= canvas.width;
                x += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(x, 0);
                ctx.lineTo(
                    x,
                    canvas.height
                );

                ctx.stroke();
            }

            for (
                let y = 0;
                y <= canvas.height;
                y += gridSize
            ) {

                ctx.beginPath();

                ctx.moveTo(0, y);
                ctx.lineTo(
                    canvas.width,
                    y
                );

                ctx.stroke();
            }
        }

        function checkObstacleCollision() {

            const head =
                snake[0];

            return obstacles.some(
                obstacle =>
                    obstacle.x === head.x &&
                    obstacle.y === head.y
            );
        }

        function checkPortalCollision() {

            const head =
                snake[0];

            const portalIndex =
                portals.findIndex(
                    portal =>
                        portal.x === head.x &&
                        portal.y === head.y
                );

            if (
                portalIndex === -1 ||
                portals.length < 2
            ) {
                return;
            }

            let destinationIndex;

            do {
                destinationIndex =
                    Math.floor(
                        Math.random() *
                        portals.length
                    );
            } while (
                destinationIndex ===
                portalIndex
            );

            const destination =
                portals[destinationIndex];

            snake[0] = {
                x: destination.x,
                y: destination.y
            };

            if (snake.length > 1) {
                snake[1] = {
                    x: destination.x - dx,
                    y: destination.y - dy
                };
            }
        }

        function checkFoodCollision() {

            const head =
                snake[0];

            for (
                let i = 0;
                i < fruits.length;
                i++
            ) {

                if (
                    head.x === fruits[i].x &&
                    head.y === fruits[i].y
                ) {

                    score++;

                    scoreElement.innerText =
                        score;

                    if (
                        score > highScore
                    ) {

                        highScore =
                            score;

                        highScoreElement.innerText =
                            highScore;

                        localStorage.setItem(
                            "snakeHighScore",
                            highScore
                        );
                    }

                    snake.push({
                        x:
                            snake[
                                snake.length - 1
                            ].x,

                        y:
                            snake[
                                snake.length - 1
                            ].y
                    });

                    fruits.splice(i, 1);

                    generateSingleFruit();

                    movePortals();

                    generateObstacles();

                    clearInterval(
                        gameInterval
                    );

                    startGame();

                    break;
                }
            }
        }

        function generateSingleFruit() {

            let fruit;
            let invalid = true;

            while (invalid) {

                fruit = {
                    x:
                        Math.floor(
                            Math.random() *
                            tileCount
                        ),

                    y:
                        Math.floor(
                            Math.random() *
                            tileCount
                        )
                };

                invalid =
                    snake.some(
                        part =>
                            part.x === fruit.x &&
                            part.y === fruit.y
                    ) ||

                    obstacles.some(
                        obstacle =>
                            obstacle.x === fruit.x &&
                            obstacle.y === fruit.y
                    ) ||

                    portals.some(
                        portal =>
                            portal.x === fruit.x &&
                            portal.y === fruit.y
                    );
            }

            fruits.push(fruit);
        }

        function populateFruits() {

            fruits = [];

            generateSingleFruit();
            generateSingleFruit();
            generateSingleFruit();
        }

        function generateObstacles() {

            obstacles = [];

            const amount =
                Math.min(
                    maxObstacles +
                    Math.floor(score / 3),
                    14
                );

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                let obstacle;
                let invalid = true;

                while (invalid) {

                    obstacle = {
                        x:
                            Math.floor(
                                Math.random() *
                                tileCount
                            ),

                        y:
                            Math.floor(
                                Math.random() *
                                tileCount
                            )
                    };

                    invalid =
                        snake.some(
                            part =>
                                Math.abs(
                                    part.x -
                                    obstacle.x
                                ) <= 2 &&
                                Math.abs(
                                    part.y -
                                    obstacle.y
                                ) <= 2
                        ) ||

                        fruits.some(
                            fruit =>
                                fruit.x ===
                                    obstacle.x &&
                                fruit.y ===
                                    obstacle.y
                        ) ||

                        portals.some(
                            portal =>
                                portal.x ===
                                    obstacle.x &&
                                portal.y ===
                                    obstacle.y
                        ) ||

                        obstacles.some(
                            existing =>
                                existing.x ===
                                    obstacle.x &&
                                existing.y ===
                                    obstacle.y
                        );
                }

                obstacles.push(obstacle);
            }
        }

        function generatePortals() {

            portals = [];

            for (
                let i = 0;
                i < maxPortals;
                i++
            ) {

                let portal;
                let invalid = true;

                while (invalid) {

                    portal = {
                        x:
                            Math.floor(
                                Math.random() *
                                (tileCount - 6)
                            ) + 3,

                        y:
                            Math.floor(
                                Math.random() *
                                (tileCount - 6)
                            ) + 3
                    };

                    invalid =
                        snake.some(
                            part =>
                                part.x ===
                                    portal.x &&
                                part.y ===
                                    portal.y
                        ) ||

                        portals.some(
                            existing =>
                                existing.x ===
                                    portal.x &&
                                existing.y ===
                                    portal.y
                        );
                }

                portals.push(portal);
            }
        }

        function movePortals() {

            const oldPortals =
                [...portals];

            portals = [];

            for (
                let i = 0;
                i < maxPortals;
                i++
            ) {

                let portal;
                let invalid = true;

                while (invalid) {

                    portal = {
                        x:
                            Math.floor(
                                Math.random() *
                                (tileCount - 6)
                            ) + 3,

                        y:
                            Math.floor(
                                Math.random() *
                                (tileCount - 6)
                            ) + 3
                    };

                    invalid =
                        snake.some(
                            part =>
                                part.x ===
                                    portal.x &&
                                part.y ===
                                    portal.y
                        ) ||

                        fruits.some(
                            fruit =>
                                fruit.x ===
                                    portal.x &&
                                fruit.y ===
                                    portal.y
                        ) ||

                        obstacles.some(
                            obstacle =>
                                obstacle.x ===
                                    portal.x &&
                                obstacle.y ===
                                    portal.y
                        ) ||

                        portals.some(
                            existing =>
                                existing.x ===
                                    portal.x &&
                                existing.y ===
                                    portal.y
                        );
                }

                portals.push(portal);
            }

            if (oldPortals.length === 0) {
                generatePortals();
            }
        }

        function endGame() {

            clearInterval(
                gameInterval
            );

            finalScore.innerText =
                score;

            finalHigh.innerText =
                highScore;

            gameOverScreen.style.display =
                "flex";
        }

        retryButton.addEventListener(
            "click",
            resetGame
        );

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowUp" ||
                    event.key.toLowerCase() === "w"
                ) {

                    if (dy === 0) {
                        dx = 0;
                        dy = -1;
                    }
                }

                if (
                    event.key === "ArrowDown" ||
                    event.key.toLowerCase() === "s"
                ) {

                    if (dy === 0) {
                        dx = 0;
                        dy = 1;
                    }
                }

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    if (dx === 0) {
                        dx = -1;
                        dy = 0;
                    }
                }

                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    if (dx === 0) {
                        dx = 1;
                        dy = 0;
                    }
                }
            }
        );

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key.toLowerCase() !== "r"
                ) {
                    return;
                }

                rPresses++;

                clearTimeout(rTimer);

                rTimer =
                    setTimeout(
                        () => {
                            rPresses = 0;
                        },
                        700
                    );

                if (rPresses === 3) {

                    window.location.href =
                        "flashcards.html";

                    rPresses = 0;
                }
            }
        );

        resetGame();
    </script>

</body>
</html>
