<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard.com</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* TOP */

#top {
    width: min(90vw, 700px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

#title {
    font-size: 24px;
    font-weight: bold;
}

#score {
    font-size: 18px;
}

/* CANVAS */

#canvas {
    background: #111;
    border: 3px solid #fff;
    width: min(90vw, 700px);
    height: min(70vh, 700px);
    image-rendering: pixelated;
}

/* BUTTONS */

#controls {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

button {
    background: #fff;
    color: #000;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ccc;
}

/* OVERLAY */

#overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.7);
    z-index: 10;
}

#panel {
    width: min(85vw, 380px);
    background: #111;
    border: 3px solid #fff;
    padding: 30px;
    text-align: center;
}

#panel h1 {
    margin-top: 0;
    font-size: 28px;
}

#panel p {
    color: #aaa;
    line-height: 1.7;
}

.hidden {
    display: none !important;
}

/* TOUCH */

#touch {
    display: none;
    margin-top: 15px;
    text-align: center;
}

.touch-row {
    display: flex;
    justify-content: center;
}

.touch-button {
    width: 55px;
    height: 45px;
    margin: 3px;
    padding: 0;
    font-size: 20px;
}

@media (max-width: 700px) {

    #touch {
        display: block;
    }

    #canvas {
        width: 92vw;
        height: 65vh;
    }

    #top {
        width: 92vw;
    }

}

</style>

</head>

<body>

<div id="game">

```
<div id="top">

    <div id="title">
        SNAKE
    </div>

    <div id="score">
        Score: 0 | Best: 0
    </div>

</div>


<canvas id="canvas"
        width="500"
        height="500">
</canvas>


<div id="controls">

    <button onclick="togglePause()">
        PAUSE
    </button>

</div>


<!-- TOUCH CONTROLS -->

<div id="touch">

    <div class="touch-row">

        <button
            class="touch-button"
            onclick="changeDirection('up')">
            ▲
        </button>

    </div>

    <div class="touch-row">

        <button
            class="touch-button"
            onclick="changeDirection('left')">
            ◀
        </button>

        <button
            class="touch-button"
            onclick="changeDirection('down')">
            ▼
        </button>

        <button
            class="touch-button"
            onclick="changeDirection('right')">
            ▶
        </button>

    </div>

</div>
```

</div>

<!-- START / RETRY -->

<div id="overlay">

```
<div id="panel">

    <h1 id="overlayTitle">
        SNAKE
    </h1>

    <p id="overlayText">
        Use the arrow keys or WASD<br>
        to move the snake.
    </p>

    <button onclick="startGame()">
        START
    </button>

</div>
```

</div>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const overlay =
    document.getElementById("overlay");

const overlayTitle =
    document.getElementById("overlayTitle");

const overlayText =
    document.getElementById("overlayText");

const scoreDisplay =
    document.getElementById("score");


/* GRID */

const gridSize = 25;

const tileSize =
    canvas.width / gridSize;


/* SNAKE */

let snake = [];

let food = {
    x: 10,
    y: 10
};


/* DIRECTION */

let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};


/* GAME */

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "snakeHighScore"
        )
    ) || 0;

let running = false;

let paused = false;

let gameTimer;


/* UPDATE SCORE */

function updateScore() {

    scoreDisplay.textContent =
        "Score: " +
        score +
        " | Best: " +
        highScore;

}


/* START GAME */

function startGame() {

    snake = [

        {
            x: 12,
            y: 12
        },

        {
            x: 11,
            y: 12
        },

        {
            x: 10,
            y: 12
        }

    ];


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    paused = false;

    running = true;


    createFood();

    updateScore();


    overlay.classList.add(
        "hidden"
    );


    clearInterval(gameTimer);


    gameTimer =
        setInterval(
            gameLoop,
            100
        );


    draw();

}


/* FOOD */

function createFood() {

    let valid = false;


    while (!valid) {

        food = {

            x: Math.floor(
                Math.random() *
                gridSize
            ),

            y: Math.floor(
                Math.random() *
                gridSize
            )

        };


        valid = true;


        for (
            const segment of snake
        ) {

            if (
                segment.x === food.x &&
                segment.y === food.y
            ) {

                valid = false;

                break;

            }

        }

    }

}


/* GAME LOOP */

function gameLoop() {

    if (!running || paused) {
        return;
    }


    direction =
        nextDirection;


    const head = {

        x: snake[0].x +
           direction.x,

        y: snake[0].y +
           direction.y

    };


    /* WALL */

    if (
        head.x < 0 ||
        head.x >= gridSize ||
        head.y < 0 ||
        head.y >= gridSize
    ) {

        endGame();

        return;

    }


    /* SELF */

    for (
        const segment of snake
    ) {

        if (
            head.x === segment.x &&
            head.y === segment.y
        ) {

            endGame();

            return;

        }

    }


    snake.unshift(head);


    /* FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        if (score > highScore) {

            highScore = score;

            localStorage.setItem(
                "snakeHighScore",
                highScore
            );

        }


        createFood();

        updateScore();

    } else {

        snake.pop();

    }


    draw();

}


/* DRAW */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* BACKGROUND */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle = "#1d1d1d";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= gridSize;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * tileSize,
            0
        );

        ctx.lineTo(
            i * tileSize,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * tileSize
        );

        ctx.lineTo(
            canvas.width,
            i * tileSize
        );

        ctx.stroke();

    }


    /* FOOD */

    ctx.fillStyle = "#fff";

    ctx.fillRect(

        food.x * tileSize + 4,

        food.y * tileSize + 4,

        tileSize - 8,

        tileSize - 8

    );


    /* SNAKE */

    snake.forEach(
        (segment, index) => {

            ctx.fillStyle =
                index === 0
                    ? "#fff"
                    : "#bbb";


            ctx.fillRect(

                segment.x *
                tileSize + 2,

                segment.y *
                tileSize + 2,

                tileSize - 4,

                tileSize - 4

            );

        }
    );

}


/* CHANGE DIRECTION */

function changeDirection(dir) {

    if (!running) {
        return;
    }


    if (
        dir === "up" &&
        direction.y !== 1
    ) {

        nextDirection = {
            x: 0,
            y: -1
        };

    }


    if (
        dir === "down" &&
        direction.y !== -1
    ) {

        nextDirection = {
            x: 0,
            y: 1
        };

    }


    if (
        dir === "left" &&
        direction.x !== 1
    ) {

        nextDirection = {
            x: -1,
            y: 0
        };

    }


    if (
        dir === "right" &&
        direction.x !== -1
    ) {

        nextDirection = {
            x: 1,
            y: 0
        };

    }

}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();


        if (
            key === "arrowup" ||
            key === "w"
        ) {

            event.preventDefault();

            changeDirection("up");

        }


        if (
            key === "arrowdown" ||
            key === "s"
        ) {

            event.preventDefault();

            changeDirection("down");

        }


        if (
            key === "arrowleft" ||
            key === "a"
        ) {

            event.preventDefault();

            changeDirection("left");

        }


        if (
            key === "arrowright" ||
            key === "d"
        ) {

            event.preventDefault();

            changeDirection("right");

        }


        if (
            key === "p"
        ) {

            togglePause();

        }

    }
);


/* PAUSE */

function togglePause() {

    if (!running) {
        return;
    }


    paused = !paused;


    if (paused) {

        overlayTitle.textContent =
            "PAUSED";

        overlayText.innerHTML =
            "Press P or click below<br>to continue.";

        document.querySelector(
            "#panel button"
        ).textContent =
            "CONTINUE";

        document.querySelector(
            "#panel button"
        ).onclick =
            togglePause;

        overlay.classList.remove(
            "hidden"
        );

    } else {

        overlay.classList.add(
            "hidden"
        );

        document.querySelector(
            "#panel button"
        ).textContent =
            "START";

        document.querySelector(
            "#panel button"
        ).onclick =
            startGame;

    }

}


/* END GAME */

function endGame() {

    running = false;

    clearInterval(gameTimer);


    if (score > highScore) {

        highScore = score;

        localStorage.setItem(
            "snakeHighScore",
            highScore
        );

    }


    updateScore();


    overlayTitle.textContent =
        "RETRY";


    overlayText.innerHTML =

        "Score: <strong>" +
        score +
        "</strong><br><br>" +

        "Best: <strong>" +
        highScore +
        "</strong>";


    const button =
        document.querySelector(
            "#panel button"
        );


    button.textContent =
        "RETRY";


    button.onclick =
        startGame;


    overlay.classList.remove(
        "hidden"
    );

}


/* RRR SECRET SHORTCUT */

let rPresses = 0;

let rTimer;


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() !==
            "r"
        ) {

            return;

        }


        rPresses++;


        clearTimeout(
            rTimer
        );


        rTimer =
            setTimeout(
                function() {

                    rPresses = 0;

                },
                700
            );


        if (
            rPresses === 3
        ) {

            window.location.href =
                "flashcards.html";

            rPresses = 0;

        }

    }
);


/* INITIAL DRAW */

updateScore();

draw();

</script>

</body>
</html>
