<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard.com</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

#game {
    text-align: center;
}

#top {
    width: 500px;
    max-width: 94vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

#title {
    font-size: 28px;
    font-weight: bold;
    color: #39ff14;
    text-shadow: 0 0 10px #39ff14;
}

#score {
    font-size: 15px;

}

#canvas {
    width: 500px;
    height: 500px;
    max-width: 94vw;
    max-height: 94vw;
    background: #000;
    border: 2px solid #333;
    box-shadow: 0 0 18px rgba(0,255,80,.18);
    image-rendering: pixelated;
}

#controls {
    margin-top: 12px;
}

button {
    background: #111;

    border: 2px solid #555;
    padding: 10px 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #222;
    border-color: white;
}

#touch {
    display: none;
    margin-top: 12px;
}

.touch-row {

}

    margin: 3px;
    padding: 0;
    font-size: 20px;
}

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.88);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
}

#panel {
    background: #080808;
    border: 2px solid #39ff14;
    box-shadow: 0 0 25px rgba(57,255,20,.25);
    padding: 35px;
    width: min(90vw, 420px);
    text-align: center;
}

#panel h1 {
    color: #39ff14;

}

#panel p {
    color: #aaa;

.hidden {
    display: none !important;

#homeButton {

@media (max-width: 650px) {

</head>

<body>

<div id="game">

    <div id="top">
        <div id="title">SNAKE</div>
        <div id="score">Score: 0 | Best: 0</div>
    </div>

    <canvas id="canvas" width="500" height="500"></canvas>

    <div id="controls">
        <button onclick="togglePause()">PAUSE</button>
    </div>

    <div id="touch">

        <div class="touch-row">
            <button class="touch-button"
                onclick="changeDirection('up')">▲</button>
        </div>

        <div class="touch-row">
            <button class="touch-button"
                onclick="changeDirection('left')">◀</button>

            <button class="touch-button"
                onclick="changeDirection('down')">▼</button>

            <button class="touch-button"
                onclick="changeDirection('right')">▶</button>
        </div>

    </div>

</div>


<div id="overlay">

    <div id="panel">

        <h1 id="overlayTitle">SNAKE</h1>

        <p id="overlayText">
            Use the arrow keys or WASD<br>
            to move the snake.<br><br>
            Eat all 3 foods!
        </p>

        <button id="mainButton" onclick="startGame()">
            START
        </button>

        <button id="homeButton"
            onclick="goHome()"
            style="display:none;">
            HOME
        </button>

    </div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const GRID = 25;
const SIZE = canvas.width / GRID;

let snake;
let direction;
let nextDirection;

let foods = [];

let obstacles = [];
let portals = [];

let score = 0;
let best = Number(localStorage.getItem("snakeBest")) || 0;

let running = false;
let paused = false;

let gameTimer = null;


/* ---------------- RANDOM POSITION ---------------- */

function randomCell() {
    return {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
    };
}


function samePosition(a, b) {
    return a.x === b.x && a.y === b.y;
}


function occupied(pos) {

    if (snake && snake.some(s => samePosition(s, pos))) {
        return true;
    }

    if (foods.some(f => samePosition(f, pos))) {
        return true;
    }

    if (obstacles.some(o => samePosition(o, pos))) {
        return true;
    }

    if (portals.some(p => samePosition(p, pos))) {
        return true;
    }

    return false;
}


function randomFreePosition() {

    let pos;

    do {
        pos = randomCell();
    } while (occupied(pos));

    return pos;
}


/* ---------------- START ---------------- */

function startGame() {

    clearInterval(gameTimer);

    snake = [
        {x: 12, y: 12},
        {x: 11, y: 12},
        {x: 10, y: 12}
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;

    foods = [];
    obstacles = [];
    portals = [];

    /* THREE FOODS */

    for (let i = 0; i < 3; i++) {
        foods.push(randomFreePosition());
    }

    /* GREY MOVING OBSTACLES */

    for (let i = 0; i < 7; i++) {

        let obstacle = randomFreePosition();

        obstacle.dx =
            Math.floor(Math.random() * 3) - 1;

        obstacle.dy =
            Math.floor(Math.random() * 3) - 1;

        if (obstacle.dx === 0 && obstacle.dy === 0) {
            obstacle.dx = 1;
        }

        obstacles.push(obstacle);
    }

    /* BLUE PORTALS */

    for (let i = 0; i < 2; i++) {
        portals.push(randomFreePosition());
    }

    running = true;
    paused = false;

    document.getElementById("overlay")
        .classList.add("hidden");

    updateScore();

    draw();

    gameTimer = setInterval(gameStep, 115);

}


/* ---------------- MOVEMENT ---------------- */

function changeDirection(newDirection) {

    if (!running || paused) return;

    if (
        newDirection === "up" &&
        direction !== "down"
    ) {
        nextDirection = "up";
    }

    if (
        newDirection === "down" &&
        direction !== "up"
    ) {
        nextDirection = "down";
    }

    if (
        newDirection === "left" &&
        direction !== "right"
    ) {
        nextDirection = "left";
    }

    if (
        newDirection === "right" &&
        direction !== "left"
    ) {
        nextDirection = "right";
    }
}


/* ---------------- GAME STEP ---------------- */

function gameStep() {

    if (!running || paused) return;

    direction = nextDirection;

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };


    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;


    /* EDGE TELEPORT / WRAP */

    if (head.x < 0) {
        head.x = GRID - 1;
    }

    if (head.x >= GRID) {
        head.x = 0;
    }

    if (head.y < 0) {
        head.y = GRID - 1;
    }

    if (head.y >= GRID) {
        head.y = 0;
    }


    /* SNAKE COLLISION */

    if (
        snake.some(
            segment => samePosition(segment, head)
        )
    ) {
        endGame();
        return;
    }


    /* OBSTACLE COLLISION */

    if (
        obstacles.some(
            obstacle => samePosition(obstacle, head)
        )
    ) {
        endGame();
        return;
    }


    snake.unshift(head);


    /* FOOD */

    let foodIndex = foods.findIndex(
        food => samePosition(food, head)
    );

    if (foodIndex !== -1) {

        foods.splice(foodIndex, 1);

        score++;

        /* Replace eaten food so there are always 3 */

        foods.push(randomFreePosition());

        updateScore();

    } else {

        snake.pop();

    }


    /* PORTAL */

    let portalIndex = portals.findIndex(
        portal => samePosition(portal, head)
    );

    if (portalIndex !== -1) {

        let otherPortal =
            portals[portalIndex === 0 ? 1 : 0];

        head.x = otherPortal.x;
        head.y = otherPortal.y;

        /*
         * Move both portals after teleporting.
         */

        movePortals();

    }


    moveObstacles();

    draw();

}


/* ---------------- MOVING PORTALS ---------------- */

function movePortals() {

    for (let i = 0; i < portals.length; i++) {

        let old = portals[i];

        let newPosition;

        do {
            newPosition = randomCell();
        } while (
            occupied(newPosition) ||
            samePosition(newPosition, old)
        );

        portals[i] = newPosition;
    }

}


/* ---------------- MOVING OBSTACLES ---------------- */

function moveObstacles() {

    for (let obstacle of obstacles) {

        /*
         * Occasionally change direction.
         */

        if (Math.random() < 0.25) {

            obstacle.dx =
                Math.floor(Math.random() * 3) - 1;

            obstacle.dy =
                Math.floor(Math.random() * 3) - 1;

        }

        let newX =
            obstacle.x + obstacle.dx;

        let newY =
            obstacle.y + obstacle.dy;


        /* Bounce off edges */

        if (newX < 0 || newX >= GRID) {
            obstacle.dx *= -1;
            newX = obstacle.x + obstacle.dx;
        }

        if (newY < 0 || newY >= GRID) {
            obstacle.dy *= -1;
            newY = obstacle.y + obstacle.dy;
        }


        obstacle.x = newX;
        obstacle.y = newY;

    }

}


/* ---------------- DRAW ---------------- */

function draw() {

    ctx.fillStyle = "#000";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle = "#151515";
    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID; i++) {

        ctx.beginPath();

        ctx.moveTo(
            i * SIZE,
            0
        );

        ctx.lineTo(
            i * SIZE,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * SIZE
        );

        ctx.lineTo(
            canvas.width,
            i * SIZE
        );

        ctx.stroke();

    }


    /* PORTALS */

    for (let portal of portals) {

        ctx.fillStyle = "#147cff";

        ctx.shadowColor = "#147cff";
        ctx.shadowBlur = 12;

        ctx.fillRect(
            portal.x * SIZE + 2,
            portal.y * SIZE + 2,
            SIZE - 4,
            SIZE - 4
        );

        ctx.shadowBlur = 0;

        ctx.fillStyle = "#000";

        ctx.fillRect(
            portal.x * SIZE + 7,
            portal.y * SIZE + 7,
            SIZE - 14,
            SIZE - 14
        );

    }


    /* OBSTACLES */

    for (let obstacle of obstacles) {

        ctx.fillStyle = "#777";

        ctx.fillRect(
            obstacle.x * SIZE + 2,
            obstacle.y * SIZE + 2,
            SIZE - 4,
            SIZE - 4
        );

        ctx.fillStyle = "#999";

        ctx.fillRect(
            obstacle.x * SIZE + 5,
            obstacle.y * SIZE + 5,
            SIZE - 10,
            4
        );

    }


    /* FOOD */

    for (let food of foods) {

        ctx.fillStyle = "#ff3333";

        ctx.shadowColor = "#ff3333";
        ctx.shadowBlur = 12;

        ctx.fillRect(
            food.x * SIZE + 6,
            food.y * SIZE + 6,
            SIZE - 12,
            SIZE - 12
        );

        ctx.shadowBlur = 0;

    }


    /* SNAKE */

    snake.forEach(
        (segment, index) => {

            if (index === 0) {

                /* DARKER HEAD */

                ctx.fillStyle = "#159b25";

                ctx.shadowColor = "#39ff14";
                ctx.shadowBlur = 10;

            } else {

                /* GREEN BODY */

                ctx.fillStyle = "#39ff14";

                ctx.shadowColor = "#39ff14";
                ctx.shadowBlur = 8;

            }

            ctx.fillRect(
                segment.x * SIZE + 2,
                segment.y * SIZE + 2,
                SIZE - 4,
                SIZE - 4
            );

            ctx.shadowBlur = 0;

        }
    );

}


/* ---------------- SCORE ---------------- */

function updateScore() {

    if (score > best) {

        best = score;

        localStorage.setItem(
            "snakeBest",
            best
        );

    }

    document.getElementById("score")
        .textContent =
        "Score: " +
        score +
        " | Best: " +
        best;

}


/* ---------------- PAUSE ---------------- */

function togglePause() {

    if (!running) return;

    paused = !paused;

    if (paused) {

        document.getElementById("overlayTitle")
            .textContent = "PAUSED";

        document.getElementById("overlayText")
            .innerHTML =
            "Game paused.";

        document.getElementById("mainButton")
            .textContent = "CONTINUE";

        document.getElementById("mainButton")
            .onclick = togglePause;

        document.getElementById("homeButton")
            .style.display = "none";

        document.getElementById("overlay")
            .classList.remove("hidden");

    } else {

        document.getElementById("overlay")
            .classList.add("hidden");

        document.getElementById("mainButton")
            .textContent = "START";

        document.getElementById("mainButton")
            .onclick = startGame;

    }

}


/* ---------------- RETRY ---------------- */

function endGame() {

    running = false;

    clearInterval(gameTimer);

    document.getElementById("overlayTitle")
        .textContent = "RETRY";

    document.getElementById("overlayText")
        .innerHTML =
        "Score: " +
        score +
        "<br><br>" +
        "Best: " +
        best;

    document.getElementById("mainButton")
        .textContent = "RETRY";

    document.getElementById("mainButton")
        .onclick = startGame;

    document.getElementById("homeButton")
        .style.display = "inline-block";

    document.getElementById("overlay")
        .classList.remove("hidden");

}


/* ---------------- HOME ---------------- */

function goHome() {

    window.location.href = "index.html";

}


/* ---------------- KEYBOARD ---------------- */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        if (
            key === "arrowup" ||
            key === "w"
        ) {
            event.preventDefault();
            changeDirection("up");
        }

        if (
            key === "arrowdown" ||
            key === "s"
        ) {
            event.preventDefault();
            changeDirection("down");
        }

        if (
            key === "arrowleft" ||
            key === "a"
        ) {
            event.preventDefault();
            changeDirection("left");
        }

        if (
            key === "arrowright" ||
            key === "d"
        ) {
            event.preventDefault();
            changeDirection("right");
        }

        if (key === "p") {
            togglePause();
        }

    }
);


/* ---------------- RRR SHORTCUT ---------------- */

let rPresses = 0;
let rTimer;

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() !== "r"
        ) {
            return;
        }

        rPresses++;

        clearTimeout(rTimer);

        rTimer = setTimeout(
            function() {
                rPresses = 0;
            },
            700
        );

        if (rPresses === 3) {

            window.location.href =
                "flashcards.html";

            rPresses = 0;
        }

    }
);


/* INITIAL */

updateScore();
draw();

</script>

</body>
</html>
