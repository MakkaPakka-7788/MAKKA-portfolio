<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard.com</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

header {
    width: 100%;
    text-align: center;
    padding: 25px;
    border-bottom: 3px solid #fff;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

#info {
    margin: 15px 0;
    font-size: 16px;
}

#gameContainer {
    position: relative;
}

canvas {
    background: #111;
    border: 3px solid #fff;
    width: min(90vw, 600px);
    height: min(90vw, 600px);
    image-rendering: pixelated;
}

#overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.8);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

#overlayContent {
    border: 3px solid #fff;
    background: #111;
    padding: 30px;
    width: 80%;
}

#overlay h2 {
    font-size: 28px;
    margin-top: 0;
}

#overlay p {
    color: #aaa;
    line-height: 1.6;
}

button {
    border: none;
    background: #fff;
    color: #000;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #ccc;
}

.hidden {
    display: none !important;
}

#controls {
    margin-top: 15px;
    text-align: center;
}

.controlRow {
    display: flex;
    justify-content: center;
}

.controlButton {
    width: 55px;
    height: 45px;
    margin: 3px;
    padding: 0;
    font-size: 20px;
}

@media (max-width: 650px) {
    #controls {
        display: block;
    }
}

</style>

</head>

<body>

<header>
    <h1>SNAKE</h1>
</header>

<div id="info">
    Score: <span id="score">0</span>
    &nbsp;&nbsp;|&nbsp;&nbsp;
    Best: <span id="best">0</span>
</div>

<div id="gameContainer">

```
<canvas
    id="game"
    width="600"
    height="600">
</canvas>

<div id="overlay">

    <div id="overlayContent">

        <h2 id="overlayTitle">
            SNAKE
        </h2>

        <p id="overlayText">
            Use the arrow keys or WASD<br>
            to move.
        </p>

        <button
            id="startButton"
            onclick="startGame()">
            START
        </button>

    </div>

</div>
```

</div>

<div id="controls">

```
<div class="controlRow">

    <button
        class="controlButton"
        onclick="changeDirection('up')">
        ▲
    </button>

</div>

<div class="controlRow">

    <button
        class="controlButton"
        onclick="changeDirection('left')">
        ◀
    </button>

    <button
        class="controlButton"
        onclick="changeDirection('down')">
        ▼
    </button>

    <button
        class="controlButton"
        onclick="changeDirection('right')">
        ▶
    </button>

</div>
```

</div>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const gridSize = 30;

const tileSize =
    canvas.width / gridSize;

let snake;

let food;

let direction;

let nextDirection;

let score = 0;

let best =
    Number(
        localStorage.getItem(
            "snakeBest"
        )
    ) || 0;

let gameRunning = false;

let gameLoopTimer;


/* START GAME */

function startGame() {

    snake = [

        {
            x: 15,
            y: 15
        },

        {
            x: 14,
            y: 15
        },

        {
            x: 13,
            y: 15
        }

    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    gameRunning = true;

    updateScore();

    spawnFood();

    document
        .getElementById("overlay")
        .classList.add("hidden");

    clearInterval(gameLoopTimer);

    gameLoopTimer =
        setInterval(
            update,
            100
        );

    draw();
}


/* FOOD */

function spawnFood() {

    food = {

        x: Math.floor(
            Math.random() *
            gridSize
        ),

        y: Math.floor(
            Math.random() *
            gridSize
        )

    };

    for (const part of snake) {

        if (
            part.x === food.x &&
            part.y === food.y
        ) {

            spawnFood();

            return;

        }

    }

}


/* UPDATE */

function update() {

    if (!gameRunning) {
        return;
    }

    direction =
        nextDirection;

    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WALL COLLISION */

    if (
        head.x < 0 ||
        head.x >= gridSize ||
        head.y < 0 ||
        head.y >= gridSize
    ) {

        endGame();

        return;

    }


    /* BODY COLLISION */

    for (const part of snake) {

        if (
            head.x === part.x &&
            head.y === part.y
        ) {

            endGame();

            return;

        }

    }


    snake.unshift(head);


    /* FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        if (score > best) {

            best = score;

            localStorage.setItem(
                "snakeBest",
                best
            );

        }

        spawnFood();

        updateScore();

    } else {

        snake.pop();

    }

    draw();

}


/* DRAW */

function draw() {

    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle = "#1d1d1d";

    ctx.lineWidth = 1;

    for (
        let i = 0;
        i <= gridSize;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * tileSize,
            0
        );

        ctx.lineTo(
            i * tileSize,
            canvas.height
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            0,
            i * tileSize
        );

        ctx.lineTo(
            canvas.width,
            i * tileSize
        );

        ctx.stroke();

    }


    /* FOOD */

    ctx.fillStyle = "#fff";

    ctx.fillRect(

        food.x * tileSize + 5,

        food.y * tileSize + 5,

        tileSize - 10,

        tileSize - 10

    );


    /* SNAKE */

    snake.forEach(
        (part, index) => {

            ctx.fillStyle =
                index === 0
                    ? "#fff"
                    : "#aaa";

            ctx.fillRect(

                part.x * tileSize + 2,

                part.y * tileSize + 2,

                tileSize - 4,

                tileSize - 4

            );

        }
    );

}


/* CHANGE DIRECTION */

function changeDirection(dir) {

    if (!gameRunning) {
        return;
    }

    if (
        dir === "up" &&
        direction.y !== 1
    ) {

        nextDirection = {
            x: 0,
            y: -1
        };

    }

    if (
        dir === "down" &&
        direction.y !== -1
    ) {

        nextDirection = {
            x: 0,
            y: 1
        };

    }

    if (
        dir === "left" &&
        direction.x !== 1
    ) {

        nextDirection = {
            x: -1,
            y: 0
        };

    }

    if (
        dir === "right" &&
        direction.x !== -1
    ) {

        nextDirection = {
            x: 1,
            y: 0
        };

    }

}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        if (
            key === "arrowup" ||
            key === "w"
        ) {

            event.preventDefault();

            changeDirection("up");

        }

        if (
            key === "arrowdown" ||
            key === "s"
        ) {

            event.preventDefault();

            changeDirection("down");

        }

        if (
            key === "arrowleft" ||
            key === "a"
        ) {

            event.preventDefault();

            changeDirection("left");

        }

        if (
            key === "arrowright" ||
            key === "d"
        ) {

            event.preventDefault();

            changeDirection("right");

        }

    }
);


/* SCORE */

function updateScore() {

    document.getElementById(
        "score"
    ).textContent = score;

    document.getElementById(
        "best"
    ).textContent = best;

}


/* END GAME */

function endGame() {

    gameRunning = false;

    clearInterval(gameLoopTimer);


    if (score > best) {

        best = score;

        localStorage.setItem(
            "snakeBest",
            best
        );

    }

    updateScore();


    /* RETRY SCREEN */

    document.getElementById(
        "overlayTitle"
    ).textContent = "RETRY";

    document.getElementById(
        "overlayText"
    ).innerHTML =
        "Score: " +
        score +
        "<br><br>" +
        "Best: " +
        best;

    document.getElementById(
        "startButton"
    ).textContent = "RETRY";

    document.getElementById(
        "startButton"
    ).onclick = startGame;

    document.getElementById(
        "overlay"
    ).classList.remove(
        "hidden"
    );

}


/* RRR SECRET SHORTCUT */

let rPresses = 0;

let rTimer;

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() !== "r"
        ) {
            return;
        }

        rPresses++;

        clearTimeout(rTimer);

        rTimer =
            setTimeout(
                function() {
                    rPresses = 0;
                },
                700
            );

        if (rPresses === 3) {

            window.location.href =
                "flashcards.html";

            rPresses = 0;

        }

    }
);


/* INITIAL */

updateScore();

food = {
    x: 20,
    y: 15
};

snake = [
    {
        x: 15,
        y: 15
    }
];

draw();

</script>

</body>
</html>
