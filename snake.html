<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hee Hee - Snake</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 45px;
            margin: 0 0 15px;
            letter-spacing: 6px;
            text-shadow: 0 0 15px white;
        }

        #score-container {
            display: flex;
            gap: 40px;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #game-wrapper {
            border: 4px solid #333;
            padding: 12px;
            background: #111;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.15);
        }

        canvas {
            background: #050505;
            display: block;
        }

        #instructions {
            margin-top: 15px;
            color: #888;
        }

        #home-button {
            margin-top: 15px;
            padding: 10px 25px;
            background: #111;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        #home-button:hover {
            background: white;
            color: black;
        }

        #game-over {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        #game-over h2 {
            font-size: 60px;
            margin: 0 0 25px;
            color: #ff3030;
            text-shadow: 0 0 20px #ff0000;
        }

        #final-score,
        #final-high-score {
            font-size: 25px;
            margin: 6px;
        }

        #retry-button {
            margin-top: 25px;
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: #222;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
        }

        #retry-button:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <h1>HEE HEE</h1>

    <div id="score-container">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div id="instructions">
        Use the arrow keys to move
    </div>

    <a href="index.html" id="home-button">HOME</a>

    <div id="game-over">
        <h2>GAME OVER</h2>

        <div id="final-score">
            Score: 0
        </div>

        <div id="final-high-score">
            High Score: 0
        </div>

        <button id="retry-button">RETRY</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");

        const gameOverScreen = document.getElementById("game-over");
        const finalScoreElement = document.getElementById("final-score");
        const finalHighScoreElement = document.getElementById("final-high-score");
        const retryButton = document.getElementById("retry-button");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        const maxFruits = 3;
        const maxPortals = 6;

        let maxObstacles = 12;

        let snake = [{ x: 15, y: 15 }];
        let fruits = [];
        let obstacles = [];
        let portals = [];

        let dx = 1;
        let dy = 0;

        let score = 0;
        let gameInterval;
        let gameRunning = false;

        let highScore =
            Number(localStorage.getItem("snakeHighScore")) || 0;

        highScoreElement.innerText = highScore;

        function startGame() {
            clearInterval(gameInterval);
            gameRunning = true;
            gameInterval = setInterval(update, 140);
        }

        function update() {
            if (!gameRunning) return;

            moveSnake();

            if (checkGameOver()) {
                endGame();
                return;
            }

            checkPortalCollision();
            checkFoodCollision();

            draw();
        }

        function draw() {
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#666";

            obstacles.forEach(obs => {
                ctx.fillRect(
                    obs.x * gridSize,
                    obs.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            portals.forEach((portal, index) => {
                ctx.fillStyle = "#000";

                ctx.fillRect(
                    portal.x * gridSize,
                    portal.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );

                ctx.strokeStyle = "#00E5FF";
                ctx.lineWidth = 3;

                ctx.strokeRect(
                    portal.x * gridSize + 1,
                    portal.y * gridSize + 1,
                    gridSize - 4,
                    gridSize - 4
                );

                ctx.fillStyle = "#00E5FF";
                ctx.font = "12px Arial";

                ctx.fillText(
                    index + 1,
                    portal.x * gridSize + 6,
                    portal.y * gridSize + 14
                );
            });

            snake.forEach((part, index) => {
                ctx.fillStyle =
                    index === 0 ? "#1B5E20" : "#4CAF50";

                ctx.fillRect(
                    part.x * gridSize,
                    part.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            fruits.forEach(fruit => {
                ctx.fillStyle = "#FF3030";

                ctx.fillRect(
                    fruit.x * gridSize,
                    fruit.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });
        }

        function moveSnake() {
            let nextX = snake[0].x + dx;
            let nextY = snake[0].y + dy;

            if (nextX < 0) nextX = tileCount - 1;
            if (nextX >= tileCount) nextX = 0;
            if (nextY < 0) nextY = tileCount - 1;
            if (nextY >= tileCount) nextY = 0;

            snake.unshift({
                x: nextX,
                y: nextY
            });

            snake.pop();
        }

        function checkPortalCollision() {
            const head = snake[0];

            const portalIndex = portals.findIndex(
                portal =>
                    portal.x === head.x &&
                    portal.y === head.y
            );

            if (portalIndex === -1) return;

            const otherPortals = portals.filter(
                (_, index) => index !== portalIndex
            );

            if (otherPortals.length === 0) return;

            const destination =
                otherPortals[
                    Math.floor(
                        Math.random() * otherPortals.length
                    )
                ];

            snake[0].x = destination.x;
            snake[0].y = destination.y;
        }

        function movePortals() {
            for (let i = 0; i < portals.length; i++) {
                let newPortal;
                let valid = false;

                while (!valid) {
                    newPortal = {
                        x: Math.floor(
                            Math.random() * (tileCount - 6)
                        ) + 3,
                        y: Math.floor(
                            Math.random() * (tileCount - 6)
                        ) + 3
                    };

                    const onSnake = snake.some(
                        part =>
                            part.x === newPortal.x &&
                            part.y === newPortal.y
                    );

                    const onFruit = fruits.some(
                        fruit =>
                            fruit.x === newPortal.x &&
                            fruit.y === newPortal.y
                    );

                    const onObstacle = obstacles.some(
                        obs =>
                            obs.x === newPortal.x &&
                            obs.y === newPortal.y
                    );

                    const onOtherPortal = portals.some(
                        (portal, index) =>
                            index !== i &&
                            portal.x === newPortal.x &&
                            portal.y === newPortal.y
                    );

                    valid =
                        !onSnake &&
                        !onFruit &&
                        !onObstacle &&
                        !onOtherPortal;
                }

                portals[i] = newPortal;
            }
        }

        function checkFoodCollision() {
            for (let i = 0; i < fruits.length; i++) {
                if (
                    snake[0].x === fruits[i].x &&
                    snake[0].y === fruits[i].y
                ) {
                    score++;

                    scoreElement.innerText = score;

                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.innerText = highScore;

                        localStorage.setItem(
                            "snakeHighScore",
                            highScore
                        );
                    }

                    const tail =
                        snake[snake.length - 1];

                    snake.push({
                        x: tail.x,
                        y: tail.y
                    });

                    fruits.splice(i, 1);

                    maxObstacles =
                        Math.min(
                            30,
                            12 + Math.floor(score / 2)
                        );

                    generateObstacles();
                    movePortals();
                    generateSingleFruit();

                    break;
                }
            }
        }

        function generateSingleFruit() {
            let newFruit;
            let invalidPos = true;

            while (invalidPos) {
                newFruit = {
                    x: Math.floor(
                        Math.random() * tileCount
                    ),
                    y: Math.floor(
                        Math.random() * tileCount
                    )
                };

                invalidPos =
                    snake.some(
                        part =>
                            part.x === newFruit.x &&
                            part.y === newFruit.y
                    ) ||
                    obstacles.some(
                        obs =>
                            obs.x === newFruit.x &&
                            obs.y === newFruit.y
                    ) ||
                    portals.some(
                        portal =>
                            portal.x === newFruit.x &&
                            portal.y === newFruit.y
                    );
            }

            fruits.push(newFruit);
        }

        function generateObstacles() {
            obstacles = [];

            for (let i = 0; i < maxObstacles; i++) {
                let newObs;
                let invalidPos = true;

                while (invalidPos) {
                    newObs = {
                        x: Math.floor(
                            Math.random() * tileCount
                        ),
                        y: Math.floor(
                            Math.random() * tileCount
                        )
                    };

                    invalidPos =
                        snake.some(
                            part =>
                                Math.abs(
                                    newObs.x - part.x
                                ) <= 1 &&
                                Math.abs(
                                    newObs.y - part.y
                                ) <= 1
                        ) ||
                        fruits.some(
                            fruit =>
                                fruit.x === newObs.x &&
                                fruit.y === newObs.y
                        ) ||
                        portals.some(
                            portal =>
                                portal.x === newObs.x &&
                                portal.y === newObs.y
                        ) ||
                        obstacles.some(
                            obs =>
                                obs.x === newObs.x &&
                                obs.y === newObs.y
                        );
                }

                obstacles.push(newObs);
            }
        }

        function generatePortals() {
            portals = [];

            for (let i = 0; i < maxPortals; i++) {
                let newPortal;
                let invalidPos = true;

                while (invalidPos) {
                    newPortal = {
                        x: Math.floor(
                            Math.random() * (tileCount - 6)
                        ) + 3,
                        y: Math.floor(
                            Math.random() * (tileCount - 6)
                        ) + 3
                    };

                    invalidPos =
                        snake.some(
                            part =>
                                part.x === newPortal.x &&
                                part.y === newPortal.y
                        ) ||
                        obstacles.some(
                            obs =>
                                obs.x === newPortal.x &&
                                obs.y === newPortal.y
                        ) ||
                        portals.some(
                            portal =>
                                portal.x === newPortal.x &&
                                portal.y === newPortal.y
                        );
                }

                portals.push(newPortal);
            }
        }

        function populateAllFruits() {
            fruits = [];

            for (let i = 0; i < maxFruits; i++) {
                generateSingleFruit();
            }
        }

        function checkGameOver() {
            return obstacles.some(
                obs =>
                    obs.x === snake[0].x &&
                    obs.y === snake[0].y
            );
        }

        function endGame() {
            gameRunning = false;

            clearInterval(gameInterval);

            finalScoreElement.innerText =
                "Score: " + score;

            finalHighScoreElement.innerText =
                "High Score: " + highScore;

            gameOverScreen.style.display = "flex";
        }

        function resetGame() {
            clearInterval(gameInterval);

            snake = [{ x: 15, y: 15 }];

            dx = 1;
            dy = 0;

            score = 0;
            maxObstacles = 12;

            scoreElement.innerText = score;

            fruits = [];
            obstacles = [];
            portals = [];

            gameOverScreen.style.display = "none";

            generatePortals();
            generateObstacles();
            populateAllFruits();

            draw();
            startGame();
        }

        retryButton.addEventListener(
            "click",
            resetGame
        );

        window.addEventListener(
            "keydown",
            function(e) {
                switch (e.key) {
                    case "ArrowUp":
                        if (dy === 0) {
                            dx = 0;
                            dy = -1;
                        }
                        e.preventDefault();
                        break;

                    case "ArrowDown":
                        if (dy === 0) {
                            dx = 0;
                            dy = 1;
                        }
                        e.preventDefault();
                        break;

                    case "ArrowLeft":
                        if (dx === 0) {
                            dx = -1;
                            dy = 0;
                        }
                        e.preventDefault();
                        break;

                    case "ArrowRight":
                        if (dx === 0) {
                            dx = 1;
                            dy = 0;
                        }
                        e.preventDefault();
                        break;
                }
            }
        );

        resetGame();
    </script>

</body>
</html>
