<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard.com</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 20% 20%, #403016 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #503b1d 0 2px, transparent 3px),
        #21180d;
    background-size: 35px 35px;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

#top {
    width: 500px;
    max-width: 92vw;
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#title {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #39ff88;
    text-shadow:
        0 0 5px #39ff88,
        0 0 15px #39ff88,
        0 0 30px #39ff88;
}

#score {
    font-size: 14px;
    color: #fff;
    text-shadow: 0 0 8px #fff;
}

#canvas {
    margin-top: 15px;
    width: 500px;
    height: 500px;
    max-width: 92vw;
    max-height: 92vw;
    border: 3px solid #39ff88;
    background: #c99b55;
    box-shadow:
        0 0 8px #39ff88,
        0 0 25px rgba(57,255,136,.5),
        inset 0 0 25px rgba(0,0,0,.5);
    image-rendering: pixelated;
}

#controls {
    margin-top: 15px;
}

button {
    border: 2px solid #39ff88;
    background: #111;
    color: #39ff88;
    padding: 10px 18px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    box-shadow:
        0 0 7px rgba(57,255,136,.6);
}

button:hover {
    background: #39ff88;
    color: #000;
    box-shadow:
        0 0 15px #39ff88;
}

#touch {
    margin-top: 15px;
    display: none;
}

.touch-row {
    display: flex;
    justify-content: center;
}

.touch-button {
    width: 55px;
    height: 45px;
    padding: 0;
    margin: 3px;
    font-size: 20px;
}

/* OVERLAY */

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

#panel {
    width: min(85vw, 380px);
    padding: 30px;
    text-align: center;
    background: #090d0b;
    border: 3px solid #39ff88;
    box-shadow:
        0 0 10px #39ff88,
        0 0 35px rgba(57,255,136,.5);
}

#panel h1 {
    color: #39ff88;
    text-shadow:
        0 0 8px #39ff88,
        0 0 20px #39ff88;
}

#panel p {
    color: #ccc;
    line-height: 1.7;
    font-size: 13px;
}

#medal {
    font-size: 42px;
    margin: 15px;
    min-height: 48px;
}

.hidden {
    display: none !important;
}

@media (max-width: 650px) {

    #touch {
        display: block;
    }

    #top {
        margin-top: 12px;
    }

}

</style>

</head>

<body>

<div id="top">

```
<div id="title">
    SNAKE
</div>

<div id="score">
    Score: 0 | Best: 0
</div>
```

</div>

<canvas
 id="canvas"
 width="500"
 height="500"> </canvas>

<div id="controls">

```
<button onclick="togglePause()">
    PAUSE
</button>
```

</div>

<!-- TOUCH CONTROLS -->

<div id="touch">

```
<div class="touch-row">

    <button
        class="touch-button"
        onclick="changeDirection('up')">
        ▲
    </button>

</div>

<div class="touch-row">

    <button
        class="touch-button"
        onclick="changeDirection('left')">
        ◀
    </button>

    <button
        class="touch-button"
        onclick="changeDirection('down')">
        ▼
    </button>

    <button
        class="touch-button"
        onclick="changeDirection('right')">
        ▶
    </button>

</div>
```

</div>

<!-- OVERLAY -->

<div id="overlay">

```
<div id="panel">

    <h1 id="overlayTitle">
        SNAKE
    </h1>

    <p id="overlayText">
        Use the arrow keys or WASD<br>
        to move the snake.
    </p>

    <div id="medal"></div>

    <button
        id="overlayButton"
        onclick="startGame()">
        START
    </button>

</div>
```

</div>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const SIZE = 25;

const GRID = 20;


let snake = [];

let food = {};

let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};

let obstacles = [];

let portals = [];

let score = 0;

let best =
    Number(
        localStorage.getItem(
            "snakeBest"
        )
    ) || 0;

let running = false;

let paused = false;

let timer;


/* START */

function startGame() {

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    paused = false;

    running = true;

    createObstacles();

    createPortals();

    spawnFood();

    updateScore();

    document
        .getElementById("overlay")
        .classList.add("hidden");

    clearInterval(timer);

    timer =
        setInterval(
            update,
            115
        );

    draw();

}


/* OBSTACLES */

function createObstacles() {

    obstacles = [];

    const patterns = [

        [
            {x: 5, y: 5},
            {x: 6, y: 5},
            {x: 7, y: 5}
        ],

        [
            {x: 14, y: 13},
            {x: 14, y: 14},
            {x: 14, y: 15}
        ],

        [
            {x: 4, y: 16},
            {x: 5, y: 16},
            {x: 6, y: 16}
        ]

    ];

    const selected =
        patterns[
            Math.floor(
                Math.random() *
                patterns.length
            )
        ];

    obstacles =
        selected.map(
            p => ({
                x: p.x,
                y: p.y
            })
        );

}


/* PORTALS */

function createPortals() {

    portals = [

        {
            x: 2,
            y: 2,
            color: "#00eaff"
        },

        {
            x: 17,
            y: 17,
            color: "#ff38ff"
        }

    ];

}


/* FOOD */

function spawnFood() {

    do {

        food = {

            x:
                Math.floor(
                    Math.random() *
                    GRID
                ),

            y:
                Math.floor(
                    Math.random() *
                    GRID
                )

        };

    } while (
        onSnake(food) ||
        onObstacle(food) ||
        onPortal(food)
    );

}


/* UPDATE */

function update() {

    if (
        !running ||
        paused
    ) {
        return;
    }

    direction =
        nextDirection;

    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WALL */

    if (
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ) {

        endGame();

        return;

    }


    /* OBSTACLE */

    if (
        onObstacle(head)
    ) {

        endGame();

        return;

    }


    /* BODY */

    if (
        onSnake(head)
    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    /* FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        if (
            score > best
        ) {

            best = score;

            localStorage.setItem(
                "snakeBest",
                best
            );

        }

        spawnFood();

        updateScore();

    } else {

        snake.pop();

    }


    /* PORTAL */

    for (
        let i = 0;
        i < portals.length;
        i++
    ) {

        const portal =
            portals[i];

        if (
            head.x === portal.x &&
            head.y === portal.y
        ) {

            const other =
                portals[
                    i === 0 ? 1 : 0
                ];

            snake[0] = {
                x: other.x,
                y: other.y
            };

        }

    }


    draw();

}


/* CHECK SNAKE */

function onSnake(pos) {

    return snake.some(
        part =>
            part.x === pos.x &&
            part.y === pos.y
    );

}


/* CHECK OBSTACLE */

function onObstacle(pos) {

    return obstacles.some(
        block =>
            block.x === pos.x &&
            block.y === pos.y
    );

}


/* CHECK PORTAL */

function onPortal(pos) {

    return portals.some(
        portal =>
            portal.x === pos.x &&
            portal.y === pos.y
    );

}


/* DRAW */

function draw() {

    drawSand();

    drawObstacles();

    drawPortals();

    drawFood();

    drawSnake();

}


/* SAND */

function drawSand() {

    ctx.fillStyle = "#c99b55";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SAND DOTS */

    for (
        let y = 0;
        y < GRID;
        y++
    ) {

        for (
            let x = 0;
            x < GRID;
            x++
        ) {

            const value =
                (
                    x * 17 +
                    y * 31
                ) % 7;

            if (
                value === 0 ||
                value === 3
            ) {

                ctx.fillStyle =
                    "rgba(90,55,20,.22)";

                ctx.fillRect(
                    x * SIZE + 5,
                    y * SIZE + 8,
                    3,
                    3
                );

            }

        }

    }

}


/* OBSTACLES */

function drawObstacles() {

    obstacles.forEach(
        block => {

            const px =
                block.x * SIZE;

            const py =
                block.y * SIZE;

            ctx.fillStyle =
                "#5b4630";

            ctx.fillRect(
                px + 2,
                py + 2,
                SIZE - 4,
                SIZE - 4
            );

            ctx.strokeStyle =
                "#302417";

            ctx.lineWidth = 2;

            ctx.strokeRect(
                px + 3,
                py + 3,
                SIZE - 6,
                SIZE - 6
            );

        }
    );

}


/* PORTALS */

function drawPortals() {

    portals.forEach(
        portal => {

            const cx =
                portal.x * SIZE +
                SIZE / 2;

            const cy =
                portal.y * SIZE +
                SIZE / 2;

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                9,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle =
                portal.color;

            ctx.lineWidth = 3;

            ctx.shadowColor =
                portal.color;

            ctx.shadowBlur = 12;

            ctx.stroke();

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                4,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.shadowBlur = 0;

        }
    );

}


/* FOOD */

function drawFood() {

    const cx =
        food.x * SIZE +
        SIZE / 2;

    const cy =
        food.y * SIZE +
        SIZE / 2;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ff315f";

    ctx.shadowColor =
        "#ff315f";

    ctx.shadowBlur = 15;

    ctx.fill();

    ctx.shadowBlur = 0;

}


/* SNAKE */

function drawSnake() {

    snake.forEach(
        (part, index) => {

            const px =
                part.x * SIZE;

            const py =
                part.y * SIZE;

            ctx.fillStyle =
                index === 0
                    ? "#39ff88"
                    : "#16d96c";

            ctx.shadowColor =
                "#39ff88";

            ctx.shadowBlur =
                index === 0
                    ? 15
                    : 8;

            ctx.fillRect(
                px + 3,
                py + 3,
                SIZE - 6,
                SIZE - 6
            );

            ctx.shadowBlur = 0;

            if (
                index === 0
            ) {

                drawEyes(
                    px,
                    py
                );

            }

        }
    );

}


/* EYES */

function drawEyes(
    px,
    py
) {

    ctx.fillStyle =
        "#001b0b";

    if (
        direction.x !== 0
    ) {

        const eyeX =
            direction.x > 0
                ? px + 17
                : px + 8;

        ctx.fillRect(
            eyeX,
            py + 7,
            3,
            3
        );

        ctx.fillRect(
            eyeX,
            py + 15,
            3,
            3
        );

    } else {

        const eyeY =
            direction.y > 0
                ? py + 17
                : py + 8;

        ctx.fillRect(
            px + 7,
            eyeY,
            3,
            3
        );

        ctx.fillRect(
            px + 15,
            eyeY,
            3,
            3
        );

    }

}


/* DIRECTION */

function changeDirection(dir) {

    if (
        !running ||
        paused
    ) {
        return;
    }

    if (
        dir === "up" &&
        direction.y !== 1
    ) {

        nextDirection = {
            x: 0,
            y: -1
        };

    }

    if (
        dir === "down" &&
        direction.y !== -1
    ) {

        nextDirection = {
            x: 0,
            y: 1
        };

    }

    if (
        dir === "left" &&
        direction.x !== 1
    ) {

        nextDirection = {
            x: -1,
            y: 0
        };

    }

    if (
        dir === "right" &&
        direction.x !== -1
    ) {

        nextDirection = {
            x: 1,
            y: 0
        };

    }

}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        if (
            key === "arrowup" ||
            key === "w"
        ) {

            event.preventDefault();

            changeDirection("up");

        }

        if (
            key === "arrowdown" ||
            key === "s"
        ) {

            event.preventDefault();

            changeDirection("down");

        }

        if (
            key === "arrowleft" ||
            key === "a"
        ) {

            event.preventDefault();

            changeDirection("left");

        }

        if (
            key === "arrowright" ||
            key === "d"
        ) {

            event.preventDefault();

            changeDirection("right");

        }

    }
);


/* PAUSE */

function togglePause() {

    if (!running) {
        return;
    }

    paused =
        !paused;

    if (paused) {

        document.getElementById(
            "overlayTitle"
        ).textContent =
            "PAUSED";

        document.getElementById(
            "overlayText"
        ).innerHTML =
            "The game is paused.";

        document.getElementById(
            "overlayButton"
        ).textContent =
            "CONTINUE";

        document.getElementById(
            "overlayButton"
        ).onclick =
            togglePause;

        document.getElementById(
            "overlay"
        ).classList.remove(
            "hidden"
        );

    } else {

        document.getElementById(
            "overlay"
        ).classList.add(
            "hidden"
        );

    }

}


/* SCORE */

function updateScore() {

    document.getElementById(
        "score"
    ).textContent =
        "Score: " +
        score +
        " | Best: " +
        best;

}


/* MEDALS */

function getMedal() {

    if (score >= 30) {
        return "🏆";
    }

    if (score >= 20) {
        return "🥇";
    }

    if (score >= 10) {
        return "🥈";
    }

    if (score >= 5) {
        return "🥉";
    }

    return "";

}


/* END GAME */

function endGame() {

    running = false;

    clearInterval(timer);

    const medal =
        getMedal();

    document.getElementById(
        "overlayTitle"
    ).textContent =
        "RETRY";

    document.getElementById(
        "overlayText"
    ).innerHTML =
        "Score: " +
        score +
        "<br>" +
        "Best: " +
        best;

    document.getElementById(
        "medal"
    ).textContent =
        medal;

    document.getElementById(
        "overlayButton"
    ).textContent =
        "RETRY";

    document.getElementById(
        "overlayButton"
    ).onclick =
        startGame;

    document.getElementById(
        "overlay"
    ).classList.remove(
        "hidden"
    );

}


/* RRR SECRET SHORTCUT */

let rPresses = 0;

let rTimer;

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() !== "r"
        ) {
            return;
        }

        rPresses++;

        clearTimeout(rTimer);

        rTimer =
            setTimeout(
                function() {
                    rPresses = 0;
                },
                700
            );

        if (
            rPresses === 3
        ) {

            window.location.href =
                "flashcards.html";

            rPresses = 0;

        }

    }
);


/* INITIAL */

updateScore();

draw();

</script>

</body>
</html>
