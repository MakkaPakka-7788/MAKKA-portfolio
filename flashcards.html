<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard.com</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: white;
            color: #222;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #2E7D32;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .section {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            background-color: #f8f8f8;
        }

        h2 {
            margin-top: 0;
            color: #2E7D32;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 16px;
            background-color: white;
            color: #222;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            padding: 10px 18px;
            border: 1px solid #2E7D32;
            border-radius: 5px;
            background-color: #2E7D32;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #256628;
        }

        .set-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .set-card {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 18px;
            min-width: 0;
        }

        .set-card h3 {
            margin-top: 0;
            color: #2E7D32;
            overflow-wrap: anywhere;
        }

        .set-card p {
            color: #666;
        }

        .set-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .set-buttons button {
            flex: 1;
            min-width: 65px;
        }

        .delete-button {
            background-color: #d32f2f;
            border-color: #d32f2f;
        }

        .delete-button:hover {
            background-color: #b71c1c;
        }

        #editor,
        #study {
            display: none;
        }

        .card-item {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 15px;
            margin-bottom: 12px;
            width: 100%;
            overflow: hidden;
        }

        .card-item strong {
            color: #2E7D32;
        }

        .card-item p {
            overflow-wrap: anywhere;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .flashcard {
            width: 100%;
            max-width: 650px;
            height: 350px;
            margin: 30px auto;
            cursor: pointer;
            perspective: 1000px;
        }

        .flashcard-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: white;
            border: 2px solid #2E7D32;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .flashcard-side p {
            font-size: 26px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            border-color: #555;
        }

        .study-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #study-info {
            color: #666;
        }

        #empty-message {
            color: #777;
            text-align: center;
        }

        @media (max-width: 600px) {
            .set-buttons {
                flex-direction: column;
            }

            .set-buttons button {
                width: 100%;
            }

            .flashcard {
                height: 280px;
            }

            .flashcard-side p {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Flashcard.com</h1>
        <p>Create and study your own flashcards</p>
    </header>

    <div class="container">

        <div id="home">

            <div class="section">

                <h2>Create a Flashcard Set</h2>

                <input
                    id="set-name"
                    type="text"
                    placeholder="Set name"
                >

                <button onclick="createSet()">
                    Create Set
                </button>

            </div>

            <div class="section">

                <h2>Your Sets</h2>

                <div id="set-grid" class="set-grid"></div>

                <div id="empty-message">
                    You haven't created any sets yet.
                </div>

            </div>

        </div>

        <div id="editor">

            <div class="section">

                <h2 id="editor-title">
                    Flashcard Set
                </h2>

                <input
                    id="question"
                    type="text"
                    placeholder="Question"
                >

                <textarea
                    id="answer"
                    placeholder="Answer"
                ></textarea>

                <button onclick="addCard()">
                    Add Card
                </button>

            </div>

            <div class="section">

                <h2>Your Cards</h2>

                <div id="card-list"></div>

                <button onclick="startStudy()">
                    Study Set
                </button>

            </div>

        </div>

        <div id="study">

            <div class="section">

                <h2 id="study-title">
                    Study
                </h2>

                <p id="study-info">
                    Card 1 of 1
                </p>

                <div
                    id="flashcard"
                    class="flashcard"
                    onclick="flipCard()"
                >
                    <div class="flashcard-inner">

                        <div class="flashcard-side">
                            <p id="card-question"></p>
                        </div>

                        <div class="flashcard-side flashcard-back">
                            <p id="card-answer"></p>
                        </div>

                    </div>
                </div>

                <p>Click the card to flip it.</p>

                <div class="study-controls">

                    <button onclick="previousCard()">
                        Previous
                    </button>

                    <button onclick="flipCard()">
                        Flip
                    </button>

                    <button onclick="nextCard()">
                        Next
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script>

        let sets =
            JSON.parse(
                localStorage.getItem("flashcardSets")
            ) || [];

        let currentSetIndex = null;
        let currentStudyCard = 0;

        function saveSets() {
            localStorage.setItem(
                "flashcardSets",
                JSON.stringify(sets)
            );
        }

        function createSet() {

            const input =
                document.getElementById("set-name");

            const name =
                input.value.trim();

            if (!name) {
                alert("Please enter a set name.");
                return;
            }

            sets.push({
                name: name,
                cards: []
            });

            saveSets();

            input.value = "";

            renderSets();
        }

        function renderSets() {

            const grid =
                document.getElementById("set-grid");

            const empty =
                document.getElementById("empty-message");

            grid.innerHTML = "";

            if (sets.length === 0) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";

            sets.forEach((set, index) => {

                const card =
                    document.createElement("div");

                card.className = "set-card";

                card.innerHTML = `
                    <h3>${escapeHTML(set.name)}</h3>

                    <p>
                        ${set.cards.length}
                        card${set.cards.length === 1 ? "" : "s"}
                    </p>

                    <div class="set-buttons">

                        <button onclick="openSet(${index})">
                            Edit
                        </button>

                        <button onclick="startStudyFromSet(${index})">
                            Study
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteSet(${index})"
                        >
                            Delete
                        </button>

                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function openSet(index) {

            currentSetIndex = index;

            document.getElementById("home")
                .style.display = "none";

            document.getElementById("study")
                .style.display = "none";

            document.getElementById("editor")
                .style.display = "block";

            document.getElementById("editor-title")
                .textContent =
                sets[index].name;

            renderCards();
        }

        function renderCards() {

            const list =
                document.getElementById("card-list");

            list.innerHTML = "";

            const cards =
                sets[currentSetIndex].cards;

            if (cards.length === 0) {

                list.innerHTML =
                    "<p>No cards yet.</p>";

                return;
            }

            cards.forEach((card, index) => {

                const item =
                    document.createElement("div");

                item.className = "card-item";

                item.innerHTML = `
                    <strong>Question</strong>

                    <p>
                        ${escapeHTML(card.question)}
                    </p>

                    <strong>Answer</strong>

                    <p>
                        ${escapeHTML(card.answer)}
                    </p>

                    <div class="card-actions">

                        <button
                            class="delete-button"
                            onclick="deleteCard(${index})"
                        >
                            Delete
                        </button>

                    </div>
                `;

                list.appendChild(item);
            });
        }

        function addCard() {

            const question =
                document.getElementById("question")
                    .value.trim();

            const answer =
                document.getElementById("answer")
                    .value.trim();

            if (!question || !answer) {
                alert(
                    "Please enter both a question and answer."
                );
                return;
            }

            sets[currentSetIndex].cards.push({
                question: question,
                answer: answer
            });

            saveSets();

            document.getElementById("question").value = "";
            document.getElementById("answer").value = "";

            renderCards();
            renderSets();
        }

        function deleteCard(index) {

            sets[currentSetIndex].cards.splice(
                index,
                1
            );

            saveSets();

            renderCards();
            renderSets();
        }

        function deleteSet(index) {

            if (
                !confirm(
                    "Delete this flashcard set?"
                )
            ) {
                return;
            }

            sets.splice(index, 1);

            saveSets();

            renderSets();
        }

        function startStudy() {

            const cards =
                sets[currentSetIndex].cards;

            if (cards.length === 0) {
                alert("Add some cards first.");
                return;
            }

            currentStudyCard = 0;

            document.getElementById("home")
                .style.display = "none";

            document.getElementById("editor")
                .style.display = "none";

            document.getElementById("study")
                .style.display = "block";

            document.getElementById("study-title")
                .textContent =
                sets[currentSetIndex].name;

            updateStudyCard();
        }

        function startStudyFromSet(index) {

            currentSetIndex = index;

            startStudy();
        }

        function updateStudyCard() {

            const cards =
                sets[currentSetIndex].cards;

            const card =
                cards[currentStudyCard];

            document.getElementById("card-question")
                .textContent =
                card.question;

            document.getElementById("card-answer")
                .textContent =
                card.answer;

            document.getElementById("study-info")
                .textContent =
                `Card ${currentStudyCard + 1} of ${cards.length}`;

            document.getElementById("flashcard")
                .classList.remove("flipped");
        }

        function flipCard() {

            document.getElementById("flashcard")
                .classList.toggle("flipped");
        }

        function nextCard() {

            const cards =
                sets[currentSetIndex].cards;

            currentStudyCard++;

            if (
                currentStudyCard >= cards.length
            ) {
                currentStudyCard = 0;
            }

            updateStudyCard();
        }

        function previousCard() {

            const cards =
                sets[currentSetIndex].cards;

            currentStudyCard--;

            if (currentStudyCard < 0) {
                currentStudyCard =
                    cards.length - 1;
            }

            updateStudyCard();
        }

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }

        let rPresses = 0;
        let rTimer;

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key.toLowerCase() !== "r"
                ) {
                    return;
                }

                rPresses++;

                clearTimeout(rTimer);

                rTimer =
                    setTimeout(
                        () => {
                            rPresses = 0;
                        },
                        700
                    );

                if (rPresses === 3) {

                    window.location.href =
                        "index.html";

                    rPresses = 0;
                }
            }
        );

        renderSets();

    </script>

</body>
</html>
