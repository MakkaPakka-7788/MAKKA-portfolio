<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard.com</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fa;
    color: #1f2937;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: white;
    border-bottom: 1px solid #e2e8f0;
    height: 72px;
    display: flex;
    align-items: center;
}

.header-inner {
    width: 92%;
    max-width: 1150px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: bold;
    color: #2563eb;
}

.logo-icon {
    width: 38px;
    height: 38px;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 21px;
}

.header-right {
    color: #64748b;
    font-size: 14px;
}

.container {
    width: 92%;
    max-width: 1150px;
    margin: 35px auto;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h1 {
    margin: 0 0 7px;
    font-size: 30px;
}

.page-title p {
    margin: 0;
    color: #64748b;
}

.panel {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
}

.panel h2 {
    margin-top: 0;
    font-size: 20px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    padding: 12px;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
    font-family: inherit;
}

input:focus,
textarea:focus {
    border-color: #2563eb;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 7px;
    padding: 10px 17px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.secondary {
    background: #eef2f7;
    color: #334155;
}

.secondary:hover {
    background: #e2e8f0;
}

.danger {
    background: #ef4444;
}

.danger:hover {
    background: #dc2626;
}

.set-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
}

.set-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 20px;
}

.set-card h3 {
    margin: 0 0 8px;
    font-size: 19px;
    overflow-wrap: anywhere;
}

.set-card p {
    margin: 0 0 18px;
    color: #64748b;
}

.set-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.set-buttons button {
    flex: 1;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 25px;
}

.top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 10px;
}

.card-item {
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    padding: 18px;
    margin-bottom: 12px;
    background: #fafafa;
}

.card-label {
    color: #2563eb;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
}

.card-text {
    margin: 6px 0 15px;
    overflow-wrap: anywhere;
}

.card-actions {
    display: flex;
    justify-content: flex-end;
}

#editor,
#study {
    display: none;
}

.study-area {
    text-align: center;
}

.flashcard {
    width: 100%;
    max-width: 720px;
    height: 390px;
    margin: 25px auto;
    perspective: 1000px;
    cursor: pointer;
}

.flashcard-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s;
    transform-style: preserve-3d;
}

.flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
}

.flashcard-side {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    background: white;
    border: 1px solid #dbe3ec;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 45px;
}

.flashcard-side p {
    font-size: 28px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.flashcard-back {
    transform: rotateY(180deg);
    background: #f8fafc;
}

.study-label {
    color: #64748b;
    font-size: 14px;
}

.study-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.back-link {
    background: none;
    color: #2563eb;
    padding: 0;
}

.back-link:hover {
    background: none;
    color: #1d4ed8;
}

@media (max-width: 650px) {

    .header-right {
        display: none;
    }

    .container {
        width: 94%;
    }

    .set-buttons {
        flex-direction: column;
    }

    .set-buttons button {
        width: 100%;
    }

    .flashcard {
        height: 290px;
    }

    .flashcard-side {
        padding: 25px;
    }

    .flashcard-side p {
        font-size: 21px;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">

            <div class="logo-icon">
                ✓
            </div>

            Flashcard.com

        </div>

        <div class="header-right">
            Study smarter
        </div>

    </div>

</header>


<div class="container">


    <div id="home">

        <div class="page-title">

            <h1>My Flashcards</h1>

            <p>
                Create sets and study at your own pace.
            </p>

        </div>


        <div class="panel">

            <h2>Create a new set</h2>

            <input
                id="set-name"
                type="text"
                placeholder="Enter a set name"
            >

            <button onclick="createSet()">
                Create set
            </button>

        </div>


        <div class="panel">

            <h2>Your sets</h2>

            <div
                id="set-grid"
                class="set-grid"
            ></div>

            <div
                id="empty-message"
                class="empty"
            >
                You don't have any flashcard sets yet.
            </div>

        </div>

    </div>



    <div id="editor">

        <div class="top-actions">

            <button
                class="secondary"
                onclick="showHome()"
            >
                ← My Sets
            </button>

        </div>


        <div class="page-title">

            <h1 id="editor-title">
                Flashcard Set
            </h1>

            <p>
                Add questions and answers to your set.
            </p>

        </div>


        <div class="panel">

            <h2>Add a card</h2>

            <input
                id="question"
                type="text"
                placeholder="Question"
            >

            <textarea
                id="answer"
                placeholder="Answer"
            ></textarea>

            <button onclick="addCard()">
                Add card
            </button>

        </div>


        <div class="panel">

            <h2>Cards</h2>

            <div id="card-list"></div>

            <button onclick="startStudy()">
                Study this set
            </button>

        </div>

    </div>



    <div id="study">

        <div class="top-actions">

            <button
                class="secondary"
                onclick="showHome()"
            >
                ← My Sets
            </button>

        </div>


        <div class="study-area">

            <div class="page-title">

                <h1 id="study-title">
                    Study
                </h1>

                <p>
                    Click the card to reveal the answer.
                </p>

            </div>


            <div
                id="study-info"
                class="study-label"
            >
                Card 1 of 1
            </div>


            <div
                id="flashcard"
                class="flashcard"
                onclick="flipCard()"
            >

                <div class="flashcard-inner">

                    <div class="flashcard-side">

                        <p id="card-question"></p>

                    </div>


                    <div class="flashcard-side flashcard-back">

                        <p id="card-answer"></p>

                    </div>

                </div>

            </div>


            <div class="study-controls">

                <button
                    class="secondary"
                    onclick="previousCard()"
                >
                    ← Previous
                </button>

                <button onclick="flipCard()">
                    Flip card
                </button>

                <button
                    class="secondary"
                    onclick="nextCard()"
                >
                    Next →
                </button>

            </div>

        </div>

    </div>

</div>


<script>

let sets =
    JSON.parse(
        localStorage.getItem("flashcardSets")
    ) || [];

let currentSetIndex = null;

let currentStudyCard = 0;


function saveSets() {

    localStorage.setItem(
        "flashcardSets",
        JSON.stringify(sets)
    );

}


function createSet() {

    const input =
        document.getElementById("set-name");

    const name =
        input.value.trim();

    if (!name) {

        alert("Please enter a set name.");

        return;
    }

    sets.push({

        name: name,

        cards: []

    });

    saveSets();

    input.value = "";

    renderSets();

}


function renderSets() {

    const grid =
        document.getElementById("set-grid");

    const empty =
        document.getElementById("empty-message");

    grid.innerHTML = "";

    if (sets.length === 0) {

        empty.style.display = "block";

        return;
    }

    empty.style.display = "none";


    sets.forEach((set, index) => {

        const card =
            document.createElement("div");

        card.className = "set-card";

        card.innerHTML = `

            <h3>
                ${escapeHTML(set.name)}
            </h3>

            <p>
                ${set.cards.length}
                card${set.cards.length === 1 ? "" : "s"}
            </p>

            <div class="set-buttons">

                <button
                    onclick="openSet(${index})"
                >
                    Edit
                </button>

                <button
                    onclick="startStudyFromSet(${index})"
                >
                    Study
                </button>

                <button
                    class="danger"
                    onclick="deleteSet(${index})"
                >
                    Delete
                </button>

            </div>

        `;

        grid.appendChild(card);

    });

}


function openSet(index) {

    currentSetIndex = index;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("study")
        .style.display = "none";

    document.getElementById("editor")
        .style.display = "block";

    document.getElementById("editor-title")
        .textContent =
        sets[index].name;

    renderCards();

}


function renderCards() {

    const list =
        document.getElementById("card-list");

    list.innerHTML = "";

    const cards =
        sets[currentSetIndex].cards;


    if (cards.length === 0) {

        list.innerHTML =
            '<div class="empty">No cards in this set yet.</div>';

        return;
    }


    cards.forEach((card, index) => {

        const item =
            document.createElement("div");

        item.className = "card-item";

        item.innerHTML = `

            <div class="card-label">
                Question
            </div>

            <div class="card-text">
                ${escapeHTML(card.question)}
            </div>

            <div class="card-label">
                Answer
            </div>

            <div class="card-text">
                ${escapeHTML(card.answer)}
            </div>

            <div class="card-actions">

                <button
                    class="danger"
                    onclick="deleteCard(${index})"
                >
                    Delete
                </button>

            </div>

        `;

        list.appendChild(item);

    });

}


function addCard() {

    const question =
        document.getElementById("question")
            .value.trim();

    const answer =
        document.getElementById("answer")
            .value.trim();


    if (!question || !answer) {

        alert(
            "Please enter both a question and an answer."
        );

        return;
    }


    sets[currentSetIndex].cards.push({

        question: question,

        answer: answer

    });


    saveSets();


    document.getElementById("question")
        .value = "";

    document.getElementById("answer")
        .value = "";


    renderCards();

    renderSets();

}


function deleteCard(index) {

    sets[currentSetIndex].cards.splice(
        index,
        1
    );

    saveSets();

    renderCards();

    renderSets();

}


function deleteSet(index) {

    if (
        !confirm(
            "Are you sure you want to delete this set?"
        )
    ) {
        return;
    }

    sets.splice(index, 1);

    saveSets();

    renderSets();

}


function startStudyFromSet(index) {

    currentSetIndex = index;

    startStudy();

}


function startStudy() {

    const cards =
        sets[currentSetIndex].cards;


    if (cards.length === 0) {

        alert(
            "Add some cards to this set first."
        );

        return;
    }


    currentStudyCard = 0;


    document.getElementById("home")
        .style.display = "none";

    document.getElementById("editor")
        .style.display = "none";

    document.getElementById("study")
        .style.display = "block";


    document.getElementById("study-title")
        .textContent =
        sets[currentSetIndex].name;


    updateStudyCard();

}


function updateStudyCard() {

    const cards =
        sets[currentSetIndex].cards;

    const card =
        cards[currentStudyCard];


    document.getElementById("card-question")
        .textContent =
        card.question;

    document.getElementById("card-answer")
        .textContent =
        card.answer;


    document.getElementById("study-info")
        .textContent =
        `Card ${currentStudyCard + 1} of ${cards.length}`;


    document.getElementById("flashcard")
        .classList.remove("flipped");

}


function flipCard() {

    document.getElementById("flashcard")
        .classList.toggle("flipped");

}


function nextCard() {

    const cards =
        sets[currentSetIndex].cards;

    currentStudyCard++;


    if (
        currentStudyCard >= cards.length
    ) {

        currentStudyCard = 0;

    }


    updateStudyCard();

}


function previousCard() {

    const cards =
        sets[currentSetIndex].cards;

    currentStudyCard--;


    if (currentStudyCard < 0) {

        currentStudyCard =
            cards.length - 1;

    }


    updateStudyCard();

}


function showHome() {

    document.getElementById("home")
        .style.display = "block";

    document.getElementById("editor")
        .style.display = "none";

    document.getElementById("study")
        .style.display = "none";

    renderSets();

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


let rPresses = 0;

let rTimer;


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key.toLowerCase() !== "r"
        ) {
            return;
        }


        rPresses++;

        clearTimeout(rTimer);


        rTimer =
            setTimeout(
                function() {

                    rPresses = 0;

                },
                700
            );


        if (rPresses === 3) {

            window.location.href =
                "index.html";

            rPresses = 0;

        }

    }
);


renderSets();

</script>

</body>
</html>
