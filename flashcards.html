<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard.com</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6f8;
            color: #222;
            font-family: Arial, sans-serif;
        }

        header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 18px 30px;
        }

        header h1 {
            margin: 0;
            color: #2563eb;
            font-size: 28px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
        }

        .creator {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .creator h2 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 7px 0 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        #addButton {
            background: #2563eb;
            color: white;
        }

        #clearButton {
            background: #dc2626;
            color: white;
            margin-left: 7px;
        }

        #addButton:hover {
            background: #1d4ed8;
        }

        #clearButton:hover {
            background: #b91c1c;
        }

        #cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            height: 190px;
            perspective: 1000px;
            cursor: pointer;
        }

        .cardInner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.flipped .cardInner {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            backface-visibility: hidden;
            word-break: break-word;
        }

        .front {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #16a34a;
            color: white;
            transform: rotateY(180deg);
        }

        .deleteButton {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 5px 8px;
            background: #dc2626;
            color: white;
            z-index: 5;
        }

        #empty {
            text-align: center;
            color: #777;
            margin-top: 30px;
        }

        #home {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }

        #home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <h1>Flashcard.com</h1>
    </header>

    <main>

        <div class="creator">

            <h2>Create Flashcard</h2>

            <input
                id="question"
                type="text"
                placeholder="Question"
            >

            <textarea
                id="answer"
                placeholder="Answer"
            ></textarea>

            <button id="addButton">
                Add Flashcard
            </button>

            <button id="clearButton">
                Clear All
            </button>

        </div>

        <div id="cards"></div>

        <div id="empty">
            No flashcards yet. Create one above!
        </div>

        <a id="home" href="index.html">
            ← Back to Home
        </a>

    </main>

    <script>
        const questionInput =
            document.getElementById("question");

        const answerInput =
            document.getElementById("answer");

        const addButton =
            document.getElementById("addButton");

        const clearButton =
            document.getElementById("clearButton");

        const cardsContainer =
            document.getElementById("cards");

        const emptyMessage =
            document.getElementById("empty");

        let cards =
            JSON.parse(
                localStorage.getItem("flashcardData")
            ) || [];

        function saveCards() {
            localStorage.setItem(
                "flashcardData",
                JSON.stringify(cards)
            );
        }

        function escapeHTML(text) {
            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }

        function displayCards() {
            cardsContainer.innerHTML = "";

            emptyMessage.style.display =
                cards.length === 0
                    ? "block"
                    : "none";

            cards.forEach((card, index) => {

                const cardElement =
                    document.createElement("div");

                cardElement.className = "card";

                cardElement.innerHTML = `
                    <div class="cardInner">

                        <div class="front">

                            <button
                                class="deleteButton"
                                data-index="${index}"
                            >
                                X
                            </button>

                            ${escapeHTML(card.question)}

                        </div>

                        <div class="back">

                            ${escapeHTML(card.answer)}

                        </div>

                    </div>
                `;

                cardElement.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.classList
                                .contains("deleteButton")
                        ) {
                            return;
                        }

                        cardElement.classList.toggle(
                            "flipped"
                        );
                    }
                );

                cardElement
                    .querySelector(".deleteButton")
                    .addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            cards.splice(index, 1);

                            saveCards();
                            displayCards();
                        }
                    );

                cardsContainer.appendChild(
                    cardElement
                );
            });
        }

        addButton.addEventListener(
            "click",
            () => {

                const question =
                    questionInput.value.trim();

                const answer =
                    answerInput.value.trim();

                if (
                    question === "" ||
                    answer === ""
                ) {
                    alert(
                        "Please enter both a question and an answer."
                    );

                    return;
                }

                cards.push({
                    question: question,
                    answer: answer
                });

                saveCards();

                questionInput.value = "";
                answerInput.value = "";

                displayCards();
            }
        );

        clearButton.addEventListener(
            "click",
            () => {

                if (cards.length === 0) {
                    return;
                }

                if (
                    confirm(
                        "Are you sure you want to delete all flashcards?"
                    )
                ) {
                    cards = [];

                    saveCards();
                    displayCards();
                }
            }
        );

        let rPresses = 0;
        let rTimer;

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key.toLowerCase() !== "r"
                ) {
                    return;
                }

                rPresses++;

                clearTimeout(rTimer);

                rTimer = setTimeout(
                    () => {
                        rPresses = 0;
                    },
                    700
                );

                if (rPresses === 3) {
                    window.location.href =
                        "index.html";

                    rPresses = 0;
                }
            }
        );

        displayCards();
    </script>

</body>
</html>
