<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard.com</title>

<style>
body {
    margin: 0;
    background: #ffffff;
    color: #222;
    font-family: Arial, sans-serif;
}

header {
    background: #1976d2;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 7px 0 0;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 30px auto;
}

.section {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 22px;
    margin-bottom: 22px;
}

h2 {
    color: #1976d2;
    margin-top: 0;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #bbb;
    border-radius: 5px;
    font-size: 16px;
    box-sizing: border-box;
}

textarea {
    height: 100px;
    resize: vertical;
}

button {
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1565c0;
}

.set-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}

.set-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 18px;
    background: #fafafa;
    min-width: 0;
}

.set-card h3 {
    color: #1976d2;
    margin-top: 0;
    overflow-wrap: anywhere;
}

.set-card p {
    color: #666;
}

.set-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.set-buttons button {
    flex: 1;
    min-width: 65px;
}

.delete-button {
    background: #e53935;
}

.delete-button:hover {
    background: #c62828;
}

#editor,
#study {
    display: none;
}

.card-item {
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 16px;
    margin-bottom: 12px;
    background: #fafafa;
    overflow: hidden;
}

.card-item strong {
    color: #1976d2;
}

.card-item p {
    overflow-wrap: anywhere;
}

.card-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
}

.flashcard {
    max-width: 650px;
    height: 330px;
    margin: 25px auto;
    perspective: 1000px;
    cursor: pointer;
}

.flashcard-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s;
    transform-style: preserve-3d;
}

.flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
}

.flashcard-side {
    position: absolute;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    backface-visibility: hidden;
    border: 2px solid #1976d2;
    border-radius: 10px;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    text-align: center;
}

.flashcard-side p {
    font-size: 26px;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.flashcard-back {
    transform: rotateY(180deg);
    border-color: #555;
}

.study-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

#study-info {
    text-align: center;
    color: #666;
}

#empty-message {
    text-align: center;
    color: #777;
}

@media (max-width: 600px) {
    .set-buttons {
        flex-direction: column;
    }

    .set-buttons button {
        width: 100%;
    }

    .flashcard {
        height: 270px;
    }

    .flashcard-side p {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Flashcard.com</h1>
    <p>Create and study your flashcards</p>
</header>

<div class="container">

    <div id="home">

        <div class="section">
            <h2>Create a Set</h2>

            <input
                id="set-name"
                type="text"
                placeholder="Set name"
            >

            <button onclick="createSet()">
                Create Set
            </button>
        </div>

        <div class="section">
            <h2>Your Sets</h2>

            <div id="set-grid" class="set-grid"></div>

            <div id="empty-message">
                No sets created yet.
            </div>
        </div>

    </div>

    <div id="editor">

        <div class="section">

            <h2 id="editor-title">
                Flashcard Set
            </h2>

            <input
                id="question"
                type="text"
                placeholder="Question"
            >

            <textarea
                id="answer"
                placeholder="Answer"
            ></textarea>

            <button onclick="addCard()">
                Add Card
            </button>

        </div>

        <div class="section">

            <h2>Your Cards</h2>

            <div id="card-list"></div>

            <button onclick="startStudy()">
                Study Set
            </button>

        </div>

    </div>

    <div id="study">

        <div class="section">

            <h2 id="study-title">
                Study
            </h2>

            <div id="study-info">
                Card 1 of 1
            </div>

            <div
                id="flashcard"
                class="flashcard"
                onclick="flipCard()"
            >
                <div class="flashcard-inner">

                    <div class="flashcard-side">
                        <p id="card-question"></p>
                    </div>

                    <div class="flashcard-side flashcard-back">
                        <p id="card-answer"></p>
                    </div>

                </div>
            </div>

            <div class="study-controls">

                <button onclick="previousCard()">
                    Previous
                </button>

                <button onclick="flipCard()">
                    Flip
                </button>

                <button onclick="nextCard()">
                    Next
                </button>

            </div>

        </div>

    </div>

</div>

<script>

let sets =
    JSON.parse(
        localStorage.getItem("flashcardSets")
    ) || [];

let currentSetIndex = null;
let currentStudyCard = 0;

function saveSets() {
    localStorage.setItem(
        "flashcardSets",
        JSON.stringify(sets)
    );
}

function createSet() {

    const input =
        document.getElementById("set-name");

    const name =
        input.value.trim();

    if (!name) {
        alert("Enter a set name.");
        return;
    }

    sets.push({
        name: name,
        cards: []
    });

    saveSets();

    input.value = "";

    renderSets();
}

function renderSets() {

    const grid =
        document.getElementById("set-grid");

    const empty =
        document.getElementById("empty-message");

    grid.innerHTML = "";

    if (sets.length === 0) {
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    sets.forEach((set, index) => {

        const card =
            document.createElement("div");

        card.className = "set-card";

        card.innerHTML = `
            <h3>${escapeHTML(set.name)}</h3>

            <p>
                ${set.cards.length}
                card${set.cards.length === 1 ? "" : "s"}
            </p>

            <div class="set-buttons">

                <button onclick="openSet(${index})">
                    Edit
                </button>

                <button onclick="startStudyFromSet(${index})">
                    Study
                </button>

                <button
                    class="delete-button"
                    onclick="deleteSet(${index})"
                >
                    Delete
                </button>

            </div>
        `;

        grid.appendChild(card);
    });
}

function openSet(index) {

    currentSetIndex = index;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("study")
        .style.display = "none";

    document.getElementById("editor")
        .style.display = "block";

    document.getElementById("editor-title")
        .textContent = sets[index].name;

    renderCards();
}

function renderCards() {

    const list =
        document.getElementById("card-list");

    list.innerHTML = "";

    const cards =
        sets[currentSetIndex].cards;

    if (cards.length === 0) {

        list.innerHTML =
            "<p>No cards yet.</p>";

        return;
    }

    cards.forEach((card, index) => {

        const item =
            document.createElement("div");

        item.className = "card-item";

        item.innerHTML = `
            <strong>Question</strong>

            <p>
                ${escapeHTML(card.question)}
            </p>

            <strong>Answer</strong>

            <p>
                ${escapeHTML(card.answer)}
            </p>

            <div class="card-actions">

                <button
                    class="delete-button"
                    onclick="deleteCard(${index})"
                >
                    Delete
                </button>

            </div>
        `;

        list.appendChild(item);
    });
}

function addCard() {

    const question =
        document.getElementById("question")
            .value.trim();

    const answer =
        document.getElementById("answer")
            .value.trim();

    if (!question || !answer) {
        alert("Enter both a question and an answer.");
        return;
    }

    sets[currentSetIndex].cards.push({
        question: question,
        answer: answer
    });

    saveSets();

    document.getElementById("question").value = "";
    document.getElementById("answer").value = "";

    renderCards();
    renderSets();
}

function deleteCard(index) {

    sets[currentSetIndex].cards.splice(
        index,
        1
    );

    saveSets();

    renderCards();
    renderSets();
}

function deleteSet(index) {

    if (!confirm("Delete this set?")) {
        return;
    }

    sets.splice(index, 1);

    saveSets();

    renderSets();
}

function startStudyFromSet(index) {

    currentSetIndex = index;

    startStudy();
}

function startStudy() {

    const cards =
        sets[currentSetIndex].cards;

    if (cards.length === 0) {
        alert("Add cards before studying.");
        return;
    }

    currentStudyCard = 0;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("editor")
        .style.display = "none";

    document.getElementById("study")
        .style.display = "block";

    document.getElementById("study-title")
        .textContent =
        sets[currentSetIndex].name;

    updateStudyCard();
}

function updateStudyCard() {

    const cards =
        sets[currentSetIndex].cards;

    const card =
        cards[currentStudyCard];

    document.getElementById("card-question")
        .textContent =
        card.question;

    document.getElementById("card-answer")
        .textContent =
        card.answer;

    document.getElementById("study-info")
        .textContent =
        `Card ${currentStudyCard + 1} of ${cards.length}`;

    document.getElementById("flashcard")
        .classList.remove("flipped");
}

function flipCard() {

    document.getElementById("flashcard")
        .classList.toggle("flipped");
}

function nextCard() {

    const cards =
        sets[currentSetIndex].cards;

    currentStudyCard++;

    if (currentStudyCard >= cards.length) {
        currentStudyCard = 0;
    }

    updateStudyCard();
}

function previousCard() {

    const cards =
        sets[currentSetIndex].cards;

    currentStudyCard--;

    if (currentStudyCard < 0) {
        currentStudyCard = cards.length - 1;
    }

    updateStudyCard();
}

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

let rPresses = 0;
let rTimer;

document.addEventListener("keydown", event => {

    if (event.key.toLowerCase() !== "r") {
        return;
    }

    rPresses++;

    clearTimeout(rTimer);

    rTimer = setTimeout(() => {
        rPresses = 0;
    }, 700);

    if (rPresses === 3) {

        window.location.href = "index.html";

        rPresses = 0;
    }
});

renderSets();

</script>

</body>
</html>
