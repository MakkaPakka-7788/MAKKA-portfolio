```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard Creator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f8ff;
    color: #17233d;
    font-family: Arial, sans-serif;
}

header {
    background: white;
    border-bottom: 1px solid #dce6f5;
    padding: 18px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #246bce;
}

.container {
    width: min(1000px, 92%);
    margin: 35px auto;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

h1 {
    margin: 0;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 17px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.primary {
    background: #246bce;
    color: white;
}

.primary:hover {
    background: #1858b2;
}

.secondary {
    background: #e8f1ff;
    color: #246bce;
}

.danger {
    background: #ffe7e7;
    color: #c62828;
}

.sets {
    margin-top: 25px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 15px;
}

.set {
    background: white;
    border: 1px solid #dce6f5;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
}

.set:hover {
    border-color: #246bce;
}

.set h3 {
    margin: 0 0 8px;
}

.set p {
    color: #71809b;
}

.actions {
    display: flex;
    gap: 7px;
    margin-top: 15px;
}

.editor {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-top: 25px;
    border: 1px solid #dce6f5;
}

input,
textarea {
    width: 100%;
    border: 1px solid #cbd7e8;
    border-radius: 8px;
    padding: 12px;
    margin-top: 7px;
    margin-bottom: 16px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

.cardEditor {
    border: 1px solid #dce6f5;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}

.cardNumber {
    font-weight: bold;
    margin-bottom: 10px;
    color: #246bce;
}

.study {
    display: none;
    margin-top: 25px;
}

.studyCard {
    background: white;
    border: 1px solid #dce6f5;
    border-radius: 15px;
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    font-size: 28px;
    cursor: pointer;
}

.studyControls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.small {
    color: #71809b;
    font-size: 14px;
}

.empty {
    background: white;
    border: 1px dashed #b9c8dd;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: #71809b;
    margin-top: 25px;
}

</style>
</head>

<body>

<header>

<div class="logo">
Flashcard Creator
</div>

<button class="secondary" onclick="showSets()">
My Sets
</button>

</header>


<div class="container">

<div id="setsPage">

<div class="top">

<div>
<h1>My Flashcards</h1>
<p class="small">
Create sets and study whenever you want.
</p>
</div>

<button class="primary" onclick="createSet()">
+ New Set
</button>

</div>

<div id="sets" class="sets"></div>

</div>


<div id="editor" class="editor">

<div class="top">

<h2 id="editorTitle">
New Set
</h2>

<button class="secondary" onclick="showSets()">
Back
</button>

</div>

<label>
Set name
</label>

<input
id="setName"
placeholder="e.g. Science"
/>

<div id="cards"></div>

<button class="secondary" onclick="addCard()">
+ Add Card
</button>

<br><br>

<button class="primary" onclick="saveSet()">
Save Set
</button>

</div>


<div id="study" class="study">

<div class="top">

<div>

<h2 id="studyTitle">
Study
</h2>

<p id="studyCounter" class="small"></p>

</div>

<button class="secondary" onclick="showSets()">
Exit
</button>

</div>

<div
id="studyCard"
class="studyCard"
onclick="flipCard()"
>
Click to reveal
</div>

<div class="studyControls">

<button
class="secondary"
onclick="previousCard()"
>
← Previous
</button>

<button
class="primary"
onclick="nextCard()"
>
Next →
</button>

</div>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let sets =
    JSON.parse(
        localStorage.getItem(
            "flashcardSets"
        ) || "[]"
    );

let editingIndex = null;

let studyIndex = 0;

let studySide = "front";


/* =========================
   SAVE DATA
========================= */

function saveData() {

    localStorage.setItem(
        "flashcardSets",
        JSON.stringify(sets)
    );
}


/* =========================
   SHOW SETS
========================= */

function showSets() {

    document.getElementById(
        "setsPage"
    ).style.display = "block";

    document.getElementById(
        "editor"
    ).style.display = "none";

    document.getElementById(
        "study"
    ).style.display = "none";

    renderSets();
}


/* =========================
   RENDER SETS
========================= */

function renderSets() {

    const container =
        document.getElementById(
            "sets"
        );

    container.innerHTML = "";


    if (sets.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>No flashcard sets yet</h3>
                <p>Create your first set to get started.</p>
            </div>
        `;

        return;
    }


    sets.forEach(
        (set, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "set";


            div.innerHTML = `

                <h3>
                    ${escapeHTML(set.name)}
                </h3>

                <p>
                    ${set.cards.length}
                    card${set.cards.length === 1 ? "" : "s"}
                </p>

                <div class="actions">

                    <button
                        class="primary"
                        onclick="studySet(${index}); event.stopPropagation();"
                    >
                        Study
                    </button>

                    <button
                        class="secondary"
                        onclick="editSet(${index}); event.stopPropagation();"
                    >
                        Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteSet(${index}); event.stopPropagation();"
                    >
                        Delete
                    </button>

                </div>
            `;


            div.onclick = () =>
                studySet(index);


            container.appendChild(
                div
            );
        }
    );
}


/* =========================
   CREATE SET
========================= */

function createSet() {

    editingIndex = null;


    document.getElementById(
        "setsPage"
    ).style.display = "none";


    document.getElementById(
        "study"
    ).style.display = "none";


    document.getElementById(
        "editor"
    ).style.display = "block";


    document.getElementById(
        "editorTitle"
    ).textContent =
        "New Set";


    document.getElementById(
        "setName"
    ).value = "";


    document.getElementById(
        "cards"
    ).innerHTML = "";


    addCard();
}


/* =========================
   ADD CARD
========================= */

function addCard(
    front = "",
    back = ""
) {

    const container =
        document.getElementById(
            "cards"
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "cardEditor";


    card.innerHTML = `

        <div class="cardNumber">
            Card
        </div>

        <label>
            Front
        </label>

        <textarea
            class="front"
            placeholder="Question or term"
        >${escapeHTML(front)}</textarea>

        <label>
            Back
        </label>

        <textarea
            class="back"
            placeholder="Answer or definition"
        >${escapeHTML(back)}</textarea>

        <button
            class="danger"
            onclick="this.parentElement.remove(); updateCardNumbers();"
        >
            Delete Card
        </button>
    `;


    container.appendChild(
        card
    );


    updateCardNumbers();
}


/* =========================
   CARD NUMBERS
========================= */

function updateCardNumbers() {

    const cards =
        document.querySelectorAll(
            ".cardEditor"
        );


    cards.forEach(
        (card, index) => {

            card.querySelector(
                ".cardNumber"
            ).textContent =
                "Card " +
                (index + 1);
        }
    );
}


/* =========================
   SAVE SET
========================= */

function saveSet() {

    const name =
        document.getElementById(
            "setName"
        ).value.trim();


    if (!name) {

        alert(
            "Please enter a set name."
        );

        return;
    }


    const cardElements =
        document.querySelectorAll(
            ".cardEditor"
        );


    const cards = [];


    cardElements.forEach(
        card => {

            const front =
                card.querySelector(
                    ".front"
                ).value.trim();


            const back =
                card.querySelector(
                    ".back"
                ).value.trim();


            if (
                front ||
                back
            ) {

                cards.push({
                    front,
                    back
                });
            }
        }
    );


    if (
        cards.length === 0
    ) {

        alert(
            "Add at least one card."
        );

        return;
    }


    const newSet = {

        name,
        cards
    };


    if (
        editingIndex === null
    ) {

        sets.push(
            newSet
        );

    } else {

        sets[
            editingIndex
        ] =
            newSet;
    }


    saveData();

    showSets();
}


/* =========================
   EDIT SET
========================= */

function editSet(index) {

    editingIndex =
        index;


    const set =
        sets[index];


    document.getElementById(
        "setsPage"
    ).style.display = "none";


    document.getElementById(
        "study"
    ).style.display = "none";


    document.getElementById(
        "editor"
    ).style.display = "block";


    document.getElementById(
        "editorTitle"
    ).textContent =
        "Edit Set";


    document.getElementById(
        "setName"
    ).value =
        set.name;


    document.getElementById(
        "cards"
    ).innerHTML = "";


    set.cards.forEach(
        card => {

            addCard(
                card.front,
                card.back
            );
        }
    );
}


/* =========================
   DELETE SET
========================= */

function deleteSet(index) {

    if (
        !confirm(
            "Delete this flashcard set?"
        )
    )
        return;


    sets.splice(
        index,
        1
    );


    saveData();

    renderSets();
}


/* =========================
   STUDY
========================= */

function studySet(index) {

    const set =
        sets[index];


    if (
        !set.cards.length
    ) {

        alert(
            "This set has no cards."
        );

        return;
    }


    document.getElementById(
        "setsPage"
    ).style.display = "none";


    document.getElementById(
        "editor"
    ).style.display = "none";


    document.getElementById(
        "study"
    ).style.display = "block";


    document.getElementById(
        "studyTitle"
    ).textContent =
        set.name;


    window.currentStudySet =
        set;


    studyIndex = 0;

    studySide = "front";


    updateStudyCard();
}


/* =========================
   UPDATE STUDY CARD
========================= */

function updateStudyCard() {

    const set =
        window.currentStudySet;


    const card =
        set.cards[
            studyIndex
        ];


    document.getElementById(
        "studyCounter"
    ).textContent =

        "Card " +
        (studyIndex + 1) +
        " of " +
        set.cards.length;


    document.getElementById(
        "studyCard"
    ).textContent =

        studySide === "front"
        ? card.front
        : card.back;
}


/* =========================
   FLIP
========================= */

function flipCard() {

    studySide =
        studySide === "front"
        ? "back"
        : "front";


    updateStudyCard();
}


/* =========================
   NEXT
========================= */

function nextCard() {

    const set =
        window.currentStudySet;


    studyIndex++;


    if (
        studyIndex >=
        set.cards.length
    ) {

        studyIndex = 0;
    }


    studySide = "front";


    updateStudyCard();
}


/* =========================
   PREVIOUS
========================= */

function previousCard() {

    const set =
        window.currentStudySet;


    studyIndex--;


    if (
        studyIndex < 0
    ) {

        studyIndex =
            set.cards.length - 1;
    }


    studySide = "front";


    updateStudyCard();
}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   RRR SHORTCUT
========================= */

let rCount = 0;

let rTimer;


document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key.toLowerCase()
            !== "r"
        )
            return;


        rCount++;


        clearTimeout(
            rTimer
        );


        rTimer =
            setTimeout(
                () => {
                    rCount = 0;
                },
                700
            );


        if (
            rCount === 3
        ) {

            rCount = 0;


            window.location.href =
                "index.html?games=true";
        }
    }
);


/* =========================
   START
========================= */

showSets();

</script>

</body>
</html>
```
