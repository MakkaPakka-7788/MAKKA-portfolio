<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard.com</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 25px 10px;
    border-bottom: 2px solid #00ff66;
    box-shadow: 0 0 20px rgba(0,255,102,0.3);
}

header h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: 5px;
    color: #00ff66;
    text-shadow:
        0 0 8px #00ff66,
        0 0 20px #00ff66,
        0 0 40px #00ff66;
}

header p {
    color: #888;
    margin-bottom: 0;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 30px auto;
}

.section {
    background: #080808;
    border: 2px solid #222;
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 0 15px rgba(0,255,102,0.08);
}

h2 {
    color: #00ff66;
    margin-top: 0;
}

input,
textarea {
    width: 100%;
    background: #111;
    border: 2px solid #333;
    color: white;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 16px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #00ff66;
    box-shadow: 0 0 10px rgba(0,255,102,0.2);
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    background: #050505;
    color: #00ff66;
    border: 2px solid #00ff66;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00ff66;
    color: #000;
}

.back-button {
    margin-bottom: 20px;
}

.set-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.set-card {
    background: #101010;
    border: 2px solid #333;
    padding: 20px;
    border-radius: 8px;
    transition: 0.2s;
}

.set-card:hover {
    border-color: #00ff66;
    box-shadow: 0 0 15px rgba(0,255,102,0.25);
}

.set-card h3 {
    color: #00ff66;
    margin-top: 0;
}

.set-card p {
    color: #888;
}

.set-buttons {
    display: flex;
    gap: 8px;
}

.delete-button {
    color: #ff1744;
    border-color: #ff1744;
}

.delete-button:hover {
    background: #ff1744;
    color: white;
}

.hidden {
    display: none;
}

#editor {
    display: none;
}

.card-list {
    margin-top: 20px;
}

.card-item {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 12px;
}

.card-item strong {
    color: #00ff66;
}

.card-item p {
    color: #ccc;
}

.card-actions {
    display: flex;
    gap: 8px;
}

#study {
    display: none;
    text-align: center;
}

.flashcard {
    width: 100%;
    max-width: 650px;
    height: 350px;
    margin: 30px auto;
    perspective: 1000px;
    cursor: pointer;
}

.flashcard-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s;
    transform-style: preserve-3d;
}

.flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
}

.flashcard-side {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    background: #080808;
    border: 3px solid #00ff66;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px;
    box-shadow:
        0 0 15px rgba(0,255,102,0.3),
        inset 0 0 20px rgba(0,255,102,0.03);
}

.flashcard-side p {
    font-size: 28px;
    line-height: 1.4;
    word-break: break-word;
}

.flashcard-back {
    transform: rotateY(180deg);
    border-color: #00e5ff;
    box-shadow:
        0 0 15px rgba(0,229,255,0.3),
        inset 0 0 20px rgba(0,229,255,0.03);
}

.study-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

#study-info {
    color: #888;
    margin: 15px;
}

#empty-message {
    color: #777;
    text-align: center;
    padding: 20px;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 30px;
    }

    .flashcard {
        height: 280px;
    }

    .flashcard-side p {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Flashcard.com</h1>
    <p>Make your own flashcard sets</p>
</header>

<div class="container">

    <button class="back-button" onclick="showHome()">
        ← Back
    </button>

    <div id="home">

        <div class="section">

            <h2>Create a Flashcard Set</h2>

            <input
                id="set-name"
                type="text"
                placeholder="Set name, e.g. Biology"
            >

            <button onclick="createSet()">
                Create Set
            </button>

        </div>

        <div class="section">

            <h2>Your Sets</h2>

            <div id="set-grid" class="set-grid"></div>

            <div id="empty-message">
                You haven't created any sets yet.
            </div>

        </div>

    </div>

    <div id="editor">

        <div class="section">

            <h2 id="editor-title">
                Flashcard Set
            </h2>

            <input
                id="question"
                type="text"
                placeholder="Question"
            >

            <textarea
                id="answer"
                placeholder="Answer"
            ></textarea>

            <button onclick="addCard()">
                + Add Card
            </button>

        </div>

        <div class="section">

            <h2>Your Cards</h2>

            <div id="card-list"></div>

            <br>

            <button onclick="startStudy()">
                Study Set
            </button>

        </div>

    </div>

    <div id="study">

        <div class="section">

            <h2 id="study-title">
                Study
            </h2>

            <div id="study-info">
                Card 1 of 1
            </div>

            <div
                id="flashcard"
                class="flashcard"
                onclick="flipCard()"
            >

                <div class="flashcard-inner">

                    <div class="flashcard-side">
                        <p id="card-question"></p>
                    </div>

                    <div class="flashcard-side flashcard-back">
                        <p id="card-answer"></p>
                    </div>

                </div>

            </div>

            <p style="color:#777;">
                Click the card to flip it
            </p>

            <div class="study-controls">

                <button onclick="previousCard()">
                    ← Previous
                </button>

                <button onclick="flipCard()">
                    Flip
                </button>

                <button onclick="nextCard()">
                    Next →
                </button>

            </div>

        </div>

    </div>

</div>

<script>

let sets =
    JSON.parse(
        localStorage.getItem("flashcardSets")
    ) || [];

let currentSetIndex = null;
let currentStudyCard = 0;

function saveSets() {
    localStorage.setItem(
        "flashcardSets",
        JSON.stringify(sets)
    );
}

function createSet() {

    const input =
        document.getElementById("set-name");

    const name =
        input.value.trim();

    if (!name) {
        alert("Enter a name for your set.");
        return;
    }

    sets.push({
        name: name,
        cards: []
    });

    saveSets();

    input.value = "";

    renderSets();
}

function renderSets() {

    const grid =
        document.getElementById("set-grid");

    const empty =
        document.getElementById("empty-message");

    grid.innerHTML = "";

    if (sets.length === 0) {
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    sets.forEach((set, index) => {

        const card =
            document.createElement("div");

        card.className = "set-card";

        card.innerHTML = `
            <h3>${escapeHTML(set.name)}</h3>

            <p>
                ${set.cards.length}
                card${set.cards.length === 1 ? "" : "s"}
            </p>

            <div class="set-buttons">

                <button onclick="openSet(${index})">
                    Edit
                </button>

                <button onclick="startStudyFromSet(${index})">
                    Study
                </button>

                <button
                    class="delete-button"
                    onclick="deleteSet(${index})"
                >
                    Delete
                </button>

            </div>
        `;

        grid.appendChild(card);
    });
}

function openSet(index) {

    currentSetIndex = index;

    document.getElementById("home").style.display =
        "none";

    document.getElementById("study").style.display =
        "none";

    document.getElementById("editor").style.display =
        "block";

    document.getElementById("editor-title").textContent =
        sets[index].name;

    renderCards();
}

function renderCards() {

    const list =
        document.getElementById("card-list");

    list.innerHTML = "";

    const cards =
        sets[currentSetIndex].cards;

    if (cards.length === 0) {

        list.innerHTML =
            `<p style="color:#777;">
                No cards yet. Add your first card above.
            </p>`;

        return;
    }

    cards.forEach((card, index) => {

        const item =
            document.createElement("div");

        item.className = "card-item";

        item.innerHTML = `
            <strong>
                Question
            </strong>

            <p>
                ${escapeHTML(card.question)}
            </p>

            <strong>
                Answer
            </strong>

            <p>
                ${escapeHTML(card.answer)}
            </p>

            <div class="card-actions">

                <button
                    class="delete-button"
                    onclick="deleteCard(${index})"
                >
                    Delete
                </button>

            </div>
        `;

        list.appendChild(item);
    });
}

function addCard() {

    const question =
        document.getElementById("question")
            .value.trim();

    const answer =
        document.getElementById("answer")
            .value.trim();

    if (!question || !answer) {
        alert("Enter both a question and an answer.");
        return;
    }

    sets[currentSetIndex].cards.push({
        question: question,
        answer: answer
    });

    saveSets();

    document.getElementById("question").value = "";
    document.getElementById("answer").value = "";

    renderCards();
    renderSets();
}

function deleteCard(index) {

    sets[currentSetIndex].cards.splice(
        index,
        1
    );

    saveSets();

    renderCards();
    renderSets();
}

function deleteSet(index) {

    if (
        !confirm(
            "Delete this flashcard set?"
        )
    ) {
        return;
    }

    sets.splice(index, 1);

    saveSets();

    renderSets();
}

function startStudy() {

    const cards =
        sets[currentSetIndex].cards;

    if (cards.length === 0) {
        alert("Add some cards before studying.");
        return;
    }

    currentStudyCard = 0;

    document.getElementById("editor").style.display =
        "none";

    document.getElementById("home").style.display =
        "none";

    document.getElementById("study").style.display =
        "block";

    document.getElementById("study-title").textContent =
        sets[currentSetIndex].name;

    updateStudyCard();
}

function startStudyFromSet(index) {

    currentSetIndex = index;

    startStudy();
}

function updateStudyCard() {

    const cards =
        sets[currentSetIndex].cards;

    const card =
        cards[currentStudyCard];

    document.getElementById("card-question")
        .textContent =
        card.question;

    document.getElementById("card-answer")
        .textContent =
        card.answer;

    document.getElementById("study-info")
        .textContent =
        `Card ${currentStudyCard + 1} of ${cards.length}`;

    document.getElementById("flashcard")
        .classList.remove("flipped");
}

function flipCard() {

    document.getElementById("flashcard")
        .classList.toggle("flipped");
}

function nextCard() {

    const cards =
        sets[currentSetIndex].cards;

    currentStudyCard++;

    if (
        currentStudyCard >= cards.length
    ) {
        currentStudyCard = 0;
    }

    updateStudyCard();
}

function previousCard() {

    const cards =
        sets[currentSetIndex].cards;

    currentStudyCard--;

    if (currentStudyCard < 0) {
        currentStudyCard =
            cards.length - 1;
    }

    updateStudyCard();
}

function showHome() {

    document.getElementById("home").style.display =
        "block";

    document.getElementById("editor").style.display =
        "none";

    document.getElementById("study").style.display =
        "none";

    currentSetIndex = null;

    renderSets();
}

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

let rPresses = 0;
let rTimer;

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key.toLowerCase() !== "r"
        ) {
            return;
        }

        rPresses++;

        clearTimeout(rTimer);

        rTimer =
            setTimeout(
                () => {
                    rPresses = 0;
                },
                700
            );

        if (rPresses === 3) {

            window.location.href =
                "index.html";

            rPresses = 0;
        }
    }
);

renderSets();

</script>

</body>
</html>
