</head>

<body>

<header>
    <div class="logo">
        <div class="logo-icon">F</div>
        <div>Flashcard<span>.com</span></div>
    </div>

    <a href="index.html" class="home-button">Home</a>
</header>

<main>

    <div class="welcome">
        <h1>My Flashcards</h1>
        <p>Create cards, flip them, and study at your own pace.</p>
    </div>

    <div class="dashboard">

        <div class="panel">

            <h2>Create a Flashcard</h2>

            <label for="question">Question</label>

            <input
                id="question"
                type="text"
                placeholder="Enter your question..."
            >

            <label for="answer">Answer</label>

            <textarea
                id="answer"
                placeholder="Enter the answer..."
            ></textarea>

            <button class="primary" id="addButton">
                + Add Flashcard
            </button>

            <button
                class="secondary"
                id="clearButton"
                style="width:100%; margin-top:10px;"
            >
                Clear All
            </button>

        </div>

        <div class="panel">

            <div class="cards-header">
                <div>
                    <h2>Study Mode</h2>
                    <div class="card-count">
                        <span id="totalCards">0</span> flashcards
                    </div>
                </div>

                <button class="secondary" id="shuffleButton">
                    Shuffle
                </button>
            </div>

            <div id="studyArea">

                <div class="flashcard" id="flashcard">

                    <div class="card-inner">

                        <div class="card-front">

                            <div class="side-label">
                                Question
                            </div>

                            <div class="card-text" id="questionText">
                                Create a flashcard to begin.
                            </div>

                            <div class="hint">
                                Click to flip
                            </div>

                        </div>

                        <div class="card-back">

                            <div class="side-label">
                                Answer
                            </div>

                            <div class="card-text" id="answerText">
                                Your answer will appear here.
                            </div>

                            <div class="hint">
                                Click to flip
                            </div>

                        </div>

                    </div>

                </div>

                <div class="progress">
                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>
                </div>

                <div class="progress-text" id="progressText">
                    No cards
                </div>

                <div class="controls">

                    <button class="secondary" id="previousButton">
                        ← Previous
                    </button>

                    <button class="secondary" id="nextButton">
                        Next →
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="list panel">

        <h2>My Cards</h2>

        <div id="savedCards"></div>

    </div>

</main>

<script>
    const questionInput =
        document.getElementById("question");

    const answerInput =
        document.getElementById("answer");

    const addButton =
        document.getElementById("addButton");

    const clearButton =
        document.getElementById("clearButton");

    const shuffleButton =
        document.getElementById("shuffleButton");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const flashcard =
        document.getElementById("flashcard");

    const questionText =
        document.getElementById("questionText");

    const answerText =
        document.getElementById("answerText");

    const progressText =
        document.getElementById("progressText");

    const progressBar =
        document.getElementById("progressBar");

    const totalCards =
        document.getElementById("totalCards");

    const savedCards =
        document.getElementById("savedCards");

    let cards =
        JSON.parse(
            localStorage.getItem("flashcardData")
        ) || [];

    let currentIndex = 0;

    function saveCards() {
        localStorage.setItem(
            "flashcardData",
            JSON.stringify(cards)
        );
    }

    function displayCurrentCard() {

        flashcard.classList.remove("flipped");

        if (cards.length === 0) {

            questionText.textContent =
                "Create a flashcard to begin.";

            answerText.textContent =
                "Your answer will appear here.";

            progressText.textContent =
                "No cards";

            progressBar.style.width = "0%";

            totalCards.textContent = "0";

            return;
        }

        if (currentIndex >= cards.length) {
            currentIndex = 0;
        }

        if (currentIndex < 0) {
            currentIndex = cards.length - 1;
        }

        const card = cards[currentIndex];

        questionText.textContent =
            card.question;

        answerText.textContent =
            card.answer;

        totalCards.textContent =
            cards.length;

        progressText.textContent =
            `Card ${currentIndex + 1} of ${cards.length}`;

        progressBar.style.width =
            `${((currentIndex + 1) / cards.length) * 100}%`;
    }

    function displaySavedCards() {

        savedCards.innerHTML = "";

        if (cards.length === 0) {

            savedCards.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📚</div>
                    <div>No flashcards yet.</div>
                </div>
            `;

            return;
        }

        cards.forEach((card, index) => {

            const item =
                document.createElement("div");

            item.className = "saved-card";

            item.innerHTML = `
                <div>
                    <strong>${escapeHTML(card.question)}</strong>
                    <small>${escapeHTML(card.answer)}</small>
                </div>

                <div class="saved-actions">
                    <button
                        class="small-button"
                        onclick="studyCard(${index})"
                    >
                        Study
                    </button>

                    <button
                        class="small-button"
                        onclick="deleteCard(${index})"
                    >
                        Delete
                    </button>
                </div>
            `;

            savedCards.appendChild(item);
        });
    }

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

    function studyCard(index) {

        currentIndex = index;

        displayCurrentCard();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    function deleteCard(index) {

        cards.splice(index, 1);

        if (currentIndex >= cards.length) {
            currentIndex =
                Math.max(0, cards.length - 1);
        }

        saveCards();

        displayCurrentCard();
        displaySavedCards();
    }

    addButton.addEventListener(
        "click",
        () => {

            const question =
                questionInput.value.trim();

            const answer =
                answerInput.value.trim();

            if (!question || !answer) {

                alert(
                    "Please enter both a question and an answer."
                );

                return;
            }

            cards.push({
                question: question,
                answer: answer
            });

            currentIndex =
                cards.length - 1;

            questionInput.value = "";
            answerInput.value = "";

            saveCards();

            displayCurrentCard();
            displaySavedCards();
        }
    );

    clearButton.addEventListener(
        "click",
        () => {

            if (cards.length === 0) {
                return;
            }

            if (
                confirm(
                    "Delete all of your flashcards?"
                )
            ) {

                cards = [];
                currentIndex = 0;

                saveCards();

                displayCurrentCard();
                displaySavedCards();
            }
        }
    );

    shuffleButton.addEventListener(
        "click",
        () => {

            if (cards.length < 2) {
                return;
            }

            for (
                let i = cards.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    cards[i],
                    cards[j]
                ] = [
                    cards[j],
                    cards[i]
                ];
            }

            currentIndex = 0;

            saveCards();

            displayCurrentCard();
            displaySavedCards();
        }
    );

    previousButton.addEventListener(
        "click",
        () => {

            if (cards.length === 0) {
                return;
            }

            currentIndex--;

            if (currentIndex < 0) {
                currentIndex =
                    cards.length - 1;
            }

            displayCurrentCard();
        }
    );

    nextButton.addEventListener(
        "click",
        () => {

            if (cards.length === 0) {
                return;
            }

            currentIndex++;

            if (currentIndex >= cards.length) {
                currentIndex = 0;
            }

            displayCurrentCard();
        }
    );

    flashcard.addEventListener(
        "click",
        () => {

            if (cards.length > 0) {
                flashcard.classList.toggle("flipped");
            }
        }
    );

    let rPresses = 0;
    let rTimer;

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key.toLowerCase() !== "r"
            ) {
                return;
            }

            rPresses++;

            clearTimeout(rTimer);

            rTimer = setTimeout(
                () => {
                    rPresses = 0;
                },
                700
            );

            if (rPresses === 3) {

                window.location.href =
                    "index.html";

                rPresses = 0;
            }
        }
    );

    displayCurrentCard();
    displaySavedCards();
</script>

    if (rPresses === 3) {
        window.location.href = "index.html";

</body>
</html>
