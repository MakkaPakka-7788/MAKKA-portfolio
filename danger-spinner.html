```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard Creator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: #eee;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 900px;
    max-width: 94%;
}

.panel {
    background: #111;
    border: 2px solid #333;
    padding: 30px;
    box-shadow: 8px 8px 0 #000;
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 42px;
    letter-spacing: 3px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin: 8px 0 25px;
}

.turn {
    text-align: center;
    font-size: 24px;
    margin: 20px 0;
}

.choose {
    text-align: center;
    color: #aaa;
    margin-bottom: 15px;
}

.choiceButtons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
}

button {
    background: #eee;
    color: #111;
    border: 0;
    padding: 13px 24px;
    font-family: inherit;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: white;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.spinnerArea {
    position: relative;
    display: flex;
    justify-content: center;
    margin: 35px 0;
}

.pointer {
    position: absolute;
    top: -25px;
    z-index: 5;

    width: 0;
    height: 0;

    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid #eee;
}

.spinner {
    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: #292929;

    border: 12px solid #666;

    box-shadow:
        inset 0 0 0 8px #111;

    position: relative;

    transition:
        transform 1.3s cubic-bezier(.17,.67,.19,1.2);
}

.slot {
    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    background: #080808;

    border: 4px solid #666;

    left: 50%;
    top: 50%;

    transform-origin: 0 0;
}

.slot:nth-child(1) {
    transform: rotate(0deg) translateX(98px);
}

.slot:nth-child(2) {
    transform: rotate(60deg) translateX(98px);
}

.slot:nth-child(3) {
    transform: rotate(120deg) translateX(98px);
}

.slot:nth-child(4) {
    transform: rotate(180deg) translateX(98px);
}

.slot:nth-child(5) {
    transform: rotate(240deg) translateX(98px);
}

.slot:nth-child(6) {
    transform: rotate(300deg) translateX(98px);
}

.center {
    position: absolute;

    width: 70px;
    height: 70px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #111;

    border: 5px solid #777;
}

.status {
    text-align: center;

    min-height: 55px;

    font-size: 22px;
    font-weight: bold;

    margin: 15px 0;
}

.safe {
    color: #7ee787;
}

.danger {
    color: #ff6666;
}

.bonus {
    color: #ffd866;
}

.normal {
    color: #ddd;
}

.players {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;

    margin: 25px 0;
}

.player {
    background: #181818;

    border: 2px solid #333;

    padding: 18px;

    text-align: center;
}

.player.active {
    border-color: #aaa;
}

.playerName {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.stats {
    color: #aaa;
    line-height: 1.7;
}

.hearts {
    letter-spacing: 4px;
    color: #eee;
}

.score {
    font-size: 20px;
    color: #eee;
}

.controls {
    text-align: center;
}

.spinButton {
    font-size: 21px;
    padding: 15px 40px;
    box-shadow: 5px 5px 0 #000;
}

.spinButton:active {
    transform: translate(4px, 4px);
    box-shadow: 1px 1px 0 #000;
}

.instructions {
    text-align: center;

    color: #555;

    font-size: 12px;

    margin-top: 25px;

    line-height: 1.6;
}

.retry {
    display: none;
    text-align: center;
}

.retry h2 {
    color: #ff6666;
    font-size: 42px;
    margin: 5px;
}

.finalResult {
    font-size: 21px;
    line-height: 2;
    margin: 25px;
}

@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    .spinner {
        width: 220px;
        height: 220px;
    }

    .slot:nth-child(1) {
        transform: rotate(0deg) translateX(75px);
    }

    .slot:nth-child(2) {
        transform: rotate(60deg) translateX(75px);
    }

    .slot:nth-child(3) {
        transform: rotate(120deg) translateX(75px);
    }

    .slot:nth-child(4) {
        transform: rotate(180deg) translateX(75px);
    }

    .slot:nth-child(5) {
        transform: rotate(240deg) translateX(75px);
    }

    .slot:nth-child(6) {
        transform: rotate(300deg) translateX(75px);
    }

    .players {
        grid-template-columns: 1fr;
    }

    .choiceButtons {
        flex-direction: column;
    }

}

</style>
</head>


<body>

<div class="game">


<div class="panel" id="gamePanel">

<h1>DANGER SPINNER</h1>

<div class="subtitle">
YOU VS BOT
</div>


<div class="turn" id="turnText">
YOUR TURN
</div>


<div class="choose" id="chooseText">
Choose who spins.
</div>


<div class="choiceButtons">

<button
id="botChoice"
onclick="chooseBot()"
>
BOT SPIN
</button>

<button
id="youChoice"
onclick="chooseYou()"
>
YOU SPIN
</button>

</div>


<div class="spinnerArea">

<div class="pointer"></div>

<div class="spinner" id="spinner">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

<div class="center"></div>

</div>

</div>


<div class="status normal" id="status">
Choose who takes the spin.
</div>


<div class="players">


<div class="player" id="youPlayer">

<div class="playerName">
YOU
</div>

<div class="stats">

POINTS:
<span class="score" id="youScore">0</span>

<br>

STREAK:
<span id="youStreak">0</span>

<br>

LIVES:
<span class="hearts" id="youLives">
♥ ♥ ♥
</span>

</div>

</div>


<div class="player" id="botPlayer">

<div class="playerName">
BOT
</div>

<div class="stats">

POINTS:
<span class="score" id="botScore">0</span>

<br>

STREAK:
<span id="botStreak">0</span>

<br>

LIVES:
<span class="hearts" id="botLives">
♥ ♥ ♥
</span>

</div>

</div>


</div>

class="spinButton"

disabled
>

</button>

</div>


<div class="instructions">

BOT BOOMS → YOU GET A POINT<br>
BOT DOESN'T BOOM → YOUR TURN

</div>


</div>


<div class="panel retry" id="retryPanel">

<h2>RETRY</h2>

<div class="finalResult">

YOU:
<span id="finalYouScore">0</span>

<br>

BOT:
<span id="finalBotScore">0</span>

<br><br>

WINNER:
<span id="winner">—</span>

</div>


<button
class="spinButton"
onclick="restart()"
>
PLAY AGAIN
</button>

</div>


</div>


<script>

let selectedPlayer = null;

let spinning = false;

let rotation = 0;

let youScore = 0;
let youStreak = 0;
let youLives = 3;

let botScore = 0;
let botStreak = 0;
let botLives = 3;


const spinner =
document.getElementById("spinner");

const statusText =
document.getElementById("status");

const turnText =
document.getElementById("turnText");

const chooseText =
document.getElementById("chooseText");

const spinButton =
document.getElementById("spinButton");


function chooseBot() {

    if (spinning) return;

    if (botLives <= 0) {

        statusText.className = "status danger";
        statusText.textContent = "THE BOT IS OUT OF LIVES!";

        return;
    }

    selectedPlayer = "bot";

    turnText.textContent = "BOT'S TURN";

    chooseText.textContent =
        "You chose the BOT to spin.";

    spinButton.disabled = false;

    updateActivePlayer();

}


function chooseYou() {

    if (spinning) return;

    if (youLives <= 0) {

        statusText.className = "status danger";
        statusText.textContent = "YOU ARE OUT OF LIVES!";

        return;
    }

    selectedPlayer = "you";

    turnText.textContent = "YOUR TURN";

    chooseText.textContent =
        "You chose to spin.";

    spinButton.disabled = false;

    updateActivePlayer();

}


function updateActivePlayer() {

    document
        .getElementById("youPlayer")
        .classList.remove("active");

    document
        .getElementById("botPlayer")
        .classList.remove("active");


    if (selectedPlayer === "you") {

        document
            .getElementById("youPlayer")
            .classList.add("active");

    }


    if (selectedPlayer === "bot") {

        document
            .getElementById("botPlayer")
            .classList.add("active");

    }

}


function spin() {

    if (spinning || !selectedPlayer) {
        return;
    }

    spinning = true;

    spinButton.disabled = true;

    document.getElementById("botChoice").disabled = true;
    document.getElementById("youChoice").disabled = true;


    let playerName =
        selectedPlayer === "you"
        ? "YOU"
        : "BOT";


    statusText.className =
        "status normal";

    statusText.textContent =
        playerName + " IS SPINNING...";


    rotation +=
        720 +
        Math.floor(Math.random() * 1080);


    spinner.style.transform =
        `rotate(${rotation}deg)`;


    setTimeout(function() {

        let roll = Math.random();


        /*
        BOOM
        */

        if (roll < 0.18) {

            if (selectedPlayer === "bot") {

                botLives--;
                botStreak = 0;

                youScore++;
                youStreak++;

                statusText.className =
                    "status bonus";

                statusText.textContent =
                    "💥 BOT BOOMED! YOU GET +1 POINT!";


                if (botLives <= 0) {

                    setTimeout(gameOver, 1000);

                    return;
                }


                /*
                BOT BOOMED:
                PLAYER GETS TO CHOOSE AGAIN
                */

                setTimeout(function() {

                    selectedPlayer = null;

                    turnText.textContent =
                        "YOUR CHOICE";

                    chooseText.textContent =
                        "Choose BOT SPIN or YOU SPIN.";

                    spinButton.disabled = true;

                    document.getElementById("botChoice").disabled = false;
                    document.getElementById("youChoice").disabled = false;

                    updateActivePlayer();

                    spinning = false;

                }, 700);


                updateStats();

                return;

            }


            /*
            YOU BOOMED
            */

            youLives--;
            youStreak = 0;

            botScore++;
            botStreak++;


            statusText.className =
                "status danger";

            statusText.textContent =
                "💥 YOU BOOMED! BOT GETS +1 POINT!";


            updateStats();


            if (youLives <= 0) {

                setTimeout(gameOver, 1000);

                return;

            }


            /*
            AFTER YOU BOOM:
            BOT GETS THE TURN
            */

            setTimeout(function() {

                selectedPlayer = null;

                turnText.textContent =
                    "BOT'S TURN";

                chooseText.textContent =
                    "Choose BOT SPIN or YOU SPIN.";

                spinButton.disabled = true;

                document.getElementById("botChoice").disabled = false;
                document.getElementById("youChoice").disabled = false;

                updateActivePlayer();

                spinning = false;

            }, 700);


            return;

        }


        /*
        SAFE
        */

        if (selectedPlayer === "bot") {

            botScore += 5 + botStreak;
            botStreak++;

            statusText.className =
                "status safe";

            statusText.textContent =
                "✓ BOT IS SAFE! NOW IT'S YOUR TURN.";


            updateStats();


            setTimeout(function() {

                selectedPlayer = null;

                turnText.textContent =
                    "YOUR TURN";

                chooseText.textContent =
                    "Choose BOT SPIN or YOU SPIN.";

                spinButton.disabled = true;

                document.getElementById("botChoice").disabled = false;
                document.getElementById("youChoice").disabled = false;

                updateActivePlayer();

                spinning = false;

            }, 700);


        } else {

            youScore += 5 + youStreak;
            youStreak++;

            statusText.className =
                "status safe";

            statusText.textContent =
                "✓ YOU ARE SAFE!";


            updateStats();


            setTimeout(function() {

                selectedPlayer = null;

                turnText.textContent =
                    "YOUR CHOICE";

                chooseText.textContent =
                    "Choose BOT SPIN or YOU SPIN.";

                spinButton.disabled = true;

                document.getElementById("botChoice").disabled = false;
                document.getElementById("youChoice").disabled = false;

                updateActivePlayer();

                spinning = false;

            }, 700);

        }


    }, 1300);

}


function updateStats() {

    document.getElementById("youScore")
        .textContent = youScore;

    document.getElementById("youStreak")
        .textContent = youStreak;

    document.getElementById("botScore")
        .textContent = botScore;

    document.getElementById("botStreak")
        .textContent = botStreak;


    document.getElementById("youLives")
        .textContent = makeHearts(youLives);

    document.getElementById("botLives")
        .textContent = makeHearts(botLives);

}


function makeHearts(lives) {

    let result = "";

    for (let i = 0; i < 3; i++) {

        result +=
            i < lives
            ? "♥ "
            : "♡ ";

    }

    return result.trim();

}


function gameOver() {

    spinning = true;

    document.getElementById("gamePanel")
        .style.display = "none";

    document.getElementById("retryPanel")
        .style.display = "block";


    document.getElementById("finalYouScore")
        .textContent = youScore;

    document.getElementById("finalBotScore")
        .textContent = botScore;


    let winner;


    if (youLives <= 0 &&
        botLives <= 0) {

        winner = "DRAW";

    } else if (youLives <= 0) {

        winner = "BOT";

    } else {

        winner = "YOU";

    }


    document.getElementById("winner")
        .textContent = winner;

}


function restart() {

    selectedPlayer = null;

    spinning = false;

    rotation = 0;


    youScore = 0;
    youStreak = 0;
    youLives = 3;


    botScore = 0;
    botStreak = 0;
    botLives = 3;


    spinner.style.transform =
        "rotate(0deg)";


    document.getElementById("gamePanel")
        .style.display = "block";

    document.getElementById("retryPanel")
        .style.display = "none";


    statusText.className =
        "status normal";

    statusText.textContent =
        "Choose who takes the spin.";


    turnText.textContent =
        "YOUR TURN";


    chooseText.textContent =
        "Choose BOT SPIN or YOU SPIN.";


    spinButton.disabled = true;

    document.getElementById("botChoice").disabled = false;
    document.getElementById("youChoice").disabled = false;


    updateStats();

    updateActivePlayer();

}


// RRR SHORTCUT

let rCount = 0;
let rTimer = null;


document.addEventListener("keydown", function(e) {

    if (e.key.toLowerCase() !== "r") {
        return;
    }


    rCount++;

    clearTimeout(rTimer);


    rTimer = setTimeout(function() {

        rCount = 0;

    }, 700);


    if (rCount === 3) {

        rCount = 0;

        window.location.href =
            "flashcards.html";

    }

});


updateStats();

</script>

</body>
</html>
