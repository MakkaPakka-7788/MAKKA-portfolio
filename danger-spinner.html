<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard Creator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: #eee;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 900px;
    max-width: 94%;
}

.panel {
    background: #111;
    border: 2px solid #333;
    padding: 30px;
    box-shadow: 8px 8px 0 #000;
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 42px;
    letter-spacing: 3px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin: 8px 0 25px;
}

.turn {
    text-align: center;
    font-size: 24px;
    margin: 15px 0;
}

.choose {
    text-align: center;
    color: #aaa;
    margin-bottom: 15px;
}

.choiceButtons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
}

button {
    background: #eee;
    color: #111;
    border: 0;
    padding: 13px 24px;
    font-family: inherit;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: white;
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.countdown {
    text-align: center;
    height: 65px;
    font-size: 50px;
    font-weight: bold;
    margin: 5px 0;
}

.countdown.hidden {
    visibility: hidden;
}

.spinnerArea {
    position: relative;
    display: flex;
    justify-content: center;
    margin: 25px 0;
}

.pointer {
    position: absolute;
    top: -25px;
    z-index: 5;

    width: 0;
    height: 0;

    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid #eee;
}

.spinner {
    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: #292929;

    border: 12px solid #666;

    box-shadow: inset 0 0 0 8px #111;

    position: relative;

    transition:
        transform 1.4s cubic-bezier(.17,.67,.19,1.2);
}

.slot {
    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    background: #080808;

    border: 4px solid #666;

    left: 50%;
    top: 50%;

    margin-left: -22px;
    margin-top: -22px;
}

.slot:nth-child(1) {
    transform: rotate(0deg) translateX(98px);
}

.slot:nth-child(2) {
    transform: rotate(60deg) translateX(98px);
}

.slot:nth-child(3) {
    transform: rotate(120deg) translateX(98px);
}

.slot:nth-child(4) {
    transform: rotate(180deg) translateX(98px);
}

.slot:nth-child(5) {
    transform: rotate(240deg) translateX(98px);
}

.slot:nth-child(6) {
    transform: rotate(300deg) translateX(98px);
}

.center {
    position: absolute;

    width: 70px;
    height: 70px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #111;

    border: 5px solid #777;
}

.status {
    text-align: center;
    min-height: 55px;

    font-size: 21px;
    font-weight: bold;

    margin: 15px 0;
}

.safe {
    color: #7ee787;
}

.danger {
    color: #ff6666;
}

.point {
    color: #ffd866;
}

.normal {
    color: #ddd;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 25px 0;
}

.player {
    background: #181818;
    border: 2px solid #333;
    padding: 18px;
    text-align: center;
}

.player.active {
    border-color: #aaa;
}

.playerName {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.score {
    font-size: 24px;
}

.controls {
    text-align: center;
}

.spinButton {
    font-size: 21px;
    padding: 15px 40px;
    box-shadow: 5px 5px 0 #000;
}

.spinButton:active {
    transform: translate(4px, 4px);
    box-shadow: 1px 1px 0 #000;
}

.info {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin-top: 22px;
    line-height: 1.7;
}

.retry {
    display: none;
    text-align: center;
}

.retry h2 {
    color: #ff6666;
    font-size: 42px;
    margin: 5px;
}

.final {
    font-size: 22px;
    line-height: 2;
    margin: 25px;
}

@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    .spinner {
        width: 220px;
        height: 220px;
    }

    .slot:nth-child(1) {
        transform: rotate(0deg) translateX(75px);
    }

    .slot:nth-child(2) {
        transform: rotate(60deg) translateX(75px);
    }

    .slot:nth-child(3) {
        transform: rotate(120deg) translateX(75px);
    }

    .slot:nth-child(4) {
        transform: rotate(180deg) translateX(75px);
    }

    .slot:nth-child(5) {
        transform: rotate(240deg) translateX(75px);
    }

    .slot:nth-child(6) {
        transform: rotate(300deg) translateX(75px);
    }

    .players {
        grid-template-columns: 1fr;
    }

    .choiceButtons {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<div class="game">

<div class="panel" id="gamePanel">

<h1>DANGER SPINNER</h1>

<div class="subtitle">
6 SLOTS • 1 DANGER • 5 SAFE
</div>

<div class="turn" id="turnText">
YOUR CHOICE
</div>

<div class="choose" id="chooseText">
Choose who takes the spin.
</div>

<div class="choiceButtons">

<button id="botButton" onclick="chooseBot()">
BOT SPIN
</button>

<button id="youButton" onclick="chooseYou()">
YOU SPIN
</button>

</div>

<div id="countdown" class="countdown hidden">
6
</div>

<div class="spinnerArea">

<div class="pointer"></div>

<div class="spinner" id="spinner">

<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>
<div class="slot"></div>

<div class="center"></div>

</div>

</div>

<div class="status normal" id="status">
Choose BOT SPIN or YOU SPIN.
</div>

<div class="players">

<div class="player" id="youPlayer">

<div class="playerName">
YOU
</div>

<div class="score">
<span id="youScore">0</span>
</div>

</div>

<div class="player" id="botPlayer">

<div class="playerName">
BOT
</div>

<div class="score">
<span id="botScore">0</span>
</div>

</div>

</div>

<div class="controls">

<button
class="spinButton"
id="spinButton"
onclick="spin()"
disabled
>
SPIN
</button>

</div>

<div class="info">
THE DANGER SLOT IS RANDOMIZED EACH ROUND<br>
BOT SAFE → YOU MUST SPIN<br>
BOT DANGER → YOU GET +1 POINT<br>
YOU DANGER → BOT GETS +1 POINT
</div>

</div>

<div class="panel retry" id="retryPanel">

<h2>ROUND OVER</h2>

<div class="final">

YOU:
<span id="finalYou">0</span>

<br>

BOT:
<span id="finalBot">0</span>

<br><br>

WINNER:
<span id="winner">—</span>

</div>

<button
class="spinButton"
onclick="restart()"
>
PLAY AGAIN
</button>

</div>

</div>

<script>

let selected = null;
let spinning = false;

let rotation = 0;

let youScore = 0;
let botScore = 0;

/*
Exactly ONE danger slot.

The number is randomly chosen
at the beginning of every round.
*/

let dangerSlot = randomDangerSlot();


function randomDangerSlot() {

    return Math.floor(Math.random() * 6);

}


/*
Choose BOT
*/

function chooseBot() {

    if (spinning) return;

    selected = "bot";

    document.getElementById("turnText")
        .textContent = "BOT SPIN";

    document.getElementById("chooseText")
        .textContent = "You chose the BOT.";

    document.getElementById("spinButton")
        .disabled = false;

    updateActive();

}


/*
Choose YOU
*/

function chooseYou() {

    if (spinning) return;

    selected = "you";

    document.getElementById("turnText")
        .textContent = "YOUR SPIN";

    document.getElementById("chooseText")
        .textContent = "You must take the spin.";

    document.getElementById("spinButton")
        .disabled = false;

    updateActive();

}


/*
Highlight active player
*/

function updateActive() {

    document
        .getElementById("youPlayer")
        .classList.remove("active");

    document
        .getElementById("botPlayer")
        .classList.remove("active");


    if (selected === "you") {

        document
            .getElementById("youPlayer")
            .classList.add("active");

    }


    if (selected === "bot") {

        document
            .getElementById("botPlayer")
            .classList.add("active");

    }

}


/*
Visible countdown
*/

function countdown(callback) {

    const box =
        document.getElementById("countdown");

    box.classList.remove("hidden");

    let number = 6;

    box.textContent = number;


    const timer = setInterval(function() {

        number--;

        if (number > 0) {

            box.textContent = number;

        }

        else {

            clearInterval(timer);

            box.textContent = "GO!";

            setTimeout(function() {

                box.classList.add("hidden");

                callback();

            }, 350);

        }

    }, 350);

}


/*
Spin
*/

function spin() {

    if (spinning || !selected) return;

    spinning = true;

    document.getElementById("spinButton")
        .disabled = true;

    document.getElementById("botButton")
        .disabled = true;

    document.getElementById("youButton")
        .disabled = true;


    const currentPlayer = selected;


    document.getElementById("status")
        .className = "status normal";

    document.getElementById("status")
        .textContent =
        currentPlayer.toUpperCase() +
        " IS GETTING READY...";


    countdown(function() {

        /*
        Random result from the six slots.
        */

        const result =
            Math.floor(Math.random() * 6);


        /*
        Spin visual.
        */

        const extra =
            720 +
            Math.floor(Math.random() * 1080);

        rotation += extra;

        document.getElementById("spinner")
            .style.transform =
            `rotate(${rotation}deg)`;


        document.getElementById("status")
            .textContent =
            currentPlayer.toUpperCase() +
            " IS SPINNING...";


        setTimeout(function() {

            const danger =
                result === dangerSlot;


            if (danger) {

                dangerResult(currentPlayer);

            }

            else {

                safeResult(currentPlayer);

            }

        }, 1400);

    });

}


/*
Danger result
*/

function dangerResult(player) {

    if (player === "bot") {

        youScore++;

        updateScores();

        document.getElementById("status")
            .className = "status point";

        document.getElementById("status")
            .textContent =
            "💥 BOT HIT THE DANGER SLOT! YOU GET +1!";


        setTimeout(function() {

            nextChoice(
                "BOT FAILED — CHOOSE AGAIN."
            );

        }, 900);

    }

    else {

        botScore++;

        updateScores();

        document.getElementById("status")
            .className = "status danger";

        document.getElementById("status")
            .textContent =
            "💥 YOU HIT THE DANGER SLOT!";


        setTimeout(function() {

            endRound();

        }, 1000);

    }

}


/*
Safe result
*/

function safeResult(player) {

    document.getElementById("status")
        .className = "status safe";

    document.getElementById("status")
        .textContent =
        "✓ " +
        player.toUpperCase() +
        " GOT A SAFE SLOT!";


    if (player === "bot") {

        setTimeout(function() {

            selected = "you";

            spinning = false;

            document.getElementById("turnText")
                .textContent =
                "YOUR TURN";

            document.getElementById("chooseText")
                .textContent =
                "BOT WAS SAFE — YOU MUST SPIN.";

            document.getElementById("spinButton")
                .disabled = false;

            updateActive();

        }, 900);

    }

    else {

        setTimeout(function() {

            nextChoice(
                "YOU SURVIVED — CHOOSE AGAIN."
            );

        }, 900);

    }

}


/*
Next choice
*/

function nextChoice(message) {

    selected = null;

    spinning = false;

    document.getElementById("turnText")
        .textContent =
        "YOUR CHOICE";

    document.getElementById("chooseText")
        .textContent =
        message;

    document.getElementById("spinButton")
        .disabled = true;

    document.getElementById("botButton")
        .disabled = false;

    document.getElementById("youButton")
        .disabled = false;

    updateActive();

}


/*
Update scores
*/

function updateScores() {

    document.getElementById("youScore")
        .textContent = youScore;

    document.getElementById("botScore")
        .textContent = botScore;

}


/*
End round
*/

function endRound() {

    spinning = true;

    document.getElementById("gamePanel")
        .style.display = "none";

    document.getElementById("retryPanel")
        .style.display = "block";


    document.getElementById("finalYou")
        .textContent = youScore;

    document.getElementById("finalBot")
        .textContent = botScore;


    let winner;

    if (youScore > botScore) {

        winner = "YOU";

    }

    else if (botScore > youScore) {

        winner = "BOT";

    }

    else {

        winner = "DRAW";

    }


    document.getElementById("winner")
        .textContent = winner;

}


/*
Restart

A completely new danger slot
is generated here.
*/

function restart() {

    selected = null;

    spinning = false;

    rotation = 0;

    youScore = 0;

    botScore = 0;

    dangerSlot = randomDangerSlot();


    document.getElementById("spinner")
        .style.transform =
        "rotate(0deg)";


    document.getElementById("gamePanel")
        .style.display = "block";

    document.getElementById("retryPanel")
        .style.display = "none";


    document.getElementById("status")
        .className =
        "status normal";

    document.getElementById("status")
        .textContent =
        "Choose BOT SPIN or YOU SPIN.";


    document.getElementById("turnText")
        .textContent =
        "YOUR CHOICE";


    document.getElementById("chooseText")
        .textContent =
        "Choose who takes the spin.";


    document.getElementById("spinButton")
        .disabled = true;

    document.getElementById("botButton")
        .disabled = false;

    document.getElementById("youButton")
        .disabled = false;


    document.getElementById("countdown")
        .classList.add("hidden");


    updateScores();

    updateActive();

}


/*
RRR = FLASHCARDS
*/

let rCount = 0;

let rTimer = null;

document.addEventListener("keydown", function(e) {

    if (e.key.toLowerCase() !== "r") {
        return;
    }

    rCount++;

    clearTimeout(rTimer);

    rTimer = setTimeout(function() {

        rCount = 0;

    }, 700);


    if (rCount === 3) {

        rCount = 0;

        window.location.href =
            "flashcards.html";

    }

});

</script>

</body>
</html>
