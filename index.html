<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flashcard.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<script>
let rPresses = 0;
let rTimer;

document.addEventListener("keydown", event => {
    if (event.key.toLowerCase() !== "r") {
        return;
    }

    rPresses++;

    clearTimeout(rTimer);

    rTimer = setTimeout(() => {
        rPresses = 0;
    }, 700);

    if (rPresses === 3) {
        window.location.href = "index.html";
    }
});
</script>
<body>

    <div class="home">
        <h1>HEE HEE</h1>

        <p class="subtitle">RETRO ARCADE</p>

        <div class="games">

            <a href="snake.html" class="game-card">
                <div class="game-icon">🐍</div>
                <h2>SNAKE</h2>
                <p>Eat. Grow. Survive.</p>
            </a>

            <a href="tetris.html" class="game-card">
                <div class="game-icon">🧱</div>
                <h2>TETRIS</h2>
                <p>Stack the blocks.</p>
            </a>

        </div>
    </div>

</body>
</html>
