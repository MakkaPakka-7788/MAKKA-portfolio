<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computing Homework Task 2</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #score-container {
            display: flex;
            gap: 30px;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #game-wrapper {
            border: 4px solid #555;
            padding: 15px; 
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }
        canvas {
            background-color: #111;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Scoreboards for current score and saved high score -->
    <div id="score-container">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="high-score">0</span></div>
    </div>
    
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 15, y: 15 }];
        let fruits = []; 
        let obstacles = []; // Array to hold fixed danger blocks
        const maxFruits = 3; 
        const maxObstacles = 3; // Number of danger blocks on screen
        let dx = 1; 
        let dy = 0; 
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0; // Loads saved high score
        let gameInterval;

        // Display the loaded high score immediately
        highScoreElement.innerText = highScore;

        function startGame() {
            gameInterval = setInterval(update, 140);
        }

        function update() {
            moveSnake();
            if (checkGameOver()) {
                clearInterval(gameInterval);
                alert("Game Over! You hit an obstacle. Final Score: " + score);
                resetGame();
                return;
            }
            checkFoodCollision();
            draw();
        }

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Obstacles (Danger blocks)
            ctx.fillStyle = "#777777"; // Solid grey blocks
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x * gridSize, obs.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Snake
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = "#1B5E20"; // Dark Forest Green Head
                } else {
                    ctx.fillStyle = "#4CAF50"; // Light Green Body
                }
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Fruits
            ctx.fillStyle = "#FF5252"; 
            fruits.forEach(fruit => {
                ctx.fillRect(fruit.x * gridSize, fruit.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            let nextX = snake[0].x + dx;
            let nextY = snake[0].y + dy;

            // Screen Wrapping Logic (Teleporting walls)
            if (nextX < 0) nextX = tileCount - 1;       
            if (nextX >= tileCount) nextX = 0;          
            if (nextY < 0) nextY = tileCount - 1;       
            if (nextY >= tileCount) nextY = 0;          

            const head = { x: nextX, y: nextY };
            snake.unshift(head); 
            snake.pop(); 
        }

        function checkFoodCollision() {
            for (let i = 0; i < fruits.length; i++) {
                if (snake[0].x === fruits[i].x && snake[0].y === fruits[i].y) {
                    score++;
                    scoreElement.innerText = score;
                    
                    // Update High Score if current score beats it
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.innerText = highScore;
                        localStorage.setItem("snakeHighScore", highScore); // Saves to browser memory
                    }

                    snake.push({}); 
                    fruits.splice(i, 1); 
                    generateSingleFruit(); 
                    break;
                }
            }
        }

        function generateSingleFruit() {
            let newFruit;
            let invalidPos = true;

            while (invalidPos) {
                newFruit = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                // Ensure fruit doesn't land on snake OR an obstacle
                let onSnake = snake.some(part => part.x === newFruit.x && part.y === newFruit.y);
                let onObstacle = obstacles.some(obs => obs.x === newFruit.x && obs.y === newFruit.y);
                invalidPos = onSnake || onObstacle;
            }
            fruits.push(newFruit);
        }

        function generateObstacles() {
            obstacles = [];
            for (let i = 0; i < maxObstacles; i++) {
                let newObs;
                let invalidPos = true;

                while (invalidPos) {
                    newObs = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                    
                    // Don't place obstacle right on top of starting position (center) or other obstacles
                    let nearCenter = (Math.abs(newObs.x - 15) < 3 && Math.abs(newObs.y - 15) < 3);
                    let onObstacle = obstacles.some(obs => obs.x === newObs.x && obs.y === newObs.y);
                    invalidPos = nearCenter || onObstacle;
                }
                obstacles.push(newObs);
            }
        }

        function populateAllFruits() {
            fruits = [];
            for (let i = 0; i < maxFruits; i++) {
                generateSingleFruit();
            }
        }

        function checkGameOver() {
            // Hit an obstacle -> Game Over
            return obstacles.some(obs => obs.x === snake[0].x && obs.y === snake[0].y);
        }

        function resetGame() {
            snake = [{ x: 15, y: 15 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateObstacles(); // Randomise obstacle positions for the next round
            populateAllFruits();
            startGame();
        }

        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp":
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case "ArrowDown":
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case "ArrowLeft":
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
            }
        });

        generateObstacles();
        populateAllFruits();
        startGame();
    </script>
</body>
</html>
