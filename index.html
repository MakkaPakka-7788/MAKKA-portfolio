<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computing Homework Task 2</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #score-board {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #game-wrapper {
            border: 4px solid #555;
            padding: 15px; 
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }
        canvas {
            background-color: #111;
            display: block;
        }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 15, y: 15 }];
        let fruits = []; 
        const maxFruits = 3; 
        let dx = 1; 
        let dy = 0; 
        let score = 0;
        let gameInterval;

        function startGame() {
            gameInterval = setInterval(update, 140);
        }

        function update() {
            moveSnake();
            if (checkGameOver()) {
                clearInterval(gameInterval);
                alert("Game Over! Final Score: " + score);
                resetGame();
                return;
            }
            checkFoodCollision();
            draw();
        }

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the Snake parts
            snake.forEach((part, index) => {
                if (index === 0) {
                    // NEW: The head (index 0) is drawn in a distinct Dark Forest Green
                    ctx.fillStyle = "#1B5E20"; 
                } else {
                    // The rest of the body stays the standard lighter Green
                    ctx.fillStyle = "#4CAF50"; 
                }
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw all active fruits
            ctx.fillStyle = "#FF5252"; 
            fruits.forEach(fruit => {
                ctx.fillRect(fruit.x * gridSize, fruit.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); 
            snake.pop(); 
        }

        function checkFoodCollision() {
            for (let i = 0; i < fruits.length; i++) {
                if (snake[0].x === fruits[i].x && snake[0].y === fruits[i].y) {
                    score++;
                    scoreElement.innerText = score;
                    snake.push({}); 
                    fruits.splice(i, 1); 
                    generateSingleFruit(); 
                    break;
                }
            }
        }

        function generateSingleFruit() {
            let newFruit;
            let onSnake = true;

            while (onSnake) {
                newFruit = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                onSnake = snake.some(part => part.x === newFruit.x && part.y === newFruit.y);
            }
            fruits.push(newFruit);
        }

        function populateAllFruits() {
            fruits = [];
            for (let i = 0; i < maxFruits; i++) {
                generateSingleFruit();
            }
        }

        function checkGameOver() {
            // Wall borders are now the ONLY way to die
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) {
                return true;
            }
            // REMOVED: The code that checked for tail crashes has been completely taken out!
            return false;
        }

        function resetGame() {
            snake = [{ x: 15, y: 15 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            populateAllFruits();
            startGame();
        }

        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp":
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case "ArrowDown":
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case "ArrowLeft":
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
            }
        });

        populateAllFruits();
        startGame();
    </script>
</body>
</html>
