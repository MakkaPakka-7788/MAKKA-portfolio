```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Creator</title>

    <style>
        body {
            background-color: #2E7D32;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #score-container {
            display: flex;
            gap: 30px;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #game-wrapper {
            border: 4px solid #555;
            padding: 15px;
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        canvas {
            background-color: #111;
            display: block;
        }

        #instructions {
            margin-top: 15px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="score-container">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div id="instructions">
        Use the arrow keys to move the snake.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        const maxFruits = 3;
        const maxObstacles = 8;
        const maxPortals = 6;

        let snake = [{ x: 15, y: 15 }];
        let fruits = [];
        let obstacles = [];
        let portals = [];

        let dx = 1;
        let dy = 0;
        let score = 0;

        let highScore =
            Number(localStorage.getItem("snakeHighScore")) || 0;

        let gameInterval;

        highScoreElement.innerText = highScore;

        function startGame() {
            clearInterval(gameInterval);
            gameInterval = setInterval(update, 140);
        }

        function update() {
            moveSnake();

            if (checkGameOver()) {
                clearInterval(gameInterval);

                setTimeout(() => {
                    alert("Game Over!\nFinal Score: " + score);
                    resetGame();
                }, 50);

                return;
            }

            checkPortalCollision();
            checkFoodCollision();

            draw();
        }

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#777";

            obstacles.forEach(obs => {
                ctx.fillRect(
                    obs.x * gridSize,
                    obs.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            portals.forEach((portal, index) => {
                ctx.fillStyle = "#000";

                ctx.fillRect(
                    portal.x * gridSize,
                    portal.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );

                ctx.strokeStyle = "#00E5FF";
                ctx.lineWidth = 3;

                ctx.strokeRect(
                    portal.x * gridSize + 1,
                    portal.y * gridSize + 1,
                    gridSize - 4,
                    gridSize - 4
                );

                ctx.fillStyle = "#00E5FF";
                ctx.font = "12px Arial";

                ctx.fillText(
                    index + 1,
                    portal.x * gridSize + 6,
                    portal.y * gridSize + 14
                );
            });

            snake.forEach((part, index) => {
                ctx.fillStyle =
                    index === 0 ? "#1B5E20" : "#4CAF50";

                ctx.fillRect(
                    part.x * gridSize,
                    part.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            fruits.forEach(fruit => {
                ctx.fillStyle = "#FF5252";

                ctx.fillRect(
                    fruit.x * gridSize,
                    fruit.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });
        }

        function moveSnake() {
            let nextX = snake[0].x + dx;
            let nextY = snake[0].y + dy;

            if (nextX < 0) nextX = tileCount - 1;
            if (nextX >= tileCount) nextX = 0;
            if (nextY < 0) nextY = tileCount - 1;
            if (nextY >= tileCount) nextY = 0;

            const head = {
                x: nextX,
                y: nextY
            };

            snake.unshift(head);
            snake.pop();
        }

        function checkPortalCollision() {
            const head = snake[0];

            const portalIndex = portals.findIndex(
                portal =>
                    portal.x === head.x &&
                    portal.y === head.y
            );

            if (portalIndex === -1) return;

            const otherIndexes = [];

            for (let i = 0; i < portals.length; i++) {
                if (i !== portalIndex) {
                    otherIndexes.push(i);
                }
            }

            if (otherIndexes.length === 0) return;

            const destinationIndex =
                otherIndexes[
                    Math.floor(
                        Math.random() * otherIndexes.length
                    )
                ];

            const destination = portals[destinationIndex];

            snake[0].x = destination.x;
            snake[0].y = destination.y;
        }

        function movePortals() {
            for (let i = 0; i < portals.length; i++) {
                let newPortal;
                let valid = false;

                while (!valid) {
                    newPortal = {
                        x: Math.floor(
                            Math.random() * (tileCount - 6)
                        ) + 3,

                        y: Math.floor(
                            Math.random() * (tileCount - 6)
                        ) + 3
                    };

                    const onSnake = snake.some(
                        part =>
                            part.x === newPortal.x &&
                            part.y === newPortal.y
                    );

                    const onFruit = fruits.some(
                        fruit =>
                            fruit.x === newPortal.x &&
                            fruit.y === newPortal.y
                    );

                    const onObstacle = obstacles.some(
                        obs =>
                            obs.x === newPortal.x &&
                            obs.y === newPortal.y
                    );

                    const onOtherPortal = portals.some(
                        (portal, index) =>
                            index !== i &&
                            portal.x === newPortal.x &&
                            portal.y === newPortal.y
                    );

                    valid =
                        !onSnake &&
                        !onFruit &&
                        !onObstacle &&
                        !onOtherPortal;
                }

                portals[i] = newPortal;
            }
        }

        function checkFoodCollision() {
            for (let i = 0; i < fruits.length; i++) {
                if (
                    snake[0].x === fruits[i].x &&
                    snake[0].y === fruits[i].y
                ) {
                    score++;
                    scoreElement.innerText = score;

                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.innerText = highScore;

                        localStorage.setItem(
                            "snakeHighScore",
                            highScore
                        );
                    }

                    const tail = snake[snake.length - 1];

                    snake.push({
                        x: tail.x,
                        y: tail.y
                    });

                    fruits.splice(i, 1);

                    generateObstacles();
                    movePortals();
                    generateSingleFruit();

                    break;
                }
            }
        }

        function generateSingleFruit() {
            let newFruit;
            let invalidPos = true;

            while (invalidPos) {
                newFruit = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                const onSnake = snake.some(
                    part =>
                        part.x === newFruit.x &&
                        part.y === newFruit.y
                );

                const onObstacle = obstacles.some(
                    obs =>
                        obs.x === newFruit.x &&
                        obs.y === newFruit.y
                );

                const onPortal = portals.some(
                    portal =>
                        portal.x === newFruit.x &&
                        portal.y === newFruit.y
                );

                invalidPos =
                    onSnake ||
                    onObstacle ||
                    onPortal;
            }

            fruits.push(newFruit);
        }

        function generateObstacles() {
            obstacles = [];

            for (let i = 0; i < maxObstacles; i++) {
                let newObs;
                let invalidPos = true;

                while (invalidPos) {
                    newObs = {
                        x: Math.floor(
                            Math.random() * tileCount
                        ),

                        y: Math.floor(
                            Math.random() * tileCount
                        )
                    };

                    const nearSnake = snake.some(
                        part =>
                            Math.abs(
                                newObs.x - part.x
                            ) <= 1 &&
                            Math.abs(
                                newObs.y - part.y
                            ) <= 1
                    );

                    const onFruit = fruits.some(
                        fruit =>
                            fruit.x === newObs.x &&
                            fruit.y === newObs.y
                    );

                    const onPortal = portals.some(
                        portal =>
                            portal.x === newObs.x &&
                            portal.y === newObs.y
                    );

                    const onObstacle = obstacles.some(
                        obs =>
                            obs.x === newObs.x &&
                            obs.y === newObs.y
                    );

                    invalidPos =
                        nearSnake ||
                        onFruit ||
                        onPortal ||
                        onObstacle;
                }

                obstacles.push(newObs);
            }
        }

        function generatePortals() {
            portals = [];

            for (let i = 0; i < maxPortals; i++) {
                let newPortal;
                let invalidPos = true;

                while (invalidPos) {
                    newPortal = {
                        x: Math.floor(
                            Math.random() *
                            (tileCount - 6)
                        ) + 3,

                        y: Math.floor(
                            Math.random() *
                            (tileCount - 6)
                        ) + 3
                    };

                    const nearCenter =
                        Math.abs(
                            newPortal.x - 15
                        ) < 3 &&
                        Math.abs(
                            newPortal.y - 15
                        ) < 3;

                    const onSnake = snake.some(
                        part =>
                            part.x === newPortal.x &&
                            part.y === newPortal.y
                    );

                    const onObstacle = obstacles.some(
                        obs =>
                            obs.x === newPortal.x &&
                            obs.y === newPortal.y
                    );

                    const onPortal = portals.some(
                        portal =>
                            portal.x === newPortal.x &&
                            portal.y === newPortal.y
                    );

                    invalidPos =
                        nearCenter ||
                        onSnake ||
                        onObstacle ||
                        onPortal;
                }

                portals.push(newPortal);
            }
        }

        function populateAllFruits() {
            fruits = [];

            for (let i = 0; i < maxFruits; i++) {
                generateSingleFruit();
            }
        }

        function checkGameOver() {
            return obstacles.some(
                obs =>
                    obs.x === snake[0].x &&
                    obs.y === snake[0].y
            );
        }

        function resetGame() {
            clearInterval(gameInterval);

            snake = [{ x: 15, y: 15 }];

            dx = 1;
            dy = 0;

            score = 0;
            scoreElement.innerText = score;

            fruits = [];
            obstacles = [];
            portals = [];

            generatePortals();
            generateObstacles();
            populateAllFruits();

            draw();
            startGame();
        }

        window.addEventListener("keydown", function(e) {
            switch (e.key) {
                case "ArrowUp":
                    if (dy === 0) {
                        dx = 0;
                        dy = -1;
                    }
                    e.preventDefault();
                    break;

                case "ArrowDown":
                    if (dy === 0) {
                        dx = 0;
                        dy = 1;
                    }
                    e.preventDefault();
                    break;

                case "ArrowLeft":
                    if (dx === 0) {
                        dx = -1;
                        dy = 0;
                    }
                    e.preventDefault();
                    break;

                case "ArrowRight":
                    if (dx === 0) {
                        dx = 1;
                        dy = 0;
                    }
                    e.preventDefault();
                    break;
            }
        });

        resetGame();
    </script>

</body>
</html>
