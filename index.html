<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computing Homework Task 2</title>
    <style>
        body {
            /* NEW: Changed the whole monitor/screen background to Green */
            background-color: #2E7D32; 
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #score-container {
            display: flex;
            gap: 30px;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
            /* Added text shadow so numbers stay readable if they overlap bright areas */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
        }
        #game-wrapper {
            border: 4px solid #555;
            padding: 15px; 
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }
        canvas {
            /* NEW: Reverted the actual play zone grid back to solid Black */
            background-color: #111;
            display: block;
        }
    </style>
</head>
<body>

    <div id="score-container">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="high-score">0</span></div>
    </div>
    
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 15, y: 15 }];
        let fruits = []; 
        let obstacles = []; 
        let portals = []; 
        
        const maxFruits = 3; 
        const maxObstacles = 3; 
        const maxPortals = 3; 

        let dx = 1; 
        let dy = 0; 
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0; 
        let gameInterval;

        highScoreElement.innerText = highScore;

        function startGame() {
            gameInterval = setInterval(update, 140);
        }

        function update() {
            moveSnake();
            if (checkGameOver()) {
                clearInterval(gameInterval);
                alert("Game Over! You hit an obstacle. Final Score: " + score);
                resetGame();
                return;
            }
            checkPortalCollision(); 
            checkFoodCollision();
            draw();
        }

        function draw() {
            // NEW: Clears play board area to black box layout
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Obstacles (Grey)
            ctx.fillStyle = "#777777"; 
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x * gridSize, obs.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Portals (Black body with Blue Outline)
            portals.forEach(portal => {
                ctx.fillStyle = "#000000"; 
                ctx.fillRect(portal.x * gridSize, portal.y * gridSize, gridSize - 2, gridSize - 2);
                ctx.strokeStyle = "#00E5FF"; 
                ctx.lineWidth = 2;
                ctx.strokeRect(portal.x * gridSize + 1, portal.y * gridSize + 1, gridSize - 4, gridSize - 4);
            });

            // Draw Snake
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = "#1B5E20"; // Dark Forest Green Head
                } else {
                    ctx.fillStyle = "#4CAF50"; // Reverted body blocks back to bright classic green
                }
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Fruits
            ctx.fillStyle = "#FF5252"; 
            fruits.forEach(fruit => {
                ctx.fillRect(fruit.x * gridSize, fruit.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            let nextX = snake.x + dx;
            let nextY = snake.y + dy;

            if (nextX < 0) nextX = tileCount - 1;       
            if (nextX >= tileCount) nextX = 0;          
            if (nextY < 0) nextY = tileCount - 1;       
            if (nextY >= tileCount) nextY = 0;          

            const head = { x: nextX, y: nextY };
            snake.unshift(head); 
            snake.pop(); 
        }

        function checkPortalCollision() {
            let head = snake;
            let hitPortal = portals.some(p => p.x === head.x && p.y === head.y);

            if (hitPortal) {
                let outcome = Math.floor(Math.random() * 5) + 1;
                switch(outcome) {
                    case 1: head.x = 4; head.y = 4; break;
                    case 2: head.x = tileCount - 5; head.y = tileCount - 5; break;
                    case 3: head.x = 15; head.y = 15; break;
                    case 4: head.x = 15; head.y = 5; break;
                    case 5: head.x = 15; head.y = tileCount - 6; break;
                }
                dx = 0;
                dy = 0;
                generateObstacles();
            }
        }

        function checkFoodCollision() {
            let head = snake;
            for (let i = 0; i < fruits.length; i++) {
                if (head.x === fruits[i].x && head.y === fruits[i].y) {
                    score++;
                    scoreElement.innerText = score;
                    
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.innerText = highScore;
                        localStorage.setItem("snakeHighScore", highScore); 
                    }

                    snake.push({}); 
                    fruits.splice(i, 1); 
                    
                    generateObstacles();
                    generateSingleFruit(); 
                    break;
                }
            }
        }

        function generateSingleFruit() {
            let newFruit;
            let invalidPos = true;

            while (invalidPos) {
                newFruit = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                let onSnake = snake.some(part => part.x === newFruit.x && part.y === newFruit.y);
                let onObstacle = obstacles.some(obs => obs.x === newFruit.x && obs.y === newFruit.y);
                let onPortal = portals.some(p => p.x === newFruit.x && p.y === newFruit.y);
                invalidPos = onSnake || onObstacle || onPortal;
            }
            fruits.push(newFruit);
        }

        function generateObstacles() {
            obstacles = [];
            let head = snake;

            let front1 = { x: head.x + dx, y: head.y + dy };
            let front2 = { x: head.x + (dx * 2), y: head.y + (dy * 2) };

            for (let i = 0; i < maxObstacles; i++) {
                let newObs;
                let invalidPos = true;

                while (invalidPos) {
                    newObs = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };

                    let nearSnakeBody = snake.some(part => {
                        return Math.abs(newObs.x - part.x) <= 1 && Math.abs(newObs.y - part.y) <= 1;
                    });

                    let inFrontPath = (newObs.x === front1.x && newObs.y === front1.y) || 
                                      (newObs.x === front2.x && newObs.y === front2.y);

                    let onFruit = fruits.some(f => f.x === newObs.x && f.y === newObs.y);
                    let onObstacle = obstacles.some(obs => obs.x === newObs.x && obs.y === newObs.y);

                    invalidPos = nearSnakeBody || inFrontPath || onFruit || onObstacle;
                }
                obstacles.push(newObs);
            }
        }

        function generatePortals() {
            portals = [];
            for (let i = 0; i < maxPortals; i++) {
                let newPortal;
                let invalidPos = true;
                while (invalidPos) {
                    newPortal = {
                        x: Math.floor(Math.random() * (tileCount - 6)) + 3,
                        y: Math.floor(Math.random() * (tileCount - 6)) + 3
                    };
                    
                    let nearCenter = (Math.abs(newPortal.x - 15) < 3 && Math.abs(newPortal.y - 15) < 3);
                    let onObstacle = obstacles.some(obs => obs.x === newPortal.x && obs.y === newPortal.y);
                    let onPortal = portals.some(p => p.x === newPortal.x && p.y === newPortal.y);
                    invalidPos = nearCenter || onObstacle || onPortal;
                }
                portals.push(newPortal);
            }
        }

        function populateAllFruits() {
            fruits = [];
            for (let i = 0; i < maxFruits; i++) {
                generateSingleFruit();
            }
        }

        function checkGameOver() {
            let head = snake;
            return obstacles.some(obs => obs.x === head.x && obs.y === head.y);
        }

        function resetGame() {
            snake = [{ x: 15, y: 15 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateObstacles(); 
            populateAllFruits();
            startGame();
        }
