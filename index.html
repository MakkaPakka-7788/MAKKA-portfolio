<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hee Hee Games</title>

<style>
body {
    margin: 0;
    background: #000;
    color: white;
    font-family: "Courier New", monospace;
}

header {
    text-align: center;
    padding: 35px 20px;
    border-bottom: 3px solid white;
}

header h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: 4px;
}

header p {
    margin-top: 10px;
    color: #aaa;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 35px auto;
}

h2 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 25px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.game-card {
    display: block;
    background: #111;
    border: 3px solid white;
    color: white;
    text-decoration: none;
    padding: 25px;
    text-align: center;
    transition: 0.15s;
}

.game-card:hover {
    background: white;
    color: black;
    transform: translateY(-4px);
}

.game-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.game-card h3 {
    font-size: 24px;
    margin: 10px 0;
}

.game-card p {
    color: #aaa;
    line-height: 1.5;
}

.game-card:hover p {
    color: #333;
}

footer {
    text-align: center;
    padding: 35px;
    color: #666;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 30px;
    }

    .game-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>HEE HEE GAMES</h1>
    <p>RETRO GAME COLLECTION</p>
</header>

<div class="container">

    <h2>SELECT A GAME</h2>

    <div class="game-grid">

        <a href="snake.html" class="game-card">
            <div class="game-icon">🐍</div>
            <h3>SNAKE</h3>
            <p>Eat the fruit. Avoid the obstacles. Use the portals.</p>
        </a>

        <a href="tetris.html" class="game-card">
            <div class="game-icon">🧱</div>
            <h3>TETRIS</h3>
            <p>Stack the blocks and clear as many lines as possible.</p>
        </a>

        <a href="pong.html" class="game-card">
            <div class="game-icon">🏓</div>
            <h3>PONG</h3>
            <p>Battle the AI and choose your difficulty.</p>
        </a>

    </div>

</div>

<footer>
    HEE HEE GAMES
</footer>

<script>
let rPresses = 0;
let rTimer;

document.addEventListener("keydown", function(event) {
    if (event.key.toLowerCase() !== "r") {
        return;
    }

    rPresses++;

    clearTimeout(rTimer);

    rTimer = setTimeout(function() {
        rPresses = 0;
    }, 700);

    if (rPresses === 3) {
        window.location.href = "flashcards.html";
        rPresses = 0;
    }
});
</script>

</body>
</html>
