<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dune Dash</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hud {
    position: fixed;
    top: 18px;
    left: 18px;
    color: #222;
    background: rgba(255,255,255,0.8);
    padding: 12px 16px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 17px;
    z-index: 5;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

#level {
    margin-top: 5px;
    font-size: 14px;
}

#help {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.75);
    padding: 9px 15px;
    border-radius: 10px;
    font-size: 14px;
    color: #333;
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.3);
    z-index: 10;
}

.panel {
    background: white;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    width: min(90%, 420px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.panel h1 {
    font-size: 45px;
    margin: 0 0 10px;
}

.panel p {
    color: #555;
    line-height: 1.5;
}

button {
    border: none;
    background: #e5a83a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 13px 25px;
    border-radius: 12px;
    cursor: pointer;
}

button:hover {
    background: #d39220;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="hud">
    Height: <span id="height">0</span> m<br>
    Best: <span id="best">0</span> m
    <div id="level">Level 1</div>
</div>

<div id="help">
    ← → / A D &nbsp; Move &nbsp; • &nbsp; R Restart
</div>

<div id="startScreen">
    <div class="panel">
        <h1>🏜️ Dune Dash</h1>
        <p>
            Roll down the dunes, build speed,<br>
            launch into the air and climb as high as possible.
        </p>
        <button id="startButton">START</button>
    </div>
</div>

<div id="gameOver" class="hidden">
    <div class="panel">
        <h1>🏜️ Landed!</h1>
        <p>
            Height reached:
            <strong><span id="finalHeight">0</span> m</strong>
        </p>
        <button id="retryButton">RETRY</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const heightText = document.getElementById("height");
const bestText = document.getElementById("best");
const levelText = document.getElementById("level");

let keys = {};
let running = false;
let gameStarted = false;

let cameraX = 0;
let cameraY = 0;

let highestY = 0;
let bestHeight = Number(localStorage.getItem("duneBest") || 0);

bestText.textContent = bestHeight;

const gravity = 0.42;
const airGravity = 0.30;
const groundFriction = 0.985;
const airFriction = 0.998;

let terrain = [];

const segmentWidth = 80;

function makeTerrain() {
    terrain = [];

    let x = -1000;
    let y = H * 0.72;

    while (x < 100000) {

        let wave =
            Math.sin(x * 0.004) * 130 +
            Math.sin(x * 0.009) * 70 +
            Math.sin(x * 0.018) * 30;

        let newY = H * 0.70 + wave;

        terrain.push({
            x: x,
            y: newY
        });

        x += segmentWidth;
    }
}

makeTerrain();

function terrainY(x) {

    let index = Math.floor((x + 1000) / segmentWidth);

    if (index < 0) return H * 0.7;

    while (index >= terrain.length - 1) {
        generateMoreTerrain();
    }

    const a = terrain[index];
    const b = terrain[index + 1];

    const t = (x - a.x) / (b.x - a.x);

    return a.y + (b.y - a.y) * t;
}

function generateMoreTerrain() {

    let last = terrain[terrain.length - 1];

    for (let i = 1; i <= 100; i++) {

        let x = last.x + i * segmentWidth;

        let wave =
            Math.sin(x * 0.004) * 130 +
            Math.sin(x * 0.009) * 70 +
            Math.sin(x * 0.018) * 30;

        terrain.push({
            x,
            y: H * 0.70 + wave
        });
    }
}

let player = {
    x: 300,
    y: 0,
    vx: 0,
    vy: 0,
    radius: 20,
    grounded: false,
    rotation: 0
};

function resetPlayer() {

    player.x = 300;
    player.y = terrainY(player.x) - player.radius - 2;

    player.vx = 0;
    player.vy = 0;

    player.grounded = true;
    player.rotation = 0;

    cameraX = player.x - W * 0.35;
    cameraY = 0;

    highestY = player.y;
}

function startGame() {

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOver").classList.add("hidden");

    resetPlayer();

    running = true;
    gameStarted = true;
}

function restartGame() {
    startGame();
}

document.getElementById("startButton").onclick = startGame;
document.getElementById("retryButton").onclick = restartGame;

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.key === " "
    ) {
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

let rTimer = null;
let firstR = false;

window.addEventListener("keydown", e => {

    if (e.key.toLowerCase() !== "r") return;

    if (firstR) {

        clearTimeout(rTimer);

        window.location.href = "flashcards.html";

        firstR = false;

    } else {

        firstR = true;

        rTimer = setTimeout(() => {
            firstR = false;
            restartGame();
        }, 450);
    }
});

function update() {

    if (!running) return;

    let left =
        keys["arrowleft"] ||
        keys["a"];

    let right =
        keys["arrowright"] ||
        keys["d"];

    if (left) {
        player.vx -= player.grounded ? 0.10 : 0.055;
    }

    if (right) {
        player.vx += player.grounded ? 0.10 : 0.055;
    }

    if (player.grounded) {

        player.vx *= groundFriction;

        player.vy += gravity;

        player.x += player.vx;

        let ground = terrainY(player.x);

        if (player.y + player.radius >= ground) {

            player.y = ground - player.radius;

            player.vy = 0;

        }

        /*
        Automatic dune launch.

        If the ground suddenly falls away beneath the ball,
        the ball keeps its horizontal momentum and flies upward.
        */

        let frontGround = terrainY(player.x + 45);
        let currentGround = terrainY(player.x);

        let slope = frontGround - currentGround;

        if (slope > 18 && Math.abs(player.vx) > 3) {

            player.grounded = false;

            player.vy = -Math.abs(player.vx) * 0.55;

            player.vx *= 1.05;
        }

    } else {

        player.vy += airGravity;

        player.vx *= airFriction;

        player.x += player.vx;
        player.y += player.vy;

        player.rotation += player.vx * 0.035;

        let ground = terrainY(player.x);

        if (player.y + player.radius >= ground) {

            player.y = ground - player.radius;

            if (Math.abs(player.vy) > 5) {

                player.vy *= -0.45;

            } else {

                player.vy = 0;
                player.grounded = true;

            }
        }
    }

    if (player.y < highestY) {
        highestY = player.y;
    }

    let currentHeight =
        Math.max(
            0,
            Math.floor((terrainY(300) - highestY) / 10)
        );

    heightText.textContent = currentHeight;

    if (currentHeight > bestHeight) {

        bestHeight = currentHeight;

        bestText.textContent = bestHeight;

        localStorage.setItem(
            "duneBest",
            bestHeight
        );
    }

    let level = Math.floor(currentHeight / 100) + 1;

    levelText.textContent =
        "Level " + level;

    /*
    Camera follows player vertically.
    */

    let targetCameraY =
        player.y - H * 0.45;

    cameraY +=
        (targetCameraY - cameraY) * 0.08;

    let targetCameraX =
        player.x - W * 0.35;

    cameraX +=
        (targetCameraX - cameraX) * 0.08;

    /*
    If the ball somehow falls far below the world,
    reset it.
    */

    if (player.y > cameraY + H + 500) {

        running = false;

        document.getElementById("finalHeight").textContent =
            currentHeight;

        document.getElementById("gameOver")
            .classList.remove("hidden");
    }
}

function drawSky() {

    let gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(0, "#78c8e8");
    gradient.addColorStop(1, "#d8f0f4");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
}

function drawSun() {

    let x =
        W - 130;

    let y =
        100 - cameraY * 0.04;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        45,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#fff2b2";
    ctx.fill();
}

function drawDistantDunes() {

    ctx.beginPath();

    ctx.moveTo(0, H);

    for (let x = 0; x <= W; x += 10) {

        let worldX =
            cameraX + x;

        let y =
            H * 0.65 -
            cameraY * 0.15 +
            Math.sin(worldX * 0.002) * 70 +
            Math.sin(worldX * 0.006) * 30;

        ctx.lineTo(x, y);
    }

    ctx.lineTo(W, H);
    ctx.closePath();

    ctx.fillStyle = "#e7bd6e";
    ctx.fill();
}

function drawTerrain() {

    ctx.beginPath();

    ctx.moveTo(0, H);

    let start =
        Math.floor(cameraX / segmentWidth) - 2;

    let end =
        Math.ceil(
            (cameraX + W) /
            segmentWidth
        ) + 2;

    for (
        let i = start;
        i <= end;
        i++
    ) {

        if (i < 0) continue;

        while (i >= terrain.length) {
            generateMoreTerrain();
        }

        let point = terrain[i];

        let sx =
            point.x - cameraX;

        let sy =
            point.y - cameraY;

        if (i === start) {
            ctx.moveTo(sx, sy);
        } else {
            ctx.lineTo(sx, sy);
        }
    }

    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();

    ctx.fillStyle = "#e4ae55";
    ctx.fill();

    /*
    Light top edge.
    */

    ctx.beginPath();

    for (
        let i = start;
        i <= end;
        i++
    ) {

        if (i < 0) continue;

        let point = terrain[i];

        let sx =
            point.x - cameraX;

        let sy =
            point.y - cameraY;

        if (i === start) {
            ctx.moveTo(sx, sy);
        } else {
            ctx.lineTo(sx, sy);
        }
    }

    ctx.strokeStyle = "#f4d48a";
    ctx.lineWidth = 5;
    ctx.stroke();
}

function drawPlayer() {

    let x =
        player.x - cameraX;

    let y =
        player.y - cameraY;

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(player.rotation);

    /*
    Shadow.
    */

    ctx.beginPath();

    ctx.ellipse(
        0,
        player.radius + 5,
        player.radius * 0.9,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(80,50,20,0.18)";

    ctx.fill();

    /*
    Ball.
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#f4f0df";
    ctx.fill();

    ctx.strokeStyle = "#594d3d";
    ctx.lineWidth = 3;
    ctx.stroke();

    /*
    Simple ball markings.
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "#8c806b";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(-17, -5);
    ctx.lineTo(17, 5);

    ctx.strokeStyle = "#8c806b";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
}

function draw() {

    drawSky();
    drawSun();
    drawDistantDunes();
    drawTerrain();

    if (gameStarted) {
        drawPlayer();
    }
}

function loop() {

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
