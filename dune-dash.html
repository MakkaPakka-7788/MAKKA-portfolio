<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dune Dash</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e5bd70;
    font-family: "Courier New", monospace;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#menu {
    position: fixed;
    inset: 0;
    background: rgba(45, 28, 10, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

.menuBox {
    width: min(440px, 90%);
    background: #f4d89a;
    border: 4px solid #5b3b1d;
    box-shadow: 8px 8px 0 rgba(60, 35, 10, 0.35);
    padding: 28px;
    text-align: center;
}

.menuBox h1 {
    margin: 0;
    font-size: 42px;
    color: #4d3218;
}

.menuBox p {
    color: #76532c;
}

button {
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.mainButton {
    width: 100%;
    border: 3px solid #4f3319;
    background: #fff3cf;
    color: #4f3319;
    padding: 15px;
    margin-top: 12px;
    font-size: 20px;
}

.mainButton:hover {
    background: #ffffff;
}

#customizeButton {
    margin-top: 10px;
}

#customize {
    display: none;
    text-align: left;
    margin-top: 20px;
    border-top: 2px solid #9c7845;
    padding-top: 18px;
}

.setting {
    margin-bottom: 15px;
}

.setting label {
    display: block;
    font-weight: bold;
    color: #57391b;
    margin-bottom: 5px;
}

input[type="range"] {
    width: 100%;
}

input[type="color"] {
    width: 60px;
    height: 35px;
    border: 2px solid #5b3b1d;
    background: none;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 5;
    color: white;
    text-shadow: 2px 2px 3px #513517;
    font-weight: bold;
    pointer-events: none;
}

#level {
    font-size: 25px;
}

#pauseButton {
    position: fixed;
    right: 15px;
    top: 15px;
    z-index: 6;
    display: none;
    border: 2px solid #513517;
    background: rgba(255,255,255,.8);
    color: #513517;
    padding: 8px 12px;
}

#controls {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-shadow: 2px 2px 3px #513517;
    z-index: 5;
    text-align: center;
    pointer-events: none;
}

#gameOver {
    position: fixed;
    inset: 0;
    background: rgba(45,28,10,.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 15;
}

.gameOverBox {
    background: #f4d89a;
    border: 4px solid #5b3b1d;
    padding: 30px;
    width: min(400px,90%);
    text-align: center;
}

.gameOverBox h1 {
    margin: 0 0 10px;
    color: #513517;
    font-size: 42px;
}

.stat {
    margin: 7px;
    color: #76532c;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>


<div id="ui">

    <div id="level">
        LEVEL 1
    </div>

    <div>
        DISTANCE:
        <span id="distance">0</span>m
    </div>

    <div>
        COINS:
        <span id="coins">0</span>
    </div>

</div>


<button id="pauseButton">
    PAUSE
</button>


<div id="controls">
    ← → / A D &nbsp; • &nbsp; SPACE = JUMP &nbsp; • &nbsp; RRR = FLASHCARDS
</div>


<div id="menu">

    <div class="menuBox">

        <h1>DUNE DASH</h1>

        <p>
            Ride the endless dunes with your music disc.
        </p>

        <button
            class="mainButton"
            id="startButton"
        >
            ▶ START
        </button>

        <button
            class="mainButton"
            id="customizeButton"
        >
            ⚙ CUSTOMIZE
        </button>


        <div id="customize">

            <div class="setting">

                <label>
                    MUSIC DISC COLOR
                </label>

                <input
                    type="color"
                    id="discColor"
                    value="#315b38"
                >

            </div>


            <div class="setting">

                <label>
                    MUSIC AURA COLOR
                </label>

                <input
                    type="color"
                    id="auraColor"
                    value="#ffd84d"
                >

            </div>


            <div class="setting">

                <label>
                    AURA SIZE
                    <span id="auraValue">35</span>
                </label>

                <input
                    type="range"
                    id="auraSize"
                    min="10"
                    max="80"
                    value="35"
                >

            </div>


            <div class="setting">

                <label>
                    RUN SPEED
                    <span id="speedValue">5</span>
                </label>

                <input
                    type="range"
                    id="speedSetting"
                    min="3"
                    max="9"
                    step="0.5"
                    value="5"
                >

            </div>


            <div class="setting">

                <label>
                    JUMP POWER
                    <span id="jumpValue">12</span>
                </label>

                <input
                    type="range"
                    id="jumpSetting"
                    min="9"
                    max="16"
                    value="12"
                >

            </div>

        </div>

    </div>

</div>


<div id="gameOver">

    <div class="gameOverBox">

        <h1>RETRY</h1>

        <div class="stat">
            DISTANCE:
            <span id="finalDistance">0</span>m
        </div>

        <div class="stat">
            LEVEL:
            <span id="finalLevel">1</span>
        </div>

        <div class="stat">
            COINS:
            <span id="finalCoins">0</span>
        </div>

        <button
            class="mainButton"
            id="retryButton"
        >
            RETRY
        </button>

    </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize", () => {

    W = window.innerWidth;
    H = window.innerHeight;

});


/* =========================
   SETTINGS
========================= */

let settings = {

    discColor: "#315b38",
    auraColor: "#ffd84d",
    auraSize: 35,
    speed: 5,
    jump: 12

};


/* =========================
   INPUT
========================= */

const keys = {};

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {

        e.preventDefault();

        jump();

    }

});

document.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   RRR
========================= */

let rCount = 0;
let rTimer = null;

document.addEventListener("keydown", e => {

    if (e.key.toLowerCase() !== "r") {
        return;
    }

    rCount++;

    clearTimeout(rTimer);

    rTimer = setTimeout(() => {

        rCount = 0;

    }, 700);

    if (rCount >= 3) {

        rCount = 0;

        window.location.href = "flashcards.html";

    }

});


/* =========================
   GAME VARIABLES
========================= */

let running = false;
let paused = false;

let cameraX = 0;

let distance = 0;
let coins = 0;
let level = 1;

let platforms = [];
let coinList = [];
let obstacles = [];

let worldEnd = 0;


/* =========================
   PLAYER
========================= */

const player = {

    x: 180,
    y: 0,

    radius: 22,

    vx: 0,
    vy: 0,

    grounded: false

};


/* =========================
   MUSIC
========================= */

let audioContext = null;
let musicTimer = null;
let musicStep = 0;

function startMusic() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {

        audioContext.resume();

    }

    clearInterval(musicTimer);

    musicStep = 0;

    musicTimer = setInterval(() => {

        if (!running || paused) return;

        playNote();

    }, 330);

}


function playNote() {

    if (!audioContext) return;

    const notes = [
        261.63,
        329.63,
        392.00,
        523.25,
        392.00,
        329.63
    ];

    const frequency =
        notes[musicStep % notes.length];

    musicStep++;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "triangle";

    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.035,
        audioContext.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.25
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.26
    );

}


/* =========================
   START
========================= */

function startGame() {

    running = true;
    paused = false;

    distance = 0;
    coins = 0;
    level = 1;

    cameraX = 0;

    platforms = [];
    coinList = [];
    obstacles = [];

    player.x = 180;
    player.y = H - 160;

    player.vx = 0;
    player.vy = 0;

    createStartingWorld();

    document.getElementById("menu").style.display = "none";

    document.getElementById("gameOver").style.display = "none";

    document.getElementById("pauseButton").style.display = "block";

    startMusic();

    updateUI();

}


/* =========================
   WORLD GENERATION
========================= */

function createStartingWorld() {

    platforms.push({

        x: -500,
        y: H - 90,
        w: 1000,
        h: 200

    });

    worldEnd = 500;

    generateWorld();

}


function generateWorld() {

    while (worldEnd < player.x + 3000) {

        let gap =
            80 + Math.random() * 100;

        let width =
            180 + Math.random() * 230;

        let y =
            H - 120 -
            Math.random() * 170;

        let platform = {

            x: worldEnd + gap,

            y: y,

            w: width,

            h: 100

        };

        platforms.push(platform);

        worldEnd =
            platform.x + platform.w;


        /* coins */

        if (Math.random() < 0.8) {

            coinList.push({

                x:
                    platform.x +
                    50 +
                    Math.random() *
                    Math.max(40, platform.w - 80),

                y:
                    platform.y - 42,

                taken: false

            });

        }


        /* occasional obstacle */

        if (
            Math.random() < 0.25 &&
            distance > 150
        ) {

            obstacles.push({

                x:
                    platform.x +
                    platform.w / 2,

                y:
                    platform.y - 32,

                w: 28,

                h: 32

            });

        }

    }

}


/* =========================
   JUMP
========================= */

function jump() {

    if (
        running &&
        !paused &&
        player.grounded
    ) {

        player.vy =
            -settings.jump;

        player.grounded = false;

    }

}


/* =========================
   UPDATE
========================= */

function update() {

    if (!running || paused) {
        return;
    }


    /* movement */

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {

        player.vx -= 0.5;

    }

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {

        player.vx += 0.5;

    }

    player.vx *= 0.88;

    player.x += settings.speed;

    player.x += player.vx;


    /* gravity */

    player.vy += 0.55;

    player.y += player.vy;

    player.grounded = false;


    /* platforms */

    for (const p of platforms) {

        const left =
            player.x - player.radius;

        const right =
            player.x + player.radius;

        const bottom =
            player.y + player.radius;

        if (

            right > p.x &&

            left < p.x + p.w &&

            bottom >= p.y &&

            bottom <= p.y + 25 &&

            player.vy >= 0

        ) {

            player.y =
                p.y - player.radius;

            player.vy = 0;

            player.grounded = true;

        }

    }


    /* coins */

    for (const c of coinList) {

        if (c.taken) continue;

        const dx =
            player.x - c.x;

        const dy =
            player.y - c.y;

        const d =
            Math.sqrt(dx * dx + dy * dy);

        if (d < 35) {

            c.taken = true;

            coins++;

        }

    }


    /* obstacles */

    for (const o of obstacles) {

        if (

            player.x + player.radius > o.x &&

            player.x - player.radius < o.x + o.w &&

            player.y + player.radius > o.y &&

            player.y - player.radius < o.y + o.h

        ) {

            endGame();

        }

    }


    /* camera */

    cameraX =
        player.x - W * 0.28;


    /* distance */

    distance =
        Math.max(
            distance,
            Math.floor(player.x / 10)
        );


    /* levels */

    level =
        Math.floor(distance / 500) + 1;


    /* more world */

    if (
        player.x >
        worldEnd - 1800
    ) {

        generateWorld();

    }


    /* remove old objects */

    platforms =
        platforms.filter(
            p => p.x + p.w > cameraX - 1000
        );

    coinList =
        coinList.filter(
            c => c.x > cameraX - 1000
        );

    obstacles =
        obstacles.filter(
            o => o.x + o.w > cameraX - 1000
        );


    /* fell */

    if (player.y > H + 200) {

        endGame();

    }

    updateUI();

}


/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById(
        "distance"
    ).textContent = distance;

    document.getElementById(
        "coins"
    ).textContent = coins;

    document.getElementById(
        "level"
    ).textContent =
        "LEVEL " + level;

}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    /* sky */

    ctx.fillStyle = "#e8c984";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* sun */

    ctx.fillStyle = "#fff0ad";

    ctx.beginPath();

    ctx.arc(
        W - 120,
        100,
        55,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* distant dunes */

    ctx.fillStyle = "#d5aa5f";

    ctx.beginPath();

    ctx.moveTo(0, H);

    for (
        let x = 0;
        x <= W;
        x += 60
    ) {

        const y =
            H - 170 -
            Math.sin(
                (x + cameraX * 0.12) / 180
            ) * 40;

        ctx.lineTo(x, y);

    }

    ctx.lineTo(W, H);
    ctx.closePath();

    ctx.fill();


    /* clouds */

    ctx.fillStyle =
        "rgba(255,245,210,.5)";

    for (let i = 0; i < 4; i++) {

        let x =
            ((i * 350 -
            cameraX * 0.06) %
            (W + 500)) - 200;

        let y =
            80 + i * 50;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            25,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30,
            y - 8,
            32,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 65,
            y,
            23,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =========================
   DUNES
========================= */

function drawPlatform(p) {

    const x =
        p.x - cameraX;

    ctx.fillStyle = "#c88f40";

    ctx.beginPath();

    ctx.moveTo(
        x,
        p.y
    );

    ctx.quadraticCurveTo(

        x + p.w * 0.25,
        p.y - 30,

        x + p.w * 0.5,
        p.y

    );

    ctx.quadraticCurveTo(

        x + p.w * 0.75,
        p.y + 25,

        x + p.w,
        p.y

    );

    ctx.lineTo(
        x + p.w,
        H + 100
    );

    ctx.lineTo(
        x,
        H + 100
    );

    ctx.closePath();

    ctx.fill();


    /* sand line */

    ctx.strokeStyle = "#e6bc70";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        x,
        p.y
    );

    ctx.quadraticCurveTo(

        x + p.w * 0.25,
        p.y - 30,

        x + p.w * 0.5,
        p.y

    );

    ctx.quadraticCurveTo(

        x + p.w * 0.75,
        p.y + 25,

        x + p.w,
        p.y

    );

    ctx.stroke();

}


/* =========================
   COINS
========================= */

function drawCoin(c) {

    if (c.taken) return;

    const x =
        c.x - cameraX;

    ctx.fillStyle = "#f4c542";

    ctx.beginPath();

    ctx.arc(
        x,
        c.y,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#9a671e";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.fillStyle = "#fff2a5";

    ctx.fillRect(
        x - 2,
        c.y - 6,
        4,
        12
    );

}


/* =========================
   OBSTACLES
========================= */

function drawObstacle(o) {

    const x =
        o.x - cameraX;

    ctx.fillStyle = "#70451f";

    ctx.beginPath();

    ctx.moveTo(
        x,
        o.y + o.h
    );

    ctx.lineTo(
        x + o.w / 2,
        o.y
    );

    ctx.lineTo(
        x + o.w,
        o.y + o.h
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================
   MUSIC DISC PLAYER
========================= */

function drawPlayer() {

    const x =
        player.x - cameraX;

    const y =
        player.y;

    const pulse =
        Math.sin(
            performance.now() / 110
        ) * 5;


    /* aura */

    const auraRadius =
        settings.auraSize +
        pulse;

    ctx.globalAlpha = 0.22;

    ctx.fillStyle =
        settings.auraColor;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        auraRadius + 15,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.globalAlpha = 0.12;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        auraRadius + 28,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.globalAlpha = 1;


    /* music waves */

    ctx.strokeStyle =
        settings.auraColor;

    ctx.lineWidth = 2;

    ctx.globalAlpha = 0.65;

    for (let i = 0; i < 3; i++) {

        const wave =
            (
                performance.now() / 500 +
                i * 0.33
            ) % 1;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            28 + wave * 45,
            0,
            Math.PI * 2
        );

        ctx.globalAlpha =
            0.5 * (1 - wave);

        ctx.stroke();

    }

    ctx.globalAlpha = 1;


    /* shadow */

    if (player.grounded) {

        ctx.fillStyle =
            "rgba(70,40,15,.25)";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y + 27,
            28,
            7,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* MUSIC DISC */

    ctx.fillStyle =
        settings.discColor;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* disc rings */

    ctx.strokeStyle =
        settings.auraColor;

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        15,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /* center */

    ctx.fillStyle = "#eee";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* music note */

    ctx.fillStyle =
        settings.auraColor;

    ctx.font =
        "bold 15px Arial";

    ctx.fillText(
        "♪",
        x + 13,
        y - 15
    );

}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();


    for (const p of platforms) {

        if (

            p.x + p.w - cameraX > -100 &&

            p.x - cameraX < W + 100

        ) {

            drawPlatform(p);

        }

    }


    for (const c of coinList) {

        if (
            c.x - cameraX > -50 &&
            c.x - cameraX < W + 50
        ) {

            drawCoin(c);

        }

    }


    for (const o of obstacles) {

        if (
            o.x - cameraX > -50 &&
            o.x - cameraX < W + 50
        ) {

            drawObstacle(o);

        }

    }


    drawPlayer();

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    if (!running) return;

    running = false;

    clearInterval(musicTimer);

    document.getElementById(
        "finalDistance"
    ).textContent = distance;

    document.getElementById(
        "finalLevel"
    ).textContent = level;

    document.getElementById(
        "finalCoins"
    ).textContent = coins;

    document.getElementById(
        "gameOver"
    ).style.display = "flex";

    document.getElementById(
        "pauseButton"
    ).style.display = "none";

}


/* =========================
   PAUSE
========================= */

document.getElementById(
    "pauseButton"
).addEventListener("click", () => {

    paused = !paused;

    document.getElementById(
        "pauseButton"
    ).textContent =
        paused ? "RESUME" : "PAUSE";

});


/* =========================
   CUSTOMIZE
========================= */

const customizeButton =
    document.getElementById(
        "customizeButton"
    );

const customize =
    document.getElementById(
        "customize"
    );

customizeButton.addEventListener(
    "click",
    () => {

        if (
            customize.style.display === "block"
        ) {

            customize.style.display =
                "none";

        } else {

            customize.style.display =
                "block";

        }

    }
);


document.getElementById(
    "discColor"
).addEventListener("input", e => {

    settings.discColor =
        e.target.value;

});


document.getElementById(
    "auraColor"
).addEventListener("input", e => {

    settings.auraColor =
        e.target.value;

});


document.getElementById(
    "auraSize"
).addEventListener("input", e => {

    settings.auraSize =
        Number(e.target.value);

    document.getElementById(
        "auraValue"
    ).textContent =
        settings.auraSize;

});


document.getElementById(
    "speedSetting"
).addEventListener("input", e => {

    settings.speed =
        Number(e.target.value);

    document.getElementById(
        "speedValue"
    ).textContent =
        settings.speed;

});


document.getElementById(
    "jumpSetting"
).addEventListener("input", e => {

    settings.jump =
        Number(e.target.value);

    document.getElementById(
        "jumpValue"
    ).textContent =
        settings.jump;

});


/* =========================
   BUTTONS
========================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "retryButton"
).addEventListener(
    "click",
    startGame
);


/* =========================
   LOOP
========================= */

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
