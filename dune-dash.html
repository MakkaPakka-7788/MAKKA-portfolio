<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dune Dash</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#f4c96b;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#ui{
    position:fixed;
    top:18px;
    left:20px;
    z-index:5;
    color:#3d2918;
    font-weight:bold;
    font-size:18px;

    text-shadow:0 1px rgba(255,255,255,.35);
}

#level{
    font-size:15px;
}

#instructions{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.7);
    padding:9px 15px;
    border-radius:20px;
    color:#4b341e;
    font-size:14px;
    z-index:5;
}

#start,#retry{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(238,190,94,.25);
}

.box{
    background:rgba(255,248,222,.95);
    border-radius:18px;
    padding:35px 45px;
    text-align:center;
    box-shadow:0 10px 40px rgba(80,45,10,.25);
}

    margin:0 0 8px;

</head>

<body>

<canvas id="canvas"></canvas>

<div id="ui">
    HEIGHT: <span id="height">0</span>m
    <div id="level">LEVEL 1</div>
</div>

<div id="instructions">
    HOLD SPACE / CLICK TO BUILD MOMENTUM • RELEASE TO LAUNCH
</div>

<div id="start">
    <div class="box">
        <h1>DUNE DASH</h1>
        <p>
            Build speed as you roll down the dunes.<br>
            Release at the right moment to launch high.
        </p>
        <button id="startBtn">START</button>
    </div>
</div>

<div id="retry" class="hidden">
    <div class="box">
        <h1>RUN OVER</h1>
        <p>
            HEIGHT: <span id="finalHeight">0</span>m
        </p>
        <button id="retryBtn">RETRY</button>
    </div>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}

addEventListener("resize",resize);
resize();


/* -------------------------
   GAME SETTINGS
------------------------- */

const gravity=.42;
const airGravity=.27;

let running=false;
let holding=false;

let cameraX=0;
let cameraY=0;

let distance=0;
let highestY=0;

let terrain=[];
const STEP=55;


/* -------------------------
   TERRAIN
------------------------- */

function duneHeight(x){

    return H*.72
        + Math.sin(x*.0032)*125
        + Math.sin(x*.0071)*55
        + Math.sin(x*.014)*22;
}

function createTerrain(){

    terrain=[];

    for(let x=-1000;x<120000;x+=STEP){

        terrain.push({
            x:x,
            y:duneHeight(x)
        });

    }
}

createTerrain();

function getGround(x){

    let i=Math.floor((x+1000)/STEP);

    if(i<0)return H*.72;

    if(i>=terrain.length-1){

        for(let n=0;n<500;n++){

            let xx=terrain[terrain.length-1].x+STEP;

            terrain.push({
                x:xx,
                y:duneHeight(xx)
            });
        }
    }

    let a=terrain[i];
    let b=terrain[i+1];

    let t=(x-a.x)/(b.x-a.x);

    return a.y+(b.y-a.y)*t;
}

function getSlope(x){

    return getGround(x+20)-getGround(x-20);
}


/* -------------------------
   PLAYER
------------------------- */

const ball={
    x:300,
    y:0,
    vx:0,
    vy:0,
    r:19,
    grounded:true,
    rotation:0
};

function reset(){

    ball.x=300;
    ball.y=getGround(ball.x)-ball.r;
    ball.vx=0;
    ball.vy=0;
    ball.grounded=true;
    ball.rotation=0;

    cameraX=0;
    cameraY=0;

    highestY=ball.y;
    distance=0;
}


/* -------------------------
   INPUT
------------------------- */

addEventListener("keydown",e=>{

    if(e.code==="Space"){
        e.preventDefault();
        holding=true;
    }

    if(e.key==="ArrowLeft"||e.key==="a"){
        ball.vx-=.08;
    }

    if(e.key==="ArrowRight"||e.key==="d"){
        ball.vx+=.08;
    }

});

addEventListener("keyup",e=>{

    if(e.code==="Space"){
        holding=false;
    }

});

canvas.addEventListener("mousedown",()=>{
    holding=true;
});

addEventListener("mouseup",()=>{
    holding=false;
});


/* -------------------------
   RR SHORTCUT
------------------------- */

let rCount=0;
let rTimer=null;

addEventListener("keydown",e=>{

    if(e.key.toLowerCase()!=="r")return;

    rCount++;

    clearTimeout(rTimer);

    rTimer=setTimeout(()=>{
        rCount=0;
    },500);

    if(rCount===2){

        rCount=0;
        window.location.href="flashcards.html";

    }

});


/* -------------------------
   PHYSICS
------------------------- */

function update(){

    if(!running)return;


    if(ball.grounded){

        /*
        Gravity pulls the ball along
        the slope. Downhill = speed.
        */

        let slope=getSlope(ball.x);

        ball.vx+=slope*.018;

        /*
        Holding adds extra control/momentum.
        */

        if(holding){

            ball.vx+=.045;

        }

        ball.vx*=.992;

        ball.x+=ball.vx;

        let ground=getGround(ball.x);

        ball.y=ground-ball.r;

        ball.rotation+=ball.vx*.04;


        /*
        The crest launches the ball.
        */

        let ahead=getGround(ball.x+55);
        let behind=getGround(ball.x-55);

        let crest=behind>ground && ahead>ground;

        if(crest && Math.abs(ball.vx)>2.2){

            ball.grounded=false;

            /*
            The faster the ball is moving,
            the higher the launch.
            */

            ball.vy=-Math.min(
                13,
                3.5+Math.abs(ball.vx)*.75
            );

            ball.vx*=1.04;
        }

    }else{

        /*
        Air physics.
        */

        ball.vy+=airGravity;

        ball.x+=ball.vx;
        ball.y+=ball.vy;

        ball.vx*=.998;

        ball.rotation+=ball.vx*.035;


        /*
        Landing.
        */

        let ground=getGround(ball.x);

        if(ball.y+ball.r>=ground){

            ball.y=ground-ball.r;

            /*
            Soft landing.
            */

            if(Math.abs(ball.vy)<6){

                ball.vy=0;
                ball.grounded=true;

            }else{

                /*
                Bounce if landing hard.
                */

                ball.vy*=-.25;

            }
        }
    }


    /*
    Release gives a little extra
    launch impulse when climbing.
    */

    if(
        !holding &&
        ball.grounded &&
        ball.vx>4
    ){

        let slope=getSlope(ball.x);

        if(slope<0){

            ball.grounded=false;

            ball.vy=-Math.min(
                15,
                4+ball.vx*.9
            );
        }
    }


    if(ball.y<highestY){
        highestY=ball.y;
    }


    distance=Math.max(
        0,
        Math.floor(
            (getGround(300)-highestY)/8
        )
    );


    document.getElementById("height")
        .textContent=distance;


    let level=Math.floor(distance/100)+1;

    document.getElementById("level")
        .textContent="LEVEL "+level;


    /*
    Smooth camera.
    */

    let targetX=ball.x-W*.32;

    cameraX+=(targetX-cameraX)*.09;


    let targetY=ball.y-H*.42;

    cameraY+=(targetY-cameraY)*.08;


    /*
    Endless world.
    */

    if(ball.x>terrain[terrain.length-300].x){

        for(let n=0;n<500;n++){

            let xx=
                terrain[terrain.length-1].x+STEP;

            terrain.push({
                x:xx,
                y:duneHeight(xx)
            });
        }
    }


    /*
    Falling too far means run ends.
    */

    if(ball.y>cameraY+H+500){

        endGame();
    }
}


/* -------------------------
   DRAW SKY
------------------------- */

function drawSky(){

    let sky=ctx.createLinearGradient(
        0,0,0,H
    );

    sky.addColorStop(0,"#72c7e8");
    sky.addColorStop(.55,"#c9e8df");
    sky.addColorStop(1,"#f2c66b");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);


    /*
    Sun.
    */

    ctx.beginPath();

    ctx.arc(
        W*.82,
        100-cameraY*.03,
        48,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ffeaa5";
    ctx.fill();
}


/* -------------------------
   DISTANT DUNES
------------------------- */

function drawBackgroundDunes(){

    ctx.beginPath();

    ctx.moveTo(0,H);

    for(let x=0;x<=W;x+=10){

        let wx=x+cameraX;

        let y=
            H*.67-cameraY*.1+
            Math.sin(wx*.002)*70+
            Math.sin(wx*.005)*30;

        ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H);
    ctx.closePath();

    ctx.fillStyle="#e2b45d";
    ctx.fill();
}


/* -------------------------
   MAIN DUNES
------------------------- */

function drawTerrain(){

    ctx.beginPath();

    ctx.moveTo(0,H);

    let start=
        Math.floor((cameraX+1000)/STEP)-2;

    let end=start+
        Math.ceil(W/STEP)+6;

    for(let i=start;i<=end;i++){

        if(i<0)continue;

        if(i>=terrain.length)break;

        let p=terrain[i];

        let x=p.x-cameraX;
        let y=p.y-cameraY;

        if(i===start){
            ctx.moveTo(x,y);
        }else{
            ctx.lineTo(x,y);
        }
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();

    ctx.fillStyle="#dba84e";
    ctx.fill();


    /*
    Light sand crest.
    */

    ctx.beginPath();

    for(let i=start;i<=end;i++){

        if(i<0||i>=terrain.length)continue;

        let p=terrain[i];

        let x=p.x-cameraX;
        let y=p.y-cameraY;

        if(i===start){
            ctx.moveTo(x,y);
        }else{
            ctx.lineTo(x,y);
        }
    }

    ctx.lineWidth=5;
    ctx.strokeStyle="#f2d17c";
    ctx.stroke();
}


/* -------------------------
   BALL
------------------------- */

function drawBall(){

    let x=ball.x-cameraX;
    let y=ball.y-cameraY;

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(ball.rotation);


    /*
    Shadow.
    */

    ctx.beginPath();

    ctx.ellipse(
        0,
        ball.r+5,
        ball.r*.8,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(70,45,20,.18)";
    ctx.fill();


    /*
    Ball.
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#f4ead0";
    ctx.fill();

    ctx.lineWidth=3;
    ctx.strokeStyle="#66533b";
    ctx.stroke();


    /*
    Ball markings.
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        11,
        0,
        Math.PI*2
    );

    ctx.lineWidth=2;
    ctx.strokeStyle="#a18b68";
    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(-16,-5);
    ctx.lineTo(16,5);

    ctx.stroke();


    ctx.restore();
}


/* -------------------------
   DRAW
------------------------- */

function draw(){

    drawSky();
    drawBackgroundDunes();
    drawTerrain();

    if(running){
        drawBall();
    }
}


/* -------------------------
   GAME CONTROL
------------------------- */

function startGame(){

    document.getElementById("start")
        .classList.add("hidden");

    document.getElementById("retry")
        .classList.add("hidden");

    reset();

    running=true;
}

function endGame(){

    running=false;

    document.getElementById("finalHeight")
        .textContent=distance;

    document.getElementById("retry")
        .classList.remove("hidden");
}

document.getElementById("startBtn")
    .onclick=startGame;

document.getElementById("retryBtn")
    .onclick=startGame;


/* -------------------------
   LOOP
------------------------- */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
