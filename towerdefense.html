/* =====================================================
   AUTO WAVES
===================================================== */

function updateWave(dt){

    if(
        !waveRunning &&
        waveCountdown>0
    ){

        waveCountdown-=dt;

        if(
            waveCountdown<=0
        ){

            startWave();
        }

        return;
    }

    if(!waveRunning)
        return;

    spawnTimer-=dt;

    if(
        spawnLeft>0 &&
        spawnTimer<=0
    ){

        spawnEnemy();

        spawnLeft--;

        spawnTimer=Math.max(
            280,
            850-wave*2
        );
    }

    if(
        spawnLeft<=0 &&
        enemies.length===0
    ){

        waveRunning=false;

        /*
            Every 40 waves creates
            a new kingdom.
        */

        if(
            wave%40===0
        ){

            wave++;

            beginNewKingdom();

            return;
        }

        wave++;

        waveCountdown=5000;
    }
}

        paused ||

        make sure the road exists.

    if(
        castles.length>1 &&
        !isRoadConnected()
    ){

        return;

    waveRunning=true;

    waveCountdown=0;

    spawnLeft=Math.min(
        160,
        6+
        Math.floor(wave*.7)+
        kingdom*3
    );

    spawnTimer=0;
}

/* =====================================================
   BUILD ROAD TILE
===================================================== */

function buildRoadTile(){

    const x=
        Math.floor(mouseX/40)*40+20;

    const y=
        Math.floor(mouseY/40)*40+20;


    /*
        Road must be inside map.
    */

    if(
        x<20 ||
        x>1060 ||
        y<20 ||
        y>620
    )
        return;


    /*
        Only two vertical tiles
        for each land section.
        New kingdoms expand vertically
        a little at a time.
    */

    if(
        y<80 ||
        y>560
    )
        return;


    /*
        Prevent duplicate tile.
    */

    if(
        road.some(
            r=>
            r.x===x &&
            r.y===y
        )
    )
        return;


    /*
        New road tile must touch
        an existing road tile or
        a castle.
    */

    const connected=
        road.some(
            r=>
            Math.abs(r.x-x)===40 &&
            r.y===y
        ) ||
        road.some(
            r=>
            Math.abs(r.y-y)===40 &&
            r.x===x
        ) ||
        castles.some(
            c=>
            Math.abs(c.x-x)<45 &&
            Math.abs(c.y-y)<45
        );


    if(!connected)
        return;


    road.push({
        x:x,
        y:y
    });


    /*
        If road reaches the enemy gate,
        construction is complete.
    */

    if(
        road.some(
            r=>
            r.x>=1060 &&
            Math.abs(r.y-300)<20
        )
    ){

        roadMode=false;

        waveCountdown=2000;

        updateRoadButton();

        effects.push({

            x:550,
            y:120,
            life:2200,
            type:"road",
            text:"ROAD CONNECTED"
        });
    }
}


/* =====================================================
   ROAD CONNECTED
===================================================== */

function isRoadConnected(){

    return road.some(
        r=>
        r.x>=1060 &&
        Math.abs(r.y-300)<20

}

/* =====================================================
   ENEMIES
===================================================== */

function spawnEnemy(){

    const roll=Math.random();

    let type;

    if(wave<10){

        type=
            roll<.7
            ?"Spearmen"
            :"Crossbowmen";

    }else if(wave<20){

        type=
            roll<.5
            ?"Spearmen"
            :"Crossbowmen";

    }else if(wave<40){

        type=
            roll<.5
            ?"Crossbowmen"
            :"Guards";

    }else if(wave<80){

        const list=[
            "Crossbowmen",
            "Guards",
            "Mages"
        ];

        type=
            list[
                Math.floor(
                    Math.random()*
                    list.length
                )
            ];

    }else{

        const list=[
            "Guards",
            "Mages",
            "Berserkers"
        ];

        type=
            list[
                Math.floor(
                    Math.random()*
                    list.length
                )
            ];
    }

    const data=
        troopTypes[type];

    const scale=
        1+
        wave*.025+
        kingdom*.12;

    /*
        Find a living castle.
    */

    const alive=
        castles.filter(
            c=>c.alive
        );

    if(!alive.length){

        endGame();

        return;
    }

    const target=
        alive[
            Math.floor(
                Math.random()*
                alive.length
            )
        ];

    enemies.push({

        type:type,

        x:1080,

        y:300,

        hp:data.hp*scale,

        maxHp:data.hp*scale,

        damage:data.damage*scale,

        speed:
            .035+
            Math.min(
                wave*.00015,
                .03
            ),

        targetCastle:target,

        slow:0
    });
}


/* =====================================================
   ENEMY MOVEMENT
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=enemies[i];

        let speed=enemy.speed;

        if(enemy.slow>0){

            speed*=.35;

            enemy.slow-=dt;
        }


        /*
            Follow road.
        */

        const nextRoad=
            findNearestRoad(
                enemy.x,
                enemy.y
            );

        if(nextRoad){

            const dx=
                nextRoad.x-
                enemy.x;

            const dy=
                nextRoad.y-
                enemy.y;

            const distance=
                Math.hypot(dx,dy);

            if(distance>5){

                enemy.x+=
                    dx/distance*
                    speed*
                    dt;

                enemy.y+=
                    dy/distance*
                    speed*
                    dt;
            }

        }else{

            /*
                If no road exists,
                move toward center.
            */

            enemy.x-=
                speed*
                dt;
        }


        /*
            Reach a castle.
        */

        if(enemy.x<115){

            damageCastle(
                enemy.targetCastle,
                enemy
            );

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   ROAD FOLLOWING
===================================================== */

function findNearestRoad(x,y){

    let nearest=null;
    let best=Infinity;

    for(
        const tile of road
    ){

        const d=
            Math.hypot(
                tile.x-x,
                tile.y-y
            );

        if(d<best){

            best=d;
            nearest=tile;
        }
    }

    return nearest;
}


/* =====================================================
   CASTLE DAMAGE
===================================================== */

function damageCastle(
    castle,
    enemy
){

    if(
        !castle ||
        !castle.alive
    ){

        const alive=
            castles.filter(
                c=>c.alive
            );

        if(!alive.length){

            endGame();

            return;
        }

        castle=
            alive[
                Math.floor(
                    Math.random()*
                    alive.length
                )
            ];
    }

    castle.hp-=
        enemy.damage*.35;

    effects.push({

        x:castle.x,

        y:castle.y,

        life:100,

        type:"hit"
    });

    if(castle.hp<=0){

        castle.hp=0;

        castle.alive=false;

        effects.push({

            x:castle.x,

            y:castle.y,

            life:1800,

            type:"fallen"
        });

        /*
            If every castle falls:
            defeat.
        */

        if(
            castles.every(
                c=>!c.alive
            )
        ){

            endGame();
        }
    }
}


/* =====================================================
   CASTLE TROOP BUTTONS
===================================================== */

function updateCastleButtons(){

    const bar=
        document.getElementById(
            "castleBar"
        );

    bar.innerHTML="";


    for(
        const castle of castles
    ){

        if(!castle.alive)
            continue;

        const type=
            troopTypes[
                castle.troop
            ];

        const button=
            document.createElement(
                "button"
            );

        button.textContent=
            "CASTLE "+
            castle.id+
            ": SPAWN "+
            castle.troop+
            " $"+
            type.cost;

        button.onclick=()=>{
            spawnTroop(castle.id);
        };

        bar.appendChild(button);
    }
}


/* =====================================================
   SPAWN TROOP
===================================================== */

function spawnTroop(castleId){

    const castle=
        castles.find(
            c=>c.id===castleId
        );

    if(
        !castle ||
        !castle.alive
    )
        return;

    const data=
        troopTypes[
            castle.troop
        ];

    if(
        money<data.cost
    )
        return;

    money-=data.cost;

    troops.push({

        castle:castle,

        x:castle.x+45,

        y:castle.y,

        hp:data.hp,

        maxHp:data.hp,

        damage:data.damage,

        speed:data.speed,

        type:castle.troop,

        color:data.color,

        cooldown:0
    });
}


/* =====================================================
   TROOPS
===================================================== */

function updateTroops(dt){

    for(
        const troop of troops
    ){

        troop.cooldown-=dt;


        /*
            March toward the enemy.
        */

        if(
            troop.x<650
        ){

            troop.x+=
                troop.speed*
                dt;

        }else{

            let target=null;
            let closest=Infinity;

            for(
                const enemy of enemies
            ){

                const d=
                    Math.hypot(
                        enemy.x-troop.x,
                        enemy.y-troop.y
                    );

                if(
                    d<55 &&
                    d<closest
                ){

                    closest=d;
                    target=enemy;
                }
            }

            if(target){

                if(
                    troop.cooldown<=0
                ){

                    target.hp-=
                        troop.damage;

                    troop.cooldown=
                        650;

                    effects.push({

                        x:target.x,
                        y:target.y,
                        life:100,
                        type:"hit"
                    });
                }

            }else{

                troop.x+=
                    troop.speed*
                    dt;
            }
        }
    }


    /*
        Remove dead troops.
    */

    for(
        let i=troops.length-1;
        i>=0;
        i--
    ){

        if(
            troops[i].hp<=0
        ){

            troops.splice(i,1);
        }
    }


    /*
        Remove defeated enemies.
    */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        if(
            enemies[i].hp<=0
        ){

            money+=15;

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   TOWER SELECTION
===================================================== */

function selectTower(type){

    if(
        !unlockedTowers.includes(
            type
        )
    ){

        return;
    }

    selectedTowerType=type;

    selectedTower=null;

    document
        .querySelectorAll(
            ".towerButton"
        )
        .forEach(
            b=>
            b.classList.remove(
                "selected"
            )
        );

    const button=
        document.getElementById(
            type+"Button"
        );

    if(button)
        button.classList.add(
            "selected"
        );

    showBuildInfo(type);
}


/* =====================================================
   BUILD TOWER
===================================================== */

function buildTower(){

    const data=
        towerTypes[
            selectedTowerType
        ];

    if(
        money<data.cost
    )
        return;

    if(
        !validPlacement(
            placementX,
            placementY
        )
    )
        return;

    money-=data.cost;

    towers.push({

        x:placementX,
        y:placementY,

        type:selectedTowerType,

        range:data.range,

        damage:data.damage,

        fireRate:data.fireRate,

        cooldown:0,

        angle:0,

        flash:0,

        level:1
    });
}


/* =====================================================
   VALID TOWER PLACEMENT
===================================================== */

function validPlacement(x,y){

    /*
        Cannot build on roads.
    */

    if(
        road.some(
            r=>
            Math.hypot(
                r.x-x,
                r.y-y
            )<25
        )
    )
        return false;


    /*
        Cannot build on castles.
    */

    for(
        const castle of castles
    ){

        if(
            Math.hypot(
                castle.x-x,
                castle.y-y
            )<65
        )
            return false;
    }


    /*
        Cannot overlap towers.
    */

    for(
        const tower of towers
    ){

        if(
            Math.hypot(
                tower.x-x,
                tower.y-y
            )<45
        )
            return false;
    }


    /*
        Keep inside map.
    */

    if(
        x<25 ||
        x>1075 ||
        y<25 ||
        y>625
    )
        return false;


    return true;
}


/* =====================================================
   TOWERS UPDATE
===================================================== */

function updateTowers(dt){

    for(
        const tower of towers
    ){

        tower.cooldown-=dt;

        tower.flash=
            Math.max(
                0,
                tower.flash-dt
            );

        if(
            tower.cooldown>0
        )
            continue;


        let target=null;
        let closest=Infinity;

        for(
            const enemy of enemies
        ){

            const d=
                Math.hypot(
                    enemy.x-tower.x,
                    enemy.y-tower.y
                );

            if(
                d<tower.range &&
                d<closest
            ){

                closest=d;
                target=enemy;
            }
        }


        if(!target)
            continue;


        tower.angle=
            Math.atan2(
                target.y-tower.y,
                target.x-tower.x
            );

        tower.flash=120;


        bullets.push({

            x:tower.x,

            y:tower.y,

            target:target,

            damage:tower.damage,

            speed:
                tower.type==="laser"
                ?18
                :8,

            type:tower.type
        });


        tower.cooldown=
            tower.fireRate;
    }
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            bullets[i];

        if(
            !enemies.includes(
                bullet.target
            )
        ){

            bullets.splice(i,1);

            continue;
        }


        const dx=
            bullet.target.x-
            bullet.x;

        const dy=
            bullet.target.y-
            bullet.y;

        const d=
            Math.hypot(dx,dy);


        if(
            d<bullet.speed*dt+6
        ){

            /*
                Splash.
            */

            if(
                bullet.type==="splash"
            ){

                for(
                    const enemy of enemies
                ){

                    if(
                        Math.hypot(
                            enemy.x-
                            bullet.target.x,

                            enemy.y-
                            bullet.target.y
                        )<70
                    ){

                        enemy.hp-=
                            bullet.damage;
                    }
                }

            }else{

                bullet.target.hp-=
                    bullet.damage;
            }


            /*
                Slow.
            */

            if(
                bullet.type==="slow"
            ){

                bullet.target.slow=1000;
            }


            /*
                Freeze.
            */

            if(
                bullet.type==="freeze"
            ){

                bullet.target.slow=2200;
            }


            effects.push({

                x:bullet.target.x,
                y:bullet.target.y,
                life:150,
                type:"hit"
            });

            bullets.splice(i,1);

        }else{

            bullet.x+=
                dx/d*
                bullet.speed*
                dt;

            bullet.y+=
                dy/d*
                bullet.speed*
                dt;
        }
    }
}


/* =====================================================
   UPGRADE
===================================================== */

function upgradeSelected(){

    if(!selectedTower)
        return;

    const cost=
        selectedTower.level*
        50;

    if(
        money<cost
    )
        return;

    money-=cost;

    selectedTower.level++;

    selectedTower.damage=
        Math.round(
            selectedTower.damage*
            1.35
        );

    selectedTower.range+=10;

    selectedTower.fireRate=
        Math.max(
            80,
            Math.round(
                selectedTower.fireRate*
                .9
            )
        );

    showTowerInfo();
}


/* =====================================================
   SELL
===================================================== */

function sellSelected(){

    if(!selectedTower)
        return;

    const index=
        towers.indexOf(
            selectedTower
        );

    if(index<0)
        return;

    money+=Math.floor(
        towerTypes[
            selectedTower.type
        ].cost*
        .6*
        selectedTower.level
    );

    towers.splice(
        index,
        1
    );

    selectedTower=null;

    showBuildInfo(
        selectedTowerType
    );
}

function getTowerKey(type){

    const keys={
        basic:"[1]",
        rapid:"[2]",
        heavy:"[3]",
        slow:"[4]",
        splash:"[5]",
        laser:"[6]",
        freeze:"[7]",
        sniper:"[8]",
        tesla:"[9]",
        rocket:"[0]"
    };

}


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
"mousemove",
function(e){

    const rect=
        canvas.getBoundingClientRect();

    mouseX=
        (e.clientX-
        rect.left)*
        W/
        rect.width;

    mouseY=
        (e.clientY-
        rect.top)*
        H/
        rect.height;

    placementX=
        Math.floor(
            mouseX/40
        )*
        40+
        20;

    placementY=
        Math.floor(
            mouseY/40
        )*
        40+
        20;
});


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.fillStyle="#0c0c0c";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawGrid();

    drawLand();

    drawRoad();

    drawPlacement();

    drawCastles();

    drawTowers();

    drawTroops();

    drawEnemies();

    drawBullets();

    drawEffects();

    drawWaveStatus();

    updateStats();
}


/* =====================================================
   GRID
===================================================== */

function drawGrid(){

    ctx.strokeStyle="#151515";
    ctx.lineWidth=1;

    for(
        let x=0;
        x<W;
        x+=40
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }

    for(
        let y=0;
        y<H;
        y+=40
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }
}

/* =====================================================
   PLACEMENT
===================================================== */

function drawPlacement(){

    if(
        !running ||
        paused ||
        roadMode
    )
        return;

    const data=
        towerTypes[
            selectedTowerType
        ];

    const valid=
        money>=data.cost &&
        validPlacement(
            placementX,
            placementY
        );

    ctx.strokeStyle=
        valid
        ?"rgba(255,255,255,.35)"
        :"rgba(255,0,0,.45)";

    ctx.beginPath();

    ctx.arc(
        placementX,
        placementY,
        data.range,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle=
        valid
        ?"rgba(255,255,255,.18)"
        :"rgba(255,0,0,.18)";

    ctx.fillRect(
        placementX-20,
        placementY-20,
        40,
        40
    );

    ctx.strokeStyle=
        valid
        ?"white"
        :"red";

    ctx.strokeRect(
        placementX-20,
        placementY-20,
        40,
        40
    );
}


/* =====================================================
   CASTLES

function drawCastles(){

    for(

                castle.y-32,

            );

            ctx.font=
                "bold 10px Courier New";

            ctx.fillText(
                "FALLEN",
                castle.x-27,
                castle.y+4
            );

            continue;
        }


        /*
            Castle.
        */

        ctx.fillStyle="#777";

        ctx.fillRect(
            castle.x-32,
            castle.y-32,
            64,
            64
        );


        /*
            Towers.
        */

        ctx.fillStyle="#aaa";

        ctx.fillRect(
            castle.x-42,
            castle.y-45,
            15,
            28
        );

        ctx.fillRect(
            castle.x+27,
            castle.y-45,
            15,
            28
        );


        /*
            Gate.
        */

        ctx.fillStyle="#222";

        ctx.fillRect(
            castle.x-8,
            castle.y+10,
            16,
            22
        );


        /*
            Flag.
        */

        ctx.fillStyle=
            troopTypes[
                castle.troop
            ].color;

        ctx.fillRect(
            castle.x,
            castle.y-60,
            3,
            32
        );


        ctx.beginPath();

        ctx.moveTo(
            castle.x+3,
            castle.y-60
        );

        ctx.lineTo(
            castle.x+25,
            castle.y-52
        );

        ctx.lineTo(
            castle.x+3,
            castle.y-44
        );

        /*
            Castle number.
        */

        ctx.fillStyle="#111";

        ctx.font=
            "bold 20px Courier New";

        ctx.fillText(
            castle.id,
            castle.x-6,
            castle.y-1
        );

            HP.
        */

        ctx.fillStyle="#222";

        ctx.fillRect(
            castle.x-42,
            castle.y+43,
            84,
            7
        );

        ctx.fillStyle="#ddd";

        ctx.fillRect(
            castle.x-42,
            castle.y+43,
            84*
            castle.hp/
            castle.maxHp,

        );

            Troop name.
        */

        ctx.fillStyle=
            troopTypes[
                castle.troop
            ].color;

            "9px Courier New";

        ctx.fillText(
            castle.troop,
            castle.x-38,
            castle.y+65
        );
    }
}


/* =====================================================
   TOWERS DRAW
===================================================== */

function drawTowers(){

    const colours={

        basic:"#d44",
        rapid:"#4af",
        heavy:"#f5a623",
        slow:"#5c6",
        splash:"#b65cff",
        laser:"#4ff",
        freeze:"#8cf",
        sniper:"#eee",
        tesla:"#ff5",
        rocket:"#f66"
    };


    for(
        const tower of towers
    ){

        if(
            selectedTower===tower
        ){

            ctx.strokeStyle=
                "rgba(255,255,255,.35)";

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                tower.range,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        ctx.fillStyle=
            colours[
                tower.type
            ];


        /*
            Different shapes.
        */

        if(
            tower.type==="sniper"
        ){

            ctx.beginPath();

            ctx.moveTo(
                tower.x,
                tower.y-23
            );

            ctx.lineTo(
                tower.x+24,
                tower.y+20
            );

            ctx.lineTo(
                tower.x-24,
                tower.y+20
            );

            ctx.closePath();

            ctx.fill();

        }else if(
            tower.type==="tesla"
        ){

            ctx.beginPath();

            for(
                let i=0;
                i<8;
                i++
            ){

                const angle=
                    i*Math.PI/4;

                const radius=
                    i%2
                    ?11
                    :23;

                const px=
                    tower.x+
                    Math.cos(angle)*
                    radius;

                const py=
                    tower.y+
                    Math.sin(angle)*
                    radius;

                if(i===0)
                    ctx.moveTo(px,py);
                else
                    ctx.lineTo(px,py);
            }

            ctx.closePath();

            ctx.fill();

        }else if(
            tower.type==="heavy"
        ){

            ctx.fillRect(
                tower.x-22,
                tower.y-22,
                44,
                44
            );

        }else{

            ctx.fillRect(
                tower.x-18,
                tower.y-18,
                36,
                36
            );
        }


        /*
            Center.
        */

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            tower.x,
            tower.y,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
            Barrel.
        */

        ctx.save();

        ctx.translate(
            tower.x,
            tower.y
        );

        ctx.rotate(
            tower.angle
        );

        ctx.fillStyle="#111";

        ctx.fillRect(
            0,
            -4,
            27,
            8
        );

        ctx.restore();


        /*
            Shooting flash.
        */

        if(
            tower.flash>0
        ){

            ctx.fillStyle="#fff";

            ctx.beginPath();

            ctx.arc(
                tower.x+
                Math.cos(
                    tower.angle
                )*32,

                tower.y+
                Math.sin(
                    tower.angle
                )*32,

                9,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        /*
            Level.
        */

        ctx.fillStyle="#111";

        ctx.font=
            "bold 9px Courier New";

        ctx.fillText(
            tower.level,
            tower.x-3,
            tower.y+3
        );
    }
}


/* =====================================================
   TROOPS DRAW
===================================================== */

function drawTroops(){

    for(

    ){

        /*

        );

/* =====================================================
   ENEMIES DRAW
===================================================== */

function drawEnemies(){

    const colours={

        Spearmen:"#5c6",
        Crossbowmen:"#b65cff",
        Guards:"#f66",
        Mages:"#5ff",
        Berserkers:"#f90"
    };


    for(
        const enemy of enemies
    ){

        ctx.fillStyle=
            colours[

            ];


        if(
            enemy.type==="Spearmen"
        ){

            ctx.fillRect(
                enemy.x-9,
                enemy.y-9,
                18,
                18
            );

        }else if(
            enemy.type==="Crossbowmen"
        ){

            ctx.beginPath();

            ctx.moveTo(
                enemy.x,
                enemy.y-14
            );

            ctx.lineTo(
                enemy.x+14,
                enemy.y
            );

            ctx.lineTo(
                enemy.x,
                enemy.y+14
            );

            ctx.lineTo(
                enemy.x-14,
                enemy.y
            );

            ctx.closePath();

            ctx.fill();

        }else if(
            enemy.type==="Guards"
        ){

            ctx.fillRect(
                enemy.x-15,
                enemy.y-15,
                30,
                30
            );

        }else if(
            enemy.type==="Mages"
        ){

            ctx.beginPath();

            ctx.arc(
                enemy.x,
                enemy.y,
                14,
                0,
                Math.PI*2
            );

            ctx.fill();

        }else{

            ctx.beginPath();

            ctx.moveTo(
                enemy.x,
                enemy.y-17
            );

            ctx.lineTo(
                enemy.x+17,
                enemy.y+14
            );

            ctx.lineTo(
                enemy.x-17,
                enemy.y+14
            );

            ctx.closePath();

            ctx.fill();
        }


        /*
            HP bar.
        */

        ctx.fillStyle="#222";

        ctx.fillRect(
            enemy.x-17,
            enemy.y-23,
            34,
            4
        );

        ctx.fillStyle="#eee";

        ctx.fillRect(
            enemy.x-17,
            enemy.y-23,
            34*
            Math.max(
                0,
                enemy.hp/
                enemy.maxHp
            ),
            4
        );
    }
}


/* =====================================================
   BULLETS
===================================================== */

function drawBullets(){

    for(
        const bullet of bullets
    ){

        ctx.fillStyle=
            bullet.type==="laser"
            ?"white"
            :"#ddd";

        ctx.fillRect(
            bullet.x-3,
            bullet.y-3,
            6,
            6
        );
    }
}


/* =====================================================
   EFFECTS
===================================================== */

function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        effects[i].life-=dt;

        if(
            effects[i].life<=0
        ){

            effects.splice(i,1);
        }
    }
}


function drawEffects(){

    for(
        const effect of effects
    ){

        if(
            effect.type==="unlock"
        ){

            ctx.fillStyle="#fff";

            ctx.font=
                "bold 22px Courier New";

            ctx.textAlign="center";

            ctx.fillText(
                effect.text,
                W/2,
                165
            );

            ctx.textAlign="left";

        }else if(
            effect.type==="kingdom"
        ){

            ctx.fillStyle="#fff";

            ctx.font=
                "bold 25px Courier New";

            ctx.textAlign="center";

            ctx.fillText(
                effect.text,
                W/2,
                215
            );

            ctx.textAlign="left";

        }else if(
            effect.type==="road"
        ){

            ctx.fillStyle="#fff";

            ctx.font=
                "bold 22px Courier New";

            ctx.textAlign="center";

            ctx.fillText(
                effect.text,
                W/2,
                120
            );

            ctx.textAlign="left";

        }else if(
            effect.type==="fallen"
        ){

            ctx.fillStyle="#f33";

            ctx.font=
                "bold 11px Courier New";

            ctx.fillText(
                "CASTLE FALLEN",
                effect.x-45,
                effect.y-50
            );

        }else{

            ctx.strokeStyle=
                "rgba(255,255,255,.8)";

            ctx.strokeRect(
                effect.x-10,
                effect.y-10,
                20,
                20
            );
        }
    }
}


/* =====================================================
   WAVE STATUS
===================================================== */

function drawWaveStatus(){

    if(!running)
        return;


    ctx.textAlign="center";

    if(paused){

        ctx.fillStyle="#fff";

        ctx.font=
            "bold 24px Courier New";

        ctx.fillText(
            "PAUSED",
            W/2,
            55
        );

    }else if(
        !waveRunning &&
        waveCountdown>0
    ){

        ctx.fillStyle="#eee";

        ctx.font=
            "bold 20px Courier New";

        ctx.fillText(
            "NEXT WAVE IN "+
            Math.ceil(
                waveCountdown/1000
            ),
            W/2,
            55
        );

    }else if(waveRunning){

        ctx.fillStyle="#eee";

        ctx.font=
            "bold 18px Courier New";

        ctx.fillText(
            "WAVE "+
            wave+
            " — ENEMIES "+
            enemies.length+
            " + "+
            spawnLeft,
            W/2,
            55
        );
    }

    ctx.textAlign="left";
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const alive=
        castles.filter(
            c=>c.alive
        ).length;

    document.getElementById(
        "stats"
    ).textContent=
        "$"+
        money+
        " | WAVE "+
        wave+
        " | KINGDOM "+
        kingdom+
        " | CASTLES "+
        alive+
        "/"+
        castles.length;
}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(!running)
        return;

    paused=!paused;
}


/* =====================================================
   SAVE
===================================================== */

function saveGame(slot){

    if(!running)
        return;

    const data={

        money:money,

        wave:wave,

        kingdom:kingdom,

        castles:castles,

        towers:towers,

        unlockedTowers:
            unlockedTowers,

        road:road,

        waveCountdown:
            waveCountdown
    };

    localStorage.setItem(
        "kingdomWarSave"+
        slot,
        JSON.stringify(data)
    );

    alert(
        "SAVED TO SLOT "+
        slot
    );
}


/* =====================================================
   LOAD
===================================================== */

function loadGame(slot){

    const raw=
        localStorage.getItem(
            "kingdomWarSave"+
            slot
        );

    if(!raw){

        alert(
            "SAVE SLOT "+
            slot+
            " IS EMPTY"
        );

        return;
    }

    const data=
        JSON.parse(raw);

    money=data.money;
    wave=data.wave;
    kingdom=data.kingdom;

    castles=data.castles||[];
    towers=data.towers||[];

    unlockedTowers=
        data.unlockedTowers||
        [
            "basic",
            "rapid"
        ];

    road=data.road||[];

    waveCountdown=
        data.waveCountdown||
        5000;

    enemies=[];
    troops=[];
    bullets=[];
    effects=[];

    selectedTower=null;

    roadMode=false;

    paused=false;

    running=true;

    updateTowerButtons();
    updateCastleButtons();
    updateRoadButton();

    hideOverlay();

    lastTime=performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    running=false;
    waveRunning=false;

    document.getElementById(
        "overlayTitle"
    ).textContent="RETRY";

    document.getElementById(
        "overlayTitle"
    ).className="retry";

    document.getElementById(
        "overlayText"
    ).innerHTML=
        "ALL YOUR CASTLES HAVE FALLEN"+
        "<br><br>"+
        "Kingdom: "+
        kingdom+
        "<br>"+
        "Wave: "+
        wave+
        "<br><br>"+
        "YOUR SAVES ARE SAFE.";

    const main=
        document.getElementById(
            "mainButton"
        );

    main.textContent="RETRY";
    main.onclick=startGame;
    main.className="retryButton";

    document.getElementById(
        "homeButton"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "overlay"
    ).classList.remove(
        "hidden"
    );
}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.location.href=
        "index.html";
}


/* =====================================================
   OVERLAY
===================================================== */

function hideOverlay(){

    document.getElementById(
        "overlay"
    ).classList.add(
        "hidden"
    );
}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
"keydown",
function(e){

    const key=
        e.key.toLowerCase();

    const keys={

        "1":"basic",
        "2":"rapid",
        "3":"heavy",
        "4":"slow",
        "5":"splash",
        "6":"laser",
        "7":"freeze",
        "8":"sniper",
        "9":"tesla",
        "0":"rocket"
    };


    if(keys[key]){

        selectTower(
            keys[key]
        );
    }


    /*
        RRR = HOME
    */

    if(key==="r"){

        rCount++;

        clearTimeout(
            rTimer
        );

        rTimer=
            setTimeout(
                ()=>{
                    rCount=0;
                },
                700
            );

        if(rCount===3){

            rCount=0;

            goHome();
        }
    }
});


/* =====================================================
   INITIAL
===================================================== */

updateTowerButtons();

updateCastleButtons();

updateRoadButton();

updateStats();

draw();

</script>
