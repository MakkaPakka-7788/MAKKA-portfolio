const towerOrder = [

/* =========================

const troopTypes = {

    },

    },

    },

    },

    },

    },

        speed: .032,
        cost: 145,
        color: "#5ff",
        attackRate: 1000
    }
};

const troopOrder = [
    "Swordsmen",
    "Archers",
    "Knights",
    "Spearmen",
    "Crossbowmen",
    "Guards",
    "Mages"
];


/* =========================
   START
========================= */

function startGame() {

    money = 300;
    wave = 1;
    kingdom = 1;

    paused = false;

    unlockedTowers = [
        "basic",
        "rapid"
    ];

    castles = [
        {
            id: 1,
            x: 105,
            y: 325,
            hp: 1000,
            maxHp: 1000,
            alive: true,
            troop: "Swordsmen"
        }
    ];

    towers = [];
    enemies = [];
    troops = [];
    bullets = [];
    effects = [];

    roadPoints = [];

    selectedTower = null;
    selectedTowerType = "basic";

    roadMode = false;

    waveRunning = false;
    waveTimer = 2500;

    updateButtons();
    updateCastleButtons();

    hideOverlay();

    running = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


/* =========================
   LOOP
========================= */

function gameLoop(time) {

    if (!running)
        return;

    const dt = Math.min(time - lastTime, 50);

    lastTime = time;

    if (!paused)
        update(dt);

    draw();
    updateStats();

    requestAnimationFrame(gameLoop);
}


/* =========================
   UPDATE
========================= */

function update(dt) {

    updateWaves(dt);
    updateEnemies(dt);
    updateTowers(dt);
    updateBullets(dt);
    updateTroops(dt);
    updateEffects(dt);
}


/* =========================
   WAVES
========================= */

function updateWaves(dt) {

    if (!waveRunning) {

        waveTimer -= dt;

        if (waveTimer <= 0) {

            if (
                kingdom > 1 &&
                !roadConnected()
            ) {
                roadMode = true;
                return;
            }

            startWave();
        }

        return;
    }

    spawnTimer -= dt;

    if (
        spawnLeft > 0 &&
        spawnTimer <= 0
    ) {

        spawnEnemy();

        spawnLeft--;

        spawnTimer = Math.max(
            700,
            1200 - wave * 2
        );
    }

    if (
        spawnLeft <= 0 &&
        enemies.length === 0
    ) {

        waveRunning = false;

        /*
            WAVE PAYOUT

            Higher waves give more money,
            but the payout stays reasonable
            so the game does not become easy.
        */

        waveReward =
            45 +
            wave * 9 +
            kingdom * 30;

        money += waveReward;

        effects.push({
            x: W / 2,
            y: 75,
            life: 2200,
            type: "reward",
            text: "WAVE CLEAR  +$" + waveReward
        });

        if (wave % 40 === 0) {

            wave++;

            conquerKingdom();

            return;
        }

        wave++;

        waveTimer = 5000;
    }
}


/* =========================
   START WAVE
========================= */

function startWave() {

    if (paused)
        return;

    if (
        kingdom > 1 &&
        !roadConnected()
    )
        return;

    waveRunning = true;

    /*
        Fewer enemies.

        They get much stronger as waves
        increase instead of simply becoming
        a giant swarm.
    */

    spawnLeft =
        Math.min(
            65,
            4 +
            Math.floor(wave * .34) +
            kingdom
        );

    spawnTimer = 500;
}


/* =========================
   ENEMY DATA
========================= */

function getEnemyType() {

    const random = Math.random();

    /*
        New powerful enemies start appearing
        in later waves.
    */

    if (wave < 10) {

        return random < .65
            ? "Spearmen"
            : "Crossbowmen";

    }

    if (wave < 20) {

        return random < .5
            ? "Crossbowmen"
            : "Guards";

    }

    if (wave < 35) {

        if (random < .35)
            return "Crossbowmen";

        if (random < .7)
            return "Guards";

        return "Mages";
    }

    if (wave < 50) {

        if (random < .25)
            return "Guards";

        if (random < .55)
            return "Mages";

        if (random < .8)
            return "Knights";

        return "Boss";
    }

    /*
        Wave 50+.

        Mostly powerful enemies with occasional
        bosses.
    */

    if (random < .18)
        return "Boss";

    if (random < .43)
        return "Mages";

    if (random < .68)
        return "Guards";

    if (random < .84)
        return "Knights";

    return "Crossbowmen";
}


/* =========================
   ENEMY STATS
========================= */

function getEnemyStats(type) {

    if (type === "Boss") {

        return {
            hp: 1800,
            damage: 115,
            speed: .018,
            size: 23
        };
    }

    const data = troopTypes[type];

    return {
        hp: data.hp,
        damage: data.damage,
        speed: .035,
        size: 15
    };
}


/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy() {

    const type = getEnemyType();
    const data = getEnemyStats(type);

    /*
        Strong scaling.

        This is intentionally much harder
        around Wave 50+.
    */

    const waveScale =
        1 +
        Math.max(0, wave - 1) * .055;

    const kingdomScale =
        1 +
        Math.max(0, kingdom - 1) * .12;

    let hp =
        data.hp *
        waveScale *
        kingdomScale;

    let damage =
        data.damage *
        (
            1 +
            Math.max(0, wave - 1) * .032
        ) *
        kingdomScale;

    if (type === "Boss") {

        hp *= 1.4;
        damage *= 1.25;
    }

    enemies.push({

        type,

        x: 1080,
        y: 325,

        hp,
        maxHp: hp,

        damage,

        speed:
            data.speed +
            Math.min(
                wave * .00008,
                .006
            ),

        slow: 0,

        size: data.size,

        targetRoadIndex: null,

        pathChoice: Math.random(),

        attackCooldown: 0,

        animation: Math.random() * Math.PI * 2,

        hitFlash: 0
    });
}


/* =========================
   ENEMY MOVEMENT
========================= */

function updateEnemies(dt) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];

        enemy.animation += dt * .006;
        enemy.hitFlash =
            Math.max(
                0,
                enemy.hitFlash - dt
            );

        let speed = enemy.speed;

        if (enemy.slow > 0) {

            speed *= .35;
            enemy.slow -= dt;
        }

        if (kingdom === 1) {

            enemy.x -= speed * dt;

            enemy.y = 325;

        } else {

            moveEnemyAlongRoad(
                enemy,
                speed,
                dt
            );
        }

        /*
            Castle reached.
        */

        if (
            enemy.x < 130
        ) {

            damageCastle(enemy);

            enemies.splice(i, 1);
        }
    }
}


/* =========================
   RANDOM ROAD PATH
========================= */

function moveEnemyAlongRoad(
    enemy,
    speed,
    dt
) {

    if (
        roadPoints.length === 0
    ) {

        enemy.x -= speed * dt;
        return;
    }

    /*
        Enemies move toward the road
        point that is closest to them,
        but they can choose between nearby
        points instead of following exactly
        the same movement every time.
    */

    if (
        enemy.targetRoadIndex === null
    ) {

        let closestIndex = 0;
        let closestDistance = Infinity;

        for (
            let i = 0;
            i < roadPoints.length;
            i++
        ) {

            const p = roadPoints[i];

            const d =
                Math.hypot(
                    p.x - enemy.x,
                    p.y - enemy.y
                );

            if (
                d < closestDistance
            ) {

                closestDistance = d;
                closestIndex = i;
            }
        }

        enemy.targetRoadIndex =
            closestIndex;
    }

    let index =
        enemy.targetRoadIndex;

    /*
        Occasionally choose a nearby road
        point to make movement less identical.
    */

    if (
        Math.random() <
        .002
    ) {

        const choices = [];

        if (index > 0)
            choices.push(index - 1);

        if (index > 1)
            choices.push(index - 2);

        if (index < roadPoints.length - 1)
            choices.push(index + 1);

        if (choices.length > 0) {

            enemy.targetRoadIndex =
                choices[
                    Math.floor(
                        Math.random() *
                        choices.length
                    )
                ];

            index =
                enemy.targetRoadIndex;
        }
    }

    /*
        Road is stored castle → gate,
        so enemies normally travel backward.
    */

    let target;

    if (index > 0) {

        target =
            roadPoints[index - 1];

    } else {

        target = {
            x: castles[0].x,
            y: roadPoints[0].y
        };
    }

    const dx =
        target.x - enemy.x;

    const dy =
        target.y - enemy.y;

    const distance =
        Math.hypot(dx, dy);

    if (distance > 5) {

        enemy.x +=
            dx / distance *
            speed *
            dt;

        enemy.y +=
            dy / distance *
            speed *
            dt;
    }

    if (
        distance < 12
    ) {

        enemy.targetRoadIndex =
            Math.max(
                0,
                index - 1
            );
    }
}


/* =========================
   CASTLE DAMAGE
========================= */

function damageCastle(enemy) {

    const alive =
        castles.filter(
            c => c.alive
        );

    if (
        alive.length === 0
    ) {

        endGame();
        return;
    }

    let castle = alive[0];

    let best =
        Math.abs(
            castle.y -
            enemy.y
        );

    for (
        const c of alive
    ) {

        const d =
            Math.abs(
                c.y -
                enemy.y
            );

        if (d < best) {

            best = d;
            castle = c;
        }
    }

    castle.hp -=
        enemy.damage * .35;

    effects.push({
        x: castle.x,
        y: castle.y,
        life: 150,
        type: "hit"
    });

    if (
        castle.hp <= 0
    ) {

        castle.hp = 0;
        castle.alive = false;

        effects.push({
            x: castle.x,
            y: castle.y,
            life: 1800,
            type: "fallen"
        });

        if (
            castles.every(
                c => !c.alive
            )
        ) {

            endGame();
        }
    }
}


/* =========================
   ROAD
========================= */

function drawRoad() {

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 48;

    ctx.beginPath();
    ctx.moveTo(105, 325);
    ctx.lineTo(1080, 325);
    ctx.stroke();

    ctx.strokeStyle = "#555";
    ctx.lineWidth = 38;

    ctx.beginPath();
    ctx.moveTo(105, 325);
    ctx.lineTo(1080, 325);
    ctx.stroke();

    if (
        kingdom > 1 &&
        roadPoints.length > 1
    ) {

        ctx.strokeStyle = "#333";
        ctx.lineWidth = 48;

        ctx.beginPath();

        ctx.moveTo(
            roadPoints[0].x,
            roadPoints[0].y
        );

        for (
            let i = 1;
            i < roadPoints.length;
            i++
        ) {

            ctx.lineTo(
                roadPoints[i].x,
                roadPoints[i].y
            );
        }

        ctx.stroke();

        ctx.strokeStyle = "#555";
        ctx.lineWidth = 38;

        ctx.beginPath();

        ctx.moveTo(
            roadPoints[0].x,
            roadPoints[0].y
        );

        for (
            let i = 1;
            i < roadPoints.length;
            i++
        ) {

            ctx.lineTo(
                roadPoints[i].x,
                roadPoints[i].y
            );
        }

        ctx.stroke();
    }

    ctx.lineCap = "butt";
}


/* =========================
   ROAD MODE
========================= */

function toggleRoadMode() {

    if (kingdom <= 1)
        return;

    roadMode = !roadMode;
}


function addRoadPoint() {

    const x = mouseX;
    const y = mouseY;

    if (
        x < 70 ||
        x > 1080 ||
        y < 70 ||
        y > 580
    )
        return;

    if (
        roadPoints.length > 0
    ) {

        const last =
            roadPoints[
                roadPoints.length - 1
            ];

        const distance =
            Math.hypot(
                x - last.x,
                y - last.y
            );

        if (
            distance > 190
        )
            return;
    }

    roadPoints.push({
        x,
        y
    });

    if (
        x > 1030 &&
        Math.abs(y - 325) < 75
    ) {

        roadPoints.push({
            x: 1080,
            y: 325
        });

        roadMode = false;

        waveTimer = 2000;
    }
}


function roadConnected() {

    if (kingdom === 1)
        return true;

    if (
        roadPoints.length === 0
    )
        return false;

    const last =
        roadPoints[
            roadPoints.length - 1
        ];

    return (
        last.x >= 1070 &&
        Math.abs(
            last.y - 325
        ) < 75
    );
}


/* =========================
   CANVAS CLICK
========================= */

canvas.addEventListener(
    "click",
    function() {

        if (
            !running ||
            paused
        )
            return;

        if (roadMode) {

            addRoadPoint();
            return;
        }

        for (
            const tower of towers
        ) {

            if (
                Math.hypot(
                    mouseX - tower.x,
                    mouseY - tower.y
                ) < 28
            ) {

                selectedTower =
                    tower;

                showTowerInfo();

                return;
            }
        }

        buildTower();
    }
);


/* =========================
   TOWER SELECTION
========================= */

function selectTower(type) {

    if (
        !unlockedTowers.includes(type)
    )
        return;

    selectedTower = null;
    selectedTowerType = type;

    showBuildInfo(type);
}


/* =========================
   BUILD TOWER
========================= */

function buildTower() {

    const data =
        towerTypes[
            selectedTowerType
        ];

    if (
        money < data.cost
    )
        return;

    if (
        !validTowerPlacement(
            mouseX,
            mouseY
        )
    )
        return;

    money -= data.cost;

    towers.push({

        x: mouseX,
        y: mouseY,

        type: selectedTowerType,

        damage: data.damage,

        range: data.range,

        fireRate: data.fireRate,

        cooldown: 0,

        angle: 0,

        flash: 0,

        level: 1
    });
}


function validTowerPlacement(
    x,
    y
) {

    if (
        kingdom === 1 &&
        Math.abs(y - 325) < 35
    )
        return false;

    if (
        kingdom > 1
    ) {

        if (
            Math.abs(y - 325) < 35 &&
            x > 80
        )
            return false;

        for (
            let i = 0;
            i < roadPoints.length - 1;
            i++
        ) {

            const a =
                roadPoints[i];

            const b =
                roadPoints[i + 1];

            if (
                pointNearLine(
                    x,
                    y,
                    a.x,
                    a.y,
                    b.x,
                    b.y,
                    35
                )
            )
                return false;
        }
    }

    for (
        const castle of castles
    ) {

        if (
            Math.hypot(
                x - castle.x,
                y - castle.y
            ) < 70
        )
            return false;
    }

    for (
        const tower of towers
    ) {

        if (
            Math.hypot(
                x - tower.x,
                y - tower.y
            ) < 45
        )
            return false;
    }

    return (
        x > 30 &&
        x < 1120 &&
        y > 30 &&
        y < 620
    );
}


function pointNearLine(
    px,
    py,
    x1,
    y1,
    x2,
    y2,
    distance
) {

    const dx = x2 - x1;
    const dy = y2 - y1;

    const length =
        Math.hypot(dx, dy);

    if (length === 0)
        return false;

    let t =
        (
            (px - x1) * dx +
            (py - y1) * dy
        ) /
        (length * length);

    t =
        Math.max(
            0,
            Math.min(1, t)
        );

    const cx =
        x1 + t * dx;

    const cy =
        y1 + t * dy;

    return (
        Math.hypot(
            px - cx,
            py - cy
        ) < distance
    );
}


/* =========================
   TOWERS UPDATE
========================= */

function updateTowers(dt) {

    for (
        const tower of towers
    ) {

        tower.cooldown -= dt;

        tower.flash =
            Math.max(
                0,
                tower.flash - dt
            );

        if (
            tower.cooldown > 0
        )
            continue;

        let target = null;
        let closest = Infinity;

        for (
            const enemy of enemies
        ) {

            const d =
                Math.hypot(
                    enemy.x - tower.x,
                    enemy.y - tower.y
                );

            if (
                d <= tower.range &&
                d < closest
            ) {

                closest = d;
                target = enemy;
            }
        }

        if (!target)
            continue;

        tower.angle =
            Math.atan2(
                target.y - tower.y,
                target.x - tower.x
            );

        tower.flash = 120;

        bullets.push({

            x: tower.x,
            y: tower.y,

            target,

            damage: tower.damage,

            speed:
                tower.type === "laser"
                ? 18
                : tower.type === "sniper"
                ? 15
                : 8,

            type: tower.type
        });

        tower.cooldown =
            tower.fireRate;
    }
}


/* =========================
   BULLETS
========================= */

function updateBullets(dt) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        if (
            !enemies.includes(
                bullet.target
            )
        ) {

            bullets.splice(i, 1);
            continue;
        }

        const dx =
            bullet.target.x -
            bullet.x;

        const dy =
            bullet.target.y -
            bullet.y;

        const d =
            Math.hypot(dx, dy);

        if (
            d <
            bullet.speed * dt + 6
        ) {

            if (
                bullet.type === "splash" ||
                bullet.type === "mortar"
            ) {

                const radius =
                    bullet.type === "mortar"
                    ? 95
                    : 65;

                for (
                    const enemy of enemies
                ) {

                    if (
                        Math.hypot(
                            enemy.x -
                            bullet.target.x,
                            enemy.y -
                            bullet.target.y
                        ) < radius
                    ) {

                        enemy.hp -=
                            bullet.damage;

                        enemy.hitFlash = 100;
                    }
                }

            } else {

                bullet.target.hp -=
                    bullet.damage;

                bullet.target.hitFlash =
                    100;
            }

            if (
                bullet.type === "slow"
            ) {

                bullet.target.slow = 1000;
            }

            if (
                bullet.type === "freeze"
            ) {

                bullet.target.slow = 2200;
            }

            effects.push({

                x: bullet.target.x,
                y: bullet.target.y,

                life: 150,

                type: "hit"
            });

            bullets.splice(i, 1);

        } else {

            bullet.x +=
                dx / d *
                bullet.speed *
                dt;

            bullet.y +=
                dy / d *
                bullet.speed *
                dt;
        }
    }

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        if (
            enemies[i].hp <= 0
        ) {

            /*
                Bosses give more money.
            */

            if (
                enemies[i].type === "Boss"
            )
                money += 75;
            else
                money += 15;

            enemies.splice(i, 1);
        }
    }
}


/* =========================
   TROOPS
========================= */

function updateTroops(dt) {

    for (
        const troop of troops
    ) {

        troop.animation += dt * .008;

        troop.cooldown -= dt;

        /*
            Find enemy nearby.

            Troops STOP MOVING while fighting.
        */

        let target = null;
        let closest = Infinity;

        for (
            const enemy of enemies
        ) {

            const d =
                Math.hypot(
                    enemy.x - troop.x,
                    enemy.y - troop.y
                );

            if (
                d < 65 &&
                d < closest
            ) {

                closest = d;
                target = enemy;
            }
        }

        if (target) {

            troop.fighting = true;

            /*
                Actual troop damage.
            */

            if (
                troop.cooldown <= 0
            ) {

                target.hp -=
                    troop.damage;

                target.hitFlash = 100;

                troop.cooldown =
                    troop.attackRate;

                effects.push({

                    x: target.x,
                    y: target.y,

                    life: 100,

                    type: "hit"
                });
            }

        } else {

            troop.fighting = false;

            /*
                Follow the road.

                Troops leave their castle and
                travel toward the enemy side.
            */

            moveTroopAlongRoad(
                troop,
                dt
            );
        }
    }

    for (
        let i = troops.length - 1;
        i >= 0;
        i--
    ) {

        if (
            troops[i].hp <= 0
        ) {

            troops.splice(i, 1);
        }
    }
}


/* =========================
   TROOP ROAD MOVEMENT
========================= */

function moveTroopAlongRoad(
    troop,
    dt
) {

    if (
        kingdom === 1
    ) {

        troop.x +=
            troop.speed * dt;

        troop.y = 325;

        return;
    }

    if (
        roadPoints.length === 0
    )
        return;

    /*
        Troops travel from the castle
        toward the enemy gate.

        This is the opposite direction
        from enemies.
    */

    if (
        troop.roadIndex === undefined
    ) {

        troop.roadIndex = 0;
    }

    const index =
        Math.min(
            troop.roadIndex,
            roadPoints.length - 1
        );

    const target =
        roadPoints[index];

    const dx =
        target.x - troop.x;

    const dy =
        target.y - troop.y;

    const distance =
        Math.hypot(dx, dy);

    if (
        distance > 8
    ) {

        troop.x +=
            dx / distance *
            troop.speed *
            dt;

        troop.y +=
            dy / distance *
            troop.speed *
            dt;

    } else {

        if (
            troop.roadIndex <
            roadPoints.length - 1
        ) {

            troop.roadIndex++;
        }
    }

    /*
        Once they reach the gate,
        keep them near the front rather
        than disappearing.
    */

    if (
        troop.roadIndex >=
        roadPoints.length - 1
    ) {

        troop.x +=
            troop.speed * dt;
    }
}


/* =========================
   CASTLE BUTTONS
========================= */

function updateCastleButtons() {

    const bar =
        document.getElementById(
            "castlebar"
        );

    bar.innerHTML = "";

    for (

    ) {

            ];

            );

        button.textContent =
            "CASTLE " +
            castle.id +
            " • " +
            castle.troop +
            " $" +
            data.cost;

        button.onclick =
            () =>
                spawnTroop(castle);

        bar.appendChild(button);
    }
}


/* =========================
   SPAWN TROOP
========================= */

function spawnTroop(castle) {

    const data =
        troopTypes[
            castle.troop
        ];

    if (
        money < data.cost
    )
        return;

    money -= data.cost;

    troops.push({

        x:
            castle.x + 45,

        y:
            castle.y,

        hp:
            data.hp,

        maxHp:
            data.hp,

        damage:
            data.damage,

        speed:
            data.speed,

        color:
            data.color,

        type:
            castle.troop,

        cooldown: 0,

        attackRate:
            data.attackRate,

        fighting: false,

        animation:
            Math.random() *
            Math.PI * 2,

        roadIndex:
            kingdom === 1
            ? 0
            : 0
    });
}


/* =========================
   CONQUEST
========================= */

function conquerKingdom() {

    const id =
        castles.length + 1;

    const lanes = [
        180,
        470,
        240,
        410,
        130,
        520
    ];

    const lane =
        lanes[
            (id - 2) %
            lanes.length
        ];

    const troop =
        troopOrder[
            (id - 1) %
            troopOrder.length
        ];

    castles.push({

        id,

        x: 105,

        y: lane,

        hp: 1000,

        maxHp: 1000,

        alive: true,

        troop
    });

    kingdom++;

    money +=
        250 +
        kingdom * 75;

    /*
        Unlock towers gradually.
    */

    const unlockIndex =
        kingdom - 2;

    if (
        unlockIndex + 2 <
        towerOrder.length
    ) {

        const type =
            towerOrder[
                unlockIndex + 2
            ];

        if (
            !unlockedTowers.includes(type)
        ) {

            unlockedTowers.push(type);

            effects.push({

                x: W / 2,

                y: 110,

                life: 3500,

                type: "unlock",

                text:
                    "UNLOCKED " +
                    towerTypes[
                        type
                    ].name
            });
        }
    }

    roadPoints = [

        {
            x: 105,
            y: lane
        }

    ];

    roadMode = true;

    waveRunning = false;

    waveTimer = 999999;

    updateButtons();
    updateCastleButtons();
}


/* =========================
   UPGRADE
========================= */

function upgradeSelected() {

    if (
        !selectedTower
    )
        return;

    /*
        Upgrades become MUCH more expensive.

        This stops high-level cannons from
        becoming ridiculous.
    */

    const cost =
        Math.floor(
            90 *
            Math.pow(
                1.48,
                selectedTower.level - 1
            )
        );

    if (
        money < cost
    )
        return;

    money -= cost;

    selectedTower.level++;

    /*
        Much smaller damage buff.

        Old:
        x1.35

        New:
        x1.12
    */

    selectedTower.damage =
        Math.max(
            1,
            Math.round(
                selectedTower.damage *
                1.12
            )
        );

    /*
        Range also grows slower.
    */

    selectedTower.range += 5;

    /*
        Fire rate improvement is also
        reduced.
    */

    selectedTower.fireRate =
        Math.max(
            150,
            Math.round(
                selectedTower.fireRate *
                .96
            )
        );

    showTowerInfo();
}


/* =========================
   SELL
========================= */

function sellSelected() {

    if (
        !selectedTower
    )
        return;

    const index =
        towers.indexOf(
            selectedTower
        );

    if (index < 0)
        return;

    /*
        Sell value is based on actual
        money spent on the tower.
    */

    let invested =
        towerTypes[
            selectedTower.type
        ].cost;

    for (
        let level = 1;
        level < selectedTower.level;
        level++
    ) {

        invested +=
            Math.floor(
                90 *
                Math.pow(
                    1.48,
                    level - 1
                )
            );
    }

    money +=
        Math.floor(
            invested * .55
        );

    towers.splice(
        index,
        1
    );

    selectedTower = null;

    showBuildInfo(
        selectedTowerType
    );
}

   INFO
========================= */

function showBuildInfo(type) {

    const data =
        towerTypes[type];

    document.getElementById(
        "infoTitle"
    ).textContent =
        data.name +
        " • $" +
        data.cost;

    document.getElementById(
        "infoText"
    ).innerHTML =
        "Damage: " +
        data.damage +
        " | Range: " +
        data.range +
        " | Fire rate: " +
        data.fireRate +
        "ms" +
        "<br>Click empty land to place.";
}


function showTowerInfo() {

    if (
        !selectedTower
    )
        return;

    const t =
        selectedTower;

    const nextDamage =
        Math.max(
            1,
            Math.round(
                t.damage *
                1.12
            )
        );

    const nextRange =
        t.range + 5;

    const nextRate =
        Math.max(
            150,
            Math.round(
                t.fireRate *
                .96
            )
        );

    const cost =
        Math.floor(
            90 *
            Math.pow(
                1.48,
                t.level - 1
            )
        );

    document.getElementById(
        "infoTitle"
    ).textContent =
        towerTypes[
            t.type
        ].name +
        " • LEVEL " +
        t.level;

    document.getElementById(
        "infoText"
    ).innerHTML =

        "CURRENT → Damage: " +
        Math.round(t.damage) +
        " | Range: " +
        Math.round(t.range) +
        " | Fire: " +
        Math.round(t.fireRate) +
        "ms" +

        "<br>" +

        "NEXT → Damage: " +
        nextDamage +
        " | Range: " +
        nextRange +
        " | Fire: " +
        nextRate +
        "ms" +

        "<br>" +

        "Upgrade cost: $" +
        cost;
}


/* =========================
   BUTTONS
========================= */

function updateButtons() {

    towerOrder.forEach(
        type => {

            const button =
                document.getElementById(
                    type +
                    "Button"
                );

            if (!button)
                return;

            if (
                unlockedTowers.includes(type)
            ) {

                button.classList.remove(
                    "locked"
                );

                button.textContent =
                    getKey(type) +
                    " " +
                    towerTypes[
                        type
                    ].name +
                    " $" +
                    towerTypes[
                        type
                    ].cost;

            } else {

                button.classList.add(
                    "locked"
                );

                button.textContent =
                    getKey(type) +
                    " LOCKED";
            }
        }
    );
}


function getKey(type) {

    const keys = {

        basic: "[1]",
        rapid: "[2]",
        heavy: "[3]",
        slow: "[4]",
        splash: "[5]",
        laser: "[6]",
        freeze: "[7]",
        sniper: "[8]",
        mortar: "[9]"
    };

    return keys[type];
}


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
    "mousemove",
    function(e) {

        const rect =
            canvas.getBoundingClientRect();

        mouseX =
            (e.clientX -
            rect.left) *
            W /
            rect.width;

        mouseY =
            (e.clientY -
            rect.top) *
            H /
            rect.height;
    }
);


/* =========================
   DRAW
========================= */

function draw() {

    ctx.fillStyle = "#090909";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawLand();
    drawRoad();
    drawGate();
    drawPlacement();
    drawCastles();
    drawTowers();
    drawTroops();
    drawEnemies();
    drawBullets();
    drawEffects();
    drawWaveText();
}


/* =========================
   LAND
========================= */

function drawLand() {

    ctx.fillStyle = "#111";

    ctx.fillRect(
        20,
        275,
        260,
        100
    );

    if (
        kingdom > 1
    ) {

        ctx.fillStyle = "#141414";

        ctx.fillRect(
            20,

            650,
            510
        );
    }
}


/* =========================
   ENEMY GATE
========================= */

function drawGate() {

    ctx.fillStyle = "#222";

    ctx.fillRect(
        1070,
        290,
        45,

    );

    ctx.font =

    );

    );

/* =========================
   PLACEMENT
========================= */

function drawPlacement() {

    if (
        !running ||
        paused ||
        roadMode
    )
        return;

    const data =
        towerTypes[
            selectedTowerType
        ];

    ctx.strokeStyle =
        "rgba(255,255,255,.2)";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.arc(
        mouseX,
        mouseY,
        data.range,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.strokeStyle =
        validTowerPlacement(
            mouseX,
            mouseY
        )
        ? "rgba(255,255,255,.5)"
        : "rgba(255,60,60,.6)";

    ctx.strokeRect(
        mouseX - 20,
        mouseY - 20,
        40,
        40
    );
}


/* =========================
   CASTLES
========================= */

function drawCastles() {

    for (
        const castle of castles
    ) {

        if (
            !castle.alive
        ) {

            ctx.fillStyle =
                "#252525";

            ctx.fillRect(
                castle.x - 35,
                castle.y - 35,
                70,
                70
            );

            ctx.fillStyle =
                "#777";

            ctx.font =
                "bold 10px Courier New";

            ctx.fillText(
                "FALLEN",
                castle.x - 24,
                castle.y + 4
            );

            continue;
        }

        ctx.fillStyle =
            "#777";

        ctx.fillRect(
            castle.x - 30,
            castle.y - 30,
            60,
            60
        );

        ctx.fillStyle =
            "#aaa";

        ctx.fillRect(
            castle.x - 40,
            castle.y - 43,
            14,
            28
        );

        ctx.fillRect(
            castle.x + 26,
            castle.y - 43,
            14,
            28
        );

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            castle.x - 8,
            castle.y + 8,
            16,
            22
        );

        ctx.strokeStyle =
            "#ddd";

        ctx.beginPath();

        ctx.moveTo(
            castle.x,
            castle.y - 55
        );

        ctx.lineTo(
            castle.x,
            castle.y - 28
        );

        ctx.stroke();

        ctx.fillStyle =
            "#ddd";

        ctx.beginPath();

        ctx.moveTo(
            castle.x,
            castle.y - 55
        );

        ctx.lineTo(
            castle.x + 23,
            castle.y - 48
        );

        ctx.lineTo(
            castle.x,
            castle.y - 41
        );

        ctx.fill();

        ctx.fillStyle =
            "#111";

        ctx.font =
            "bold 19px Courier New";

        ctx.fillText(
            castle.id,
            castle.x - 6,
            castle.y + 4
        );

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            castle.x - 42,
            castle.y + 42,
            84,
            7
        );

        ctx.fillStyle =
            "#ddd";

        ctx.fillRect(
            castle.x - 42,
            castle.y + 42,
            84 *
            castle.hp /
            castle.maxHp,
            7
        );

        ctx.fillStyle =
            troopTypes[
                castle.troop
            ].color;

        ctx.font =
            "9px Courier New";

        ctx.fillText(
            castle.troop,
            castle.x - 37,
            castle.y + 62
        );
    }
}


/* =========================
   TOWERS
========================= */

function drawTowers() {

    const colours = {

        basic: "#d55",
        rapid: "#4af",
        heavy: "#f5a623",
        slow: "#6c6",
        splash: "#b65cff",
        laser: "#5ff",
        freeze: "#8cf",
        sniper: "#fff",
        mortar: "#aaa"
    };

    for (
        const tower of towers
    ) {

        ctx.fillStyle =
            colours[
                tower.type
            ];

        if (
            tower.type === "heavy" ||
            tower.type === "mortar"
        ) {

            ctx.fillRect(
                tower.x - 22,
                tower.y - 22,
                44,
                44
            );

        } else if (
            tower.type === "splash"
        ) {

            ctx.fillRect(
                tower.x - 19,
                tower.y - 19,
                38,
                38
            );

        } else if (
            tower.type === "sniper"
        ) {

            ctx.beginPath();

            ctx.moveTo(
                tower.x,
                tower.y - 23
            );

            ctx.lineTo(
                tower.x + 20,
                tower.y + 18
            );

            ctx.lineTo(
                tower.x - 20,
                tower.y + 18
            );

            ctx.closePath();

            ctx.fill();

        } else {

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                19,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        if (
            selectedTower === tower
        ) {

            ctx.strokeStyle =
                "rgba(255,255,255,.3)";

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                tower.range,
                0,
                Math.PI * 2
            );

            ctx.stroke();
        }

        ctx.save();

        ctx.translate(
            tower.x,
            tower.y
        );

        ctx.rotate(
            tower.angle
        );

        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            0,
            -4,
            tower.type === "sniper"
                ? 42
                : tower.type === "mortar"
                ? 20
                : 28,
            8
        );

        ctx.restore();

        ctx.fillStyle =
            "#111";

        ctx.beginPath();

        ctx.arc(
            tower.x,
            tower.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fill();

        if (
            tower.flash > 0
        ) {

            ctx.fillStyle =
                "#fff";

            ctx.beginPath();

            ctx.arc(
                tower.x +
                Math.cos(
                    tower.angle
                ) * 34,

                tower.y +
                Math.sin(
                    tower.angle
                ) * 34,

                8,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 9px Courier New";

        ctx.fillText(
            tower.level,
            tower.x - 3,
            tower.y + 3
        );
    }
}


/* =========================
   ENEMIES
========================= */

function drawEnemies() {

    const colours = {

        Spearmen: "#5c6",
        Crossbowmen: "#b65cff",
        Guards: "#e55",
        Mages: "#5ff",
        Knights: "#fa3",
        Boss: "#fff"
    };

    for (
        const enemy of enemies
    ) {

        const bob =
            Math.sin(
                enemy.animation
            ) * 2;

        ctx.save();

        ctx.translate(
            enemy.x,
            enemy.y + bob
        );

        if (
            enemy.hitFlash > 0
        )
            ctx.fillStyle = "#fff";
        else
            ctx.fillStyle =
                colours[
                    enemy.type
                ];

        if (
            enemy.type === "Boss"
        ) {

            ctx.fillRect(
                -23,
                -23,
                46,
                46
            );

            ctx.fillStyle =
                "#111";

            ctx.fillRect(
                -10,
                -7,
                7,
                7
            );

            ctx.fillRect(
                4,
                -7,
                7,
                7
            );

        } else if (
            enemy.type === "Spearmen"
        ) {

            ctx.fillRect(
                -9,
                -10,
                18,
                20
            );

        } else if (
            enemy.type === "Crossbowmen"
        ) {

            ctx.beginPath();

            ctx.moveTo(
                0,
                -15
            );

            ctx.lineTo(
                15,
                0
            );

            ctx.lineTo(
                0,
                15
            );

            ctx.lineTo(
                -15,
                0
            );

            ctx.closePath();

            ctx.fill();

        } else if (
            enemy.type === "Guards"
        ) {

            ctx.fillRect(
                -14,
                -14,
                28,
                28
            );

        } else {

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                enemy.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.restore();

        /*
            Bigger enemies get larger HP bars.
        */

        const barWidth =
            enemy.type === "Boss"
            ? 60
            : 36;

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            enemy.x -
            barWidth / 2,
            enemy.y -
            enemy.size -
            10,
            barWidth,
            5
        );

        ctx.fillStyle =
            "#ddd";

        ctx.fillRect(
            enemy.x -
            barWidth / 2,
            enemy.y -
            enemy.size -
            10,
            barWidth *
            Math.max(
                0,
                enemy.hp /
                enemy.maxHp
            ),
            5
        );

        if (
            enemy.type === "Boss"
        ) {

            ctx.fillStyle =
                "#fff";

            ctx.font =
                "bold 9px Courier New";

            ctx.textAlign =
                "center";

            ctx.fillText(
                "BOSS",
                enemy.x,
                enemy.y - 32
            );

            ctx.textAlign =
                "left";
        }
    }
}


/* =========================
   TROOPS DRAW
========================= */

function drawTroops() {

    for (
        const troop of troops
    ) {

        /*
            Walking animation.
        */

        const walk =
            troop.fighting
            ? Math.sin(
                troop.animation * 2
              ) * 1
            : Math.sin(
                troop.animation
              ) * 4;

        ctx.save();

        ctx.translate(
            troop.x,
            troop.y + walk
        );

        /*
            Body
        */

        ctx.fillStyle =
            troop.color;

        ctx.fillRect(
            -7,
            -9,
            14,
            18
        );

        /*
            Head
        */

        ctx.fillStyle =
            "#ddd";

        ctx.beginPath();

        ctx.arc(
            0,
            -14,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /*
            Animated weapon.

            When fighting, swing the weapon.
        */

        const swing =
            troop.fighting
            ? Math.sin(
                troop.animation * 4
              ) * 18
            : 0;

        ctx.strokeStyle =
            "#111";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.lineTo(
            14,
            -10 + swing
        );

        ctx.stroke();

        /*
            Legs animate while walking.
        */

        if (
            !troop.fighting
        ) {

            ctx.beginPath();

            ctx.moveTo(
                -4,
                9
            );

            ctx.lineTo(
                -7 + walk,
                18
            );

            ctx.moveTo(
                4,
                9
            );

            ctx.lineTo(
                7 - walk,
                18
            );

            ctx.stroke();
        }

        ctx.restore();

        /*
            Troop HP bar.
        */

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            troop.x - 14,
            troop.y + 22,
            28,
            4
        );

        ctx.fillStyle =
            "#ddd";

        ctx.fillRect(
            troop.x - 14,
            troop.y + 22,
            28 *
            Math.max(
                0,
                troop.hp /
                troop.maxHp
            ),
            4
        );

        /*
            Fighting marker.
        */

        if (
            troop.fighting
        ) {

            ctx.fillStyle =
                "#fff";

            ctx.font =
                "bold 10px Courier New";

            ctx.fillText(
                "!",
                troop.x + 12,
                troop.y - 18
            );
        }
    }
}


/* =========================
   BULLETS
========================= */

function drawBullets() {

    for (
        const bullet of bullets
    ) {

        ctx.fillStyle =
            bullet.type === "laser"
            ? "#fff"
            : bullet.type === "mortar"
            ? "#aaa"
            : "#ddd";

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.type === "mortar"
                ? 6
                : 4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================
   EFFECTS
========================= */

function updateEffects(dt) {

    for (
        let i = effects.length - 1;
        i >= 0;
        i--
    ) {

        effects[i].life -= dt;

        if (
            effects[i].life <= 0
        ) {

            effects.splice(i, 1);
        }
    }
}


function drawEffects() {

    for (
        const effect of effects
    ) {

        if (
            effect.type === "unlock"
        ) {

            ctx.fillStyle =
                "#fff";

            ctx.font =
                "bold 22px Courier New";

            ctx.textAlign =
                "center";

            ctx.fillText(
                effect.text,
                W / 2,
                110
            );

            ctx.textAlign =
                "left";

        } else if (
            effect.type === "reward"
        ) {

            ctx.fillStyle =
                "#fff";

            ctx.font =
                "bold 18px Courier New";

            ctx.textAlign =
                "center";

            ctx.fillText(
                effect.text,
                W / 2,
                75
            );

            ctx.textAlign =
                "left";

        } else if (
            effect.type === "fallen"
        ) {

            ctx.fillStyle =
                "#e33";

            ctx.font =
                "bold 11px Courier New";

            ctx.fillText(
                "CASTLE FALLEN",
                effect.x - 40,
                effect.y - 48
            );

        } else {

            ctx.strokeStyle =
                "rgba(255,255,255,.8)";

            ctx.strokeRect(
                effect.x - 10,
                effect.y - 10,
                20,
                20
            );
        }
    }
}


/* =========================
   WAVE TEXT
========================= */

function drawWaveText() {

    if (!running)
        return;

    ctx.textAlign =
        "center";

    if (paused) {

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 24px Courier New";

        ctx.fillText(
            "PAUSED",
            W / 2,
            40
        );

    } else if (roadMode) {

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 18px Courier New";

        ctx.fillText(
            "BUILD ROAD → CONNECT TO ENEMY GATE",
            W / 2,
            40
        );

    } else if (!waveRunning) {

        ctx.fillStyle =
            "#ddd";

        ctx.font =
            "bold 20px Courier New";

        ctx.fillText(
            "NEXT WAVE IN " +
            Math.ceil(
                Math.max(
                    0,
                    waveTimer
                ) / 1000
            ),
            W / 2,
            40
        );

    } else {

        ctx.fillStyle =
            "#ddd";

        ctx.font =
            "bold 18px Courier New";

        ctx.fillText(
            "WAVE " +
            wave +
            "   ENEMIES: " +
            (
                enemies.length +
                spawnLeft
            ),
            W / 2,
            40
        );
    }

    ctx.textAlign =
        "left";
}


/* =========================
   STATS
========================= */

function updateStats() {

    const alive =
        castles.filter(
            c => c.alive
        ).length;

    document.getElementById(
        "stats"
    ).textContent =

        "$" +
        money +

        " | WAVE " +
        wave +

        " | KINGDOM " +
        kingdom +

        " | CASTLES " +
        alive +
        "/" +
        castles.length;
}


/* =========================
   PAUSE
========================= */

function togglePause() {

    if (!running)
        return;

    paused =
        !paused;
}


/* =========================
   SAVE
========================= */

function saveGame(slot) {

    if (!running)
        return;

    const data = {

        money,
        wave,
        kingdom,

        castles,
        towers,

        unlockedTowers,

        roadPoints,

        waveRunning,
        waveTimer,

        roadMode
    };

    localStorage.setItem(
        "kingdomWarSave" +
        slot,

        JSON.stringify(data)
    );
}


function loadGame(slot) {

    const raw =
        localStorage.getItem(
            "kingdomWarSave" +
            slot
        );

    if (!raw)
        return;

    const data =
        JSON.parse(raw);

    money =
        data.money;

    wave =
        data.wave;

    kingdom =
        data.kingdom;

    castles =
        data.castles ||
        [];

    towers =
        data.towers ||
        [];

    unlockedTowers =
        data.unlockedTowers ||
        [
            "basic",
            "rapid"
        ];

    roadPoints =
        data.roadPoints ||
        [];

    waveRunning =
        data.waveRunning ||
        false;

    waveTimer =
        data.waveTimer ||
        5000;

    roadMode =
        data.roadMode ||
        false;

    enemies = [];
    troops = [];
    bullets = [];
    effects = [];

    selectedTower =
        null;

    paused =
        false;

    running =
        true;

    updateButtons();
    updateCastleButtons();

    hideOverlay();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;

    waveRunning = false;

    document.getElementById(
        "overlayTitle"
    ).textContent =
        "RETRY";

    document.getElementById(
        "overlayTitle"
    ).className =
        "retry";

    document.getElementById(
        "overlayText"
    ).innerHTML =

        "ALL YOUR CASTLES HAVE FALLEN" +
        "<br><br>" +

        "KINGDOM " +
        kingdom +

        "<br>" +

        "WAVE " +
        wave +

        "<br><br>" +

        "YOUR SAVE SLOTS ARE SAFE.";

    const main =
        document.getElementById(
            "mainButton"
        );

    main.textContent =
        "RETRY";

    main.onclick =
        startGame;

    main.className =
        "retryButton";

    document.getElementById(
        "homeButton"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "overlay"
    ).classList.remove(
        "hidden"
    );
}


/* =========================
   HOME
========================= */

function goHome() {

    window.location.href =
        "index.html";
}


/* =========================
   OVERLAY
========================= */

function hideOverlay() {

    document.getElementById(
        "overlay"
    ).classList.add(
        "hidden"
    );
}


/* =========================
   RRR
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();

        if (key === "r") {

            rCount++;

            clearTimeout(
                rTimer
            );

            rTimer =
                setTimeout(
                    () => {
                        rCount = 0;
                    },
                    700
                );

            if (
                rCount === 3
            ) {

                rCount = 0;

                goHome();
            }
        }

        const keys = {

            "1": "basic",
            "2": "rapid",
            "3": "heavy",
            "4": "slow",
            "5": "splash",
            "6": "laser",
            "7": "freeze",
            "8": "sniper",
            "9": "mortar"
        };

        if (
            keys[key]
        ) {

            selectTower(
                keys[key]
            );
        }
    }
);


/* =========================
   INITIAL
========================= */

updateButtons();
updateCastleButtons();
updateStats();
draw();

</script>
