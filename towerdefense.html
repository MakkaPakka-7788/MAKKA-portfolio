
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KINGDOM WAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:"Courier New",monospace;overflow:hidden}
#stats{height:46px;background:#111;border-bottom:2px solid #333;display:flex;align-items:center;gap:24px;padding:0 14px;font-size:15px;font-weight:bold}
#gameWrap{position:relative;width:1150px;max-width:100vw;margin:auto}
canvas{display:block;background:#111;cursor:grab}
canvas.dragging{cursor:grabbing}
#towerInfo{position:absolute;top:8px;left:8px;min-width:215px;background:rgba(0,0,0,.88);border:1px solid #555;padding:9px;font-size:12px;line-height:1.5;pointer-events:none}
#towerInfo b{font-size:14px}
.toolbar{background:#111;border-top:2px solid #333;padding:7px;display:flex;gap:5px;flex-wrap:wrap}
#towerbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%}
.towerBtn{height:43px;border:1px solid #555;background:#181818;color:#eee;font-family:inherit;font-size:10px;cursor:pointer}
.towerBtn:hover{background:#292929}
.towerBtn.locked{opacity:.3;cursor:not-allowed}
.towerBtn.selected{outline:2px solid white}
#controls{display:flex;gap:5px;margin-top:6px}
button{font-family:inherit;background:#181818;color:#eee;border:1px solid #555;padding:7px 10px;cursor:pointer}
button:hover{background:#292929}
.castlebar,.savebar{display:flex;gap:5px;padding:6px 7px 0;flex-wrap:wrap}
.info{padding:6px 8px;font-size:11px;color:#aaa}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}
#overlay h1{font-size:48px;margin:0 0 20px}
#overlay button{font-size:18px;padding:10px 25px;margin:4px}
</style>
</head>
<body>

<div id="stats">
<span id="money">GOLD: 300</span>
<span id="wave">WAVE: 1</span>
<span id="kingdom">KINGDOM: 1</span>
<span id="castleHP">KINGDOM HP: 1000/1000</span>
<span id="enemies">ENEMIES: 0</span>
</div>

<div id="gameWrap">

<canvas id="game" width="1150" height="650"></canvas>

<div id="towerInfo"><b>NO TOWER SELECTED</b></div>

<div class="toolbar">
<div id="towerbar"></div>
<div id="controls">
<button id="upgradeBtn">UPGRADE</button>
<button id="sellBtn">DELETE / SELL</button>
<button id="roadBtn">ROADS AUTOMATIC</button>
<button id="pauseBtn">PAUSE</button>
</div>
</div>

<div class="castlebar">
<button data-troop="swordsman">SWORDSMEN $80</button>
<button data-troop="archer">ARCHERS $100</button>
<button data-troop="knight">KNIGHTS $160</button>
<button data-troop="spearman">SPEARMEN $120</button>
<button data-troop="crossbow">CROSSBOW $180</button>
<button data-troop="guard">GUARDS $220</button>
<button data-troop="mage">MAGES $300</button>
</div>

<div class="savebar">
<button id="save1">SAVE 1</button>
<button id="save2">SAVE 2</button>
<button id="save3">SAVE 3</button>
<button id="load1">LOAD 1</button>
<button id="load2">LOAD 2</button>
<button id="load3">LOAD 3</button>
<button id="autoLoad">LOAD AUTOSAVE</button>
<button id="copyAuto">COPY AUTOSAVE</button>
</div>

<div class="info">CLICK A TOWER TO SELECT IT • CLICK EMPTY LAND TO BUILD • DRAG MAP TO PAN • RRR = HOME</div>

<div id="overlay">
<h1 id="overlayTitle">KINGDOM LOST</h1>
<button id="retryBtn">RETRY</button>
<button id="homeBtn">HOME</button>
</div>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const WORLD_W=1900;
const WORLD_H=950;

const towerTypes=[
{name:"Basic",cost:60,damage:22,range:125,rate:700,color:"#4da6ff",shot:"bullet",unlock:1},
{name:"Rapid",cost:90,damage:10,range:135,rate:220,color:"#ffcc33",shot:"rapid",unlock:1},
{name:"Heavy",cost:140,damage:65,range:145,rate:1100,color:"#ff7043",shot:"heavy",unlock:2},
{name:"Slow",cost:120,damage:12,range:150,rate:800,color:"#8e9eff",shot:"slow",unlock:2},
{name:"Splash",cost:170,damage:35,range:135,rate:1000,color:"#ff4d88",shot:"splash",unlock:2},
{name:"Laser",cost:230,damage:18,range:190,rate:170,color:"#ff3333",shot:"laser",unlock:3},
{name:"Freeze",cost:250,damage:9,range:155,rate:700,color:"#66eaff",shot:"freeze",unlock:3},
{name:"Poison",cost:280,damage:14,range:160,rate:600,color:"#9cff33",shot:"poison",unlock:3},
{name:"Sniper",cost:350,damage:150,range:300,rate:1900,color:"#d9d9d9",shot:"sniper",unlock:4},
{name:"Tesla",cost:420,damage:38,range:175,rate:850,color:"#b266ff",shot:"tesla",unlock:4},
{name:"Mortar",cost:480,damage:80,range:250,rate:1800,color:"#a87952",shot:"mortar",unlock:4},
{name:"Flame",cost:520,damage:17,range:105,rate:260,color:"#ff6600",shot:"flame",unlock:5},
{name:"Ice",cost:580,damage:28,range:180,rate:650,color:"#99ffff",shot:"ice",unlock:5},
{name:"Ballista",cost:650,damage:220,range:280,rate:2400,color:"#b58a5a",shot:"ballista",unlock:5},
{name:"Catapult",cost:700,damage:125,range:260,rate:2100,color:"#806040",shot:"catapult",unlock:6},
{name:"Void",cost:800,damage:100,range:220,rate:1000,color:"#7b4dff",shot:"void",unlock:6},
{name:"Meteor",cost:950,damage:250,range:290,rate:2600,color:"#ff452e",shot:"meteor",unlock:7},
{name:"Crystal",cost:1100,damage:70,range:240,rate:500,color:"#e8aaff",shot:"crystal",unlock:7},
{name:"Guardian",cost:1400,damage:120,range:200,rate:700,color:"#59d98e",shot:"guardian",unlock:8},
{name:"King",cost:2000,damage:300,range:350,rate:1800,color:"#ffd700",shot:"king",unlock:9}
];

const troopTypes={
swordsman:{name:"Swordsman",cost:80,damage:12,hp:90,speed:55},
archer:{name:"Archer",cost:100,damage:18,hp:60,speed:48},
knight:{name:"Knight",cost:160,damage:28,hp:180,speed:42},
spearman:{name:"Spearman",cost:120,damage:20,hp:110,speed:45},
crossbow:{name:"Crossbow",cost:180,damage:35,hp:80,speed:40},
guard:{name:"Guard",cost:220,damage:40,hp:230,speed:35},
mage:{name:"Mage",cost:300,damage:55,hp:75,speed:38}
};

function newGame(){
return{
money:300,
wave:1,
kingdom:1,
towers:[],
enemies:[],
troops:[],
castles:[{x:250,y:475,hp:1000,maxHp:1000,id:1}],
roads:[],
effects:[],
selected:null,
paused:false,
defeated:false
};
}

let game=newGame();

let camera={x:0,y:0};
let dragging=false;
let dragStartX=0;
let dragStartY=0;
let camStartX=0;
let camStartY=0;

let lastTime=performance.now();
let waveTimer=0;
let spawnTimer=0;
let enemiesToSpawn=0;
let waveRunning=false;
let waveMessage=0;
let selectedBuild=0;
let keyBuffer="";

function clamp(v,a,b){
return Math.max(a,Math.min(b,v));
}

function unlocked(type){
return type.unlock<=game.kingdom;
}

function refreshTowerButtons(){
const bar=document.getElementById("towerbar");
bar.innerHTML="";

towerTypes.forEach((t,i)=>{
const b=document.createElement("button");
b.className="towerBtn";
b.textContent=t.name;

if(!unlocked(t)){
b.classList.add("locked");
b.textContent=t.name+" 🔒";
}else{
b.onclick=()=>{
selectedBuild=i;
game.selected=null;
document.querySelectorAll(".towerBtn").forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
};
}

bar.appendChild(b);
});
}

function worldPos(e){
const r=canvas.getBoundingClientRect();
return{
x:(e.clientX-r.left)+camera.x,
y:(e.clientY-r.top)+camera.y
};
}

canvas.addEventListener("mousedown",e=>{
dragging=true;
canvas.classList.add("dragging");
dragStartX=e.clientX;
dragStartY=e.clientY;
camStartX=camera.x;
camStartY=camera.y;
});

window.addEventListener("mouseup",()=>{
dragging=false;
canvas.classList.remove("dragging");
});

canvas.addEventListener("mousemove",e=>{
if(!dragging)return;

camera.x=clamp(
camStartX-(e.clientX-dragStartX),
0,
WORLD_W-canvas.width
);

camera.y=clamp(
camStartY-(e.clientY-dragStartY),
0,
WORLD_H-canvas.height
);
});

canvas.addEventListener("click",e=>{
if(Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>8)return;
if(game.defeated)return;

const p=worldPos(e);

for(const t of game.towers){
if(Math.hypot(t.x-p.x,t.y-p.y)<25){
game.selected=t;
selectedBuild=null;
document.querySelectorAll(".towerBtn").forEach(x=>x.classList.remove("selected"));
return;
}
}

if(selectedBuild!==null&&selectedBuild!==undefined){
const type=towerTypes[selectedBuild];

if(
unlocked(type)&&
game.money>=type.cost&&
!onRoad(p.x,p.y)&&
p.x>40&&
p.x<WORLD_W-40&&
p.y>40&&
p.y<WORLD_H-40
){
game.money-=type.cost;

const tower={
id:Date.now()+Math.random(),
type:selectedBuild,
x:p.x,
y:p.y,
level:1,
lastShot:0,
angle:0,
kills:0,
shots:0
};

game.towers.push(tower);
game.selected=tower;
}
}
});

function pointSegmentDistance(px,py,x1,y1,x2,y2){
const dx=x2-x1;
const dy=y2-y1;

if(dx===0&&dy===0)return Math.hypot(px-x1,py-y1);

const t=clamp(
((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy),
0,
1
);

return Math.hypot(
px-(x1+t*dx),
py-(y1+t*dy)
);
}

function onRoad(x,y){
for(const road of game.roads){
for(let i=0;i<road.points.length-1;i++){
if(pointSegmentDistance(
x,y,
road.points[i].x,
road.points[i].y,
road.points[i+1].x,
road.points[i+1].y
)<34)return true;
}
}
return false;
}

function generateRoad(castle){
const base={x:1740,y:475};
const start={x:base.x,y:base.y};
const end={x:castle.x,y:castle.y};

const style=Math.floor(Math.random()*5);
const pts=[start];

if(style===0){
pts.push(
{x:1500,y:start.y},
{x:800,y:end.y},
{x:end.x+150,y:end.y},
end
);
}

if(style===1){
const steps=8;

for(let i=1;i<steps;i++){
const p=i/steps;

pts.push({
x:start.x+(end.x-start.x)*p,
y:start.y+(end.y-start.y)*p+(i%2?85:-85)
});
}

pts.push(end);
}

if(style===2){
pts.push(
{x:1500,y:350},
{x:1300,y:650},
{x:900,y:300},
{x:end.x+180,y:end.y+70},
end
);
}

if(style===3){
pts.push(
{x:1500,y:start.y},
{x:1500,y:180},
{x:end.x+180,y:180},
{x:end.x+180,y:end.y},
end
);
}

if(style===4){
pts.push(
{x:1550,y:600},
{x:1250,y:600},
{x:1250,y:250},
{x:800,y:250},
{x:800,y:end.y},
end
);
}

game.roads.push({
castleId:castle.id,
points:pts
});
}

function generateAllRoads(){
game.roads=[];
game.castles.forEach(generateRoad);
}

function roadPointAt(road,progress){
const lengths=[];
let total=0;

for(let i=0;i<road.points.length-1;i++){
const a=road.points[i];
const b=road.points[i+1];
const l=Math.hypot(b.x-a.x,b.y-a.y);
lengths.push(l);
total+=l;
}

let target=total*progress;
let passed=0;

for(let i=0;i<lengths.length;i++){
if(target<=passed+lengths[i]){
const a=road.points[i];
const b=road.points[i+1];
const q=(target-passed)/lengths[i];

return{
x:a.x+(b.x-a.x)*q,
y:a.y+(b.y-a.y)*q,
angle:Math.atan2(b.y-a.y,b.x-a.x)
};
}

passed+=lengths[i];
}

const p=road.points[road.points.length-1];

return{x:p.x,y:p.y,angle:0};
}

function spawnEnemy(){
if(!game.roads.length)return;

const road=game.roads[Math.floor(Math.random()*game.roads.length)];
const scale=1+game.wave*.075;

game.enemies.push({
road:road,
progress:0,
hp:90*scale,
maxHp:90*scale,
speed:28+game.wave*.7,
damage:10+game.wave*.5,
size:13,
dead:false,
slow:1,
poison:0,
freeze:0,
hitFlash:0
});
}

function startWave(){
if(waveRunning||game.defeated)return;

waveRunning=true;
enemiesToSpawn=5+game.wave*2;
spawnTimer=0;
waveMessage=1200;
}

function updateWave(dt){
if(!waveRunning){
waveTimer+=dt;

if(waveTimer>3500)startWave();

return;
}

spawnTimer+=dt;

const interval=Math.max(
220,
850-game.wave*15
);

if(enemiesToSpawn>0&&spawnTimer>=interval){
spawnTimer=0;
spawnEnemy();
enemiesToSpawn--;
}

if(enemiesToSpawn<=0&&game.enemies.length===0){
waveRunning=false;
waveTimer=0;

game.money+=50+game.wave*12;

if(game.wave%10===0){
conquerKingdom();
}else{
game.wave++;
}
}
}

function conquerKingdom(){
game.kingdom++;
game.wave++;
game.money+=500+game.kingdom*100;

const positions=[
{x:250,y:475},
{x:620,y:210},
{x:500,y:760},
{x:1050,y:220},
{x:1050,y:730},
{x:1350,y:450},
{x:400,y:180},
{x:850,y:480},
{x:1400,y:750}
];

const pos=positions[(game.castles.length-1)%positions.length];

game.castles.push({
x:pos.x,
y:pos.y,
hp:1000,
maxHp:1000,
id:game.castles.length+1
});

generateAllRoads();
refreshTowerButtons();
waveMessage=2500;
}

function nearestEnemy(t){
const type=towerTypes[t.type];

let best=null;
let bestD=Infinity;

for(const e of game.enemies){
if(e.dead)continue;

const p=roadPointAt(e.road,e.progress);
const d=Math.hypot(t.x-p.x,t.y-p.y);

if(d<=type.range&&d<bestD){
bestD=d;
best={enemy:e,pos:p};
}
}

return best;
}

function damageEnemy(e,dmg,tower){
if(!e||e.dead)return;

e.hp-=dmg;
e.hitFlash=100;

if(e.hp<=0){
e.dead=true;
game.money+=Math.max(2,Math.floor(8+game.wave*.8));

if(tower)tower.kills++;
}
}

function addEffect(type,x,y,x2,y2,color){
game.effects.push({
type:type,
x:x,
y:y,
x2:x2,
y2:y2,
color:color,
life:320,
max:320
});
}

function fireTower(t,target){
const type=towerTypes[t.type];
const p=target.pos;

t.shots++;
t.lastShot=performance.now();

const desired=Math.atan2(
p.y-t.y,
p.x-t.x
);

t.angle=desired;

const damage=type.damage*(1+(t.level-1)*.35);

if(type.shot==="bullet"){
damageEnemy(target.enemy,damage,t);
addEffect("bullet",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="rapid"){
damageEnemy(target.enemy,damage,t);
addEffect("rapid",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="heavy"){
damageEnemy(target.enemy,damage,t);
addEffect("heavy",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="slow"){
damageEnemy(target.enemy,damage,t);
target.enemy.slow=.55;
addEffect("slow",p.x,p.y,p.x,p.y,type.color);
}

else if(type.shot==="splash"){
for(const e of game.enemies){
if(e.dead)continue;

const ep=roadPointAt(e.road,e.progress);

if(Math.hypot(ep.x-p.x,ep.y-p.y)<65){
damageEnemy(e,damage*.65,t);
}
}

addEffect("splash",p.x,p.y,p.x,p.y,type.color);
}

else if(type.shot==="laser"){
damageEnemy(target.enemy,damage,t);
addEffect("laser",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="freeze"){
damageEnemy(target.enemy,damage,t);
target.enemy.freeze=700;
target.enemy.slow=.25;
addEffect("freeze",p.x,p.y,p.x,p.y,type.color);
}

else if(type.shot==="poison"){
damageEnemy(target.enemy,damage,t);
target.enemy.poison=2200;
addEffect("poison",p.x,p.y,p.x,p.y,type.color);
}

else if(type.shot==="sniper"){
damageEnemy(target.enemy,damage,t);
addEffect("sniper",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="tesla"){
damageEnemy(target.enemy,damage,t);

let chain=0;

for(const e of game.enemies){
if(e===target.enemy||e.dead)continue;

const ep=roadPointAt(e.road,e.progress);

if(Math.hypot(ep.x-p.x,ep.y-p.y)<85&&chain<2){
damageEnemy(e,damage*.45,t);
addEffect("tesla",p.x,p.y,ep.x,ep.y,type.color);
chain++;
}
}

addEffect("tesla",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="mortar"){
damageEnemy(target.enemy,damage,t);

for(const e of game.enemies){
if(e===target.enemy||e.dead)continue;

const ep=roadPointAt(e.road,e.progress);

if(Math.hypot(ep.x-p.x,ep.y-p.y)<75){
damageEnemy(e,damage*.45,t);
}
}

addEffect("mortar",p.x,p.y,p.x,p.y,type.color);
}

else if(type.shot==="flame"){
for(const e of game.enemies){
if(e.dead)continue;

const ep=roadPointAt(e.road,e.progress);

if(Math.hypot(ep.x-t.x,ep.y-t.y)<type.range){
damageEnemy(e,damage,t);
}
}

addEffect("flame",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="ice"){
damageEnemy(target.enemy,damage,t);
target.enemy.slow=.35;
target.enemy.freeze=450;
addEffect("ice",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="ballista"){
damageEnemy(target.enemy,damage,t);
addEffect("ballista",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="catapult"){
damageEnemy(target.enemy,damage,t);
addEffect("catapult",p.x,p.y,p.x,p.y,type.color);
}

else if(type.shot==="void"){
damageEnemy(target.enemy,damage,t);
addEffect("void",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="meteor"){
damageEnemy(target.enemy,damage,t);
addEffect("meteor",p.x,p.y,p.x,p.y,type.color);
}

else if(type.shot==="crystal"){
damageEnemy(target.enemy,damage,t);
addEffect("crystal",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="guardian"){
damageEnemy(target.enemy,damage,t);
addEffect("guardian",t.x,t.y,p.x,p.y,type.color);
}

else if(type.shot==="king"){
damageEnemy(target.enemy,damage,t);
addEffect("king",t.x,t.y,p.x,p.y,type.color);
}
}

function updateTowers(dt){
const now=performance.now();

for(const t of game.towers){
const type=towerTypes[t.type];
const target=nearestEnemy(t);

if(target){
const desired=Math.atan2(
target.pos.y-t.y,
target.pos.x-t.x
);

let diff=desired-t.angle;

while(diff>Math.PI)diff-=Math.PI*2;
while(diff<-Math.PI)diff+=Math.PI*2;

const rotationSpeed=.014*dt;

if(Math.abs(diff)<=rotationSpeed){
t.angle=desired;
}else{
t.angle+=Math.sign(diff)*rotationSpeed;
}

if(now-t.lastShot>=type.rate){
fireTower(t,target);
}
}
}
}

function updateEnemies(dt){
for(const e of game.enemies){
if(e.dead)continue;

if(e.poison>0){
e.poison-=dt;
e.hp-=dt*.018*(1+game.wave*.05);

if(e.hp<=0){
e.dead=true;
game.money+=5;
continue;
}
}

if(e.freeze>0)e.freeze-=dt;

let speed=e.speed;

if(e.slow<1)speed*=e.slow;
if(e.freeze>0)speed*=.2;

e.progress+=speed*dt/100000;

if(e.progress>=1){
e.dead=true;

const castle=game.castles.find(c=>c.id===e.road.castleId);

if(castle){
castle.hp-=e.damage;

if(castle.hp<=0){
castle.hp=0;

if(game.castles.every(c=>c.hp<=0)){
loseGame();
}
}
}
}
}

game.enemies=game.enemies.filter(e=>!e.dead);
}

function updateTroops(dt){
for(const tr of game.troops){
if(tr.dead)continue;

tr.attackTimer-=dt;

let target=null;
let targetD=Infinity;

for(const e of game.enemies){
if(e.dead)continue;

const p=roadPointAt(e.road,e.progress);
const d=Math.hypot(tr.x-p.x,tr.y-p.y);

if(d<targetD){
targetD=d;
target={e:e,p:p};
}
}

if(target&&targetD<280){
if(tr.attackTimer<=0){
damageEnemy(
target.e,
troopTypes[tr.type].damage,
null
);

tr.attackTimer=800;
}
}else{
const castle=tr.castle;
const dx=castle.x-tr.x;
const dy=castle.y-tr.y;
const d=Math.hypot(dx,dy)||1;

if(d>55){
tr.x+=dx/d*troopTypes[tr.type].speed*dt/1000;
tr.y+=dy/d*troopTypes[tr.type].speed*dt/1000;
}
}
}

game.troops=game.troops.filter(x=>!x.dead);
}

function updateEffects(dt){
for(const e of game.effects)e.life-=dt;
game.effects=game.effects.filter(e=>e.life>0);
}

function drawWorld(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.save();
ctx.translate(-camera.x,-camera.y);

ctx.fillStyle="#111";
ctx.fillRect(0,0,WORLD_W,WORLD_H);

drawGrid();
drawRoads();
drawEnemyBase();
drawCastles();
drawTowers();
drawTroops();
drawEnemies();
drawEffects();

ctx.restore();

if(waveMessage>0){
ctx.fillStyle="rgba(0,0,0,.72)";
ctx.fillRect(canvas.width/2-190,25,380,55);

ctx.strokeStyle="#555";
ctx.strokeRect(canvas.width/2-190,25,380,55);

ctx.fillStyle="#fff";
ctx.font="bold 20px Courier New";
ctx.textAlign="center";

ctx.fillText(
game.kingdom>1&&game.wave%10===1?
"KINGDOM CONQUERED!":
"WAVE "+game.wave,
canvas.width/2,
59
);

ctx.textAlign="left";
}
}

function drawGrid(){
ctx.strokeStyle="#181818";
ctx.lineWidth=1;

for(let x=0;x<WORLD_W;x+=50){
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,WORLD_H);
ctx.stroke();
}

for(let y=0;y<WORLD_H;y+=50){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(WORLD_W,y);
ctx.stroke();
}
}

function drawRoads(){
for(const road of game.roads){
ctx.beginPath();
ctx.moveTo(
road.points[0].x,
road.points[0].y
);

for(let i=1;i<road.points.length;i++){
ctx.lineTo(
road.points[i].x,
road.points[i].y
);
}

ctx.lineWidth=42;
ctx.strokeStyle="#282828";
ctx.stroke();

ctx.lineWidth=3;
ctx.strokeStyle="#555";
ctx.setLineDash([15,15]);
ctx.stroke();
ctx.setLineDash([]);
}
}

function drawEnemyBase(){
ctx.save();
ctx.translate(1740,475);

ctx.fillStyle="#711d1d";
ctx.fillRect(-45,-45,90,90);

ctx.strokeStyle="#d44";
ctx.lineWidth=4;
ctx.strokeRect(-45,-45,90,90);

ctx.fillStyle="#f44";
ctx.fillRect(-25,-70,50,25);

ctx.fillStyle="#fff";
ctx.font="bold 13px Courier New";
ctx.textAlign="center";
ctx.fillText("ENEMY",0,5);
ctx.fillText("BASE",0,20);

ctx.restore();
}

function drawCastles(){
for(const c of game.castles){
ctx.save();
ctx.translate(c.x,c.y);

ctx.fillStyle="#555";
ctx.fillRect(-48,-42,96,84);

ctx.fillStyle="#777";
ctx.fillRect(-58,-60,25,30);
ctx.fillRect(-12,-70,25,40);
ctx.fillRect(33,-60,25,30);

ctx.strokeStyle="#aaa";
ctx.lineWidth=3;
ctx.strokeRect(-48,-42,96,84);

ctx.fillStyle="#222";
ctx.fillRect(-14,5,28,37);

ctx.fillStyle="#ddd";
ctx.font="bold 13px Courier New";
ctx.textAlign="center";
ctx.fillText("CASTLE "+c.id,0,-48);

ctx.fillStyle="#222";
ctx.fillRect(-55,55,110,9);

ctx.fillStyle="#4caf50";
ctx.fillRect(
-55,
55,
110*Math.max(0,c.hp/c.maxHp),
9
);

ctx.restore();
}
function drawTowers(){
for(const t of game.towers){
const type=towerTypes[t.type];

ctx.save();
ctx.translate(t.x,t.y);

if(game.selected===t){
ctx.beginPath();
ctx.arc(0,0,type.range,0,Math.PI*2);
ctx.strokeStyle="rgba(255,255,255,.2)";
ctx.lineWidth=1;
ctx.stroke();
}

ctx.fillStyle="#050505";
ctx.beginPath();
ctx.arc(0,0,24,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle=type.color;
ctx.lineWidth=3;
ctx.stroke();

ctx.fillStyle=type.color;

if(t.type===0){
ctx.beginPath();
ctx.arc(0,0,17,0,Math.PI*2);
ctx.fill();
}

if(t.type===1)ctx.fillRect(-17,-17,34,34);

if(t.type===2){
ctx.beginPath();
ctx.moveTo(0,-20);
ctx.lineTo(19,17);
ctx.lineTo(-19,17);
ctx.closePath();
ctx.fill();
}

if(t.type===3)ctx.fillRect(-18,-18,36,36);

if(t.type===4){
ctx.beginPath();
ctx.arc(0,0,20,0,Math.PI*2);
ctx.fill();
}

if(t.type===5){
ctx.beginPath();
ctx.moveTo(0,-21);
ctx.lineTo(21,0);
ctx.lineTo(0,21);
ctx.lineTo(-21,0);
ctx.closePath();
ctx.fill();
}

if(t.type===6){
ctx.beginPath();
ctx.arc(0,0,20,0,Math.PI*2);
ctx.fill();
}

if(t.type===7)ctx.fillRect(-18,-18,36,36);

if(t.type===8){
ctx.beginPath();
ctx.arc(0,0,19,0,Math.PI*2);
ctx.fill();
}

if(t.type===9){
ctx.beginPath();
ctx.moveTo(0,-22);
ctx.lineTo(20,0);
ctx.lineTo(0,22);
ctx.lineTo(-20,0);
ctx.closePath();
ctx.fill();
}

if(t.type===10)ctx.fillRect(-21,-17,42,34);

if(t.type===11){
ctx.beginPath();
ctx.arc(0,0,20,0,Math.PI*2);
ctx.fill();
}

if(t.type===12){
ctx.beginPath();
ctx.moveTo(0,-22);
ctx.lineTo(19,15);
ctx.lineTo(-19,15);
ctx.closePath();
ctx.fill();
}

if(t.type===13)ctx.fillRect(-20,-15,40,30);

if(t.type===14){
ctx.beginPath();
ctx.arc(0,0,21,0,Math.PI*2);
ctx.fill();
}

if(t.type===15){
ctx.beginPath();
ctx.moveTo(0,-22);
ctx.lineTo(22,0);
ctx.lineTo(0,22);
ctx.lineTo(-22,0);
ctx.closePath();
ctx.fill();
}

if(t.type===16){
ctx.beginPath();
ctx.arc(0,0,21,0,Math.PI*2);
ctx.fill();
}

if(t.type===17)ctx.fillRect(-20,-20,40,40);

if(t.type===18){
ctx.beginPath();
ctx.arc(0,0,22,0,Math.PI*2);
ctx.fill();
}

if(t.type===19){
ctx.beginPath();
ctx.moveTo(0,-23);
ctx.lineTo(20,-7);
ctx.lineTo(13,20);
ctx.lineTo(-13,20);
ctx.lineTo(-20,-7);
ctx.closePath();
ctx.fill();
}

ctx.save();
ctx.rotate(t.angle);

let barrelLength=30;
let barrelWidth=7;

if(t.type===0){
barrelLength=32;
barrelWidth=7;
}

if(t.type===1){
barrelLength=31;
barrelWidth=5;
}

if(t.type===2){
barrelLength=35;
barrelWidth=11;
}

if(t.type===5){
barrelLength=39;
barrelWidth=5;
}

if(t.type===8){
barrelLength=43;
barrelWidth=5;
}

if(t.type===13){
barrelLength=45;
barrelWidth=8;
}

if(t.type===19){
barrelLength=40;
barrelWidth=10;
}

ctx.fillStyle=type.color;
ctx.fillRect(2,-barrelWidth/2,barrelLength,barrelWidth);

if(t.type===0){
ctx.fillStyle="#d8eaff";
ctx.fillRect(
barrelLength-2,
-barrelWidth/2-1,
8,
barrelWidth+2
);
}

if(t.type===1){
ctx.fillStyle="#fff2a8";
ctx.fillRect(barrelLength-2,-3,8,6);
}

if(t.type===2){
ctx.fillStyle="#222";
ctx.fillRect(
barrelLength-4,
-barrelWidth/2,
7,
barrelWidth
);
}

if(t.type===5){
ctx.fillStyle="#ff7777";
ctx.fillRect(barrelLength-2,-2,9,4);
}

if(t.type===8){
ctx.fillStyle="#eee";
ctx.fillRect(barrelLength-2,-2,10,4);
}

if(t.type===13){
ctx.fillStyle="#5b402b";
ctx.fillRect(
barrelLength-3,
-barrelWidth/2-2,
10,
barrelWidth+4
);
}

if(t.type===19){
ctx.fillStyle="#fff";
ctx.fillRect(
barrelLength-3,
-barrelWidth/2-2,
9,
barrelWidth+4
);
}

ctx.restore();

ctx.fillStyle="#111";
ctx.beginPath();
ctx.arc(0,0,9,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#fff";
ctx.font="bold 12px Courier New";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(t.level,0,1);

ctx.restore();
}
}

function drawTroops(){
for(const tr of game.troops){
if(tr.dead)continue;

ctx.save();
ctx.translate(tr.x,tr.y);

ctx.fillStyle="#ddd";
ctx.beginPath();
ctx.arc(0,-8,6,0,Math.PI*2);
ctx.fill();

ctx.fillStyle=
tr.type==="mage"?"#9b5cff":
tr.type==="knight"?"#aaa":
tr.type==="archer"?"#6b8e23":
"#777";

ctx.fillRect(-7,-2,14,18);

ctx.fillStyle="#333";
ctx.fillRect(-10,17,20,3);

ctx.restore();
}
}

function drawEnemies(){
for(const e of game.enemies){
if(e.dead)continue;

const p=roadPointAt(e.road,e.progress);

ctx.save();
ctx.translate(p.x,p.y);

ctx.fillStyle=e.hitFlash>0?"#fff":"#b52b2b";

ctx.beginPath();
ctx.arc(0,0,e.size,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#551111";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle="#111";
ctx.fillRect(-7,-4,4,4);
ctx.fillRect(3,-4,4,4);

ctx.fillStyle="#222";
ctx.fillRect(-16,-23,32,5);

ctx.fillStyle="#e33";
ctx.fillRect(
-16,
-23,
32*Math.max(0,e.hp/e.maxHp),
5
);

ctx.restore();
}
}

function drawEffects(){
for(const e of game.effects){
const a=e.life/e.max;

ctx.save();
ctx.globalAlpha=a;

if(e.type==="bullet"){
ctx.fillStyle=e.color;
ctx.beginPath();
ctx.arc(e.x2,e.y2,5,0,Math.PI*2);
ctx.fill();
}

else if(e.type==="rapid"){
ctx.strokeStyle=e.color;
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(e.type==="heavy"){
ctx.strokeStyle=e.color;
ctx.lineWidth=6*a;
ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(e.type==="laser"){
ctx.strokeStyle=e.color;
ctx.lineWidth=5*a;
ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(e.type==="sniper"){
ctx.strokeStyle="#fff";
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(e.type==="tesla"){
ctx.strokeStyle=e.color;
ctx.lineWidth=3;

ctx.beginPath();
ctx.moveTo(e.x,e.y);

const dx=e.x2-e.x;
const dy=e.y2-e.y;

ctx.lineTo(
e.x+dx*.3+(Math.random()-.5)*15,
e.y+dy*.3+(Math.random()-.5)*15
);

ctx.lineTo(
e.x+dx*.65+(Math.random()-.5)*15,
e.y+dy*.65+(Math.random()-.5)*15
);

ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(
e.type==="splash"||
e.type==="mortar"||
e.type==="meteor"
){
ctx.strokeStyle=e.color;
ctx.lineWidth=4;

ctx.beginPath();
ctx.arc(
e.x,
e.y,
70*(1-a)+10,
0,
Math.PI*2
);
ctx.stroke();
}

else if(e.type==="freeze"||e.type==="ice"){
ctx.strokeStyle=e.color;
ctx.lineWidth=3;

ctx.beginPath();
ctx.arc(
e.x,
e.y,
25+35*(1-a),
0,
Math.PI*2
);
ctx.stroke();
}

else if(e.type==="poison"){
ctx.fillStyle=e.color;

ctx.beginPath();
ctx.arc(
e.x,
e.y,
18+20*(1-a),
0,
Math.PI*2
);
ctx.fill();
}

else if(e.type==="flame"){
ctx.strokeStyle=e.color;
ctx.lineWidth=10*a;

ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(e.type==="ballista"||e.type==="catapult"){
ctx.strokeStyle=e.color;
ctx.lineWidth=4;

ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(e.type==="void"){
ctx.strokeStyle=e.color;
ctx.lineWidth=6;

ctx.beginPath();
ctx.arc(
e.x2,
e.y2,
25*(1-a)+5,
0,
Math.PI*2
);
ctx.stroke();
}

else if(e.type==="crystal"){
ctx.strokeStyle=e.color;
ctx.lineWidth=4;

ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

else if(e.type==="guardian"){
ctx.strokeStyle=e.color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.arc(
e.x2,
e.y2,
30*(1-a)+5,
0,
Math.PI*2
);
ctx.stroke();
}

else if(e.type==="king"){
ctx.strokeStyle=e.color;
ctx.lineWidth=7;

ctx.beginPath();
ctx.moveTo(e.x,e.y);
ctx.lineTo(e.x2,e.y2);
ctx.stroke();
}

ctx.restore();
}
}

function updateTowerInfo(){
const box=document.getElementById("towerInfo");
const t=game.selected;

if(!t){
box.innerHTML="<b>NO TOWER SELECTED</b>";
return;
}

const type=towerTypes[t.type];

const upgradeCost=Math.floor(
type.cost*Math.pow(1.7,t.level)
);

const sell=Math.floor(
type.cost*.6*Math.pow(1.45,t.level-1)
);

const damage=(
type.damage*
(1+(t.level-1)*.35)
).toFixed(1);

box.innerHTML=
"<b>"+type.name+" TOWER</b><br>"+
"LEVEL: "+t.level+"<br>"+
"DAMAGE: "+damage+"<br>"+
"RANGE: "+type.range+"<br>"+
"ATTACK: "+(type.rate/1000).toFixed(2)+"s<br>"+
"KILLS: "+t.kills+"<br>"+
"UPGRADE: $"+upgradeCost+"<br>"+
"SELL: $"+sell;
}

function updateUI(){
document.getElementById("money").textContent=
"GOLD: "+Math.floor(game.money);

document.getElementById("wave").textContent=
"WAVE: "+game.wave;

document.getElementById("kingdom").textContent=
"KINGDOM: "+game.kingdom;

const hp=game.castles.reduce((a,c)=>a+c.hp,0);
const max=game.castles.reduce((a,c)=>a+c.maxHp,0);

document.getElementById("castleHP").textContent=
"KINGDOM HP: "+Math.floor(hp)+"/"+max;

document.getElementById("enemies").textContent=
"ENEMIES: "+game.enemies.length;

updateTowerInfo();
}

function upgradeSelected(){
const t=game.selected;

if(!t)return;

const type=towerTypes[t.type];

const cost=Math.floor(
type.cost*Math.pow(1.7,t.level)
);

if(game.money>=cost){
game.money-=cost;
t.level++;
}
}

function sellSelected(){
const t=game.selected;

if(!t)return;

const type=towerTypes[t.type];

const value=Math.floor(
type.cost*.6*Math.pow(1.45,t.level-1)
);

game.money+=value;

game.towers=game.towers.filter(x=>x!==t);
game.selected=null;
}

document.getElementById("upgradeBtn").onclick=upgradeSelected;
document.getElementById("sellBtn").onclick=sellSelected;

document.getElementById("pauseBtn").onclick=()=>{
game.paused=!game.paused;

document.getElementById("pauseBtn").textContent=
game.paused?"RESUME":"PAUSE";
};

document.getElementById("roadBtn").onclick=()=>{
alert("ROADS ARE AUTOMATIC");
};

document.querySelectorAll("[data-troop]").forEach(btn=>{
btn.onclick=()=>{
const id=btn.dataset.troop;
const type=troopTypes[id];

if(game.money<type.cost||game.defeated)return;

game.money-=type.cost;

const castle=game.castles.find(c=>c.hp>0)||game.castles[0];

game.troops.push({
type:id,
castle:castle,
x:castle.x,
y:castle.y,
hp:type.hp,
maxHp:type.hp,
attackTimer:0,
dead:false
});
};
});

function loseGame(){
game.defeated=true;

document.getElementById("overlayTitle").textContent="KINGDOM LOST";
document.getElementById("overlay").style.display="flex";
}

document.getElementById("retryBtn").onclick=()=>{
game=newGame();
camera={x:0,y:0};
waveTimer=0;
spawnTimer=0;
enemiesToSpawn=0;
waveRunning=false;
waveMessage=0;
selectedBuild=0;
document.getElementById("pauseBtn").textContent="PAUSE";
document.getElementById("overlay").style.display="none";
refreshTowerButtons();
generateAllRoads();
};

document.getElementById("homeBtn").onclick=()=>{
location.href="index.html";
};

function saveGame(slot){
const copy=JSON.parse(JSON.stringify(game));
copy.selected=null;
localStorage.setItem(
"kingdomWarSave"+slot,
JSON.stringify(copy)
);
}

function loadGame(slot){
const raw=localStorage.getItem("kingdomWarSave"+slot);

if(!raw)return;

try{
game={
...game,
...JSON.parse(raw),
selected:null,
paused:false,
defeated:false
};

generateAllRoads();
refreshTowerButtons();
document.getElementById("overlay").style.display="none";
}catch(e){}
}

document.getElementById("save1").onclick=()=>saveGame(1);
document.getElementById("save2").onclick=()=>saveGame(2);
document.getElementById("save3").onclick=()=>saveGame(3);

document.getElementById("load1").onclick=()=>loadGame(1);
document.getElementById("load2").onclick=()=>loadGame(2);
document.getElementById("load3").onclick=()=>loadGame(3);

document.getElementById("autoLoad").onclick=()=>{
const raw=localStorage.getItem("kingdomWarAutosave");

if(raw){
try{
game={
...game,
...JSON.parse(raw),
selected:null,
paused:false,
defeated:false
};

generateAllRoads();
refreshTowerButtons();
document.getElementById("overlay").style.display="none";
}catch(e){}
}
};

document.getElementById("copyAuto").onclick=()=>{
const raw=localStorage.getItem("kingdomWarAutosave");

if(raw&&navigator.clipboard){
navigator.clipboard.writeText(raw);
}
};

setInterval(()=>{
if(!game.defeated){
const copy=JSON.parse(JSON.stringify(game));
copy.selected=null;

localStorage.setItem(
"kingdomWarAutosave",
JSON.stringify(copy)
);
}
},5000);

window.addEventListener("keydown",e=>{
keyBuffer+=(e.key||"").toLowerCase();

if(keyBuffer.length>3){
keyBuffer=keyBuffer.slice(-3);
}

if(keyBuffer==="rrr"){
location.href="index.html";
}
});

function gameLoop(now){
const dt=Math.min(40,now-lastTime);
lastTime=now;

if(!game.paused&&!game.defeated){
updateWave(dt);
updateEnemies(dt);
updateTowers(dt);
updateTroops(dt);
updateEffects(dt);

if(waveMessage>0)waveMessage-=dt;

for(const e of game.enemies){
e.hitFlash=Math.max(0,e.hitFlash-dt);
}
}

updateUI();
drawWorld();

requestAnimationFrame(gameLoop);
}

refreshTowerButtons();
generateAllRoads();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
