<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const WIDTH = 900;
const HEIGHT = 560;

const MAX_WAVES = 100000000;


/* =====================================================
   STATE
===================================================== */

let running = false;
let waveRunning = false;

let money = 250;
let wave = 1;
let kingdom = 1;

let enemies = [];
let towers = [];
let bullets = [];
let effects = [];

let selectedTowerType = "basic";
let selectedTower = null;

let mouseX = 450;
let mouseY = 280;

let placementX = 460;
let placementY = 300;

let spawnLeft = 0;
let spawnTimer = 0;

let lastTime = 0;


/* =====================================================
   CASTLES
===================================================== */

let castles = [

    {
        x: 110,
        y: 280,
        hp: 1000,
        maxHp: 1000,
        alive: true,
        number: 1
    }

];


/* =====================================================
   PATH
===================================================== */

const path = [

    {x:-30,y:130},
    {x:150,y:130},
    {x:150,y:280},
    {x:300,y:280},
    {x:300,y:430},
    {x:470,y:430},
    {x:470,y:280},
    {x:680,y:280},
    {x:680,y:130},
    {x:930,y:130}

];


/* =====================================================
   TOWERS
===================================================== */

const towerTypes = {

    basic: {
        cost:50,
        range:120,
        damage:15,
        fireRate:700
    },

    rapid: {
        cost:75,
        range:100,
        damage:7,
        fireRate:240
    },

    heavy: {
        cost:120,
        range:140,
        damage:42,
        fireRate:1100
    },

    slow: {
        cost:100,
        range:120,
        damage:9,
        fireRate:650
    },

    splash: {
        cost:150,
        range:125,
        damage:24,
        fireRate:950
    },

    laser: {
        cost:200,
        range:165,
        damage:13,
        fireRate:130
    },

    freeze: {
        cost:250,
        range:135,
        damage:8,
        fireRate:600
    },

    sniper: {
        cost:300,
        range:300,
        damage:120,
        fireRate:1800
    },

    tesla: {
        cost:400,
        range:155,
        damage:30,
        fireRate:700
    },

    rocket: {
        cost:500,
        range:200,
        damage:80,
        fireRate:1400
    }

};


/* =====================================================
   UNLOCKS
===================================================== */

const unlocks = {

    basic:1,
    rapid:1,
    heavy:5,
    slow:10,
    splash:20,
    laser:40,
    freeze:60,
    sniper:100,
    tesla:200,
    rocket:500

};


/* =====================================================
   ENEMY TYPES
===================================================== */

function getEnemyType() {

    const list = ["grunt"];

    if (wave >= 11)
        list.push("runner");

    if (wave >= 21)
        list.push("shield");

    if (wave >= 31)
        list.push("armour");

    if (wave >= 41)
        list.push("mage");

    if (wave >= 61)
        list.push("brute");

    if (wave >= 81)
        list.push("siege");

    if (wave >= 150)
        list.push("assassin");

    if (wave >= 300)
        list.push("warlock");

    if (wave >= 500)
        list.push("destroyer");

    return list[
        Math.floor(
            Math.random() * list.length
        )
    ];
}


/* =====================================================
   ENEMY STATS
===================================================== */

function enemyStats(type) {

    const data = {

        grunt: {
            hp:45,
            speed:.32,
            reward:10
        },

        runner: {
            hp:35,
            speed:.48,
            reward:14
        },

        shield: {
            hp:100,
            speed:.25,
            reward:20
        },

        armour: {
            hp:190,
            speed:.21,
            reward:28
        },

        mage: {
            hp:140,
            speed:.27,
            reward:35
        },

        brute: {
            hp:350,
            speed:.16,
            reward:50
        },

        siege: {
            hp:650,
            speed:.12,
            reward:80
        },

        assassin: {
            hp:450,
            speed:.42,
            reward:100
        },

        warlock: {
            hp:1000,
            speed:.18,
            reward:160
        },

        destroyer: {
            hp:2200,
            speed:.10,
            reward:300
        }

    }[type];

    const scale =
        Math.pow(
            1.012,
            Math.min(
                wave,
                5000
            )
        );

    const kingdomScale =
        1 +
        (kingdom - 1) * .35;

    return {

        hp:
            data.hp *
            scale *
            kingdomScale,

        speed:
            data.speed,

        reward:
            Math.round(
                data.reward *
                kingdomScale
            )
    };
}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    money = 250;
    wave = 1;
    kingdom = 1;

    enemies = [];
    towers = [];
    bullets = [];
    effects = [];

    castles = [

        {
            x:110,
            y:280,
            hp:1000,
            maxHp:1000,
            alive:true,
            number:1
        }

    ];

    selectedTower = null;
    selectedTowerType = "basic";

    running = true;
    waveRunning = false;

    hideOverlay();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(time) {

    if (!running)
        return;

    const dt =
        Math.min(
            time - lastTime,
            50
        );

    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt) {

    updateSpawning(dt);
    updateEnemies(dt);
    updateTowers(dt);
    updateBullets(dt);
    updateEffects(dt);
}


/* =====================================================
   START WAVE
===================================================== */

function startWave() {

    if (
        !running ||
        waveRunning
    )
        return;

    waveRunning = true;

    spawnLeft =
        Math.min(
            100,
            5 +
            Math.floor(
                wave * .5
            )
        );

    spawnTimer = 0;
}


/* =====================================================
   SPAWN
===================================================== */

function updateSpawning(dt) {

    if (!waveRunning)
        return;

    spawnTimer -= dt;

    if (
        spawnLeft > 0 &&
        spawnTimer <= 0
    ) {

        spawnEnemy();

        spawnLeft--;

        spawnTimer =
            Math.max(
                350,
                900 -
                Math.min(
                    wave * 2,
                    400
                )
            );
    }

    if (
        spawnLeft <= 0 &&
        enemies.length === 0
    ) {

        waveRunning = false;

        if (
            wave % 40 === 0
        ) {

            conquerKingdom();

        } else {

            wave++;
        }
    }
}


/* =====================================================
   SPAWN ENEMY
===================================================== */

function spawnEnemy() {

    const type =
        getEnemyType();

    const stats =
        enemyStats(type);

    enemies.push({

        type:type,

        x:path[0].x,
        y:path[0].y,

        waypoint:1,

        hp:stats.hp,
        maxHp:stats.hp,

        speed:stats.speed,

        reward:stats.reward,

        slow:1,
        freeze:0,

        castleTarget:
            castles[
                Math.floor(
                    Math.random() *
                    castles.length
                )
            ]

    });
}


/* =====================================================
   CONQUER
===================================================== */

function conquerKingdom() {

    kingdom++;

    const number =
        castles.length + 1;

    const newCastle = {

        x:
            120 +
            ((number - 2) % 3) *
            300,

        y:
            number % 2 === 0
            ? 430
            : 280,

        hp:1000,
        maxHp:1000,

        alive:true,

        number:number
    };

    castles.push(
        newCastle
    );

    money +=
        300 * kingdom;

    effects.push({

        x:450,
        y:250,

        life:1800,

        type:"conquest"
    });

    wave++;
}


/* =====================================================
   ENEMIES
===================================================== */

function updateEnemies(dt) {

    for (
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ) {

        const enemy =
            enemies[i];

        if (
            enemy.freeze > 0
        ) {

            enemy.freeze -= dt;

            continue;
        }

        const target =
            path[
                enemy.waypoint
            ];

        if (!target) {

            attackCastle(
                enemy.castleTarget,
                enemy
            );

            enemies.splice(
                i,
                1
            );

            continue;
        }

        const dx =
            target.x -
            enemy.x;

        const dy =
            target.y -
            enemy.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        const movement =
            enemy.speed *
            enemy.slow *
            dt;

        if (
            distance <=
            movement
        ) {

            enemy.x =
                target.x;

            enemy.y =
                target.y;

            enemy.waypoint++;

        } else {

            enemy.x +=
                dx /
                distance *
                movement;

            enemy.y +=
                dy /
                distance *
                movement;
        }

        if (
            enemy.slow < 1
        ) {

            enemy.slow =
                Math.min(
                    1,
                    enemy.slow +
                    dt * .00015
                );
        }
    }
}


/* =====================================================
   CASTLE ATTACK
===================================================== */

function attackCastle(
    castle,
    enemy
) {

    if (
        !castle ||
        !castle.alive
    ) {

        castle =
            castles.find(
                c => c.alive
            );
    }

    if (!castle)
        return;

    let damage = 25;

    if (
        enemy.type === "siege"
    )
        damage = 80;

    if (
        enemy.type === "brute"
    )
        damage = 45;

    if (
        enemy.type === "destroyer"
    )
        damage = 150;

    castle.hp -= damage;

    if (
        castle.hp <= 0
    ) {

        castle.hp = 0;
        castle.alive = false;

        effects.push({

            x:castle.x,
            y:castle.y,

            life:1000,

            type:"castle"
        });

        if (
            castles.every(
                c => !c.alive
            )
        ) {

            endGame();
        }
    }
}


/* =====================================================
   SELECT TOWER
===================================================== */

function selectTower(type) {

    if (
        wave <
        unlocks[type]
    )
        return;

    selectedTowerType =
        type;

    document
        .querySelectorAll(
            ".towerButton"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );

    document
        .getElementById(
            type + "Button"
        )
        .classList.add(
            "selected"
        );
}


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    function(e) {

        const rect =
            canvas.getBoundingClientRect();

        mouseX =
            (e.clientX -
            rect.left) *
            WIDTH /
            rect.width;

        mouseY =
            (e.clientY -
            rect.top) *
            HEIGHT /
            rect.height;

        /*
           IMPORTANT:
           Snap to 40px building grid.
        */

        placementX =
            Math.floor(
                mouseX / 40
            ) * 40 + 20;

        placementY =
            Math.floor(
                mouseY / 40
            ) * 40 + 20;
    }
);


/* =====================================================
   BUILD
===================================================== */

canvas.addEventListener(
    "click",
    function() {

        if (!running)
            return;

        /*
           First check whether
           clicking an existing tower.
        */

        for (
            const tower of towers
        ) {

            if (
                Math.hypot(
                    placementX -
                    tower.x,

                    placementY -
                    tower.y
                ) < 25
            ) {

                selectedTower =
                    tower;

                return;
            }
        }

        const type =
            towerTypes[
                selectedTowerType
            ];

        if (
            money <
            type.cost
        )
            return;

        if (
            !validPlacement(
                placementX,
                placementY
            )
        )
            return;

        money -=
            type.cost;

        towers.push({

            x:placementX,
            y:placementY,

            type:selectedTowerType,

            level:1,

            range:type.range,

            damage:type.damage,

            fireRate:type.fireRate,

            cooldown:0,

            flash:0,

            recoil:0,

            angle:0
        });
    }
);


/* =====================================================
   VALID PLACEMENT
===================================================== */

function validPlacement(x,y) {

    /*
       Keep towers inside map.
    */

    if (
        x < 25 ||
        x > WIDTH - 25 ||
        y < 25 ||
        y > HEIGHT - 25
    )
        return false;


    /*
       Do NOT build on path.
       Path is 58px wide.
    */

    for (
        let i = 0;
        i < path.length - 1;
        i++
    ) {

        const a = path[i];
        const b = path[i+1];

        if (
            a.x === b.x
        ) {

            if (
                Math.abs(
                    x - a.x
                ) < 38 &&

                y >=
                    Math.min(
                        a.y,
                        b.y
                    ) - 38 &&

                y <=
                    Math.max(
                        a.y,
                        b.y
                    ) + 38
            )
                return false;

        } else {

            if (
                Math.abs(
                    y - a.y
                ) < 38 &&

                x >=
                    Math.min(
                        a.x,
                        b.x
                    ) - 38 &&

                x <=
                    Math.max(
                        a.x,
                        b.x
                    ) + 38
            )
                return false;
        }
    }


    /*
       Don't build on castles.
    */

    for (
        const castle of castles
    ) {

        if (
            Math.hypot(
                x - castle.x,
                y - castle.y
            ) < 55
        )
            return false;
    }


    /*
       Don't overlap towers.
    */

    for (
        const tower of towers
    ) {

        if (
            Math.hypot(
                x - tower.x,
                y - tower.y
            ) < 45
        )
            return false;
    }

    return true;
}


/* =====================================================
   TOWERS
===================================================== */

function updateTowers(dt) {

    for (
        const tower of towers
    ) {

        tower.cooldown -= dt;

        if (
            tower.flash > 0
        )
            tower.flash -= dt;

        tower.recoil =
            Math.max(
                0,
                tower.recoil -
                dt * .08
            );

        if (
            tower.cooldown > 0
        )
            continue;

        let target = null;
        let closest = Infinity;

        for (
            const enemy of enemies
        ) {

            const distance =
                Math.hypot(
                    enemy.x -
                    tower.x,

                    enemy.y -
                    tower.y
                );

            if (
                distance <=
                    tower.range &&
                distance <
                    closest
            ) {

                closest =
                    distance;

                target =
                    enemy;
            }
        }

        if (!target)
            continue;

        tower.angle =
            Math.atan2(
                target.y -
                    tower.y,

                target.x -
                    tower.x
            );

        tower.flash = 100;
        tower.recoil = 6;

        bullets.push({

            x:tower.x,
            y:tower.y,

            target:target,

            damage:tower.damage,

            speed:
                tower.type === "laser"
                ? 17
                : tower.type === "sniper"
                ? 11
                : 7,

            tower:tower
        });

        tower.cooldown =
            tower.fireRate;
    }
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt) {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];

        if (
            !bullet.target ||
            !enemies.includes(
                bullet.target
            )
        ) {

            bullets.splice(
                i,
                1
            );

            continue;
        }

        const target =
            bullet.target;

        const dx =
            target.x -
            bullet.x;

        const dy =
            target.y -
            bullet.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        const move =
            bullet.speed *
            dt;

        if (
            distance <=
            move + 5
        ) {

            hitEnemy(
                target,
                bullet.damage,
                bullet.tower
            );

            effects.push({

                x:target.x,
                y:target.y,

                life:200,

                type:"hit"
            });

            bullets.splice(
                i,
                1
            );

        } else {

            bullet.x +=
                dx /
                distance *
                move;

            bullet.y +=
                dy /
                distance *
                move;
        }
    }
}


/* =====================================================
   HIT
===================================================== */

function hitEnemy(
    enemy,
    damage,
    tower
) {

    enemy.hp -= damage;


    if (
        tower.type === "slow"
    ) {

        enemy.slow = .45;
    }


    if (
        tower.type === "freeze"
    ) {

        enemy.freeze = 800;
    }


    if (
        tower.type === "splash"
    ) {

        splash(
            enemy,
            damage * .55,
            60
        );
    }


    if (
        tower.type === "rocket"
    ) {

        splash(
            enemy,
            damage * .75,
            95
        );
    }


    if (
        tower.type === "tesla"
    ) {

        let hits = 0;

        for (
            const other of enemies
        ) {

            if (
                other === enemy ||
                hits >= 2
            )
                continue;

            if (
                Math.hypot(
                    other.x -
                    enemy.x,

                    other.y -
                    enemy.y
                ) < 80
            ) {

                other.hp -=
                    damage * .45;

                hits++;
            }
        }
    }


    if (
        enemy.hp <= 0
    ) {

        killEnemy(enemy);
    }
}


/* =====================================================
   SPLASH
===================================================== */

function splash(
    center,
    damage,
    radius
) {

    for (
        const enemy of enemies
    ) {

        if (
            enemy === center
        )
            continue;

        if (
            Math.hypot(
                enemy.x -
                center.x,

                enemy.y -
                center.y
            ) <= radius
        ) {

            enemy.hp -= damage;

            if (
                enemy.hp <= 0
            )
                killEnemy(enemy);
        }
    }
}


/* =====================================================
   KILL
===================================================== */

function killEnemy(enemy) {

    const index =
        enemies.indexOf(
            enemy
        );

    if (
        index === -1
    )
        return;

    enemies.splice(
        index,
        1
    );

    money +=
        enemy.reward;
}


/* =====================================================
   EFFECTS
===================================================== */

function updateEffects(dt) {

    for (
        let i =
            effects.length - 1;

        i >= 0;

        i--
    ) {

        effects[i].life -= dt;

        if (
            effects[i].life <= 0
        )
            effects.splice(
                i,
                1
            );
    }
}


/* =====================================================
   UPGRADE
===================================================== */

function upgradeSelected() {

    if (!selectedTower)
        return;

    const cost =
        50 *
        selectedTower.level;

    if (
        money < cost
    )
        return;

    money -= cost;

    selectedTower.level++;

    selectedTower.damage =
        Math.round(
            selectedTower.damage *
            1.35
        );

    selectedTower.range += 10;

    selectedTower.fireRate =
        Math.max(
            80,
            selectedTower.fireRate *
            .9
        );
}


/* =====================================================
   SELL
===================================================== */

function sellSelected() {

    if (!selectedTower)
        return;

    const index =
        towers.indexOf(
            selectedTower
        );

    if (
        index === -1
    )
        return;

    money +=
        25 *
        selectedTower.level;

    towers.splice(
        index,
        1
    );

    selectedTower = null;
}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    ctx.fillStyle =
        "#101010";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       GRID
    */

    ctx.strokeStyle =
        "#191919";

    ctx.lineWidth = 1;

    for (
        let x=0;
        x<WIDTH;
        x+=20
    ) {

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,HEIGHT);

        ctx.stroke();
    }

    for (
        let y=0;
        y<HEIGHT;
        y+=20
    ) {

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(WIDTH,y);

        ctx.stroke();
    }


    /*
       ROAD
    */

    ctx.strokeStyle =
        "#444";

    ctx.lineWidth = 58;

    ctx.beginPath();

    ctx.moveTo(
        path[0].x,
        path[0].y
    );

    for (
        let i=1;
        i<path.length;
        i++
    ) {

        ctx.lineTo(
            path[i].x,
            path[i].y
        );
    }

    ctx.stroke();


    ctx.strokeStyle =
        "#777";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        12,
        12
    ]);

    ctx.beginPath();

    ctx.moveTo(
        path[0].x,
        path[0].y
    );

    for (
        let i=1;
        i<path.length;
        i++
    ) {

        ctx.lineTo(
            path[i].x,
            path[i].y
        );
    }

    ctx.stroke();

    ctx.setLineDash([]);


    /*
       CASTLES
    */

    for (
        const castle of castles
    ) {

        drawCastle(castle);
    }


    /*
       PLACEMENT
    */

    drawPlacement();


    /*
       TOWERS
    */

    for (
        const tower of towers
    ) {

        drawTower(tower);
    }


    /*
       ENEMIES
    */

    for (
        const enemy of enemies
    ) {

        drawEnemy(enemy);
    }


    /*
       BULLETS
    */

    for (
        const bullet of bullets
    ) {

        drawBullet(bullet);
    }


    /*
       EFFECTS
    */

    for (
        const effect of effects
    ) {

        drawEffect(effect);
    }


    updateStats();
}


/* =====================================================
   PLACEMENT DRAW
===================================================== */

function drawPlacement() {

    if (!running)
        return;

    const type =
        towerTypes[
            selectedTowerType
        ];

    const valid =
        money >= type.cost &&
        validPlacement(
            placementX,
            placementY
        );


    /*
       RANGE
    */

    ctx.strokeStyle =
        valid
        ? "rgba(255,255,255,.25)"
        : "rgba(255,0,0,.25)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        placementX,
        placementY,
        type.range,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
       BUILD SQUARE
    */

    ctx.fillStyle =
        valid
        ? "rgba(210,210,210,.25)"
        : "rgba(255,0,0,.25)";

    ctx.fillRect(
        placementX - 20,
        placementY - 20,
        40,
        40
    );


    ctx.strokeStyle =
        valid
        ? "#bbb"
        : "#f33";

    ctx.strokeRect(
        placementX - 20,
        placementY - 20,
        40,
        40
    );
}


/* =====================================================
   CASTLE DRAW
===================================================== */

function drawCastle(castle) {

    if (!castle.alive) {

        ctx.fillStyle =
            "#222";

        ctx.fillRect(
            castle.x-30,
            castle.y-30,
            60,
            60
        );

        ctx.fillStyle =
            "#777";

        ctx.font =
            "10px Courier New";

        ctx.fillText(
            "FALLEN",
            castle.x-22,
            castle.y+4
        );

        return;
    }


    /*
       BODY
    */

    ctx.fillStyle =
        "#777";

    ctx.fillRect(
        castle.x-30,
        castle.y-30,
        60,
        60
    );


    /*
       CORNERS
    */

    ctx.fillStyle =
        "#aaa";

    ctx.fillRect(
        castle.x-38,
        castle.y-38,
        15,
        25
    );

    ctx.fillRect(
        castle.x+23,
        castle.y-38,
        15,
        25
    );

    ctx.fillRect(
        castle.x-38,
        castle.y+13,
        15,
        25
    );

    ctx.fillRect(
        castle.x+23,
        castle.y+13,
        15,
        25
    );


    /*
       FLAG
    */

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        castle.x,
        castle.y-48,
        3,
        20
    );

    ctx.beginPath();

    ctx.moveTo(
        castle.x+3,
        castle.y-48
    );

    ctx.lineTo(
        castle.x+20,
        castle.y-42
    );

    ctx.lineTo(
        castle.x+3,
        castle.y-35
    );

    ctx.fill();


    /*
       NUMBER
    */

    ctx.fillStyle =
        "#111";

    ctx.font =
        "bold 20px Courier New";

    ctx.fillText(
        castle.number,
        castle.x-6,
        castle.y+7
    );


    /*
       HP
    */

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        castle.x-35,
        castle.y+48,
        70,
        6
    );

    ctx.fillStyle =
        "#ddd";

    ctx.fillRect(
        castle.x-35,
        castle.y+48,
        70 *
        castle.hp /
        castle.maxHp,
        6
    );
}


/* =====================================================
   TOWER DRAW
===================================================== */

function drawTower(tower) {

    if (
        selectedTower === tower
    ) {

        ctx.strokeStyle =
            "rgba(255,255,255,.35)";

        ctx.beginPath();

        ctx.arc(
            tower.x,
            tower.y,
            tower.range,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    const colours = {

        basic:"#d44",
        rapid:"#4af",
        heavy:"#f5a623",
        slow:"#5c6",
        splash:"#b65cff",
        laser:"#4ff",
        freeze:"#8cf",
        sniper:"#eee",
        tesla:"#ff5",
        rocket:"#f66"

    };


    ctx.fillStyle =
        colours[
            tower.type
        ];


    ctx.save();

    ctx.translate(
        tower.x,
        tower.y
    );


    /*
       CANNON
    */

    if (
        tower.type === "basic"
    ) {

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            18,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
       RAPID
    */

    else if (
        tower.type === "rapid"
    ) {

        ctx.fillRect(
            -18,
            -18,
            36,
            36
        );

        ctx.fillStyle =
            "#111";

        ctx.fillRect(
            -5,
            -23,
            7,
            46
        );

        ctx.fillRect(
            5,
            -23,
            7,
            46
        );
    }


    /*
       HEAVY
    */

    else if (
        tower.type === "heavy"
    ) {

        ctx.rotate(
            Math.PI/4
        );

        ctx.fillRect(
            -17,
            -17,
            34,
            34
        );
    }


    /*
       SLOW
    */

    else if (
        tower.type === "slow"
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            -21
        );

        ctx.lineTo(
            21,
            18
        );

        ctx.lineTo(
            -21,
            18
        );

        ctx.closePath();

        ctx.fill();
    }


    /*
       SPLASH
    */

    else if (
        tower.type === "splash"
    ) {

        drawPolygon(
            0,
            0,
            21,
            8
        );
    }


    /*
       LASER
    */

    else if (
        tower.type === "laser"
    ) {

        ctx.fillRect(
            -10,
            -23,
            20,
            46
        );
    }


    /*
       FREEZE
    */

    else if (
        tower.type === "freeze"
    ) {

        drawStar(
            0,
            0,
            22,
            8
        );
    }


    /*
       SNIPER
    */

    else if (
        tower.type === "sniper"
    ) {

        ctx.fillRect(
            -23,
            -13,
            46,
            26
        );
    }


    /*
       TESLA
    */

    else if (
        tower.type === "tesla"
    ) {

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            21,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle =
            "#111";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            -8,
            -13
        );

        ctx.lineTo(
            5,
            0
        );

        ctx.lineTo(
            -5,
            14
        );

        ctx.stroke();
    }


    /*
       ROCKET
    */

    else {

        drawPolygon(
            0,
            0,
            22,
            6
        );
    }


    ctx.restore();


    /*
       BARREL
    */

    ctx.save();

    ctx.translate(
        tower.x,
        tower.y
    );

    ctx.rotate(
        tower.angle
    );

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        0,
        -4,
        20 -
            tower.recoil,
        8
    );

    ctx.restore();


    /*
       MUZZLE FLASH
    */

    if (
        tower.flash > 0
    ) {

        ctx.fillStyle =
            "white";

        ctx.beginPath();

        ctx.arc(
            tower.x +
            Math.cos(
                tower.angle
            ) * 25,

            tower.y +
            Math.sin(
                tower.angle
            ) * 25,

            9 *
            tower.flash /
            100,

            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
       LEVEL
    */

    ctx.fillStyle =
        "#111";

    ctx.font =
        "bold 9px Courier New";

    ctx.fillText(
        tower.level,
        tower.x-3,
        tower.y+3
    );
}


/* =====================================================
   ENEMY DRAW
===================================================== */

function drawEnemy(enemy) {

    const colours = {

        grunt:"#e33",
        runner:"#38f",
        shield:"#3c6",
        armour:"#fa3",
        mage:"#b65cff",
        brute:"#f66",
        siege:"#999",
        assassin:"#ff4",
        warlock:"#d35cff",
        destroyer:"#fff"

    };

    ctx.fillStyle =
        colours[
            enemy.type
        ];


    const size =
        enemy.type === "destroyer"
        ? 32
        : enemy.type === "brute"
        ? 28
        : enemy.type === "siege"
        ? 30
        : 21;


    /*
       RUNNER
    */

    if (
        enemy.type === "runner"
    ) {

        ctx.beginPath();

        ctx.moveTo(
            enemy.x,
            enemy.y-size
        );

        ctx.lineTo(
            enemy.x+size,
            enemy.y
        );

        ctx.lineTo(
            enemy.x,
            enemy.y+size
        );

        ctx.lineTo(
            enemy.x-size,
            enemy.y
        );

        ctx.closePath();

        ctx.fill();
    }


    /*
       MAGIC ENEMIES
    */

    else if (
        enemy.type === "mage" ||
        enemy.type === "warlock"
    ) {

        drawStar(
            enemy.x,
            enemy.y,
            size,
            6
        );
    }


    /*
       NORMAL
    */

    else {

        ctx.fillRect(
            enemy.x-size/2,
            enemy.y-size/2,
            size,
            size
        );
    }


    /*
       EYES
    */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        enemy.x-6,
        enemy.y-4,
        4,
        4
    );

    ctx.fillRect(
        enemy.x+2,
        enemy.y-4,
        4,
        4
    );


    /*
       HP BAR
    */

    const bar =
        size+10;

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        enemy.x-bar/2,
        enemy.y-size/2-9,
        bar,
        4
    );

    ctx.fillStyle =
        "#eee";

    ctx.fillRect(
        enemy.x-bar/2,
        enemy.y-size/2-9,
        bar *
        Math.max(
            0,
            enemy.hp /
            enemy.maxHp
        ),
        4
    );
}


/* =====================================================
   BULLET DRAW
===================================================== */

function drawBullet(
    bullet
) {

    ctx.fillStyle =
        "white";

    ctx.fillRect(
        bullet.x-3,
        bullet.y-3,
        6,
        6
    );

    if (
        bullet.tower.type ===
        "laser"
    ) {

        ctx.fillRect(
            bullet.x-12,
            bullet.y-2,
            8,
            4
        );
    }
}


/* =====================================================
   EFFECTS
===================================================== */

function drawEffect(effect) {

    if (
        effect.type ===
        "conquest"
    ) {

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 28px Courier New";

        ctx.fillText(
            "KINGDOM CONQUERED!",
            255,
            245
        );

        ctx.font =
            "16px Courier New";

        ctx.fillText(
            "CASTLE " +
            castles.length +
            " ADDED",
            350,
            275
        );

        return;
    }


    ctx.strokeStyle =
        "rgba(255,255,255,.7)";

    ctx.strokeRect(
        effect.x-15,
        effect.y-15,
        30,
        30
    );
}


/* =====================================================
   POLYGON
===================================================== */

function drawPolygon(
    x,
    y,
    radius,
    sides
) {

    ctx.beginPath();

    for (
        let i=0;
        i<sides;
        i++
    ) {

        const angle =
            i *
            Math.PI*2 /
            sides -
            Math.PI/2;

        const px =
            x +
            Math.cos(angle) *
            radius;

        const py =
            y +
            Math.sin(angle) *
            radius;

        if (i === 0)
            ctx.moveTo(
                px,
                py
            );
        else
            ctx.lineTo(
                px,
                py
            );
    }

    ctx.closePath();
    ctx.fill();
}


/* =====================================================
   STAR
===================================================== */

function drawStar(
    x,
    y,
    radius,
    points
) {

    ctx.beginPath();

    for (
        let i=0;
        i<points*2;
        i++
    ) {

        const r =
            i%2 === 0
            ? radius
            : radius*.4;

        const angle =
            i *
            Math.PI /
            points -
            Math.PI/2;

        const px =
            x +
            Math.cos(angle) *
            r;

        const py =
            y +
            Math.sin(angle) *
            r;

        if (i === 0)
            ctx.moveTo(
                px,
                py
            );
        else
            ctx.lineTo(
                px,
                py
            );
    }

    ctx.closePath();
    ctx.fill();
}


/* =====================================================
   STATS
===================================================== */

function updateStats() {

    const alive =
        castles.filter(
            c => c.alive
        ).length;

    document
        .getElementById(
            "stats"
        )
        .textContent =
        "$" + money +
        " | Castles " +
        alive +
        "/" +
        castles.length +
        " | Kingdom " +
        kingdom +
        " | Wave " +
        wave +
        "/" +
        MAX_WAVES;
}


/* =====================================================
   SAVE
===================================================== */

function saveGame(slot) {

    if (!running)
        return;

    const data = {

        money:money,
        wave:wave,
        kingdom:kingdom,
        castles:castles,

        towers:
            towers.map(
                t => ({

                    x:t.x,
                    y:t.y,

                    type:t.type,

                    level:t.level,

                    range:t.range,

                    damage:t.damage,

                    fireRate:t.fireRate
                })
            )
    };

    localStorage.setItem(

    );

        "SAVED TO SLOT " +
        slot
    );

/* =====================================================
   LOAD
===================================================== */

function loadGame(slot) {

    const raw =
        localStorage.getItem(
            "towerDefenseSave" +
            slot
        );

    if (!raw) {

        alert(
            "SAVE SLOT " +
            slot +
            " IS EMPTY"
        );

        return;
    }

    const data =
        JSON.parse(raw);

    money =
        data.money;

    wave =
        data.wave;

    kingdom =
        data.kingdom;

    castles =
        data.castles;

    towers =
        data.towers.map(
            t => ({

                ...t,

                cooldown:0,
                flash:0,
                recoil:0,
                angle:0
            })
        );

    enemies = [];
    bullets = [];
    effects = [];

    selectedTower = null;
    selectedTowerType = "basic";

    running = true;
    waveRunning = false;

    hideOverlay();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}

document.addEventListener(
