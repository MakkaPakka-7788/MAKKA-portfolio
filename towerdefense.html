function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function getUpgradeCost(level){

  if(level<10){
    return 75+level*45;
  }

  return 500+(level-10)*175;
}

/* =====================================================
   EXPANDING WORLD
===================================================== */

function createEnemyBase(id,x,y){

  enemyBases.push({
    id,
    x,
    y
  });
}

function getRandomCastlePosition(){

  /*
    Pick a random enemy base.
    New castles are kept reasonably close
    to that base.
  */

  const base=
    enemyBases[
      Math.floor(
        Math.random()*
        enemyBases.length
      )
    ];

  for(let attempt=0;attempt<600;attempt++){

    const angle=
      Math.random()*
      Math.PI*2;

    const radius=
      300+
      Math.random()*450;

    const x=
      base.x+
      Math.cos(angle)*radius;

    const y=
      base.y+
      Math.sin(angle)*radius;

    /*
      Large world limits.
    */

    if(
      x<-3000||
      x>6000||
      y<-3000||
      y>5000
    ){
      continue;
    }

    /*
      Keep away from roads.
    */

    if(
      pointNearRoad(
        x,
        y
      )
    ){
      continue;
    }

    /*
      Keep away from castles.
    */

    let castleTooClose=false;

    for(const castle of castles){

      if(
        distance(
          {x,y},
          castle
        )<180
      ){

        castleTooClose=true;
        break;
      }
    }

    if(castleTooClose){
      continue;
    }

    /*
      Keep away from enemy bases themselves.
    */

    let baseTooClose=false;

    for(const enemyBase of enemyBases){

      if(
        distance(
          {x,y},
          enemyBase
        )<140
      ){

        baseTooClose=true;
        break;
      }
    }

    if(baseTooClose){
      continue;
    }

    return {x,y};
  }

  /*
    Emergency fallback.
  */

  return {
    x:base.x+350,
    y:base.y+350
  };
}

function addCastle(id){

  const pos=
    getRandomCastlePosition();

  const hp=
    1000+
    Math.max(
      0,
      id-1
    )*250;

  castles.push({

    id,

    x:pos.x,
    y:pos.y,

    hp,
    maxHp:hp
  });
}

function addEnemyBaseForExpansion(){

  /*
    Enemy bases no longer expand.
    The enemy becomes stronger through
    larger armies and stronger units.
  */
  return;
}

function getNearestEnemyBase(castle){

  let best=null;
  let bestD=Infinity;

  for(const base of enemyBases){

    const d=
      distance(
        castle,
        base
      );

    if(d<bestD){

      bestD=d;
      best=base;
    }
  }

  return best;
}

function getRoadTarget(){

  if(currentRoadCastleId===null){
    return null;
  }

  const castle=
    castles.find(
      c=>c.id===currentRoadCastleId
    );

  if(!castle)return null;

  return getNearestEnemyBase(castle);
}

function roadConnected(){

  if(roadPoints.length<2){
    return false;
  }

  const target=
    getRoadTarget();

  if(!target){
    return false;
  }

  const p=
    roadPoints[
      roadPoints.length-1
    ];

  return distance(
    p,
    target
  )<65;
}

function getInitialRoad(){

  const base=
    enemyBases[0];

  if(!base){
    return [];
  }

  return [
    {
      x:250,
      y:325
    },
    {
      x:base.x,
      y:base.y
    }
  ];
}

function getActiveRoadPaths(){

  const paths=[];

  if(
    castles.some(
      c=>
        c.id===1 &&
        c.hp>0
    )
  ){

    const initial=
      getInitialRoad();

    if(initial.length>1){

      paths.push({

        castleId:1,
        points:initial

      });
    }
  }

  for(const p of roadPaths){

    const castle=
      castles.find(
        c=>
          c.id===
          p.castleId
      );

    if(
      castle &&
      castle.hp>0 &&
      p.points.length>1
    ){

      paths.push(p);
    }
  }

  if(
    currentRoadCastleId!==null &&
    roadPoints.length>1 &&
    roadConnected()
  ){

    const exists=
      paths.some(
        p=>
          p.castleId===
          currentRoadCastleId
      );

    if(!exists){

      const castle=
        castles.find(
          c=>
            c.id===
            currentRoadCastleId
        );

      if(
        castle &&
        castle.hp>0
      ){

        paths.push({

          castleId:
            currentRoadCastleId,

          points:
            roadPoints

        });
      }
    }
  }

  return paths;
}

function getRoadPathForCastle(id){

  if(id===1){
    return getInitialRoad();
  }

  if(
    id===currentRoadCastleId &&
    roadPoints.length>1
  ){

    return roadPoints;
  }

  const found=
    roadPaths.find(
      p=>
        p.castleId===id
    );

  return found?
    found.points:
    null;
}

function pointNearRoad(x,y){

  const all=[];

  const initial=
    getInitialRoad();

  if(initial.length>1){
    all.push(initial);
  }

  for(const p of roadPaths){
    if(p.points.length>1){
      all.push(p.points);
    }
  }

  if(roadPoints.length>1){
    all.push(roadPoints);
  }

  for(const path of all){

    for(let i=0;i<path.length-1;i++){

      const a=path[i];
      const b=path[i+1];

      const dx=b.x-a.x;
      const dy=b.y-a.y;

      const len2=
        dx*dx+
        dy*dy;

      if(len2===0)continue;

      let t=
        (
          (x-a.x)*dx+
          (y-a.y)*dy
        )/
        len2;

      t=clamp(
        t,
        0,
        1
      );

      const px=
        a.x+
        t*dx;

      const py=
        a.y+
        t*dy;

      if(
        Math.hypot(
          x-px,
          y-py
        )<27
      ){

        return true;
      }
    }
  }

  return false;
}

function validTowerPlacement(x,y){

  if(
    x<-10000||
    x>10000||
    y<-10000||
    y>10000
  ){

    return false;
  }

  if(pointNearRoad(x,y)){
    return false;
  }

  for(const tower of towers){

    if(
      Math.hypot(
        x-tower.x,
        y-tower.y
      )<48
    ){

      return false;
    }
  }

  for(const castle of castles){

    if(
      castle.hp>0 &&
      Math.hypot(
        x-castle.x,
        y-castle.y
      )<70
    ){

      return false;
    }
  }

  for(const base of enemyBases){

    if(
      Math.hypot(
        x-base.x,
        y-base.y
      )<80
    ){

      return false;
    }
  }

  return true;
}

function addTower(type,x,y){

  const data=towerTypes[type];

  if(!data)return;

  if(!unlockedTowers.includes(type))return;

  if(money<data.cost)return;

  if(!validTowerPlacement(x,y))return;

  money-=data.cost;

  towers.push({

    x,
    y,
    type,
    level:1,
    damage:data.damage,
    range:data.range,
    fireRate:data.fireRate,
    cooldown:0,
    angle:0,
    flash:0
  });

  selectedTower=
    towers[
      towers.length-1
    ];

  moneyText();
  showTowerInfo();
}

function upgradeSelected(){

  if(!selectedTower)return;

  const cost=
    getUpgradeCost(
      selectedTower.level
    );

  if(money<cost)return;

  money-=cost;

  const oldLevel=
    selectedTower.level;

  selectedTower.level++;

  const multiplier=
    oldLevel<10
    ?1.12
    :1.08;

  selectedTower.damage=
    Math.round(
      selectedTower.damage*
      multiplier
    );

  selectedTower.range+=
    oldLevel<10
    ?6
    :5;

  selectedTower.fireRate=
    Math.max(
      110,
      Math.round(
        selectedTower.fireRate*
        (
          oldLevel<10
          ?.96
          :.975
        )
      )
    );

  moneyText();
  showTowerInfo();
}

function sellSelected(){

  if(!selectedTower)return;

  const data=
    towerTypes[
      selectedTower.type
    ];

  const refund=
    Math.floor(
      data.cost*
      .6*
      selectedTower.level
    );

  money+=refund;

  towers=
    towers.filter(
      t=>t!==selectedTower
    );

  selectedTower=null;

  moneyText();
  showTowerInfo();
}

function showTowerInfo(){

  const info=
    document.getElementById(
      "info"
    );

  if(!selectedTower){

    info.textContent=
      "Click empty land to build • Click a tower for stats";

    return;
  }

  const t=selectedTower;

  const nextMultiplier=
    t.level<10
    ?1.12
    :1.08;

  const nextDamage=
    Math.round(
      t.damage*
      nextMultiplier
    );

  const nextRange=
    t.range+
    (
      t.level<10
      ?6
      :5
    );

  const nextFire=
    Math.max(
      110,
      Math.round(
        t.fireRate*
        (
          t.level<10
          ?.96
          :.975
        )
      )
    );

  info.innerHTML=
    `<b>${towerTypes[t.type].name}</b>
     LVL ${t.level}
     • DMG ${t.damage}
     • RANGE ${t.range}
     • RATE ${t.fireRate}ms
     • ${towerTypes[t.type].ability}
     • NEXT: $${getUpgradeCost(t.level)}
     (${nextDamage} DMG / ${nextRange} RNG / ${nextFire}ms)`;
}

function unlockTowerForKingdom(){

  const index=
    Math.min(
      towerOrder.length-1,
      kingdom
    );

  const type=
    towerOrder[index];

  if(
    !unlockedTowers.includes(type)
  ){

    unlockedTowers.push(type);
  }

  updateTowerButtons();
}

function updateTowerButtons(){

  document
    .querySelectorAll(".towerBtn")
    .forEach(btn=>{

      const type=
        btn.dataset.tower;

      const data=
        towerTypes[type];

      const index=
        towerOrder.indexOf(type);

      const unlocked=
        unlockedTowers.includes(type);

      btn.disabled=!unlocked;

      if(unlocked){

        btn.innerHTML=
          `${index+1} ${data.name}<br>
           <span class="small">$${data.cost}</span>`;

      }else{

        btn.innerHTML=
          `${index+1} ${data.name}<br>
           <span class="lock">LOCKED</span>`;
      }
    });
}

function startGame(){

  running=true;
  paused=false;

  money=300;
  wave=1;
  kingdom=1;

  castles=[];

  towers=[];
  enemies=[];
  troops=[];
  bullets=[];
  effects=[];

  selectedTower=null;
  selectedTowerType=null;

  roadMode=false;
  roadPoints=[];
  roadPaths=[];
  currentRoadCastleId=null;

  enemyBases=[];

  /*
    Start with the original castle
    and original enemy base.
  */

  castles=[{
    id:1,
    x:250,
    y:325,
    hp:1000,
    maxHp:1000
  }];

  createEnemyBase(
    1,
    1050,
    325
  );

  cameraX=0;
  cameraY=0;

  unlockedTowers=[
    "basic",
    "rapid"
  ];

  waveRunning=false;
  waveTimer=2500;
  spawnLeft=0;
  spawnTimer=0;

  updateTowerButtons();
  updateCastleButtons();
  moneyText();

  document
    .getElementById("overlay")
    .classList.add("hidden");

  lastTime=
    performance.now();

  startLoop();
}

function startLoop(){

  if(window.gameLoopStarted)return;

  window.gameLoopStarted=true;

  requestAnimationFrame(
    gameLoop
  );
}

function gameLoop(now){

  const dt=
    Math.min(
      100,
      now-lastTime
    );

  lastTime=now;

  if(
    running &&
    !paused &&
    !document.hidden
  ){

    update(dt);
  }

  draw();

  requestAnimationFrame(
    gameLoop
  );
}

function update(dt){

  updateWaves(dt);
  updateTowers(dt);
  updateEnemies(dt);
  updateTroops(dt);
  updateBullets(dt);
  updateEffects(dt);

  autosaveTimer+=dt;

  if(
    autosaveTimer>=30000
  ){

    autosaveTimer=0;
    autosaveGame();
  }

  moneyText();
}

function updateWaves(dt){

  if(waveRunning){

    if(spawnLeft>0){

      spawnTimer-=dt;

      if(spawnTimer<=0){

        spawnEnemy();

        spawnLeft--;

        spawnTimer=
          Math.max(
            360,
            1050-wave*3
          );
      }
    }

    if(
      spawnLeft<=0 &&
      enemies.length===0
    ){

      waveRunning=false;

      const reward=
        80+
        Math.floor(wave*7)+
        kingdom*30;

      money+=reward;

      /*
        NEW CASTLE EVERY 10 WAVES.
        Enemy bases never increase.
      */

      if(
        wave>0 &&
        wave%10===0
      ){

        conquerKingdom();

      }else{

        wave++;

        waveTimer=5000;
      }
    }

    return;
  }

  waveTimer-=dt;

  if(waveTimer>0)return;

  startWave();
}

function startWave(){

  waveRunning=true;

  /*
    The enemy army grows every wave.
    There are no extra enemy bases.
  */
  spawnLeft=
    Math.max(
      8,
      Math.floor(
        10+
        wave*1.25+
        kingdom*2
      )
    );

  spawnTimer=0;
}

function chooseEnemyType(){

  const r=Math.random();

  if(wave<10){

    return r<.5
      ?"spearmen"
      :"crossbowmen";
  }

  if(wave<20){

    return r<.45
      ?"crossbowmen"
      :"guards";
  }

  if(wave<40){

    return r<.5
      ?"guards"
      :"mages";
  }

  if(wave<80){

    return r<.4
      ?"guards"
      :"mages";
  }

  return r<.35
    ?"guards"
    :"mages";
}

function spawnEnemy(){

  const paths=
    getActiveRoadPaths();

  if(paths.length===0)return;

  const path=
    paths[
      Math.floor(
        Math.random()*
        paths.length
      )
    ];

  if(path.points.length<2)return;

  const type=
    chooseEnemyType();

  const baseHP={

    spearmen:150,
    crossbowmen:125,
    guards:280,
    mages:210

  }[type];

  const scale=
    1+
    wave*.055+
    kingdom*.14+
    Math.max(
      0,
      wave-30
    )*.025+
    Math.max(
      0,
      wave-80
    )*.018;

  const hp=
    Math.round(
      baseHP*scale
    );

  enemies.push({

    type,

    x:
      path.points[
        path.points.length-1
      ].x,

    y:
      path.points[
        path.points.length-1
      ].y,

    hp,
    maxHp:hp,

    speed:
      .032+
      Math.min(
        wave*.00012,
        .018
      ),

    path,

    pathIndex:
      path.points.length-1,

    pathCastleId:
      path.castleId,

    slowUntil:0,
    freezeUntil:0,
    poisonUntil:0,
    poisonTick:0,
    burnUntil:0,
    burnTick:0,

    weak:1,

    hitTimer:0
  });
}

function damageCastle(enemy,castle){

  if(!castle || castle.hp<=0)return;

  const damage=
    Math.max(
      1,
      Math.round(enemy.hp)
    );

  castle.hp-=damage;

  effects.push({

    type:"hit",
    x:castle.x,
    y:castle.y,
    life:500
  });

  if(castle.hp<=0){

    castle.hp=0;

    effects.push({

      type:"fall",
      x:castle.x,
      y:castle.y,
      life:1200
    });
  }

  enemies=
    enemies.filter(
      e=>e!==enemy
    );

  checkCastleDefeat();
}

function checkCastleDefeat(){

  if(
    castles.every(
      c=>c.hp<=0
    )
  ){

    endGame();
  }
}

function updateEnemies(dt){

  const now=
    performance.now();

  for(
    const enemy of [...enemies]
  ){

    if(
      !enemies.includes(enemy)
    )continue;

    if(
      enemy.poisonUntil>now
    ){

      enemy.poisonTick-=dt;

      if(
        enemy.poisonTick<=0
      ){

        enemy.hp-=
          Math.max(
            1,
            enemy.maxHp*.025
          );

        enemy.poisonTick=500;

        effects.push({

          type:"poison",
          x:enemy.x,
          y:enemy.y,
          life:250
        });
      }
    }

    if(
      enemy.burnUntil>now
    ){

      enemy.burnTick-=dt;

      if(
        enemy.burnTick<=0
      ){

        enemy.hp-=
          Math.max(
            1,
            enemy.maxHp*.018
          );

        enemy.burnTick=350;
      }
    }

    if(enemy.hp<=0){

      killEnemy(enemy);
      continue;
    }

    let speed=enemy.speed;

    if(
      enemy.slowUntil>now
    ){
      speed*=.55;
    }

    if(
      enemy.freezeUntil>now
    ){
      speed=0;
    }

    let remaining=
      speed*dt;

    while(
      remaining>0 &&
      enemy.pathIndex>0
    ){

      const target=
        enemy.path.points[
          enemy.pathIndex-1
        ];

      const dx=
        target.x-enemy.x;

      const dy=
        target.y-enemy.y;

      const d=
        Math.hypot(
          dx,
          dy
        );

      if(d<=remaining){

        enemy.x=target.x;
        enemy.y=target.y;

        enemy.pathIndex--;

        remaining-=d;

      }else{

        enemy.x+=
          dx/d*remaining;

        enemy.y+=
          dy/d*remaining;

        remaining=0;
      }
    }

    if(
      enemy.pathIndex<=0
    ){

      const castle=
        castles.find(
          c=>
            c.id===
              enemy.pathCastleId &&
            c.hp>0
        );

      if(castle){

        damageCastle(
          enemy,
          castle
        );
      }
    }
  }
}

function killEnemy(enemy){

  if(!enemies.includes(enemy))return;

  enemies=
    enemies.filter(
      e=>e!==enemy
    );

  money+=15;

  effects.push({

    type:"kill",
    x:enemy.x,
    y:enemy.y,
    life:500
  });
}

function getNearestEnemy(tower){

  let best=null;
  let bestD=Infinity;

  for(
    const enemy of enemies
  ){

    const d=
      distance(
        tower,
        enemy
      );

    if(
      d<=tower.range &&
      d<bestD
    ){

      best=enemy;
      bestD=d;
    }
  }

  return best;
}

function guardianBoost(tower){

  if(
    tower.type==="guardian"
  ){
    return 1;
  }

  for(
    const other of towers
  ){

    if(
      other.type==="guardian" &&
      distance(
        tower,
        other
      )<180
    ){

      return 1.15;
    }
  }

  return 1;
}

function updateTowers(dt){

  for(
    const tower of towers
  ){

    tower.cooldown-=dt;

    tower.flash=
      Math.max(
        0,
        tower.flash-dt
      );

    const target=
      getNearestEnemy(
        tower
      );

    if(!target)continue;

    tower.angle=
      Math.atan2(
        target.y-tower.y,
        target.x-tower.x
      );

    if(
      tower.cooldown>0
    )continue;

    fireTower(
      tower,
      target
    );

    tower.cooldown=
      tower.fireRate/
      guardianBoost(tower);
  }
}

function fireTower(
  tower,
  target
){

  const multiplier=
    guardianBoost(tower);

  tower.flash=100;

  if(
    tower.type==="laser"
  ){

    target.hp-=
      tower.damage*
      multiplier;

    effects.push({

      type:"laser",

      x1:tower.x,
      y1:tower.y,

      x2:target.x,
      y2:target.y,

      life:120
    });

    if(
      target.hp<=0
    ){

      killEnemy(target);
    }

    return;
  }

  if(
    tower.type==="tesla"
  ){

    const hit=[];

    let current=target;

    for(let i=0;i<4;i++){

      if(!current)break;

      if(
        hit.includes(current)
      )break;

      hit.push(current);

      current.hp-=
        tower.damage*
        multiplier;

      effects.push({

        type:"electric",

        x1:
          i===0
          ?tower.x
          :hit[i-1].x,

        y1:
          i===0
          ?tower.y
          :hit[i-1].y,

        x2:current.x,
        y2:current.y,

        life:180
      });

      let next=null;
      let best=130;

      for(
        const enemy of enemies
      ){

        if(
          hit.includes(enemy)
        )continue;

        const d=
          distance(
            current,
            enemy
          );

        if(d<best){

          best=d;
          next=enemy;
        }
      }

      current=next;
    }

    for(
      const enemy of hit
    ){

      if(
        enemy.hp<=0
      ){

        killEnemy(enemy);
      }
    }

    return;
  }

  bullets.push({

    x:tower.x,
    y:tower.y,

    target,

    damage:
      tower.damage*
      multiplier,

    type:tower.type,

    speed:
      tower.type==="sniper"||
      tower.type==="ballista"
      ?1
      :.55
  });
}

function updateBullets(dt){

  for(
    const bullet of [...bullets]
  ){

    if(
      !bullet.target ||
      !enemies.includes(
        bullet.target
      )
    ){

      bullets=
        bullets.filter(
          b=>b!==bullet
        );

      continue;
    }

    const target=
      bullet.target;

    const dx=
      target.x-bullet.x;

    const dy=
      target.y-bullet.y;

    const d=
      Math.hypot(dx,dy);

    const move=
      Math.max(
        8,
        .65*
        dt*
        bullet.speed
      );

    if(d<=move){

      hitEnemy(
        bullet,
        target
      );

      bullets=
        bullets.filter(
          b=>b!==bullet
        );

    }else{

      bullet.x+=
        dx/d*move;

      bullet.y+=
        dy/d*move;
    }
  }
}

function hitEnemy(
  bullet,
  target
){

  if(
    !enemies.includes(target)
  )return;

  const damage=
    bullet.damage*
    (target.weak||1);

  target.hp-=damage;

  const type=
    bullet.type;

  if(type==="slow"){

    target.slowUntil=
      performance.now()+
      1000;
  }

  if(type==="freeze"){

    target.freezeUntil=
      performance.now()+
      2200;
  }

  if(type==="ice"){

    target.slowUntil=
      performance.now()+
      1800;
  }

  if(type==="poison"){

    target.poisonUntil=
      performance.now()+
      5000;

    target.poisonTick=0;
  }

  if(type==="flame"){

    target.burnUntil=
      performance.now()+
      4000;

    target.burnTick=0;
  }

  if(type==="void"){

    target.weak=.7;
  }

  if(
    type==="splash"||
    type==="mortar"||
    type==="catapult"||
    type==="meteor"
  ){

    const radius=
      type==="meteor"
      ?110
      :type==="catapult"
      ?90
      :65;

    for(
      const enemy of [...enemies]
    ){

      if(
        distance(
          target,
          enemy
        )<=radius
      ){

        enemy.hp-=
          damage*
          (
            enemy===target
            ?1
            :.55
          );
      }
    }

    effects.push({

      type:"explosion",

      x:target.x,
      y:target.y,

      life:350,
      radius
    });
  }

  if(
    type==="ballista"
  ){

    const index=
      target.pathIndex;

    for(
      const enemy of [...enemies]
    ){

      if(
        enemy!==target &&
        enemy.pathCastleId===
          target.pathCastleId &&
        Math.abs(
          enemy.pathIndex-index
        )<=1
      ){

        enemy.hp-=
          damage*.45;
      }
    }
  }

  if(target.hp<=0){

    killEnemy(target);
  }
}

function updateTroops(dt){

  for(
    const troop of [...troops]
  ){

    if(troop.hp<=0){

      troops=
        troops.filter(
          t=>t!==troop
        );

      continue;
    }

    troop.attackCooldown-=dt;
    troop.contactCooldown-=dt;

    const nearby=
      enemies
        .filter(
          e=>
            e.pathCastleId===
            troop.castleId
        )
        .sort(
          (a,b)=>
            distance(
              troop,
              a
            )-
            distance(
              troop,
              b
            )
        )[0];

    if(
      nearby &&
      distance(
        troop,
        nearby
      )<220
    ){

      const d=
        distance(
          troop,
          nearby
        );

      if(d>55){

        const dx=
          nearby.x-troop.x;

        const dy=
          nearby.y-troop.y;

        const len=
          Math.hypot(
            dx,
            dy
          );

        troop.x+=
          dx/len*
          troop.speed*
          dt;

        troop.y+=
          dy/len*
          troop.speed*
          dt;

      }else{

        if(
          troop.attackCooldown<=0
        ){

          nearby.hp-=
            troop.damage;

          troop.attackCooldown=700;

          effects.push({

            type:"hit",

            x:nearby.x,
            y:nearby.y,

            life:200
          });

          if(
            nearby.hp<=0
          ){

            killEnemy(
              nearby
            );
          }
        }

        if(
          nearby &&
          troop.contactCooldown<=0
        ){

          troop.hp-=
            Math.max(
              4,
              nearby.maxHp*.008
            );

          troop.contactCooldown=900;
        }
      }

      continue;
    }

    const path=
      getRoadPathForCastle(
        troop.castleId
      );

    if(!path)continue;

    const nextIndex=
      troop.pathIndex+1;

    if(
      nextIndex>=path.length
    ){
      continue;
    }

    const target=
      path[nextIndex];

    const dx=
      target.x-troop.x;

    const dy=
      target.y-troop.y;

    const d=
      Math.hypot(
        dx,
        dy
      );

    const move=
      troop.speed*dt;

    if(d<=move){

      troop.x=target.x;
      troop.y=target.y;

      troop.pathIndex++;

    }else{

      troop.x+=
        dx/d*move;

      troop.y+=
        dy/d*move;
    }
  }
}

function updateEffects(dt){

  for(
    const e of effects
  ){
    e.life-=dt;
  }

  effects=
    effects.filter(
      e=>e.life>0
    );
}

function updateCastleButtons(){

  const bar=
    document.getElementById(
      "castlebar"
    );

  bar.innerHTML="";

  for(
    const castle of castles
  ){

    if(castle.hp<=0)continue;

    const title=
      document.createElement(
        "span"
      );

    title.textContent=
      `CASTLE ${castle.id}: `;

    bar.appendChild(title);

    troopOrder.forEach(
      (type,index)=>{

        const data=
          troopTypes[type];

        const btn=
          document.createElement(
            "button"
          );

        btn.textContent=
          `${index+1} ${data.name} $${data.cost}`;

        btn.disabled=
          money<data.cost;

        btn.onclick=()=>{

          spawnTroop(
            castle,
            type
          );
        };

        bar.appendChild(btn);
      }
    );

    bar.appendChild(
      document.createElement(
        "br"
      )
    );
  }
}

function spawnTroop(
  castle,
  type
){

  const data=
    troopTypes[type];

  if(money<data.cost)return;

  const path=
    getRoadPathForCastle(
      castle.id
    );

  if(!path)return;

  money-=data.cost;

  troops.push({

    type,

    castleId:
      castle.id,

    x:
      castle.x+18,

    y:
      castle.y,

    hp:data.hp,
    maxHp:data.hp,

    damage:data.damage,
    speed:data.speed,

    path,

    pathIndex:0,

    attackCooldown:0,
    contactCooldown:0
  });

  updateCastleButtons();
  moneyText();
}

function startRoad(){

  if(kingdom===1){
    return;
  }

  if(
    roadPoints.length===0
  ){

    const castle=
      castles.find(
        c=>
          c.id===
          currentRoadCastleId
      );

    if(!castle)return;

    roadPoints=[{

      x:castle.x,
      y:castle.y

    }];
  }

  roadMode=true;
}

function addRoadPoint(x,y){

  if(!roadMode)return;

  const last=
    roadPoints[
      roadPoints.length-1
    ];

  if(
    Math.hypot(
      x-last.x,
      y-last.y
    )<30
  ){
    return;
  }

  if(
    Math.hypot(
      x-last.x,
      y-last.y
    )>190
  ){
    return;
  }

  /*
    Don't let a road be built
    directly through another castle.
  */

  for(const castle of castles){

    if(
      castle.id!==currentRoadCastleId &&
      castle.hp>0 &&
      distance(
        {x,y},
        castle
      )<55
    ){

      return;
    }
  }

  roadPoints.push({
    x,
    y
  });

  const target=
    getRoadTarget();

  if(
    target &&
    distance(
      {
        x,
        y
      },
      target
    )<65
  ){

    roadPoints.push({

      x:target.x,
      y:target.y

    });

    roadMode=false;

    waveTimer=2500;
  }
}

/* =====================================================
   FIXED CONQUEST SYSTEM
===================================================== */

function saveCurrentRoad(){

  if(
    currentRoadCastleId===null ||
    roadPoints.length<2
  ){
    return;
  }

  const savedPoints=
    roadPoints.map(
      p=>({
        x:p.x,
        y:p.y
      })
    );

  const existing=
    roadPaths.find(
      p=>p.castleId===currentRoadCastleId
    );

  if(existing){
    existing.points=savedPoints;
  }else{
    roadPaths.push({
      castleId:currentRoadCastleId,
      points:savedPoints
    });
  }
}

function conquerKingdom(){

  /*
    A new castle is added every 10 waves.
    Only ONE castle is added each time.
    Enemy bases stay exactly the same.
  */

  /*
    IMPORTANT: preserve the current castle's road
    before switching roadPoints to the new castle.
    This keeps Castle 2's road when Castle 3 appears,
    and so on for every castle.
  */
  saveCurrentRoad();

  const id=
    castles.length+1;

  addCastle(id);

  kingdom++;

  money+=
    250+
    kingdom*75;

  unlockTowerForKingdom();

  /*
    The new castle becomes the active castle for
    building a new road, but every older road is
    already stored in roadPaths and remains visible.
  */

  currentRoadCastleId=id;

  const castle=
    castles.find(
      c=>c.id===id
    );

  if(castle){

    roadPoints=[{
      x:castle.x,
      y:castle.y
    }];
  }else{
    roadPoints=[];
  }

  roadMode=false;
  waveRunning=false;

  /*
    Move to the next wave immediately.
  */
  wave++;
  waveTimer=5000;

  updateCastleButtons();
  moneyText();
}

/* =====================================================
   DRAWING
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  ctx.translate(
    -cameraX,
    -cameraY
  );

  drawLand();
  drawRoad();
  drawGate();
  drawPlacement();
  drawCastles();
  drawTowers();
  drawEnemies();
  drawTroops();
  drawBullets();
  drawEffects();

  ctx.restore();

  drawWaveText();
}

function drawLand(){

  const left=
    Math.floor(
      cameraX/40
    )*40-400;

  const right=
    cameraX+
    canvas.width+
    400;

  const top=
    Math.floor(
      cameraY/40
    )*40-400;

  const bottom=
    cameraY+
    canvas.height+
    400;

  ctx.fillStyle="#090909";

  ctx.fillRect(
    left,
    top,
    right-left,
    bottom-top
  );

  ctx.strokeStyle="#151515";
  ctx.lineWidth=1;

  for(
    let x=left;
    x<=right;
    x+=40
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      top
    );

    ctx.lineTo(
      x,
      bottom
    );

    ctx.stroke();
  }

  for(
    let y=top;
    y<=bottom;
    y+=40
  ){

    ctx.beginPath();

    ctx.moveTo(
      left,
      y
    );

    ctx.lineTo(
      right,
      y
    );

    ctx.stroke();
  }
}

function drawRoad(){

  const paths=[];

  const initial=
    getInitialRoad();

  if(initial.length>1){
    paths.push(initial);
  }

  for(
    const p of roadPaths
  ){

    if(p.points.length>1){
      paths.push(p.points);
    }
  }

  if(
    roadPoints.length>1
  ){

    paths.push(roadPoints);
  }

  for(
    const path of paths
  ){

    ctx.strokeStyle="#292929";
    ctx.lineWidth=34;

    ctx.beginPath();

    path.forEach(
      (p,i)=>{

        if(i===0){

          ctx.moveTo(
            p.x,
            p.y
          );

        }else{

          ctx.lineTo(
            p.x,
            p.y
          );
        }
      }
    );

    ctx.stroke();

    ctx.strokeStyle="#444";
    ctx.lineWidth=2;

    ctx.beginPath();

    path.forEach(
      (p,i)=>{

        if(i===0){

          ctx.moveTo(
            p.x,
            p.y
          );

        }else{

          ctx.lineTo(
            p.x,
            p.y
          );
        }
      }
    );

    ctx.stroke();
  }

  if(
    roadMode &&
    roadPoints.length
  ){

    const p=
      roadPoints[
        roadPoints.length-1
      ];

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

    const target=
      getRoadTarget();

    if(target){

      ctx.strokeStyle=
        "rgba(255,255,255,.2)";

      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.arc(
        target.x,
        target.y,
        65,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }
  }
}

function drawCastles(){

      );

      ctx.lineTo(

        castle.y+25
      );

      ctx.moveTo(
        castle.x+25,
        castle.y-25
      );

      ctx.lineTo(
        castle.x-25,
        castle.y+25
      );

      ctx.stroke();

      continue;
    }

    ctx.fillStyle=
      castle.id===1

      castle.x-27,
      castle.y-27,
      54,
      54
    );

    ctx.fillStyle="#111";

    ctx.fillRect(
      castle.x-9,
      castle.y-10,
      18,
      37
    );

    ctx.fillStyle="#777";

    for(
      let i=-2;
      i<=2;
      i++
    ){

      ctx.fillRect(
        castle.x+
        i*12-
        4,

        castle.y-36,

        10
      );
    }

    ctx.strokeStyle="#eee";

    ctx.strokeRect(
      castle.x-27,
      castle.y-27,
      54,
      54
    );

    );

    );

function drawTowers(){

  for(
    const tower of towers
  ){

    const data=
      towerTypes[
        tower.type
      ];

    ctx.save();

    ctx.translate(
      tower.x,
      tower.y
    );

    ctx.fillStyle=
      data.color;

    if(
      tower.type==="heavy"||
      tower.type==="mortar"||
      tower.type==="catapult"
    ){

      ctx.fillRect(
        -22,
        -22,
        44,
        44
      );

    }else if(
      tower.type==="sniper"||
      tower.type==="ballista"
    ){

      ctx.fillRect(
        -16,
        -16,
        32,
        32
      );

      ctx.strokeStyle="#111";
      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.moveTo(
        -14,
        -14
      );

      ctx.lineTo(
        14,
        14
      );

      ctx.moveTo(
        14,
        -14
      );

      ctx.lineTo(
        -14,
        14
      );

      ctx.stroke();

    }else if(
      tower.type==="king"
    ){

      ctx.beginPath();

      ctx.moveTo(
        -23,
        18
      );

      ctx.lineTo(
        -18,
        -18
      );

      ctx.lineTo(
        -7,
        -8
      );

      ctx.lineTo(
        0,
        -25
      );

      ctx.lineTo(
        8,
        -8
      );

      ctx.lineTo(
        19,
        -18
      );

      ctx.lineTo(
        23,
        18
      );

      ctx.closePath();

      ctx.fill();

    }else if(
      tower.type==="guardian"
    ){

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        23,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle="#111";
      ctx.lineWidth=3;

      ctx.stroke();

    }else{

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        19,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    ctx.rotate(
      tower.angle
    );

    ctx.fillStyle="#111";

    ctx.fillRect(
      0,
      -4,
      tower.type==="sniper"||
      tower.type==="ballista"
      ?38
      :28,
      8
    );

    ctx.restore();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
      tower.x,
      tower.y,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();

    if(
      selectedTower===tower
    ){

      ctx.strokeStyle=
        "rgba(255,255,255,.3)";

      ctx.lineWidth=1;

      ctx.beginPath();

      ctx.arc(
        tower.x,
        tower.y,
        tower.range,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    if(tower.flash>0){

      ctx.fillStyle="#fff";

      ctx.beginPath();

      ctx.arc(
        tower.x+
          Math.cos(
            tower.angle
          )*34,

        tower.y+
          Math.sin(
            tower.angle
          )*34,

        8,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    ctx.fillStyle="#fff";
    ctx.font=
      "bold 9px Courier New";

    ctx.fillText(
      tower.level,
      tower.x-3,
      tower.y+3
    );
  }
}

function drawEffects(){

  for(
    const e of effects
  ){

    if(
      e.type==="laser"
    ){

      ctx.strokeStyle=
        "rgba(255,255,255,"+
        Math.min(
          1,
          e.life/120
        )+
        ")";

      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.moveTo(
        e.x1,
        e.y1
      );

      ctx.lineTo(
        e.x2,
        e.y2
      );

      ctx.stroke();
    }

    if(
      e.type==="electric"
    ){

      ctx.strokeStyle=
        "rgba(160,200,255,"+
        Math.min(
          1,
          e.life/180
        )+
        ")";

      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.moveTo(
        e.x1,
        e.y1
      );

      ctx.lineTo(
        e.x2,
        e.y2
      );

      ctx.stroke();
    }

    if(
      e.type==="explosion"
    ){

      const alpha=
        Math.max(
          0,
          e.life/350
        );

      ctx.strokeStyle=
        `rgba(255,255,255,${alpha})`;

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        e.radius*
        (
          1-alpha+.2
        ),
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    if(
      e.type==="hit"
    ){

      ctx.strokeStyle="#fff";

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        12*
        (
          1-
          e.life/500
        ),
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    if(
      e.type==="kill"
    ){

      ctx.strokeStyle="#aaa";

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        20*
        (
          1-
          e.life/500
        ),
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    if(
      e.type==="poison"
    ){

      ctx.strokeStyle="#6f6";

      ctx.beginPath();

      ctx.arc(
        e.x,
        e.y,
        8,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }

    if(
      e.type==="fall"
    ){

      ctx.strokeStyle="#777";
      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.moveTo(
        e.x-25,
        e.y-25
      );

      ctx.lineTo(
        e.x+25,
        e.y+25
      );

      ctx.moveTo(
        e.x+25,
        e.y-25
      );

      ctx.lineTo(
        e.x-25,
        e.y+25
      );

      ctx.stroke();
    }
  }
}

function rebuildMissingEnemyBases(){

  /*
    There is only ONE enemy base in the game.
    Older saves that contain extra bases are
    normalized back to the original base.
  */

  const first=
    enemyBases[0]||{
      id:1,
      x:1050,
      y:325
    };

  enemyBases=[{
    id:1,
    x:first.x,
    y:first.y
  }];
}

function loadData(data){

  running=true;
  paused=false;

  money=
    data.money??300;

  wave=
    data.wave??1;

  kingdom=
    data.kingdom??1;

  castles=
    data.castles||[];

  towers=
    data.towers||[];

  unlockedTowers=
    data.unlockedTowers||
    [
      "basic",
      "rapid"
    ];

    data.roadPoints||[];

    (

    data.cameraX??0;

  cameraY=
    data.cameraY??0;

  waveTimer=
    data.waveTimer??2500;

/* =====================================================
   MAP CAMERA
===================================================== */

function screenToWorld(e){

  const rect=
    canvas.getBoundingClientRect();

  const sx=
    (e.clientX-rect.left)*
    canvas.width/
    rect.width;

  const sy=
    (e.clientY-rect.top)*
    canvas.height/
    rect.height;

  return {

    x:sx+cameraX,
    y:sy+cameraY

  };
}

function updateMousePosition(e){

  const pos=
    screenToWorld(e);

  mouseX=pos.x;
  mouseY=pos.y;
}

canvas.addEventListener(
  "mousedown",
  e=>{

    updateMousePosition(e);

    draggingMap=true;
    dragMoved=false;

    dragStartX=e.clientX;
    dragStartY=e.clientY;

    dragCameraX=cameraX;
    dragCameraY=cameraY;

    canvas.classList.add(
      "dragging"
    );
  }
);

canvas.addEventListener(
  "mousemove",
  e=>{

    if(draggingMap){

      const rect=
        canvas.getBoundingClientRect();

      const dx=
        (
          e.clientX-
          dragStartX
        )*
        canvas.width/
        rect.width;

      const dy=
        (
          e.clientY-
          dragStartY
        )*
        canvas.height/
        rect.height;

      if(
        Math.abs(dx)>5||
        Math.abs(dy)>5
      ){

        dragMoved=true;
      }

      if(dragMoved){

        cameraX=
          dragCameraX-dx;

        cameraY=
          dragCameraY-dy;
      }
    }

    updateMousePosition(e);
  }
);

canvas.addEventListener(
  "mouseup",
  e=>{

    updateMousePosition(e);

    const wasDragged=
      dragMoved;

    draggingMap=false;

    canvas.classList.remove(
      "dragging"
    );

    if(!wasDragged){

      handleWorldClick(
        mouseX,
        mouseY
      );
    }
  }
);

canvas.addEventListener(
  "mouseleave",
  ()=>{
    draggingMap=false;

    canvas.classList.remove(
      "dragging"
    );
  }
);

function handleWorldClick(
  x,
  y
){

  if(roadMode){

    addRoadPoint(
      x,
      y
    );

    return;
  }

  let clicked=null;

  for(
    const tower of towers
  ){

    if(
      Math.hypot(
        x-tower.x,
        y-tower.y
      )<24
    ){

      clicked=tower;
      break;
    }
  }

  if(clicked){

    selectedTower=clicked;
    selectedTowerType=null;

    showTowerInfo();

    return;
  }

  if(selectedTowerType){

    addTower(
      selectedTowerType,
      x,
      y
    );

    return;
  }

  selectedTower=null;

  showTowerInfo();
}

/* =====================================================
   RRR HOME
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key.toLowerCase()==="r"
    ){

      const now=Date.now();

      if(
        now-rTimer>700
      ){

        rCount=0;
      }

      rCount++;
      rTimer=now;

      if(rCount>=3){

        rCount=0;

        goHome();
      }
    }
  }
);

/* =====================================================
   BACKGROUND / AUTOSAVE
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      autosaveGame();

      if(
        backgroundTimer===null
      ){

        backgroundTimer=
          setInterval(
            backgroundTick,
            1000
          );
      }

    }else{

      if(
        backgroundTimer!==null
      ){

        clearInterval(
          backgroundTimer
        );

        backgroundTimer=null;
      }

      lastTime=
        performance.now();
    }
  }
);

function backgroundTick(){

  if(
    !running||
    !document.hidden||
    paused
  ){
    return;
  }

  const now=
    performance.now();

  const dt=
    Math.min(
      5000,
      now-lastTime
    );

  lastTime=now;

  update(dt);

  autosaveGame();
}

updateTowerButtons();
updateCastleButtons();
