function updateButtons(){
document.querySelectorAll("#towerbar button").forEach(button=>{
const type=button.dataset.type;

button.classList.toggle(
"selected",
selectedTowerType===type
);

button.classList.toggle(
"locked",
!unlockedTowers.includes(type)
);
});
}

function unlockNextTower(){
const next=towerNames.find(
type=>!unlockedTowers.includes(type)
);

if(!next)return;

unlockedTowers.push(next);

);

updateButtons();
}

class Castle{
constructor(x,y,id){
this.x=x;
this.y=y;
this.id=id;

this.maxHp=1000;
this.hp=1000;

this.alive=true;

this.troops=[];
this.troopCooldown=0;
}
}

function createInitialCastle(){
castles=[
new Castle(180,325,1)
];

selectedCastle=castles[0];

generateAllRoads();
updateCastleBar();
}

function getEnemyBase(){
return{
x:1100,
y:325
};
}

function generateAllRoads(){
roads=[];

for(const castle of castles){
generateRoadForCastle(castle);
}
}

function generateRoadForCastle(castle){
const base=getEnemyBase();

roads.push({
castleId:castle.id,
points:generateRoad(
castle.x,
castle.y,
base.x,
base.y
)
});
}

function generateRoad(x1,y1,x2,y2){
const styles=[
"straight",
"zigzag",
"wide",
"steps",
"angled",
"zigzag",
"wide"
];

const style=
styles[Math.floor(Math.random()*styles.length)];

const points=[
{x:x1,y:y1}
];

if(style==="straight"){
points.push({
x:x2,
y:y2
});
}

if(style==="angled"){
const mx=x1+(x2-x1)*.45;

points.push({
x:mx,
y:y1
});

points.push({
x:mx,
y:y2
});

points.push({
x:x2,
y:y2
});
}

if(style==="zigzag"){
const count=6;

for(let i=1;i<count;i++){
const t=i/count;

const x=x1+(x2-x1)*t;
const y=y1+(y2-y1)*t;

const offset=
(i%2===0?1:-1)*
(35+Math.random()*50);

points.push({
x:x,
y:Math.max(55,
Math.min(H-55,y+offset))
});
}

points.push({
x:x2,
y:y2
});
}

if(style==="wide"){
const dx=x2-x1;
const dy=y2-y1;

const length=Math.hypot(dx,dy)||1;

const nx=-dy/length;
const ny=dx/length;

points.push({
x:x1+dx*.25+nx*80,
y:y1+dy*.25+ny*80
});

points.push({
x:x1+dx*.5-nx*100,
y:y1+dy*.5-ny*100
});

points.push({
x:x1+dx*.78+nx*65,
y:y1+dy*.78+ny*65
});

points.push({
x:x2,
y:y2
});
}

if(style==="steps"){
const count=6;

for(let i=1;i<count;i++){
const t=i/count;

points.push({
x:x1+(x2-x1)*t,
y:i%2===0?y1+90:y2-90
});
}

points.push({
x:x2,
y:y2
});
}

return points;
}

function getRoadForCastle(id){
return roads.find(
road=>road.castleId===id
);
}

function pointNearRoad(x,y,padding=30){
for(const road of roads){

for(let i=0;i<road.points.length-1;i++){

const a=road.points[i];
const b=road.points[i+1];

const dx=b.x-a.x;
const dy=b.y-a.y;

const len=dx*dx+dy*dy;

if(len===0)continue;

let t=
((x-a.x)*dx+
(y-a.y)*dy)/len;

t=Math.max(0,Math.min(1,t));

const px=a.x+dx*t;
const py=a.y+dy*t;

if(
Math.hypot(
x-px,
y-py
)<padding
){
return true;
}
}
}

return false;
}

function nearCastle(x,y){
return castles.some(
castle=>
Math.hypot(
x-castle.x,
y-castle.y
)<65
);
}

function placeTower(x,y){

if(gameOver||paused)return;

if(!unlockedTowers.includes(selectedTowerType)){
showMessage("TOWER LOCKED");
return;
}

if(pointNearRoad(x,y,34)){
showMessage("CANNOT BUILD ON ROAD");
return;
}

if(nearCastle(x,y)){
showMessage("TOO CLOSE TO CASTLE");
return;
}

if(
towers.some(
tower=>
Math.hypot(
tower.x-x,
tower.y-y
)<38
)
){
showMessage("TOO CLOSE");
return;
}

const data=towerTypes[selectedTowerType];

if(money<data.cost){
showMessage("NOT ENOUGH MONEY");
return;
}

money-=data.cost;

const tower={
x,
y,
type:selectedTowerType,
level:1,

damage:data.damage,
range:data.range,
rate:data.rate,
speed:data.speed,

color:data.color,

cooldown:0,

cost:data.cost,

kills:0
};

towers.push(tower);

selectedTower=tower;

showMessage(
data.name+" BUILT"
);
}

function upgradeSelectedTower(){

if(!selectedTower){
showMessage("SELECT A TOWER");
return;
}

const cost=
Math.floor(
selectedTower.cost*
(.75+
selectedTower.level*.55)
);

if(money<cost){
showMessage(
"UPGRADE COST $"+cost
);
return;
}

money-=cost;

selectedTower.level++;

selectedTower.damage*=1.3;
selectedTower.range*=1.08;
selectedTower.rate*=.91;

showMessage(
"UPGRADED TO LEVEL "+
selectedTower.level
);
}

function sellSelectedTower(){

if(!selectedTower){
showMessage("SELECT A TOWER");
return;
}

const value=
Math.floor(
selectedTower.cost*
(.55+
selectedTower.level*.15)
);

money+=value;

const index=
towers.indexOf(selectedTower);

if(index>=0){
towers.splice(index,1);
}

selectedTower=null;

showMessage(
"SOLD FOR $"+value
);
}

if(!selectedCastle){
showMessage("SELECT A CASTLE");
return;
}

const data=troopTypes[type];

if(money<data.cost){
showMessage("NOT ENOUGH MONEY");
return;
}

money-=data.cost;

selectedCastle.troops.push({
type:type,
hp:data.hp,
maxHp:data.hp,
damage:data.damage,
speed:data.speed,
range:data.range||0,
splash:data.splash||0,
x:selectedCastle.x,
y:selectedCastle.y,
target:null,
cooldown:0
});

showMessage(
data.name+" RECRUITED"
);
}

function spawnEnemy(){

if(!castles.length)return;

const aliveCastles=
castles.filter(
castle=>castle.alive
);

if(!aliveCastles.length)return;

const castle=
aliveCastles[
Math.floor(
Math.random()*aliveCastles.length
)
];

const road=
getRoadForCastle(castle.id);

if(!road)return;

const first=road.points[0];

let type="normal";

const roll=Math.random();

if(wave>=4&&roll<.18){
type="fast";
}

if(wave>=7&&roll<.13){
type="tank";
}

if(wave>=12&&roll<.08){
type="elite";
}

if(wave%10===0&&roll<.16){
type="boss";
}

let stats;

if(type==="normal"){
stats={
hp:70+wave*18,
speed:1.15+wave*.015,
reward:12+Math.floor(wave*.4),
size:10
};
}

if(type==="fast"){
stats={
hp:45+wave*11,
speed:1.95+wave*.018,
reward:16+Math.floor(wave*.5),
size:8
};
}

if(type==="tank"){
stats={
hp:250+wave*48,
speed:.63+wave*.007,
reward:35+wave,
size:15
};
}

if(type==="elite"){
stats={
hp:480+wave*70,
speed:1.05+wave*.01,
reward:65+wave*2,
size:18
};
}

if(type==="boss"){
stats={
hp:1100+wave*160,
speed:.42+wave*.004,
reward:180+wave*4,
size:25
};
}

enemies.push({
x:first.x,
y:first.y,

road:road,
segment:0,

type:type,

hp:stats.hp,
maxHp:stats.hp,

speed:stats.speed,
reward:stats.reward,
size:stats.size,

slow:1,

poison:0,
poisonTimer:0,

dead:false,

progress:0
});
}

function startWave(){

if(gameOver)return;

if(waveRunning){
showMessage("WAVE ALREADY RUNNING");
return;
}

if(castles.every(c=>!c.alive)){
endGame();
return;
}

waveRunning=true;

waveTotal=
8+
Math.floor(
wave*2.8
);

enemiesLeftToSpawn=waveTotal;

spawnTimer=0;

showMessage(
"WAVE "+wave+
" STARTED"
);
}

function finishWave(){

waveRunning=false;

money+=
35+
wave*6;

if(wave%10===0){
conquerKingdom();
}else{
wave++;
}

saveAuto();
}

function conquerKingdom(){

kingdom++;

const id=
castles.length+1;

let x;
let y;

let attempts=0;

do{

x=
330+
Math.random()*570;

y=
90+
Math.random()*470;

attempts++;

}while(
(
castles.some(
castle=>
Math.hypot(
castle.x-x,
castle.y-y
)<170
)
||
pointNearRoad(x,y,55)
)&&
attempts<100
);

const castle=
new Castle(
x,
y,
id
);

castles.push(castle);

generateRoadForCastle(castle);

unlockNextTower();

money+=
250+
kingdom*150;

wave++;

selectedCastle=castle;

updateCastleBar();

showMessage(
"KINGDOM "+
kingdom+
" CONQUERED!"
);
}

function killEnemy(enemy){

if(enemy.dead)return;

enemy.dead=true;

money+=enemy.reward;

kills++;

if(enemy.sourceTower){
enemy.sourceTower.kills++;
}

effects.push({
x:enemy.x,
y:enemy.y,
life:400,
max:400,
type:"death"
});
}

function reachCastle(enemy){

const castle=
castles.find(
c=>c.id===enemy.road.castleId
);

if(castle){

let damage=35;

if(enemy.type==="fast"){
damage=25;
}

if(enemy.type==="tank"){
damage=70;
}

if(enemy.type==="elite"){
damage=95;
}

if(enemy.type==="boss"){
damage=180;
}

castle.hp-=damage;

effects.push({
x:castle.x,
y:castle.y,
life:500,
max:500,
type:"castlehit"
});

if(castle.hp<=0){

castle.hp=0;
castle.alive=false;

castle.troops=[];

showMessage(
"CASTLE "+
castle.id+
" FALLEN"
);
}
}

enemy.dead=true;
}

function updateEnemies(dt){

for(
let i=enemies.length-1;
i>=0;
i--
){

const enemy=enemies[i];

if(enemy.dead){
enemies.splice(i,1);
continue;
}

if(enemy.poison>0){

enemy.poisonTimer+=dt;

if(enemy.poisonTimer>=500){

enemy.poisonTimer=0;

enemy.hp-=enemy.poison;
}
}

if(enemy.hp<=0){

killEnemy(enemy);
continue;
}

enemy.slow=
Math.min(
1,
enemy.slow+
dt*.00025
);

const road=enemy.road;

const next=
road.points[
enemy.segment+1
];

if(!next){

reachCastle(enemy);
continue;
}

const dx=next.x-enemy.x;
const dy=next.y-enemy.y;

const distance=Math.hypot(dx,dy);

const movement=
enemy.speed*
enemy.slow*
dt*.06;

if(distance<=movement){

enemy.x=next.x;
enemy.y=next.y;

enemy.segment++;

enemy.progress=enemy.segment;

if(
enemy.segment>=
road.points.length-1
){

reachCastle(enemy);
}
}else{

enemy.x+=
dx/distance*
movement;

enemy.y+=
dy/distance*
movement;

enemy.progress=
enemy.segment+
(1-
distance/
Math.max(
1,
Math.hypot(
road.points[
enemy.segment+1
].x-
road.points[
enemy.segment
].x,
road.points[
enemy.segment+1
].y-
road.points[
enemy.segment
].y
)
));
}
}
}

function findTowerTarget(tower){

let best=null;
let bestProgress=-Infinity;

for(const enemy of enemies){

if(enemy.dead)continue;

const d=
Math.hypot(
tower.x-enemy.x,
tower.y-enemy.y
);

if(
d<=tower.range &&
enemy.progress>bestProgress
){

best=enemy;
bestProgress=enemy.progress;
}
}

return best;
}

function updateTowers(dt){

for(const tower of towers){

if(tower.cooldown>0){
tower.cooldown-=dt;
}

if(tower.cooldown>0)continue;

const target=
findTowerTarget(tower);

if(!target)continue;

projectiles.push({
x:tower.x,
y:tower.y,

target:target,

damage:tower.damage,
speed:tower.speed,

color:tower.color,

splash:
towerTypes[tower.type].splash||0,

slow:
towerTypes[tower.type].slow||0,

poison:
towerTypes[tower.type].poison||0,

chain:
towerTypes[tower.type].chain||0,

sourceTower:tower
});

tower.cooldown=tower.rate;
}
}

function updateProjectiles(dt){

for(
let i=projectiles.length-1;
i>=0;
i--
){

const projectile=
projectiles[i];

if(
!projectile.target||
projectile.target.dead
){

projectiles.splice(i,1);
continue;
}

const target=
projectile.target;

const dx=target.x-projectile.x;
const dy=target.y-projectile.y;

const distance=
Math.hypot(dx,dy);

const movement=
projectile.speed*
dt*.08;

if(
distance<=movement+5
){

hitEnemy(
projectile,
target
);

projectiles.splice(i,1);

}else{

projectile.x+=
dx/distance*
movement;

projectile.y+=
dy/distance*
movement;
}
}
}

function hitEnemy(projectile,enemy){

enemy.hp-=
projectile.damage;

if(projectile.sourceTower){
projectile.sourceTower.kills++;
}

if(projectile.slow){
enemy.slow=
Math.min(
enemy.slow,
projectile.slow
);
}

if(projectile.poison){
enemy.poison=
Math.max(
enemy.poison,
projectile.poison
);
}

if(projectile.splash){

for(const other of enemies){

if(
other===enemy||
other.dead
)continue;

const d=
Math.hypot(
other.x-enemy.x,
other.y-enemy.y
);

if(
d<=projectile.splash
){

other.hp-=
projectile.damage*.45;

if(projectile.slow){
other.slow=
Math.min(
other.slow,
projectile.slow
);
}
}
}
}

if(projectile.chain){

let chains=
projectile.chain;

for(const other of enemies){

if(chains<=0)break;

if(
other===enemy||
other.dead
)continue;

const d=
Math.hypot(
other.x-enemy.x,
other.y-enemy.y
);

if(d<95){

other.hp-=
projectile.damage*.42;

chains--;
}
}
}

effects.push({
x:enemy.x,
y:enemy.y,
life:130,
max:130,
type:"hit"
});
}

function updateTroops(dt){

for(const castle of castles){

if(!castle.alive)continue;

for(let i=castle.troops.length-1;i>=0;i--){

const troop=
castle.troops[i];

if(troop.hp<=0){

castle.troops.splice(i,1);
continue;
}

if(troop.cooldown>0){
troop.cooldown-=dt;
}

let target=null;
let closest=Infinity;

for(const enemy of enemies){

if(enemy.dead)continue;

const d=
Math.hypot(
troop.x-enemy.x,
troop.y-enemy.y
);

if(
troop.range &&
d<=troop.range
){

if(d<closest){
closest=d;
target=enemy;
}

}else if(!troop.range){

if(d<closest){
closest=d;
target=enemy;
}
}
}

if(target){

if(
troop.range &&
troop.cooldown<=0
){

target.hp-=troop.damage;

if(troop.splash){

for(const other of enemies){

if(
other!==target&&
!other.dead&&
Math.hypot(
other.x-target.x,
other.y-target.y
)<=troop.splash
){

other.hp-=
troop.damage*.4;
}
}
}

troop.cooldown=
troop.type==="mages"?900:1000;

}else if(!troop.range){

const dx=
target.x-troop.x;

const dy=
target.y-troop.y;

const d=
Math.hypot(dx,dy);

if(d>20){

troop.x+=
dx/d*
troop.speed*
dt*.06;

troop.y+=
dy/d*
troop.speed*
dt*.06;

}else if(troop.cooldown<=0){

target.hp-=troop.damage;

troop.cooldown=600;
}
}
}
}
}
}

function updateWave(dt){

if(!waveRunning)return;

if(enemiesLeftToSpawn>0){

spawnTimer-=dt;

if(spawnTimer<=0){

spawnEnemy();

enemiesLeftToSpawn--;

spawnTimer=
Math.max(
130,
470-wave*8
);
}

}else if(enemies.length===0){

finishWave();
}
}

function updateEffects(dt){

for(
let i=effects.length-1;
i>=0;
i--
){

effects[i].life-=dt;

if(effects[i].life<=0){
effects.splice(i,1);
}
}
}

function update(dt){

if(paused||gameOver)return;

updateWave(dt);
updateEnemies(dt);
updateTowers(dt);
updateProjectiles(dt);
updateTroops(dt);
updateEffects(dt);

if(messageTimer>0){
messageTimer-=dt;
}

if(
castles.length>0&&
castles.every(c=>!c.alive)
){

endGame();
}
}

function drawBackground(){

ctx.fillStyle="#172419";
ctx.fillRect(0,0,W,H);

ctx.strokeStyle=
"rgba(255,255,255,.035)";

ctx.lineWidth=1;

for(let x=0;x<W;x+=40){

ctx.beginPath();
ctx.moveTo(x+cameraX%40,0);
ctx.lineTo(x+cameraX%40,H);
ctx.stroke();
}

for(let y=0;y<H;y+=40){

ctx.beginPath();
ctx.moveTo(0,y+cameraY%40);
ctx.lineTo(W,y+cameraY%40);
ctx.stroke();
}

for(let i=0;i<120;i++){

const x=
((i*137+
cameraX*.15)%W+W)%W;

const y=
((i*83+
cameraY*.12)%H+H)%H;

ctx.fillStyle=
"rgba(90,130,80,.13)";

ctx.fillRect(
x,
y,
3,
3
);
}
}

road.points[0].x,
road.points[0].y
);

let i=1;
i<road.points.length;
i++
){

road.points[i].x,
road.points[i].y
);

ctx.beginPath();

road.points[0].x,

);

let i=1;
i<road.points.length;
i++
){

);
}

"rgba(255,220,170,.16)";

ctx.lineWidth=2;

ctx.beginPath();

road.points[0].x,
road.points[0].y
);

let i=1;
i<road.points.length;
i++

}

function drawEffects(){

for(const effect of effects){

const alpha=
Math.max(
0,
effect.life/effect.max
);

ctx.save();

ctx.globalAlpha=alpha;

if(effect.type==="death"){

ctx.strokeStyle="#ffd54a";
ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(
effect.x,
effect.y,
30*(1-alpha),
0,
Math.PI*2
);

ctx.stroke();

}

if(effect.type==="hit"){

ctx.fillStyle="#fff";

ctx.beginPath();

ctx.arc(
effect.x,
effect.y,
3+8*(1-alpha),
0,
Math.PI*2
);

ctx.fill();
}

if(effect.type==="castlehit"){

ctx.strokeStyle="#ff5a5a";
ctx.lineWidth=4;

ctx.beginPath();

ctx.arc(
effect.x,
effect.y,
50*(1-alpha),
0,
Math.PI*2
);

ctx.stroke();
}

ctx.restore();
}
}

function saveData(){

return{

money,
wave,
kingdom,
kills,

selectedTowerType,

unlockedTowers:[
...unlockedTowers
],

towers:
towers.map(t=>({

type:t.type,
level:t.level,
damage:t.damage,
range:t.range,
rate:t.rate,
speed:t.speed,
color:t.color,
cooldown:t.cooldown,
cost:t.cost,
kills:t.kills
})),

castles:
castles.map(c=>({
x:c.x,
y:c.y,
id:c.id,
hp:c.hp,
maxHp:c.maxHp,
alive:c.alive,

troops:
c.troops.map(t=>({
type:t.type,
hp:t.hp,
maxHp:t.maxHp,
damage:t.damage,
speed:t.speed,
range:t.range,
splash:t.splash,

cooldown:t.cooldown
}))
})),

roads:
roads.map(r=>({
castleId:r.castleId,

}))
};
}

function restoreData(data){

if(!data)return;

money=
Number.isFinite(data.money)?
data.money:
300;

wave=
Number.isFinite(data.wave)?
data.wave:
1;

kingdom=
Number.isFinite(data.kingdom)?
data.kingdom:
1;

kills=
Number.isFinite(data.kills)?
data.kills:
0;

selectedTowerType=
data.selectedTowerType||
"basic";

unlockedTowers.length=0;

for(
const type of
data.unlockedTowers||
["basic","rapid"]
){

if(
towerTypes[type]&&
!unlockedTowers.includes(type)
){
unlockedTowers.push(type);
}
}

towers=
(data.towers||[]).map(t=>({
...t
}));

castles=
(data.castles||[]).map(c=>{

const castle=
new Castle(
c.x,
c.y,
c.id
);

castle.hp=c.hp;
castle.maxHp=c.maxHp;
castle.alive=c.alive;

castle.troops=
(c.troops||[]).map(t=>({
...t
}));

return castle;
});

roads=
(data.roads||[]).map(r=>({
castleId:r.castleId,
points:r.points
}));

enemies=[];
projectiles=[];
effects=[];

selectedTower=null;

selectedCastle=
castles[0]||
null;

waveRunning=false;
gameOver=false;

updateButtons();
updateCastleBar();
updateUI();
}

if(!raw){

showMessage(
"NO AUTOSAVE"
);

return;
}

localStorage.setItem(
"kingdomWarSlot1",
raw
);

showMessage(
"AUTOSAVE → SLOT 1"
);
}

canvas.addEventListener(
"mousemove",
event=>{

const rect=
canvas.getBoundingClientRect();

mouseX=
(event.clientX-rect.left)*
(canvas.width/rect.width);

mouseY=
(event.clientY-rect.top)*
(canvas.height/rect.height);

if(dragging){

const dx=
event.clientX-dragStartX;

const dy=
event.clientY-dragStartY;

if(
Math.abs(dx)+
Math.abs(dy)>5
){

dragMoved=true;
}

cameraX=
oldCameraX+dx;

cameraY=
oldCameraY+dy;
}
}
);

canvas.addEventListener(
"mousedown",
event=>{

if(event.button!==0)return;

dragging=true;
dragMoved=false;

dragStartX=event.clientX;
dragStartY=event.clientY;

oldCameraX=cameraX;
oldCameraY=cameraY;
}
);

canvas.addEventListener(
"mouseup",
event=>{

if(event.button!==0)return;

if(!dragMoved){
canvasClick();
}

dragging=false;
}
);

canvas.addEventListener(
"mouseleave",
()=>{

dragging=false;
}
);

canvas.addEventListener(
"contextmenu",
event=>{

event.preventDefault();

selectedTower=null;
}
);

function canvasClick(){

if(gameOver||paused)return;

for(const tower of towers){

if(
Math.hypot(
tower.x-mouseX,
tower.y-mouseY
)<23
){

selectedTower=tower;
selectedTowerType=tower.type;

updateButtons();

return;
}
}

for(const castle of castles){

if(
Math.hypot(
castle.x-mouseX,
castle.y-mouseY
)<60
){

selectedCastle=castle;
selectedTower=null;

updateCastleBar();

return;
}
}

placeTower(
mouseX,
mouseY
);
}

document.getElementById(
"upgradeBtn"
).onclick=
upgradeSelectedTower;

document.getElementById(
"sellBtn"
).onclick=
sellSelectedTower;

document.getElementById(
"pauseBtn"
).onclick=()=>{

if(gameOver)return;

paused=!paused;

updateUI();
};

document.getElementById(
"waveBtn"
).onclick=
startWave;

document.getElementById(
"startBtn"
).onclick=()=>{

document.getElementById(
"overlay"
).style.display=
"none";
};

document.getElementById(
"retryBtn"
).onclick=()=>{

resetGame();

document.getElementById(
"overlay"
).style.display=
"none";
};

document.getElementById(
"homeBtn"
).onclick=()=>{

window.location.href=
"index.html";
};

window.addEventListener(
"keydown",
event=>{

const key=
event.key.toLowerCase();

if(key==="r"){

const now=Date.now();

if(
window.lastRPress&&
now-window.lastRPress<600
){

window.location.href=
"index.html";
}

window.lastRPress=now;
}

if(key==="escape"){

selectedTower=null;
}

if(key==="p"){

paused=!paused;
}

const number=
parseInt(event.key);

if(
number>=1&&
number<=20
){

const type=
towerNames[number-1];

if(
unlockedTowers.includes(type)
){

selectedTowerType=type;
selectedTower=null;

updateButtons();
}
}
}
);

window.addEventListener(
"beforeunload",
saveAuto
);

window.addEventListener(
"pagehide",
saveAuto
);

setInterval(
()=>{
if(!gameOver){
saveAuto();
}
},
5000
);

function gameLoop(time){

const dt=
Math.min(
45,
time-lastTime
);

lastTime=time;

update(dt);
draw();
updateUI();

requestAnimationFrame(
gameLoop
);
}

createInitialCastle();

updateButtons();
updateCastleBar();
updateUI();

document.getElementById(
"overlayTitle"
).textContent=
"KINGDOM WAR";

document.getElementById(
"overlayText"
).textContent=
"Defend your castles and conquer new kingdoms.\n\n"+
"A new kingdom is conquered every 10 waves.\n"+
"Each new castle gets its own automatically generated road.\n\n"+
"Castle 2 is NOT visible until you conquer Kingdom 2.";

document.getElementById(
"overlay"
).style.display=
"flex";

requestAnimationFrame(
gameLoop
);
</script>

</body>
</html>
