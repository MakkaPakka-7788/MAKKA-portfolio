<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flashcard Creator</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#203020;
    cursor:grab;
}

#game.dragging{
    cursor:grabbing;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    background:rgba(20,20,20,.96);
    border-bottom:2px solid #444;
    overflow-x:auto;
}

.stat{
    background:#292929;
    border:1px solid #4d4d4d;
    border-radius:5px;
    padding:8px 11px;
    white-space:nowrap;
}

button{
    border:1px solid #555;
    background:#292929;
    color:#fff;
    padding:8px 11px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
}

button:hover{
    background:#3a3a3a;
}

button:active{
    transform:translateY(1px);
}

#towerPanel{
    position:fixed;
    right:10px;
    top:72px;
    bottom:10px;
    width:205px;
    z-index:20;
    background:rgba(20,20,20,.95);

    border-radius:6px;

    overflow-y:auto;

.towerButton{

    margin-bottom:5px;
    text-align:left;
    font-size:12px;
}

.towerButton.selected{
    outline:2px solid #fff;
    background:#444;
}

#message{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:30;
    display:none;
    padding:11px 18px;
    background:rgba(20,20,20,.95);
    border:1px solid #777;
    border-radius:5px;
    font-weight:bold;
}

#help{
    position:fixed;
    left:10px;
    bottom:10px;
    z-index:20;
    background:rgba(20,20,20,.88);
    border:1px solid #444;

    border-radius:5px;
    font-size:12px;

    transform:translate(-50%,-50%);

    border:2px solid #555;

.saveSlot{
    width:100%;

}

.closeSave{

    width:100%;

}

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);


/* =========================================================
   CAMERA
========================================================= */

let cameraX=0;
let cameraY=0;
let zoom=1;

let dragging=false;
let dragMoved=false;

let dragStartX=0;
let dragStartY=0;

let cameraStartX=0;
let cameraStartY=0;

function screenToWorld(x,y){
    return {
        x:x/zoom+cameraX,
        y:y/zoom+cameraY
    };
}

function worldToScreen(x,y){
    return {
        x:(x-cameraX)*zoom,
        y:(y-cameraY)*zoom
    };
}

canvas.addEventListener("mousedown",e=>{

    if(e.button!==0)return;

    dragging=true;
    dragMoved=false;

    dragStartX=e.clientX;
    dragStartY=e.clientY;

    cameraStartX=cameraX;
    cameraStartY=cameraY;

    canvas.classList.add("dragging");
});

canvas.addEventListener("mousemove",e=>{

    if(!dragging)return;

    const dx=e.clientX-dragStartX;
    const dy=e.clientY-dragStartY;

    if(Math.abs(dx)>5 || Math.abs(dy)>5){
        dragMoved=true;
    }

    cameraX=cameraStartX-dx/zoom;
    cameraY=cameraStartY-dy/zoom;
});

canvas.addEventListener("mouseup",e=>{

    if(e.button!==0)return;

    dragging=false;

    canvas.classList.remove("dragging");

    if(!dragMoved){
        handleClick(e.clientX,e.clientY);
    }
});

canvas.addEventListener("mouseleave",()=>{
    dragging=false;
    canvas.classList.remove("dragging");
});


/* =========================================================
   ZOOM
========================================================= */

canvas.addEventListener("wheel",e=>{

    e.preventDefault();

    const mouseX=e.clientX;
    const mouseY=e.clientY;

    const before=screenToWorld(mouseX,mouseY);

    if(e.deltaY<0){
        zoom*=1.12;
    }else{
        zoom*=0.89;
    }

    zoom=Math.max(.4,Math.min(2.4,zoom));

    const after=screenToWorld(mouseX,mouseY);

    cameraX+=before.x-after.x;
    cameraY+=before.y-after.y;

},{passive:false});


/* =========================================================
   GAME VARIABLES
========================================================= */

let money=500;
let lives=20;

let wave=1;
let waveRunning=false;

let enemies=[];
let projectiles=[];

let towers=[];
let castles=[];
let enemyBases=[];

let selectedTower=null;
let selectedTowerIndex=null;

let gameTime=0;

let troops=[];

let roadMode=false;
let roadStartCastle=null;


/* =========================================================

========================================================= */

const towerTypes=[

/* =========================================================
   CASTLES
========================================================= */

castles=[
    {
        id:1,
        x:500,
        y:450,
        parent:null,
        conquered:true
    }
];

function castleCount(){
    return castles.length;
}


/*
    Castle expansion pattern:

                    4
                    |
                    |
        1 --------- 2
        |
        |
        3

    Then it continues outward.
*/

function createNextCastle(){

    const id=castles.length+1;

    let parent;
    let dx=0;
    let dy=0;

    if(id===2){

        parent=1;
        dx=420;
        dy=0;

    }else if(id===3){

        parent=1;
        dx=0;
        dy=420;

    }else{

        parent=Math.floor((id-2)/2)+1;

        const firstChild=(id%2===0);

        if(parent%2===0){

            if(firstChild){

                dx=0;
                dy=-420;

            }else{

                dx=420;
                dy=0;
            }

        }else{

            if(firstChild){

                dx=420;
                dy=0;

            }else{

                dx=0;
                dy=420;
            }
        }
    }

    const parentCastle=castles.find(c=>c.id===parent);

    let x=parentCastle.x+dx;
    let y=parentCastle.y+dy;

    /*
        Keep new castles separated.
    */

    let tries=0;

    while(
        castles.some(
            c=>Math.hypot(c.x-x,c.y-y)<180
        ) &&
        tries<30
    ){

        x+=70;
        y+=70;

        tries++;
    }

    castles.push({
        id,
        x,
        y,
        parent,
        conquered:false
    });

    /*
        Every 3 additional castles creates
        another enemy base.

        Castle 4
        Castle 7
        Castle 10
        Castle 13...
    */

    if(
        castles.length>=4 &&
        (castles.length-1)%3===0
    ){

        createEnemyBase();
    }

    updateUI();
    saveBackground();

    showMessage(
        "Castle "+id+" discovered!"
    );
}


/* =========================================================
   ENEMY BASES
========================================================= */

enemyBases=[
    {
        id:1,
        x:1500,
        y:450
    }
];

function createEnemyBase(){

    const newest=castles[castles.length-1];

    const direction=
        enemyBases.length%2===0
        ? -1
        : 1;

    const base={
        id:enemyBases.length+1,
        x:newest.x+620,
        y:newest.y+(direction*520)
    };

    /*
        Move it if it is too close to another base.
    */

    while(
        enemyBases.some(
            b=>Math.hypot(
                b.x-base.x,
                b.y-base.y
            )<300
        )
    ){

        base.x+=300;
    }

    enemyBases.push(base);

    showMessage(
        "⚠️ ENEMY BASE "+base.id+" DISCOVERED"
    );

    updateUI();
}


/* =========================================================
   ROAD CONNECTIONS
========================================================= */

const roads=[];

function getNearestBase(castle){

    let best=null;
    let bestDistance=Infinity;

    for(const base of enemyBases){

        const d=Math.hypot(
            castle.x-base.x,
            castle.y-base.y
        );

        if(d<bestDistance){

            bestDistance=d;
            best=base;
        }
    }

    return best;
}

function createRoad(castleId,baseId){

    if(
        roads.some(
            r=>r.castleId===castleId &&
               r.baseId===baseId
        )
    ){
        return;
    }

    roads.push({
        castleId,
        baseId
    });
}


/*
    Automatically connect conquered castles
    to the closest enemy base.
*/

function updateRoads(){

    for(const castle of castles){

        if(!castle.conquered)continue;

        const base=getNearestBase(castle);

        if(base){
            createRoad(castle.id,base.id);
        }
    }
}


/* =========================================================
   DRAW ROAD
========================================================= */

function drawRoad(x1,y1,x2,y2){

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.lineWidth=34;
    ctx.strokeStyle="#4d3929";
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.lineWidth=22;
    ctx.strokeStyle="#806548";
    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   HANDLE CLICKS
========================================================= */

function handleClick(screenX,screenY){

    const p=screenToWorld(
        screenX,
        screenY
    );

    /*
        Castle click.
    */

    for(const castle of castles){

        if(
            Math.hypot(
                p.x-castle.x,
                p.y-castle.y
            )<75
        ){

            if(!castle.conquered){

                castle.conquered=true;

                money+=150;

                updateRoads();

                createNextCastle();

                showMessage(
                    "🏰 Castle "+castle.id+
                    " conquered! +$150"
                );

            }else{

                selectedTower=null;
                selectedTowerIndex=null;
            }

            return;
        }
    }


    /*
        Tower selection.
    */

    for(const tower of towers){

        if(
            Math.hypot(
                p.x-tower.x,
                p.y-tower.y
            )<35
        ){

            selectedTower=tower;

            showMessage(
                towerTypes[tower.type].name+
                " Lv."+tower.level+
                " — Upgrade with U"
            );

            return;
        }
    }


    /*
        Place tower.
    */

    if(selectedTowerIndex!==null){

        placeTower(
            p.x,
            p.y,
            selectedTowerIndex
        );
    }
}


/* =========================================================
   PLACE TOWER
========================================================= */

function placeTower(x,y,index){

    const type=towerTypes[index];

    if(money<type.cost){

        showMessage("Not enough money!");

        return;
    }

    /*
        Prevent placing on roads.
    */

    for(const castle of castles){

        if(
            Math.hypot(
                x-castle.x,
                y-castle.y
            )<90
        ){

            showMessage(
                "You cannot build there."
            );

            return;
        }
    }


    /*
        Prevent towers overlapping.
    */

    if(
        towers.some(
            t=>Math.hypot(
                t.x-x,
                t.y-y
            )<50
        )
    ){

        showMessage(
            "Too close to another tower."
        );

        return;
    }


    towers.push({

        x,
        y,

        type:index,

        level:1,

        damage:type.damage,

        range:type.range,

        rate:type.rate,

        lastShot:0,

        kills:0

    });

    money-=type.cost;

    selectedTowerIndex=null;

    updateTowerButtons();
    updateUI();

    saveBackground();
}


/* =========================================================
   UPGRADE
========================================================= */

function getUpgradeCost(level){

    if(level<10){
        return 75+level*45;
    }

    return 500+(level-10)*175;
}

function upgradeSelected(){

    if(!selectedTower)return;

    const cost=getUpgradeCost(
        selectedTower.level
    );

    if(money<cost){

        showMessage(
            "Need $"+cost
        );

        return;
    }

    money-=cost;

    selectedTower.level++;

    if(selectedTower.level<10){

        selectedTower.damage*=1.12;
        selectedTower.range+=6;
        selectedTower.rate*=.96;

    }else{

        selectedTower.damage*=1.08;
        selectedTower.range+=5;
        selectedTower.rate*=.975;
    }

    selectedTower.rate=Math.max(
        110,
        selectedTower.rate
    );

    showMessage(
        "Tower upgraded to Lv."+
        selectedTower.level
    );

    updateUI();
    saveBackground();
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

    if(e.key.toLowerCase()==="u"){
        upgradeSelected();
    }

});


/* =========================================================
   ENEMIES
========================================================= */

function getEnemyScale(){

    const kingdom=Math.floor(
        Math.max(0,castles.length-1)/40
    );

    return (
        1+
        wave*.055+
        kingdom*.14+
        Math.max(0,wave-30)*.025+
        Math.max(0,wave-80)*.018
    );
}

function spawnEnemy(){

    if(enemyBases.length===0)return;

    const base=
        enemyBases[
            Math.floor(
                Math.random()*enemyBases.length
            )
        ];

    /*
        Find a conquered castle connected
        to this base.
    */

    let possible=castles.filter(c=>
        c.conquered &&
        roads.some(r=>
            r.castleId===c.id &&
            r.baseId===base.id
        )
    );

    if(possible.length===0){

        possible=castles.filter(
            c=>c.conquered
        );
    }

    if(possible.length===0)return;

    const castle=
        possible[
            Math.floor(
                Math.random()*possible.length
            )
        ];


    const scale=getEnemyScale();

    const hp=
        Math.floor(
            90*scale
        );

    enemies.push({

        x:base.x,
        y:base.y,

        targetCastle:castle.id,
        baseId:base.id,

        hp,
        maxHp:hp,

        speed:
            38+
            Math.random()*16+
            wave*.25,

        slow:0,

        poison:0,

        progress:0,

        alive:true
    });
}


/* =========================================================
   ENEMY PATH
========================================================= */

function getEnemyPath(enemy){

    const base=enemyBases.find(
        b=>b.id===enemy.baseId
    );

    const castle=castles.find(
        c=>c.id===enemy.targetCastle
    );

    if(!base || !castle){
        return [];
    }

    return [
        {
            x:base.x,
            y:base.y
        },
        {
            x:(base.x+castle.x)/2,
            y:(base.y+castle.y)/2
        },
        {
            x:castle.x,
            y:castle.y
        }
    ];
}


/* =========================================================
   MOVE ENEMIES
========================================================= */

function updateEnemies(dt){

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        const path=getEnemyPath(enemy);

        if(path.length===0)continue;

        const target=
            path[path.length-1];

        const dx=target.x-enemy.x;
        const dy=target.y-enemy.y;

        const dist=Math.hypot(dx,dy);

        let speed=enemy.speed;

        if(enemy.slow>0){

            speed*=.45;
            enemy.slow-=dt;
        }

        if(enemy.poison>0){

            enemy.hp-=enemy.poison*dt;
        }

        if(dist<20){

            damageCastle(
                enemy.targetCastle
            );

            enemy.alive=false;

            continue;
        }

        enemy.x+=dx/dist*speed*dt;
        enemy.y+=dy/dist*speed*dt;
    }

    enemies=enemies.filter(
        e=>e.alive
    );
}


/* =========================================================
   DAMAGE CASTLE
========================================================= */

function damageCastle(id){

    lives--;

    showMessage(
        "⚠️ Castle "+id+" was attacked!"
    );

    if(lives<=0){

        lives=0;

        waveRunning=false;

        showMessage(
            "DEFEATED — Retry"
        );
    }

    updateUI();
}


/* =========================================================
   TOWER TARGETING
========================================================= */

function findTarget(tower){

    let best=null;
    let bestDistance=Infinity;

    for(const enemy of enemies){

        if(!enemy.alive)continue;

        const d=Math.hypot(
            tower.x-enemy.x,
            tower.y-enemy.y
        );

        if(
            d<=tower.range &&
            d<bestDistance
        ){

            best=enemy;
            bestDistance=d;
        }
    }

    return best;
}


/* =========================================================
   TOWER ATTACK
========================================================= */

function updateTowers(){

    for(const tower of towers){

        if(
            gameTime-tower.lastShot<
            tower.rate
        ){
            continue;
        }

        const target=findTarget(tower);

        if(!target)continue;

        tower.lastShot=gameTime;

        fireTower(
            tower,
            target
        );
    }
}


/* =========================================================
   FIRE TOWER
========================================================= */

function fireTower(tower,target){

    const type=towerTypes[tower.type];

    /*
        Splash
    */

    if(type.name==="Splash"){

        target.hp-=tower.damage;

        for(const enemy of enemies){

            if(enemy===target)continue;

            const d=Math.hypot(
                enemy.x-target.x,
                enemy.y-target.y
            );

            if(d<65){
                enemy.hp-=tower.damage*.45;
            }
        }

        return;
    }


    /*
        Freeze
    */

    if(type.name==="Freeze" ||
       type.name==="Ice"){

        target.hp-=tower.damage;
        target.slow=2;

        return;
    }


    /*
        Poison
    */

    if(type.name==="Poison"){

        target.hp-=tower.damage;
        target.poison=8;

        return;
    }


    /*
        Flame
    */

    if(type.name==="Flame"){

        target.hp-=tower.damage;

        for(const enemy of enemies){

            if(enemy===target)continue;

            if(
                Math.hypot(
                    enemy.x-target.x,
                    enemy.y-target.y
                )<80
            ){

                enemy.hp-=tower.damage*.3;
            }
        }

        return;
    }


    /*
        Tesla
    */

    if(type.name==="Tesla"){

        target.hp-=tower.damage;

        let jumps=0;

        for(const enemy of enemies){

            if(enemy===target)continue;

            if(jumps>=2)break;

            if(
                Math.hypot(
                    enemy.x-target.x,
                    enemy.y-target.y
                )<100
            ){

                enemy.hp-=tower.damage*.55;
                jumps++;
            }
        }

        return;
    }


    /*
        Meteor
    */

    if(type.name==="Meteor"){

        for(const enemy of enemies){

            if(
                Math.hypot(
                    enemy.x-target.x,
                    enemy.y-target.y
                )<105
            ){

                enemy.hp-=tower.damage;
            }
        }

        return;
    }


    /*
        Normal attack.
    */

    target.hp-=tower.damage;
}


/* =========================================================
   CLEAN DEAD ENEMIES
========================================================= */

function cleanupEnemies(){

    for(const enemy of enemies){

        if(
            enemy.hp<=0 &&
            enemy.alive
        ){

            enemy.alive=false;

            money+=8;

            /*
                Find tower that killed it approximately.
            */

            for(const tower of towers){

                const d=Math.hypot(
                    tower.x-enemy.x,
                    tower.y-enemy.y
                );

                if(d<tower.range+20){
                    tower.kills++;
                }
            }
        }
    }

    enemies=enemies.filter(
        e=>e.alive
    );
}


/* =========================================================
   WAVES
========================================================= */

let spawnTimer=null;
let spawnedThisWave=0;
let enemiesForWave=0;

function startWave(){

    if(waveRunning)return;

    if(lives<=0){

        resetGame();

        return;
    }

    waveRunning=true;

    spawnedThisWave=0;

    enemiesForWave=Math.max(
        6,
        Math.floor(
            8+
            wave*.27+
            Math.max(0,castles.length-1)*.8
        )
    );

    showMessage(
        "Wave "+wave+" started!"
    );

    clearInterval(spawnTimer);

    spawnEnemy();

    spawnedThisWave=1;

    const interval=Math.max(
        520,
        1150-wave*1.5
    );

    spawnTimer=setInterval(()=>{

        if(!waveRunning){

            clearInterval(spawnTimer);

            return;
        }

        if(
            spawnedThisWave>=
            enemiesForWave
        ){

            clearInterval(spawnTimer);

            return;
        }

        spawnEnemy();

        spawnedThisWave++;

    },interval);
}


/* =========================================================
   WAVE FINISH
========================================================= */

function checkWaveFinished(){

    if(!waveRunning)return;

    if(
        spawnedThisWave>=enemiesForWave &&
        enemies.length===0
    ){

        waveRunning=false;

        const reward=
            80+
            Math.floor(wave*7)+
            Math.floor(
                (castles.length-1)*30
            );

        money+=reward;

        showMessage(
            "Wave cleared! +$"+reward
        );

        /*
            Every 40 waves expands the kingdom.
        */

        if(wave%40===0){

            for(let i=0;i<2;i++){
                createNextCastle();
            }

            showMessage(
                "🏰 Kingdom expanded!"
            );
        }

        wave++;

        updateRoads();
        updateUI();

        saveBackground();
    }
}


/* =========================================================
   TROOPS
========================================================= */

function sendTroop(){

    const castle=castles.find(
        c=>c.conquered
    );

    if(!castle)return;

    const base=getNearestBase(castle);

    if(!base)return;

    troops.push({

        x:castle.x,
        y:castle.y,

        targetX:base.x,
        targetY:base.y,

        hp:100,
        alive:true
    });
}

function updateTroops(dt){

    for(const troop of troops){

        if(!troop.alive)continue;

        const dx=troop.targetX-troop.x;
        const dy=troop.targetY-troop.y;

        const dist=Math.hypot(dx,dy);

        if(dist<20){

            troop.alive=false;

            continue;
        }

        troop.x+=dx/dist*35*dt;
        troop.y+=dy/dist*35*dt;
    }

    troops=troops.filter(
        t=>t.alive
    );
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    const left=cameraX;
    const top=cameraY;

    const right=
        cameraX+
        canvas.width/zoom;

    const bottom=
        cameraY+
        canvas.height/zoom;


    ctx.fillStyle="#203020";

    ctx.fillRect(
        left,
        top,
        right-left,
        bottom-top
    );


    /*
        Grid
    */

    const grid=100;

    ctx.strokeStyle="#263c27";
    ctx.lineWidth=1;

    const sx=
        Math.floor(left/grid)*grid;

    const sy=
        Math.floor(top/grid)*grid;

    for(
        let x=sx;
        x<right+grid;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=sy;
        y<bottom+grid;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }


    /*
        Some world terrain patches.
    */

    const patchSize=260;

    const startPX=
        Math.floor(left/patchSize)-1;

    const endPX=
        Math.ceil(right/patchSize)+1;

    const startPY=
        Math.floor(top/patchSize)-1;

    const endPY=
        Math.ceil(bottom/patchSize)+1;

    for(
        let gx=startPX;
        gx<endPX;
        gx++
    ){

        for(
            let gy=startPY;
            gy<endPY;
            gy++
        ){

            const value=
                Math.abs(
                    Math.sin(
                        gx*12.37+
                        gy*5.73
                    )
                );

            if(value>.82){

                ctx.fillStyle=
                    "rgba(50,75,45,.18)";

                ctx.fillRect(
                    gx*patchSize,
                    gy*patchSize,
                    patchSize,
                    patchSize
                );
            }
        }
    }
}


/* =========================================================
   DRAW ROADS
========================================================= */

function drawAllRoads(){

    /*
        Castle-to-castle expansion roads.
    */

    for(const castle of castles){

        if(!castle.parent)continue;

        const parent=castles.find(
            c=>c.id===castle.parent
        );

        if(!parent)continue;

        drawRoad(
            parent.x,
            parent.y,
            castle.x,
            castle.y
        );
    }


    /*
        Castle-to-enemy-base roads.
    */

    for(const road of roads){

        const castle=castles.find(
            c=>c.id===road.castleId
        );

        const base=enemyBases.find(
            b=>b.id===road.baseId
        );

        if(!castle || !base)continue;

        drawRoad(
            castle.x,
            castle.y,
            base.x,
            base.y
        );
    }
}

function drawTower(tower){

    ctx.save();

    ctx.translate(
        tower.x,
        tower.y
    );


    const type=towerTypes[tower.type];


    /*
        Range when selected.
    */

    if(selectedTower===tower){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            tower.range,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            "rgba(255,255,255,.05)";

        ctx.fill();

        ctx.strokeStyle=
            "rgba(255,255,255,.25)";

        ctx.stroke();

    /*
        Base.
    */

    ctx.fillStyle="#252525";

    ctx.fillRect(
        -25,
        -20,
        50,
        40
    );


    /*
        Tower body varies by type.
    */

    const typeIndex=tower.type;

    if(typeIndex===0){

        drawBasicTower();

    }else if(typeIndex===1){

        drawRapidTower();

    }else if(typeIndex===2){

        drawHeavyTower();

    }else if(typeIndex===3){

        drawSlowTower();

    }else if(typeIndex===4){

        drawSplashTower();

    }else if(typeIndex===5){

        drawLaserTower();

    }else if(typeIndex===6){

        drawFreezeTower();

    }else if(typeIndex===7){

        drawPoisonTower();

    }else if(typeIndex===8){

        drawSniperTower();

    }else if(typeIndex===9){

        drawTeslaTower();

    }else if(typeIndex===10){

        drawMortarTower();

    }else if(typeIndex===11){

        drawFlameTower();

    }else if(typeIndex===12){

        drawIceTower();

    }else if(typeIndex===13){

        drawBallistaTower();

    }else if(typeIndex===14){

        drawCatapultTower();

    }else if(typeIndex===15){

        drawVoidTower();

    }else if(typeIndex===16){

        drawMeteorTower();

    }else if(typeIndex===17){

        drawCrystalTower();

    }else if(typeIndex===18){

        drawGuardianTower();

        drawKingTower();

    /*
        Level.
    */

    ctx.fillStyle="#fff";

    ctx.font="bold 11px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "Lv."+tower.level,
        0,

    );

}

    for(const castle of castles){

    drawTroops();

                selectedTowerIndex=index;

                selectedTower=null;

                updateTowerButtons();

                showMessage(
                    tower.name+
                    " selected"
                );
            };

            towerPanel.appendChild(
                button
            );
        }
    );


    const troopButton=
        document.createElement(
            "button"
        );

    troopButton.className=
        "towerButton";

    troopButton.textContent=
        "⚔ Send Troop";

    troopButton.onclick=()=>{
        sendTroop();
    };

    towerPanel.appendChild(
        troopButton
    );


    const upgradeButton=
        document.createElement(
            "button"
        );

    upgradeButton.className=
        "towerButton";

    upgradeButton.textContent=
        "⬆ Upgrade Selected";

    upgradeButton.onclick=()=>{
        upgradeSelected();
    };

    towerPanel.appendChild(
        upgradeButton
    );
}

function updateTowerButtons(){

    const buttons=
        document.querySelectorAll(
            ".towerButton"
        );

    buttons.forEach(button=>{

        button.classList.remove(
            "selected"
        );

        if(
            Number(button.dataset.index)===
            selectedTowerIndex
        ){

            button.classList.add(
                "selected"
            );
        }
    });
}

createTowerButtons();


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout=null;

function showMessage(text){

    const box=
        document.getElementById(
            "message"
        );

    box.textContent=text;

    box.style.display="block";

    clearTimeout(
        messageTimeout
    );

    messageTimeout=setTimeout(()=>{

        box.style.display="none";

    },2500);
}


/* =========================================================
   END DAY
========================================================= */

function endDay(){

    if(waveRunning){

        showMessage(
            "Finish the wave first."
        );

        return;
    }

    const reward=
        100+
        Math.floor(
            castles.length*15
        );

    money+=reward;

    updateUI();

    showMessage(
        "Day ended. +$"+reward
    );

    saveBackground();
}


/* =========================================================
   SAVE SYSTEM
========================================================= */

function getSaveData(){

    return {

        money,
        lives,
        wave,

        cameraX,
        cameraY,
        zoom,

        castles,
        enemyBases,
        roads,

        towers,

        troops

    };
}

function saveGame(slot){

    const data=getSaveData();

    localStorage.setItem(
        "towerDefenseSave"+slot,
        JSON.stringify(data)
    );

    closeSavePanel();

    showMessage(
        "Saved to Slot "+slot
    );
}

function loadGame(){

    let data=null;

    for(let i=1;i<=3;i++){

        const raw=
            localStorage.getItem(
                "towerDefenseSave"+i
            );

        if(raw){

            data=JSON.parse(raw);

            break;
        }
    }

    if(!data){

        showMessage(
            "No save found."
        );

        return;
    }

    applySave(data);

    showMessage(
        "Game loaded."
    );
}

function applySave(data){

    money=data.money??500;
    lives=data.lives??20;
    wave=data.wave??1;

    cameraX=data.cameraX??0;
    cameraY=data.cameraY??0;
    zoom=data.zoom??1;

    castles=data.castles||[
        {
            id:1,
            x:500,
            y:450,
            parent:null,
            conquered:true
        }
    ];

    enemyBases=data.enemyBases||[
        {
            id:1,
            x:1500,
            y:450
        }
    ];

    roads=data.roads||[];

    towers=data.towers||[];

    troops=data.troops||[];

    enemies=[];

    projectiles=[];

    selectedTower=null;
    selectedTowerIndex=null;

    updateTowerButtons();
    updateUI();
}

function saveBackground(){

    clearTimeout(
        window.backgroundSaveTimer
    );

    window.backgroundSaveTimer=
        setTimeout(()=>{

            localStorage.setItem(
                "towerDefenseAutoSave",
                JSON.stringify(
                    getSaveData()
                )
            );

        },250);
}

function loadAutoSave(){

    const raw=
        localStorage.getItem(
            "towerDefenseAutoSave"
        );

    if(!raw)return;

    try{

        const data=
            JSON.parse(raw);

        applySave(data);

    }catch(e){

        console.log(
            "Autosave could not load."
        );
    }
}


/* =========================================================
   SAVE PANEL
========================================================= */

function openSavePanel(){

    document.getElementById(
        "savePanel"
    ).style.display="block";
}

function closeSavePanel(){

    document.getElementById(
        "savePanel"
    ).style.display="none";
}


/* =========================================================
   RRR HOME
========================================================= */

let rPresses=[];

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key.toLowerCase()!=="r"
        ){
            return;
        }

        const now=Date.now();

        rPresses=
            rPresses.filter(
                t=>now-t<700
            );

        rPresses.push(now);

        if(rPresses.length>=3){

            location.href=
                "index.html";
        }
    }
);


/* =========================================================
   RESET
========================================================= */

function resetGame(){

    clearInterval(
        spawnTimer
    );

    money=500;
    lives=20;
    wave=1;

    enemies=[];
    towers=[];
    troops=[];
    roads=[];

    castles=[
        {
            id:1,
            x:500,
            y:450,
            parent:null,
            conquered:true
        }
    ];

    enemyBases=[
        {
            id:1,
            x:1500,
            y:450
        }
    ];

    cameraX=0;
    cameraY=0;
    zoom=1;

    waveRunning=false;

    selectedTower=null;
    selectedTowerIndex=null;

    updateTowerButtons();
    updateUI();

    showMessage(
        "Retry"
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=performance.now();

function gameLoop(now){

    const dt=Math.min(
        .05,
        (now-lastTime)/1000
    );

    lastTime=now;

    gameTime=now;

    updateEnemies(dt);

    updateTroops(dt);

    updateTowers();

    cleanupEnemies();

    checkWaveFinished();

    drawScreen();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   SCREEN DRAW
========================================================= */

function drawScreen(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWorld();


    /*
        Fixed map indicator.
    */

    ctx.save();

    ctx.fillStyle=
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        10,
        70,
        145,
        29
    );

    ctx.fillStyle="#fff";

    ctx.font="12px Arial";

    ctx.fillText(
        "Zoom: "+
        Math.round(zoom*100)+ "%",
        20,
        89
    );

    ctx.restore();
}


/* =========================================================
   START
========================================================= */

loadAutoSave();

updateRoads();

updateUI();

requestAnimationFrame(
    gameLoop
);

</script>
