<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Creator</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
}

#top {
    height: 58px;
    background: #1b1b1b;
    border-bottom: 3px solid #555;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 18px;
    font-size: 11px;
}

#title {
    font-size: 15px;
}

#stats {
    display: flex;
    gap: 16px;
}

#toolbar {
    height: 58px;
    background: #222;
    border-bottom: 3px solid #444;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px;
}

button {
    font-family: 'Press Start 2P', monospace;
    background: #333;
    color: white;
    border: 2px solid #777;
    padding: 9px 10px;
    cursor: pointer;
    font-size: 8px;
}

button:hover {
    background: #444;
}

button.selected {
    background: #666;
    border-color: white;
}

button.locked {
    opacity: .45;
}

#canvasWrap {
    position: relative;
    width: 100vw;
    height: calc(100vh - 116px);
}

canvas {
    display: block;
    background: #4d8b45;
}

#castleBar {
    position: absolute;
    left: 10px;
    bottom: 10px;
    background: rgba(20,20,20,.92);
    border: 2px solid #777;
    padding: 8px;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    max-width: 620px;
}

.castleButton {
    min-width: 100px;
}

#savePanel {
    position: absolute;
    right: 10px;
    bottom: 10px;
    background: rgba(20,20,20,.94);
    border: 2px solid #777;
    padding: 8px;
    width: 250px;
}

#savePanel div {
    margin-bottom: 6px;
}

#savePanel button {
    margin: 2px;
    padding: 7px;
}

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

#overlayBox {
    width: 500px;
    background: #202020;
    border: 4px solid #777;
    padding: 35px;
    text-align: center;
}

#overlayTitle {
    font-size: 28px;
    margin-bottom: 25px;
}

#overlayText {
    font-size: 10px;
    line-height: 2;
    margin-bottom: 25px;
}

.retry {
    color: #e33;
}

#towerInfo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 250px;
    background: rgba(20,20,20,.94);
    border: 2px solid #777;
    padding: 10px;
    font-size: 8px;
    line-height: 1.9;
    display: none;
}

#toast {
    position: fixed;
    top: 125px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    border: 2px solid #888;
    padding: 10px;
    font-size: 9px;
    display: none;
    z-index: 30;
}
</style>
</head>

<body>

<div id="top">
    <div id="title">KINGDOM WAR</div>
    <div id="stats">
        <span id="money">GOLD: 250</span>
        <span id="wave">WAVE: 1</span>
        <span id="kingdom">KINGDOM: 1</span>
        <span id="castles">CASTLES: 1</span>
    </div>
</div>

<div id="toolbar">
    <button data-tower="basic">[1] CANNON $50</button>
    <button data-tower="rapid">[2] RAPID $75</button>
    <button data-tower="heavy">[3] HEAVY $125</button>
    <button data-tower="slow">[4] SLOW $110</button>
    <button data-tower="splash">[5] SPLASH $160</button>
    <button data-tower="laser">[6] LASER $220</button>
    <button data-tower="freeze">[7] FREEZE $270</button>
    <button id="upgrade">UPGRADE</button>
    <button id="delete">DELETE / SELL</button>
    <button id="road">BUILD ROAD</button>
    <button id="pause">PAUSE</button>
</div>

<div id="canvasWrap">
    <canvas id="canvas" width="1150" height="650"></canvas>

    <div id="towerInfo"></div>

    <div id="castleBar"></div>

    <div id="savePanel">
        <div>SAVES</div>
        <div>
            <button onclick="saveSlot(1)">SAVE 1</button>
            <button onclick="loadSlot(1)">LOAD 1</button>
        </div>
        <div>
            <button onclick="saveSlot(2)">SAVE 2</button>
            <button onclick="loadSlot(2)">LOAD 2</button>
        </div>
        <div>
            <button onclick="saveSlot(3)">SAVE 3</button>
            <button onclick="loadSlot(3)">LOAD 3</button>
        </div>
        <div>
            <button onclick="loadAutoSave()">LOAD AUTO</button>
            <button onclick="copyAuto(1)">AUTO → 1</button>
            <button onclick="copyAuto(2)">AUTO → 2</button>
            <button onclick="copyAuto(3)">AUTO → 3</button>
        </div>
        <div id="autoStatus">AUTO-SAVE: READY</div>
    </div>
</div>

<div id="toast"></div>

<div id="overlay">
    <div id="overlayBox">
        <div id="overlayTitle">KINGDOM WAR</div>
        <div id="overlayText">
            DEFEND YOUR KINGDOM.<br><br>
            BUILD TOWERS.<br>
            TRAIN TROOPS.<br>
            SURVIVE THE WAVES.
        </div>
        <button id="startButton">START</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let money = 250;
let wave = 1;
let kingdom = 1;
let running = false;
let paused = false;
let selectedTowerType = null;
let selectedTower = null;
let selectedCastle = null;
let towers = [];
let enemies = [];
let troops = [];
let castlesData = [];
let projectiles = [];
let particles = [];

let waveTimer = 4500;
let spawnTimer = 0;
let spawnLeft = 0;
let waveActive = false;

let roadMode = false;
let roadPoints = [];

let lastTime = performance.now();
let lastAutoSave = 0;
let hiddenAt = null;

const towerTypes = {
    basic: {
        name: "CANNON",
        cost: 50,
        damage: 18,
        range: 135,
        fireRate: 750,
        color: "#aaa"
    },
    rapid: {
        name: "RAPID",
        cost: 75,
        damage: 8,
        range: 115,
        fireRate: 260,
        color: "#ddd"
    },
    heavy: {
        name: "HEAVY",
        cost: 125,
        damage: 55,
        range: 150,
        fireRate: 1200,
        color: "#888"
    },
    slow: {
        name: "SLOW",
        cost: 110,
        damage: 13,
        range: 140,
        fireRate: 650,
        color: "#aaa"
    },
    splash: {
        name: "SPLASH",
        cost: 160,
        damage: 32,
        range: 145,
        fireRate: 1000,
        color: "#ccc"
    },
    laser: {
        name: "LASER",
        cost: 220,
        damage: 16,
        range: 185,
        fireRate: 150,
        color: "#fff"
    },
    freeze: {
        name: "FREEZE",
        cost: 270,
        damage: 11,
        range: 155,
        fireRate: 650,
        color: "#bbb"
    }
};

const troopTypes = {
    swordsman: {
        name: "SWORDSMEN",
        hp: 140,
        damage: 15,
        speed: .045,
        cost: 30,
        range: 35
    },
    archer: {
        name: "ARCHERS",
        hp: 90,
        damage: 20,
        speed: .038,
        cost: 45,
        range: 120
    },
    knight: {
        name: "KNIGHTS",
        hp: 250,
        damage: 35,
        speed: .052,
        cost: 80,
        range: 40
    },
    spearman: {
        name: "SPEARMEN",
        hp: 180,
        damage: 22,
        speed: .04,
        cost: 55,
        range: 45
    },
    crossbow: {
        name: "CROSSBOW",
        hp: 115,
        damage: 30,
        speed: .034,
        cost: 90,
        range: 100
    },
    guard: {
        name: "GUARDS",
        hp: 340,
        damage: 42,
        speed: .026,
        cost: 115,
        range: 45
    },
    mage: {
        name: "MAGES",
        hp: 140,
        damage: 50,
        speed: .032,
        cost: 145,
        range: 120
    }
};

function showToast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.style.display = "block";

    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
        t.style.display = "none";
    }, 1600);
}

function updateStats() {
    document.getElementById("money").textContent = "GOLD: " + Math.floor(money);
    document.getElementById("wave").textContent = "WAVE: " + wave;
    document.getElementById("kingdom").textContent = "KINGDOM: " + kingdom;
    document.getElementById("castles").textContent =
        "CASTLES: " + castlesData.filter(c => c.hp > 0).length;
}

function createInitialKingdom() {
    castlesData = [
        {
            id: 1,
            x: 100,
            y: 325,
            hp: 1000,
            maxHp: 1000
        }
    ];

    roadPoints = [
        {x: 110, y: 325},
        {x: 260, y: 325},
        {x: 430, y: 325},
        {x: 600, y: 325},
        {x: 770, y: 325},
        {x: 940, y: 325},
        {x: 1080, y: 325}
    ];
}

function startGame() {
    money = 250;
    wave = 1;
    kingdom = 1;
    towers = [];
    enemies = [];
    troops = [];
    projectiles = [];
    particles = [];
    selectedTower = null;
    selectedCastle = null;

    createInitialKingdom();

    running = true;
    paused = false;
    waveTimer = 2500;
    spawnTimer = 0;
    spawnLeft = 0;
    waveActive = false;

    document.getElementById("overlay").style.display = "none";

    lastTime = performance.now();

    updateStats();
    requestAnimationFrame(gameLoop);

    autoSave();
}

document.getElementById("startButton").onclick = startGame;

function getUpgradeCost(tower) {
    const level = tower.level;

    if (level < 10) {
        return Math.round(100 + level * 35);
    }

    return Math.round(
        600 +
        Math.pow(level - 9, 1.65) * 350
    );
}

function getUpgradeDamage(tower) {
    if (tower.level < 10) {
        return tower.damage * 1.12;
    }

    return tower.damage * 1.08;
}

function upgradeSelected() {
    if (!selectedTower) {
        showToast("SELECT A TOWER");
        return;
    }

    const cost = getUpgradeCost(selectedTower);

    if (money < cost) {
        showToast("NOT ENOUGH GOLD");
        return;
    }

    money -= cost;

    selectedTower.damage = getUpgradeDamage(selectedTower);
    selectedTower.range += selectedTower.level < 10 ? 6 : 4;
    selectedTower.fireRate *= selectedTower.level < 10 ? .96 : .97;

    selectedTower.level++;

    showToast("TOWER LEVEL " + selectedTower.level);

    updateStats();
    showTowerInfo();

    autoSave();
}

function showTowerInfo() {
    const box = document.getElementById("towerInfo");

    if (!selectedTower) {
        box.style.display = "none";
        return;
    }

    const nextDamage = getUpgradeDamage(selectedTower);
    const cost = getUpgradeCost(selectedTower);

    box.innerHTML =
        "<b>" + towerTypes[selectedTower.type].name + "</b><br>" +
        "LEVEL: " + selectedTower.level + "<br>" +
        "DAMAGE: " + Math.round(selectedTower.damage) + "<br>" +
        "RANGE: " + Math.round(selectedTower.range) + "<br>" +
        "NEXT DAMAGE: " + Math.round(nextDamage) + "<br>" +
        "UPGRADE: $" + cost;

    box.style.display = "block";
}

document.getElementById("upgrade").onclick = upgradeSelected;

document.getElementById("delete").onclick = () => {
    if (!selectedTower) {
        showToast("SELECT A TOWER");
        return;
    }

    money += Math.floor(towerTypes[selectedTower.type].cost * .6);

    towers = towers.filter(t => t !== selectedTower);
    selectedTower = null;

    updateStats();
    showTowerInfo();
};

document.getElementById("pause").onclick = () => {
    paused = !paused;
    document.getElementById("pause").textContent =
        paused ? "RESUME" : "PAUSE";
};

document.getElementById("road").onclick = () => {
    roadMode = !roadMode;
    document.getElementById("road").classList.toggle("selected", roadMode);
};

document.querySelectorAll("[data-tower]").forEach(button => {
    button.onclick = () => {
        selectedTowerType = button.dataset.tower;
        roadMode = false;

        document.querySelectorAll("[data-tower]").forEach(b =>
            b.classList.remove("selected")
        );

        button.classList.add("selected");
    };
});

canvas.addEventListener("click", e => {
    if (!running || paused) return;

    const rect = canvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) * canvas.width / rect.width;
    const y = (e.clientY - rect.top) * canvas.height / rect.height;

    if (roadMode) {
        if (y > 260 && y < 390) {
            roadPoints.push({x, y});
            showToast("ROAD BUILT");
        }

        return;
    }

    const clickedTower = towers.find(t =>
        Math.hypot(t.x - x, t.y - y) < 22
    );

    if (clickedTower) {
        selectedTower = clickedTower;
        selectedCastle = null;
        showTowerInfo();
        return;
    }

    selectedTower = null;
    showTowerInfo();

    if (selectedTowerType) {
        buildTower(x, y, selectedTowerType);
    }
});

function buildTower(x, y, type) {
    const data = towerTypes[type];

    if (money < data.cost) {
        showToast("NOT ENOUGH GOLD");
        return;
    }

    if (Math.abs(y - 325) < 55) {
        showToast("CAN'T BUILD ON ROAD");
        return;
    }

    if (towers.some(t => Math.hypot(t.x - x, t.y - y) < 38)) {
        showToast("TOO CLOSE");
        return;
    }

    money -= data.cost;

    towers.push({
        x,
        y,
        type,
        damage: data.damage,
        range: data.range,
        fireRate: data.fireRate,
        level: 1,
        cooldown: 0
    });

    updateStats();
    autoSave();
}

function startWave() {
    waveActive = true;

    /*
        Fewer enemies as waves rise,
        but their HP becomes much stronger.
    */
    spawnLeft = Math.max(
        4,
        Math.floor(11 + kingdom * 1.5 - wave * .018)
    );

    spawnLeft = Math.min(spawnLeft, 16);

    spawnTimer = 0;
}

function spawnEnemy() {
    const scale =
        1 +
        wave * .075 +
        kingdom * .18;

    let type;

    const roll = Math.random();

    if (wave < 10) {
        type = roll < .7 ? "spearman" : "crossbow";
    } else if (wave < 25) {
        type = roll < .45 ? "crossbow" : "guard";
    } else if (wave < 50) {
        type = roll < .5 ? "guard" : "mage";
    } else {
        type = roll < .35 ? "guard" : "mage";
    }

    const base = troopTypes[type];

    const path = getRandomPath();

    enemies.push({
        type,
        path,
        pathIndex: 0,

        x: path[0].x,
        y: path[0].y,

        hp: Math.round(base.hp * scale * enemyWaveMultiplier()),
        maxHp: Math.round(base.hp * scale * enemyWaveMultiplier()),

        damage: Math.round(
            base.damage *
            (1 + wave * .045 + kingdom * .12)
        ),

        speed:
            base.speed *
            (1 + Math.min(wave * .006, .65)),

        freeze: 0
    });
}

function enemyWaveMultiplier() {
    if (wave < 20) return 1;
    if (wave < 40) return 1.35;
    if (wave < 60) return 1.75;
    if (wave < 100) return 2.3;

    return 2.3 + (wave - 100) * .035;
}

/*
    Several valid road paths.
    Enemies choose one when they spawn.
    Every point remains on the road network.
*/
function getRandomPath() {
    const main = roadPoints.map(p => ({x:p.x,y:p.y}));

    const upper = [
        {x:1080,y:325},
        {x:940,y:325},
        {x:850,y:270},
        {x:700,y:270},
        {x:600,y:325},
        {x:430,y:325},
        {x:260,y:325},
        {x:110,y:325}
    ];

    const lower = [
        {x:1080,y:325},
        {x:940,y:325},
        {x:850,y:380},
        {x:700,y:380},
        {x:600,y:325},
        {x:430,y:325},
        {x:260,y:325},
        {x:110,y:325}
    ];

    const choice = Math.floor(Math.random() * 3);

    if (choice === 1) return upper;
    if (choice === 2) return lower;

    return main.slice().reverse();
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        if (enemy.freeze > 0) {
            enemy.freeze -= dt;
        }

        const speedMultiplier = enemy.freeze > 0 ? .35 : 1;

        if (enemy.pathIndex < enemy.path.length - 1) {
            const target = enemy.path[enemy.pathIndex + 1];

            const dx = target.x - enemy.x;
            const dy = target.y - enemy.y;

            const dist = Math.hypot(dx, dy);

            if (dist < 4) {
                enemy.pathIndex++;
            } else {
                enemy.x += dx / dist * enemy.speed * dt * speedMultiplier;
                enemy.y += dy / dist * enemy.speed * dt * speedMultiplier;
            }
        }

        for (const castle of castlesData) {
            if (castle.hp <= 0) continue;

            const dist = Math.hypot(
                enemy.x - castle.x,
                enemy.y - castle.y
            );

            if (dist < 40) {
                damageCastle(enemy, castle);
                enemies.splice(i, 1);
                break;
            }
        }
    }
}

function damageCastle(enemy, castle) {
    /*
        Enemy deals damage equal to its CURRENT HP,
        then disappears.
    */
    const damage = Math.max(1, Math.round(enemy.hp));

    castle.hp -= damage;

    showToast("CASTLE HIT -" + damage);

    if (castle.hp <= 0) {
        castle.hp = 0;
        showToast("CASTLE FALLEN");
    }

    updateStats();
}

function updateTowers(dt) {
    for (const tower of towers) {
        tower.cooldown -= dt;

        if (tower.cooldown > 0) continue;

        let target = null;
        let closest = Infinity;

        for (const enemy of enemies) {
            const dist = Math.hypot(
                enemy.x - tower.x,
                enemy.y - tower.y
            );

            if (dist <= tower.range && dist < closest) {
                closest = dist;
                target = enemy;
            }
        }

        if (!target) continue;

        tower.cooldown = tower.fireRate;

        fireTower(tower, target);
    }
}

function fireTower(tower, target) {
    const damage = tower.damage;

    if (tower.type === "splash") {
        for (const enemy of enemies) {
            const d = Math.hypot(
                enemy.x - target.x,
                enemy.y - target.y
            );

            if (d < 65) {
                enemy.hp -= damage;
            }
        }
    } else {
        target.hp -= damage;
    }

    if (tower.type === "slow") {
        target.freeze = 1100;
    }

    if (tower.type === "freeze") {
        target.freeze = 1800;
        target.hp -= damage * .35;
    }

    projectiles.push({
        x: tower.x,
        y: tower.y,
        tx: target.x,
        ty: target.y,
        life: 100
    });
}

function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        projectiles[i].life -= dt;

        if (projectiles[i].life <= 0) {
            projectiles.splice(i, 1);
        }
    }
}

function updateTroops(dt) {
    for (let i = troops.length - 1; i >= 0; i--) {
        const troop = troops[i];

        let nearbyEnemy = null;
        let closest = Infinity;

        for (const enemy of enemies) {
            const d = Math.hypot(
                enemy.x - troop.x,
                enemy.y - troop.y
            );

            if (d < closest) {
                closest = d;
                nearbyEnemy = enemy;
            }
        }

        /*
            Swordsmen and melee troops stop moving
            when enemies get close.
        */
        if (
            nearbyEnemy &&
            closest <= troop.range + 15
        ) {
            troop.attackCooldown -= dt;

            if (troop.attackCooldown <= 0) {
                nearbyEnemy.hp -= troop.damage;
                troop.attackCooldown = 900;
            }

            /*
                Enemies can fight back.
            */
            troop.enemyDamageCooldown -= dt;

            if (troop.enemyDamageCooldown <= 0) {
                troop.hp -= nearbyEnemy.damage * .12;
                troop.enemyDamageCooldown = 900;
            }

        } else {
            followRoadTroop(troop, dt);
        }

        if (troop.hp <= 0) {
            troops.splice(i, 1);
        }
    }
}

function followRoadTroop(troop, dt) {
    if (!troop.path || troop.pathIndex >= troop.path.length - 1) {
        return;
    }

    const target = troop.path[troop.pathIndex + 1];

    const dx = target.x - troop.x;
    const dy = target.y - troop.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 5) {
        troop.pathIndex++;
        return;
    }

    troop.x += dx / dist * troop.speed * dt;
    troop.y += dy / dist * troop.speed * dt;
}

function cleanupDeadEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        if (enemies[i].hp <= 0) {
            const enemy = enemies[i];

            money += Math.max(
                3,
                Math.round(
                    troopTypes[enemy.type].hp *
                    .18
                )
            );

            createParticles(enemy.x, enemy.y);

            enemies.splice(i, 1);
        }
    }
}

function updateWave(dt) {
    if (!waveActive) {
        waveTimer -= dt;

        if (waveTimer <= 0) {
            startWave();
        }

        return;
    }

    if (spawnLeft > 0) {
        spawnTimer -= dt;

        if (spawnTimer <= 0) {
            spawnEnemy();
            spawnLeft--;

            /*
                Enemy spacing increases slightly on
                harder waves so there aren't huge crowds.
            */
            spawnTimer = Math.max(
                450,
                850 - wave * 2
            );
        }
    }

    if (
        spawnLeft <= 0 &&
        enemies.length === 0
    ) {
        waveActive = false;

        const payout =
            100 +
            wave * 18 +
            kingdom * 50;

        money += payout;

        showToast(
            "WAVE " + wave +
            " COMPLETE +" + payout
        );

        wave++;

        waveTimer = Math.max(
            2200,
            5000 - wave * 15
        );

        autoSave();

        if (wave % 40 === 0) {
            conquerKingdom();
        }

        updateStats();
    }
}

function conquerKingdom() {
    kingdom++;

    const lane =
        180 +
        Math.random() * 290;

    roadPoints = [
        {x:1080,y:lane},
        {x:930,y:lane},
        {x:780,y:lane},
        {x:620,y:lane},
        {x:460,y:lane},
        {x:300,y:lane},
        {x:110,y:lane}
    ];

    castlesData.push({
        id: castlesData.length + 1,
        x: 100,
        y: lane,
        hp: 1200 + kingdom * 250,
        maxHp: 1200 + kingdom * 250
    });

    showToast("KINGDOM " + kingdom + " CONQUERED");

    updateCastleButtons();
    updateStats();
}

function spawnTroop(type, castle) {
    const data = troopTypes[type];

    if (money < data.cost) {
        showToast("NOT ENOUGH GOLD");
        return;
    }

    money -= data.cost;

    const path = roadPoints.map(p => ({x:p.x,y:p.y}));

    troops.push({
        type,
        x: castle.x + 30,
        y: castle.y,
        hp: data.hp,
        maxHp: data.hp,
        damage: data.damage,
        speed: data.speed,
        range: data.range,
        attackCooldown: 0,
        enemyDamageCooldown: 0,
        path,
        pathIndex: 0
    });

    updateStats();
}

function updateCastleButtons() {
    const bar = document.getElementById("castleBar");
    bar.innerHTML = "";

    castlesData.forEach(castle => {
        const wrapper = document.createElement("div");

        wrapper.innerHTML =
            "<div style='font-size:7px;margin-bottom:3px'>" +
            "CASTLE " + castle.id +
            " HP " + Math.ceil(castle.hp) +
            "</div>";

        [
            ["swordsman","SWORD $30"],
            ["archer","ARCHER $45"],
            ["knight","KNIGHT $80"],
            ["spearman","SPEAR $55"]
        ].forEach(item => {
            const button = document.createElement("button");

            button.className = "castleButton";
            button.textContent = item[1];

            button.onclick = () => {
                if (castle.hp > 0) {
                    spawnTroop(item[0], castle);
                }
            };

            wrapper.appendChild(button);
        });

        bar.appendChild(wrapper);
    });
}

function createParticles(x, y) {
    for (let i = 0; i < 5; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - .5) * .15,
            vy: (Math.random() - .5) * .15,
            life: 500
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawTerrain();
    drawRoads();
    drawCastles();
    drawTowers();
    drawTroops();
    drawEnemies();
    drawProjectiles();
    drawParticles();

    if (paused) {
        ctx.fillStyle = "rgba(0,0,0,.45)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "20px 'Press Start 2P'";
        ctx.textAlign = "center";
        ctx.fillText(
            "PAUSED",
            canvas.width / 2,
            canvas.height / 2
        );
    }
}

function drawTerrain() {
    ctx.fillStyle = "#4d8b45";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,.04)";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}

function drawRoads() {
    if (roadPoints.length < 2) return;

    ctx.lineCap = "round";

    ctx.strokeStyle = "#806f5b";
    ctx.lineWidth = 48;

    ctx.beginPath();

    ctx.moveTo(
        roadPoints[0].x,
        roadPoints[0].y
    );

    for (let i = 1; i < roadPoints.length; i++) {
        ctx.lineTo(
            roadPoints[i].x,
            roadPoints[i].y
        );
    }

    ctx.stroke();

    /*
        Extra valid branch roads.
        No arrows.
    */
    if (roadPoints.length >= 4) {
        ctx.beginPath();
        ctx.moveTo(940,325);
        ctx.lineTo(850,270);
        ctx.lineTo(700,270);
        ctx.lineTo(600,325);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(940,325);
        ctx.lineTo(850,380);
        ctx.lineTo(700,380);
        ctx.lineTo(600,325);
        ctx.stroke();
    }

    ctx.strokeStyle = "#a38e70";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        roadPoints[0].x,
        roadPoints[0].y
    );

    for (let i = 1; i < roadPoints.length; i++) {
        ctx.lineTo(
            roadPoints[i].x,
            roadPoints[i].y
        );
    }

    ctx.stroke();
}

function drawCastles() {
    castlesData.forEach(c => {
        ctx.fillStyle = c.hp > 0 ? "#777" : "#333";

        ctx.fillRect(
            c.x - 28,
            c.y - 40,
            56,
            80
        );

        ctx.fillStyle = c.hp > 0 ? "#999" : "#444";

        ctx.fillRect(
            c.x - 38,
            c.y - 50,
            16,
            20
        );

        ctx.fillRect(
            c.x - 8,
            c.y - 55,
            16,
            25
        );

        ctx.fillRect(
            c.x + 22,
            c.y - 50,
            16,
            20
        );

        ctx.fillStyle = "#222";
        ctx.fillRect(
            c.x - 28,
            c.y + 15,
            56,
            8
        );

        ctx.fillStyle = "#ddd";
        ctx.fillRect(
            c.x - 28,
            c.y + 15,
            56 * Math.max(0,c.hp) / c.maxHp,
            8
        );
    });
}

function drawTowers() {
    towers.forEach(t => {
        ctx.fillStyle =
            towerTypes[t.type].color;

        ctx.fillRect(
            t.x - 13,
            t.y - 13,
            26,
            26
        );

        ctx.fillStyle = "#222";

        ctx.fillRect(
            t.x - 4,
            t.y - 20,
            8,
            20
        );

        ctx.fillStyle = "white";
        ctx.font = "7px 'Press Start 2P'";
        ctx.textAlign = "center";

        ctx.fillText(
            t.level,
            t.x,
            t.y + 28
        );

        if (selectedTower === t) {
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.arc(
                t.x,
                t.y,
                t.range,
                0,
                Math.PI * 2
            );
            ctx.stroke();
        }
    });
}

function drawEnemies() {
    enemies.forEach(e => {
        ctx.fillStyle =
            e.type === "mage"
                ? "#ddd"
                : e.type === "guard"
                ? "#999"
                : "#777";

        ctx.fillRect(
            e.x - 10,
            e.y - 10,
            20,
            20
        );

        ctx.fillStyle = "#222";

        ctx.fillRect(
            e.x - 10,
            e.y - 17,
            20,
            4
        );

        ctx.fillStyle = "#ddd";

        ctx.fillRect(
            e.x - 10,
            e.y - 17,
            20 * Math.max(0,e.hp) / e.maxHp,
            4
        );
    });
}

function drawTroops() {
    troops.forEach(t => {
        ctx.fillStyle =
            t.type === "swordsman"
                ? "#eee"
                : t.type === "knight"
                ? "#bbb"
                : "#ddd";

        ctx.fillRect(
            t.x - 8,
            t.y - 8,
            16,
            16
        );

        ctx.fillStyle = "#222";

        ctx.fillRect(
            t.x - 9,
            t.y - 15,
            18,
            3
        );

        ctx.fillStyle = "#eee";

        ctx.fillRect(
            t.x - 9,
            t.y - 15,
            18 * Math.max(0,t.hp) / t.maxHp,
            3
        );
    });
}

function drawProjectiles() {
    projectiles.forEach(p => {
        ctx.strokeStyle = "#eee";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.tx,p.ty);
        ctx.stroke();
    });
}

function drawParticles() {
    particles.forEach(p => {
        ctx.fillStyle = "#ddd";

        ctx.fillRect(
            p.x,
            p.y,
            3,
            3
        );
    });
}

/*
    BACKGROUND TAB SUPPORT

    Browsers may pause animation frames in hidden tabs.
    When the player returns, we calculate the elapsed
    time and process the game in chunks.
*/
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        hiddenAt = Date.now();
        return;
    }

    if (!hiddenAt || !running) {
        hiddenAt = null;
        return;
    }

    const elapsed = Math.min(
        Date.now() - hiddenAt,
        120000
    );

    hiddenAt = null;

    if (!paused) {
        catchUpGame(elapsed);
    }
});

function catchUpGame(elapsed) {
    /*
        Process hidden time in smaller chunks.
        This prevents huge jumps from breaking physics.
    */
    let remaining = elapsed;

    while (remaining > 0) {
        const step = Math.min(remaining, 100);
        simulate(step);
        remaining -= step;
    }

    showToast(
        "KINGDOM CAUGHT UP +" +
        Math.round(elapsed / 1000) +
        " SEC"
    );

    autoSave();
}

function simulate(dt) {
    if (!running || paused) return;

    updateWave(dt);
    updateEnemies(dt);
    updateTowers(dt);
    updateTroops(dt);
    updateProjectiles(dt);
    cleanupDeadEnemies();
    updateParticles(dt);
}

function gameLoop(now) {
    if (!running) return;

    const dt = Math.min(
        now - lastTime,
        100
    );

    lastTime = now;

    if (!paused) {
        simulate(dt);
    }

    draw();

    /*
        Autosave while playing.
    */
    lastAutoSave += dt;

    if (lastAutoSave >= 30000) {
        lastAutoSave = 0;
        autoSave();
    }

    requestAnimationFrame(gameLoop);
}

function getSaveData() {
    return {
        version: 2,
        money,
        wave,
        kingdom,
        running,
        paused,
        waveTimer,
        spawnTimer,
        spawnLeft,
        waveActive,
        roadPoints,
        castlesData,
        towers,
        enemies,
        troops,
        timestamp: Date.now()
    };
}

function restoreSave(data) {
    if (!data) return false;

    money = data.money ?? 250;
    wave = data.wave ?? 1;
    kingdom = data.kingdom ?? 1;
    waveTimer = data.waveTimer ?? 4000;
    spawnTimer = data.spawnTimer ?? 0;
    spawnLeft = data.spawnLeft ?? 0;
    waveActive = data.waveActive ?? false;

    roadPoints = data.roadPoints || [];
    castlesData = data.castlesData || [];

    towers = data.towers || [];
    enemies = data.enemies || [];
    troops = data.troops || [];

    projectiles = [];
    particles = [];

    running = true;
    paused = false;

    document.getElementById("overlay").style.display = "none";

    updateStats();
    updateCastleButtons();
    showTowerInfo();

    lastTime = performance.now();

    return true;
}

function saveSlot(slot) {
    localStorage.setItem(
        "kingdomWarSave" + slot,
        JSON.stringify(getSaveData())
    );

    showToast("SAVED SLOT " + slot);
}

function loadSlot(slot) {
    const raw = localStorage.getItem(
        "kingdomWarSave" + slot
    );

    if (!raw) {
        showToast("EMPTY SLOT");
        return;
    }

    try {
        restoreSave(JSON.parse(raw));
        showToast("LOADED SLOT " + slot);
    } catch {
        showToast("SAVE ERROR");
    }
}

function autoSave() {
    if (!running) return;

    localStorage.setItem(
        "kingdomWarAutoSave",
        JSON.stringify(getSaveData())
    );

    document.getElementById("autoStatus").textContent =
        "AUTO-SAVE: " +
        new Date().toLocaleTimeString();
}

function loadAutoSave() {
    const raw =
        localStorage.getItem("kingdomWarAutoSave");

    if (!raw) {
        showToast("NO AUTO-SAVE");
        return;
    }

    try {
        restoreSave(JSON.parse(raw));
        showToast("AUTO-SAVE LOADED");
    } catch {
        showToast("AUTO-SAVE ERROR");
    }
}

function copyAuto(slot) {
    const raw =
        localStorage.getItem("kingdomWarAutoSave");

    if (!raw) {
        showToast("NO AUTO-SAVE");
        return;
    }

    localStorage.setItem(
        "kingdomWarSave" + slot,
        raw
    );

    showToast("AUTO → SAVE " + slot);
}

/*
    Keyboard controls.
*/
document.addEventListener("keydown", e => {
    if (e.key === "1") selectTowerButton("basic");
    if (e.key === "2") selectTowerButton("rapid");
    if (e.key === "3") selectTowerButton("heavy");
    if (e.key === "4") selectTowerButton("slow");
    if (e.key === "5") selectTowerButton("splash");
    if (e.key === "6") selectTowerButton("laser");
    if (e.key === "7") selectTowerButton("freeze");

    if (e.key.toLowerCase() === "u") {
        upgradeSelected();
    }

    if (e.key === "Escape") {
        selectedTowerType = null;
        roadMode = false;

        document.querySelectorAll("[data-tower]")
            .forEach(b => b.classList.remove("selected"));

        document.getElementById("road")
            .classList.remove("selected");
    }
});

function selectTowerButton(type) {
    const button =
        document.querySelector(
            `[data-tower="${type}"]`
        );

    if (button) button.click();
}

/*
    RRR = HOME
*/
let rKeys = [];

document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() !== "r") return;

    rKeys.push(Date.now());

    if (rKeys.length > 3) {
        rKeys.shift();
    }

    if (
        rKeys.length === 3 &&
        rKeys[2] - rKeys[0] < 900
    ) {
        window.location.href = "index.html";
        rKeys = [];
    }
});

createInitialKingdom();
updateCastleButtons();
updateStats();
draw();
</script>
