
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard.com</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #eee;
    font-family: "Courier New", monospace;
    text-align: center;
}

#top {
    width: 900px;
    max-width: 96vw;
    margin: 12px auto 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

#title {
    font-size: 24px;
    font-weight: bold;
}

#stats {
    font-size: 13px;
    color: #ccc;
}

canvas {
    width: 900px;
    max-width: 96vw;
    height: auto;
    background: #101010;
    border: 3px solid #555;
    image-rendering: pixelated;
    cursor: crosshair;
}

#towers,
#controls,
#saves {
    width: 900px;
    max-width: 96vw;
    margin: 7px auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
}

button {
    background: #171717;
    color: #eee;
    border: 2px solid #555;
    padding: 8px 10px;
    font-family: "Courier New", monospace;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #303030;
}

.towerButton {
    min-width: 105px;
    font-size: 10px;
}

.towerButton.selected {
    background: #eee;
    color: #000;
    border-color: #fff;
}

#hint {
    color: #777;
    font-size: 11px;
}

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.94);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

#panel {
    width: min(90vw, 470px);
    background: #111;
    border: 3px solid #555;
    padding: 35px;
}

#overlayTitle {
    margin: 0 0 18px;
    font-size: 42px;
}

#overlayText {
    color: #aaa;
    line-height: 1.7;
    font-size: 13px;
}

#overlay button {
    margin: 5px;
}

.retry {
    color: #f22;
    border-color: #f22;
    background: #180000;
    text-shadow: 0 0 8px #f22;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="top">
    <div id="title">TOWER DEFENCE</div>
    <div id="stats"></div>
</div>

<canvas id="game" width="900" height="560"></canvas>

<div id="towers">

    <button class="towerButton" id="basicButton"
        onclick="selectTower('basic')">[1] CANNON $50</button>

    <button class="towerButton" id="rapidButton"
        onclick="selectTower('rapid')">[2] RAPID $75</button>

    <button class="towerButton" id="heavyButton"
        onclick="selectTower('heavy')">[3] HEAVY $120</button>

    <button class="towerButton" id="slowButton"
        onclick="selectTower('slow')">[4] SLOW $100</button>

    <button class="towerButton" id="splashButton"
        onclick="selectTower('splash')">[5] SPLASH $150</button>

    <button class="towerButton" id="laserButton"
        onclick="selectTower('laser')">[6] LASER $200</button>

    <button class="towerButton" id="freezeButton"
        onclick="selectTower('freeze')">[7] FREEZE $250</button>

    <button class="towerButton" id="sniperButton"
        onclick="selectTower('sniper')">[8] SNIPER $300</button>

    <button class="towerButton" id="teslaButton"
        onclick="selectTower('tesla')">[9] TESLA $400</button>

    <button class="towerButton" id="rocketButton"
        onclick="selectTower('rocket')">[0] ROCKET $500</button>

</div>

<div id="controls">

    <button onclick="startWave()">START WAVE</button>
    <button onclick="upgradeSelected()">UPGRADE</button>
    <button onclick="sellSelected()">SELL</button>

</div>

<div id="saves">

    <button onclick="saveGame(1)">SAVE 1</button>
    <button onclick="loadGame(1)">LOAD 1</button>

    <button onclick="saveGame(2)">SAVE 2</button>
    <button onclick="loadGame(2)">LOAD 2</button>

    <button onclick="saveGame(3)">SAVE 3</button>
    <button onclick="loadGame(3)">LOAD 3</button>

</div>

<div id="hint">
    Select a tower → move over the map → click to build.
    Grey = valid. Red = blocked.
</div>


<div id="overlay">

    <div id="panel">

        <h1 id="overlayTitle">
            TOWER DEFENCE
        </h1>

        <p id="overlayText">
            Defend your kingdom.<br><br>
            Survive waves and conquer enemy
            kingdoms to gain more castles.
        </p>

        <button id="mainButton"
            onclick="startGame()">
            START
        </button>

        <button id="homeButton"
            onclick="goHome()"
            class="hidden">
            HOME
        </button>

    </div>

</div>


<script>

/* =====================================================
   BASIC SETUP
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const WIDTH = 900;
const HEIGHT = 560;

const MAX_WAVES =
    100000000;


/* =====================================================
   GAME STATE
===================================================== */

let money = 250;
let wave = 1;

let running = false;
let waveRunning = false;

let enemies = [];
let towers = [];
let bullets = [];
let effects = [];

let selectedTowerType = "basic";
let selectedTower = null;

let spawnLeft = 0;
let spawnTimer = 0;

let mouseX = 450;
let mouseY = 280;

let placementX = 460;
let placementY = 280;

let lastTime = 0;


/* =====================================================
   CASTLES
===================================================== */

let castles = [

    {
        x: 110,
        y: 280,
        hp: 1000,
        maxHp: 1000,
        alive: true,
        number: 1
    }

];


/* =====================================================
   KINGDOM
===================================================== */

let kingdom = 1;


/* =====================================================
   PATHS
===================================================== */

const paths = [

    [
        {x: -30, y: 130},
        {x: 160, y: 130},
        {x: 160, y: 280},
        {x: 300, y: 280},
        {x: 300, y: 430},
        {x: 470, y: 430},
        {x: 470, y: 280},
        {x: 680, y: 280},
        {x: 680, y: 130},
        {x: 930, y: 130}
    ],

    [
        {x: -30, y: 430},
        {x: 150, y: 430},
        {x: 150, y: 280},
        {x: 350, y: 280},
        {x: 350, y: 130},
        {x: 550, y: 130},
        {x: 550, y: 280},
        {x: 750, y: 280},
        {x: 930, y: 280}
    ]

];


/* =====================================================
   TOWER TYPES
===================================================== */

const towerTypes = {

    basic: {
        cost: 50,
        range: 120,
        damage: 15,
        fireRate: 700
    },

    rapid: {
        cost: 75,
        range: 95,
        damage: 7,
        fireRate: 230
    },

    heavy: {
        cost: 120,
        range: 135,
        damage: 42,
        fireRate: 1100
    },

    slow: {
        cost: 100,
        range: 120,
        damage: 9,
        fireRate: 650
    },

    splash: {
        cost: 150,
        range: 125,
        damage: 24,
        fireRate: 950
    },

    laser: {
        cost: 200,
        range: 165,
        damage: 13,
        fireRate: 130
    },

    freeze: {
        cost: 250,
        range: 135,
        damage: 8,
        fireRate: 600
    },

    sniper: {
        cost: 300,
        range: 300,
        damage: 120,
        fireRate: 1800
    },

    tesla: {
        cost: 400,
        range: 155,
        damage: 30,
        fireRate: 700
    },

    rocket: {
        cost: 500,
        range: 200,
        damage: 80,
        fireRate: 1400
    }

};


/* =====================================================
   TOWER UNLOCKS
===================================================== */

const towerUnlocks = {

    basic: 1,
    rapid: 1,
    heavy: 5,
    slow: 10,
    splash: 20,
    laser: 40,
    freeze: 60,
    sniper: 100,
    tesla: 200,
    rocket: 500

};


/* =====================================================
   ENEMY TYPES
===================================================== */

function getEnemyType() {

    const available = [];

    available.push("grunt");

    if (wave >= 11)
        available.push("runner");

    if (wave >= 21)
        available.push("shield");

    if (wave >= 31)
        available.push("armour");

    if (wave >= 41)
        available.push("mage");

    if (wave >= 61)
        available.push("brute");

    if (wave >= 81)
        available.push("siege");

    if (wave >= 150)
        available.push("assassin");

    if (wave >= 300)
        available.push("warlock");

    if (wave >= 500)
        available.push("destroyer");

    return available[
        Math.floor(
            Math.random() *
            available.length
        )
    ];
}


/* =====================================================
   ENEMY STATS
===================================================== */

function enemyStats(type) {

    const scale =
        Math.pow(
            1.012,
            Math.min(wave, 5000)
        );

    const kingdomScale =
        1 +
        (kingdom - 1) *
        0.35;

    const base = {

        grunt: {
            hp: 45,
            speed: 0.35,
            reward: 10
        },

        runner: {
            hp: 30,
            speed: 0.55,
            reward: 14
        },

        shield: {
            hp: 95,
            speed: 0.28,
            reward: 20
        },

        armour: {
            hp: 180,
            speed: 0.23,
            reward: 28
        },

        mage: {
            hp: 130,
            speed: 0.30,
            reward: 35
        },

        brute: {
            hp: 330,
            speed: 0.18,
            reward: 50
        },

        siege: {
            hp: 600,
            speed: 0.14,
            reward: 80
        },

        assassin: {
            hp: 450,
            speed: 0.48,
            reward: 100
        },

        warlock: {
            hp: 1000,
            speed: 0.20,
            reward: 160
        },

        destroyer: {
            hp: 2200,
            speed: 0.12,
            reward: 300
        }

    }[type];

    return {

        hp:
            base.hp *
            scale *
            kingdomScale,

        speed:
            base.speed,

        reward:
            Math.round(
                base.reward *
                kingdomScale
            )

    };
}


/* =====================================================
   START
===================================================== */

function startGame() {

    money = 250;
    wave = 1;
    kingdom = 1;

    enemies = [];
    towers = [];
    bullets = [];
    effects = [];

    castles = [

        {
            x: 110,
            y: 280,
            hp: 1000,
            maxHp: 1000,
            alive: true,
            number: 1
        }

    ];

    selectedTower = null;

    running = true;
    waveRunning = false;

    resetOverlay();

    document
        .getElementById("overlay")
        .classList.add("hidden");

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!running)
        return;

    const dt =
        Math.min(
            time - lastTime,
            50
        );

    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   WAVE
===================================================== */

function startWave() {

    if (
        !running ||
        waveRunning
    )
        return;

    waveRunning = true;

    spawnLeft =
        Math.min(
            100,
            5 +
            Math.floor(
                wave * 0.5
            )
        );

    spawnTimer = 0;
}


/* =====================================================
   SPAWN
===================================================== */

function updateSpawning(dt) {

    if (!waveRunning)
        return;

    spawnTimer -= dt;

    if (
        spawnLeft > 0 &&
        spawnTimer <= 0
    ) {

        spawnEnemy();

        spawnLeft--;

        spawnTimer =
            Math.max(
                350,
                900 -
                Math.min(
                    wave * 2,
                    400
                )
            );
    }

    if (
        spawnLeft <= 0 &&
        enemies.length === 0
    ) {

        waveRunning = false;

        if (
            wave % 40 === 0 &&
            castles.length <
            20
        ) {

            conquerKingdom();

        } else {

            if (
                wave <
                MAX_WAVES
            ) {
                wave++;
            }
        }
    }
}


/* =====================================================
   SPAWN ENEMY
===================================================== */

function spawnEnemy() {

    const type =
        getEnemyType();

    const stats =
        enemyStats(type);

    const route =
        paths[
            Math.floor(
                Math.random() *
                paths.length
            )
        ];

    enemies.push({

        type: type,

        path: route,

        waypoint: 1,

        x: route[0].x,
        y: route[0].y,

        hp: stats.hp,
        maxHp: stats.hp,

        speed: stats.speed,

        reward: stats.reward,

        slow: 1,

        freeze: 0,

        castleTarget:
            castles[
                Math.floor(
                    Math.random() *
                    castles.length
                )
            ]
    });
}


/* =====================================================
   CONQUEST
===================================================== */

function conquerKingdom() {

    kingdom++;

    const number =
        castles.length + 1;

    castles.push({

        x:
            100 +
            ((number - 1) % 4) *
            210,

        y:
            number % 2 === 0
            ? 430
            : 280,

        hp: 1000,
        maxHp: 1000,

        alive: true,

        number: number
    });

    money +=
        300 *
        kingdom;

    effects.push({

        x: 450,
        y: 250,

        life: 1500,

        type: "conquest"
    });

    wave++;
}


/* =====================================================
   ENEMIES
===================================================== */

function updateEnemies(dt) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];

        if (
            enemy.freeze > 0
        ) {

            enemy.freeze -= dt;

            continue;
        }

        const target =
            enemy.path[
                enemy.waypoint
            ];

        if (!target) {

            attackCastle(
                enemy.castleTarget,
                enemy
            );

            enemies.splice(i, 1);

            continue;
        }

        const dx =
            target.x - enemy.x;

        const dy =
            target.y - enemy.y;

        const distance =
            Math.hypot(dx, dy);

        const move =
            enemy.speed *
            enemy.slow *
            dt;

        if (
            distance <= move
        ) {

            enemy.x =
                target.x;

            enemy.y =
                target.y;

            enemy.waypoint++;

        } else {

            enemy.x +=
                dx /
                distance *
                move;

            enemy.y +=
                dy /
                distance *
                move;
        }

        if (
            enemy.slow < 1
        ) {

            enemy.slow =
                Math.min(
                    1,
                    enemy.slow +
                    dt * 0.00015
                );
        }
    }
}


/* =====================================================
   ATTACK CASTLE
===================================================== */

function attackCastle(
    castle,
    enemy
) {

    if (
        !castle ||
        !castle.alive
    ) {

        castle =
            castles.find(
                c => c.alive
            );
    }

    if (!castle)
        return;

    const damage =
        enemy.type === "siege"
        ? 80
        : enemy.type === "destroyer"
        ? 150
        : enemy.type === "brute"
        ? 40
        : 25;

    castle.hp -= damage;

    if (
        castle.hp <= 0
    ) {

        castle.hp = 0;
        castle.alive = false;

        effects.push({

            x: castle.x,
            y: castle.y,

            life: 1000,

            type: "castle"
        });

        if (
            castles.every(
                c => !c.alive
            )
        ) {

            endGame();
        }
    }
}


/* =====================================================
   SELECT TOWER
===================================================== */

function selectTower(type) {

    if (
        wave <
        towerUnlocks[type]
    ) {

        return;
    }

    selectedTowerType = type;

    document
        .querySelectorAll(
            ".towerButton"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "selected"
                )
        );

    document
        .getElementById(
            type + "Button"
        )
        .classList.add(
            "selected"
        );
}


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        mouseX =
            (event.clientX -
            rect.left) *
            WIDTH /
            rect.width;

        mouseY =
            (event.clientY -
            rect.top) *
            HEIGHT /
            rect.height;

        placementX =
            Math.floor(
                mouseX / 40
            ) * 40 + 20;

        placementY =
            Math.floor(
                mouseY / 40
            ) * 40 + 20;
    }
);


/* =====================================================
   BUILD
===================================================== */

canvas.addEventListener(
    "click",
    function() {

        if (!running)
            return;

        /*
           Select tower
        */

        for (
            const tower of towers
        ) {

            if (
                Math.hypot(
                    placementX -
                    tower.x,

                    placementY -
                    tower.y
                ) < 24
            ) {

                selectedTower =
                    tower;

                return;
            }
        }

        const type =
            towerTypes[
                selectedTowerType
            ];

        if (
            money <
            type.cost
        )
            return;

        if (
            pointOnPath(
                placementX,
                placementY
            )
        )
            return;

        if (
            towers.some(
                t =>
                    t.x === placementX &&
                    t.y === placementY
            )
        )
            return;

        money -=
            type.cost;

        towers.push({

            x: placementX,
            y: placementY,

            type:
                selectedTowerType,

            level: 1,

            range:
                type.range,

            damage:
                type.damage,

            fireRate:
                type.fireRate,

            cooldown: 0,

            flash: 0,

            recoil: 0,

            angle: 0
        });
    }
);


/* =====================================================
   PATH CHECK
===================================================== */

function pointOnPath(x, y) {

    for (
        const path of paths
    ) {

        for (
            let i = 0;
            i <
            path.length - 1;
            i++
        ) {

            const a =
                path[i];

            const b =
                path[i + 1];

            if (
                a.x === b.x
            ) {

                if (
                    Math.abs(
                        x - a.x
                    ) < 32 &&
                    y >=
                        Math.min(
                            a.y,
                            b.y
                        ) - 32 &&
                    y <=
                        Math.max(
                            a.y,
                            b.y
                        ) + 32
                )
                    return true;

            } else {

                if (
                    Math.abs(
                        y - a.y
                    ) < 32 &&
                    x >=
                        Math.min(
                            a.x,
                            b.x
                        ) - 32 &&
                    x <=
                        Math.max(
                            a.x,
                            b.x
                        ) + 32
                )
                    return true;
            }
        }
    }

    return false;
}


/* =====================================================
   TOWERS
===================================================== */

function updateTowers(dt) {

    for (
        const tower of towers
    ) {

        tower.cooldown -= dt;

        if (
            tower.flash > 0
        )
            tower.flash -= dt;

        if (
            tower.recoil > 0
        ) {

            tower.recoil -=
                dt * .08;

            if (
                tower.recoil < 0
            )
                tower.recoil = 0;
        }

        if (
            tower.cooldown > 0
        )
            continue;

        let target = null;
        let best = Infinity;

        for (
            const enemy of enemies
        ) {

            const distance =
                Math.hypot(
                    enemy.x -
                    tower.x,

                    enemy.y -
                    tower.y
                );

            if (
                distance <=
                    tower.range &&
                distance < best
            ) {

                target = enemy;
                best = distance;
            }
        }

        if (!target)
            continue;

        tower.angle =
            Math.atan2(
                target.y -
                    tower.y,

                target.x -
                    tower.x
            );

        tower.flash = 100;
        tower.recoil = 6;

        bullets.push({

            x: tower.x,
            y: tower.y,

            target: target,

            damage:
                tower.damage,

            speed:
                tower.type === "laser"
                ? 17
                : tower.type === "sniper"
                ? 11
                : 7,

            tower:
                tower
        });

        tower.cooldown =
            tower.fireRate;
    }
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        if (
            !bullet.target ||
            !enemies.includes(
                bullet.target
            )
        ) {

            bullets.splice(i, 1);
            continue;
        }

        const target =
            bullet.target;

        const dx =
            target.x -
            bullet.x;

        const dy =
            target.y -
            bullet.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        const move =
            bullet.speed *
            dt;

        if (
            distance <=
            move + 4
        ) {

            hitEnemy(
                target,
                bullet.damage,
                bullet.tower
            );

            effects.push({

                x: target.x,
                y: target.y,

                life: 220,

                type: "hit"
            });

            bullets.splice(
                i,
                1
            );

        } else {

            bullet.x +=
                dx /
                distance *
                move;

            bullet.y +=
                dy /
                distance *
                move;
        }
    }
}


/* =====================================================
   HIT
===================================================== */

function hitEnemy(
    enemy,
    damage,
    tower
) {

    enemy.hp -= damage;

    if (
        tower.type === "slow"
    )
        enemy.slow = .45;

    if (
        tower.type === "freeze"
    )
        enemy.freeze = 800;

    if (
        tower.type === "splash"
    )
        splash(
            enemy,
            damage * .55,
            60
        );

    if (
        tower.type === "rocket"
    )
        splash(
            enemy,
            damage * .75,
            95
        );

    if (
        tower.type === "tesla"
    ) {

        let hits = 0;

        for (
            const other of enemies
        ) {

            if (
                other === enemy ||
                hits >= 2
            )
                continue;

            if (
                Math.hypot(
                    other.x -
                        enemy.x,

                    other.y -
                        enemy.y
                ) < 80
            ) {

                other.hp -=
                    damage * .45;

                hits++;

                effects.push({

                    x: other.x,
                    y: other.y,

                    life: 180,

                    type: "electric"
                });
            }
        }
    }

    if (
        enemy.hp <= 0
    )
        killEnemy(enemy);
}


/* =====================================================
   SPLASH
===================================================== */

function splash(
    center,
    damage,
    radius
) {

    for (
        const enemy of enemies
    ) {

        if (
            enemy === center
        )
            continue;

        if (
            Math.hypot(
                enemy.x -
                    center.x,

                enemy.y -
                    center.y
            ) <= radius
        ) {

            enemy.hp -= damage;

            if (
                enemy.hp <= 0
            )
                killEnemy(enemy);
        }
    }
}


/* =====================================================
   KILL
===================================================== */

function killEnemy(enemy) {

    const index =
        enemies.indexOf(
            enemy
        );

    if (
        index === -1
    )
        return;

    enemies.splice(
        index,
        1
    );

    money +=
        enemy.reward;

    effects.push({

        x: enemy.x,
        y: enemy.y,

        life: 300,

        type: "death"
    });
}


/* =====================================================
   EFFECTS
===================================================== */

function updateEffects(dt) {

    for (
        let i =
            effects.length - 1;

        i >= 0;

        i--
    ) {

        effects[i].life -= dt;

        if (
            effects[i].life <= 0
        )
            effects.splice(
                i,
                1
            );
    }
}


/* =====================================================
   UPGRADE
===================================================== */

function upgradeSelected() {

    if (!selectedTower)
        return;

    const cost =
        50 *
        selectedTower.level;

    if (
        money < cost
    )
        return;

    money -= cost;

    selectedTower.level++;

    selectedTower.damage =
        Math.round(
            selectedTower.damage *
            1.35
        );

    selectedTower.range += 10;

    selectedTower.fireRate =
        Math.max(
            80,

            selectedTower.fireRate *
            .9
        );
}


/* =====================================================
   SELL
===================================================== */

function sellSelected() {

    if (!selectedTower)
        return;

    const index =
        towers.indexOf(
            selectedTower
        );

    if (
        index === -1
    )
        return;

    money +=
        25 *
        selectedTower.level;

    towers.splice(
        index,
        1
    );

    selectedTower = null;
}


/* =====================================================
   SAVE
===================================================== */

function saveGame(slot) {

    if (!running)
        return;

    const data = {

        money,
        wave,
        kingdom,

        castles,

        towers:
            towers.map(
                t => ({

                    x: t.x,
                    y: t.y,

                    type: t.type,

                    level: t.level,

                    range: t.range,

                    damage: t.damage,

                    fireRate:
                        t.fireRate
                })
            )
    };

    localStorage.setItem(
        "towerDefenseSave" +
        slot,

        JSON.stringify(data)
    );

    alert(
        "GAME SAVED — SLOT " +
        slot
    );
}


/* =====================================================
   LOAD
===================================================== */

function loadGame(slot) {

    const raw =
        localStorage.getItem(
            "towerDefenseSave" +
            slot
        );

    if (!raw) {

        alert(
            "SAVE SLOT " +
            slot +
            " IS EMPTY"
        );

        return;
    }

    const data =
        JSON.parse(raw);

    money =
        data.money;

    wave =
        data.wave;

    kingdom =
        data.kingdom;

    castles =
        data.castles;

    towers =
        data.towers.map(
            t => ({

                ...t,

                cooldown: 0,
                flash: 0,
                recoil: 0,
                angle: 0
            })
        );

    enemies = [];
    bullets = [];
    effects = [];

    selectedTower = null;

    running = true;
    waveRunning = false;

    resetOverlay();

    document
        .getElementById(
            "overlay"
        )
        .classList.add(
            "hidden"
        );

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    ctx.fillStyle =
        "#101010";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       GRID
    */

    ctx.strokeStyle =
        "#181818";

    ctx.lineWidth = 1;

    for (
        let x = 0;
        x < WIDTH;
        x += 20
    ) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
    }

    for (
        let y = 0;
        y < HEIGHT;
        y += 20
    ) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
    }


    /*
       PATHS
    */

    for (
        const path of paths
    ) {

        ctx.strokeStyle =
            "#3b3b3b";

        ctx.lineWidth = 58;

        ctx.beginPath();

        ctx.moveTo(
            path[0].x,
            path[0].y
        );

        for (
            let i = 1;
            i < path.length;
            i++
        ) {

            ctx.lineTo(
                path[i].x,
                path[i].y
            );
        }

        ctx.stroke();


        ctx.strokeStyle =
            "#555";

        ctx.lineWidth = 2;

        ctx.setLineDash([
            12,
            12
        ]);

        ctx.beginPath();

        ctx.moveTo(
            path[0].x,
            path[0].y
        );

        for (
            let i = 1;
            i < path.length;
            i++
        ) {

            ctx.lineTo(
                path[i].x,
                path[i].y
            );
        }

        ctx.stroke();

        ctx.setLineDash([]);
    }


    /*
       CASTLES
    */

    for (
        const castle of castles
    ) {

        drawCastle(castle);
    }


    /*
       PLACEMENT
    */

    drawPlacement();


    /*
       TOWERS
    */

    for (
        const tower of towers
    ) {

        drawTower(tower);
    }


    /*
       ENEMIES
    */

    for (
        const enemy of enemies
    ) {

        drawEnemy(enemy);
    }


    /*
       BULLETS
    */

    for (
        const bullet of bullets
    ) {

        drawBullet(bullet);
    }


    /*
       EFFECTS
    */

    for (
        const effect of effects
    ) {

        drawEffect(effect);
    }


    updateStats();
}


/* =====================================================
   CASTLE DRAW
===================================================== */

function drawCastle(castle) {

    if (
        !castle.alive
    ) {

        ctx.fillStyle =
            "#151515";

        ctx.fillRect(
            castle.x - 30,
            castle.y - 30,
            60,
            60
        );

        ctx.strokeStyle =
            "#444";

        ctx.strokeRect(
            castle.x - 30,
            castle.y - 30,
            60,
            60
        );

        ctx.fillStyle =
            "#666";

        ctx.font =
            "11px Courier New";

        ctx.fillText(
            "FALLEN",
            castle.x - 21,
            castle.y + 4
        );

        return;
    }


    /*
       CASTLE BODY
    */

    ctx.fillStyle =
        "#777";

    ctx.fillRect(
        castle.x - 30,
        castle.y - 30,
        60,
        60
    );


    /*
       TOWERS
    */

    ctx.fillStyle =
        "#aaa";

    ctx.fillRect(
        castle.x - 38,
        castle.y - 38,
        15,
        25
    );

    ctx.fillRect(
        castle.x + 23,
        castle.y - 38,
        15,
        25
    );

    ctx.fillRect(
        castle.x - 38,
        castle.y + 13,
        15,
        25
    );

    ctx.fillRect(
        castle.x + 23,
        castle.y + 13,
        15,
        25
    );


    /*
       FLAG
    */

    ctx.fillStyle =
        "#eee";

    ctx.fillRect(
        castle.x,
        castle.y - 48,
        3,
        20
    );

    ctx.beginPath();

    ctx.moveTo(
        castle.x + 3,
        castle.y - 48
    );

    ctx.lineTo(
        castle.x + 20,
        castle.y - 42
    );

    ctx.lineTo(
        castle.x + 3,
        castle.y - 35
    );

    ctx.fill();


    /*
       NUMBER
    */

    ctx.fillStyle =
        "#111";

    ctx.font =
        "bold 20px Courier New";

    ctx.fillText(
        castle.number,
        castle.x - 6,
        castle.y + 7
    );


    /*
       HP BAR
    */

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        castle.x - 35,
        castle.y + 48,
        70,
        6
    );

    ctx.fillStyle =
        "#ddd";

    ctx.fillRect(
        castle.x - 35,
        castle.y + 48,
        70 *
        (
            castle.hp /
            castle.maxHp
        ),
        6
    );
}


/* =====================================================
   PLACEMENT
===================================================== */

function drawPlacement() {

    if (!running)
        return;

    const type =
        towerTypes[
            selectedTowerType
        ];

    const valid =
        money >= type.cost &&
        !pointOnPath(
            placementX,
            placementY
        ) &&
        !towers.some(
            t =>
                t.x === placementX &&
                t.y === placementY
        );


    /*
       RANGE
    */

    ctx.strokeStyle =
        valid
        ? "rgba(255,255,255,.22)"
        : "rgba(255,0,0,.2)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        placementX,
        placementY,
        type.range,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
       SQUARE
    */

    ctx.fillStyle =
        valid
        ? "rgba(220,220,220,.18)"
        : "rgba(255,0,0,.2)";

    ctx.fillRect(
        placementX - 20,
        placementY - 20,
        40,
        40
    );


    ctx.strokeStyle =
        valid
        ? "#aaa"
        : "#f33";

    ctx.strokeRect(
        placementX - 20,
        placementY - 20,
        40,
        40
    );
}


/* =====================================================
   TOWER DRAW
===================================================== */

function drawTower(tower) {

    /*
       RANGE
    */

    if (
        selectedTower === tower
    ) {

        ctx.strokeStyle =
            "rgba(255,255,255,.35)";

        ctx.beginPath();

        ctx.arc(
            tower.x,
            tower.y,
            tower.range,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }


    /*
       DIFFERENT COLOURS
    */

    const towerColours = {

        basic: "#d44",
        rapid: "#4af",
        heavy: "#f5a623",
        slow: "#5c6",
        splash: "#b65cff",
        laser: "#4ff",
        freeze: "#8cf",
        sniper: "#eee",
        tesla: "#ff5",
        rocket: "#f66"

    };


    ctx.fillStyle =
        towerColours[
            tower.type
        ];


    /*
       DIFFERENT SHAPES
    */

    ctx.save();

    ctx.translate(
        tower.x,
        tower.y
    );

    /*
       Basic = circle
    */

    if (
        tower.type === "basic"
    ) {

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            18,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    /*
       Rapid = square
    */

    else if (
        tower.type === "rapid"
    ) {

        ctx.fillRect(
            -18,
            -18,
            36,
            36
        );

    }

    /*
       Heavy = diamond
    */

    else if (
        tower.type === "heavy"
    ) {

        ctx.rotate(
            Math.PI / 4
        );

        ctx.fillRect(
            -15,
            -15,
            30,
            30
        );

    }

    /*
       Slow = triangle
    */

    else if (
        tower.type === "slow"
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            -20
        );

        ctx.lineTo(
            20,
            17
        );

        ctx.lineTo(
            -20,
            17
        );

        ctx.closePath();

        ctx.fill();

    }

    /*
       Splash = octagon
    */

    else if (
        tower.type === "splash"
    ) {

        drawPolygon(
            0,
            0,
            20,
            8
        );

    }

    /*
       Laser = tall
    */

    else if (
        tower.type === "laser"
    ) {

        ctx.fillRect(
            -9,
            -21,
            18,
            42
        );

    }

    /*
       Freeze = star
    */

    else if (
        tower.type === "freeze"
    ) {

        drawStar(
            0,
            0,
            21,
            9
        );

    }

    /*
       Sniper = rectangle
    */

    else if (
        tower.type === "sniper"
    ) {

        ctx.fillRect(
            -23,
            -13,
            46,
            26
        );

    }

    /*
       Tesla = circle
    */

    else if (
        tower.type === "tesla"
    ) {

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            21,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle =
            "#111";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            -7,
            -13
        );

        ctx.lineTo(
            5,
            0
        );

        ctx.lineTo(
            -4,
            14
        );

        ctx.stroke();

    }

    /*
       Rocket = hexagon
    */

    else {

        drawPolygon(
            0,
            0,
            21,
            6
        );
    }

    ctx.restore();


    /*
       BARREL
    */

    ctx.save();

    ctx.translate(
        tower.x,
        tower.y
    );

    ctx.rotate(
        tower.angle
    );

    ctx.fillStyle =
        "#111";

    const length =
        19 -
        tower.recoil;

    ctx.fillRect(
        0,
        -4,
        length,
        8
    );

    ctx.restore();


    /*
       MUZZLE FLASH
    */

    if (
        tower.flash > 0
    ) {

        ctx.fillStyle =
            "#fff";

        ctx.beginPath();

        ctx.arc(
            tower.x +
                Math.cos(
                    tower.angle
                ) *
                24,

            tower.y +
                Math.sin(
                    tower.angle
                ) *
                24,

            8 *
                tower.flash /
                100,

            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
       LEVEL
    */

    ctx.fillStyle =
        "#111";

    ctx.font =
        "bold 9px Courier New";

    ctx.fillText(
        tower.level,
        tower.x - 3,
        tower.y + 3
    );
}


/* =====================================================
   POLYGON
===================================================== */

function drawPolygon(
    x,
    y,
    radius,
    sides
) {

    ctx.beginPath();

    for (
        let i = 0;
        i < sides;
        i++
    ) {

        const angle =
            i *
            Math.PI * 2 /
            sides -
            Math.PI / 2;

        const px =
            x +
            Math.cos(angle) *
            radius;

        const py =
            y +
            Math.sin(angle) *
            radius;

        if (i === 0)
            ctx.moveTo(
                px,
                py
            );
        else
            ctx.lineTo(
                px,
                py
            );
    }

    ctx.closePath();
    ctx.fill();
}


/* =====================================================
   STAR
===================================================== */

function drawStar(
    x,
    y,
    radius,
    points
) {

    ctx.beginPath();

    for (
        let i = 0;
        i < points * 2;
        i++
    ) {

        const radius2 =
            i % 2 === 0
            ? radius
            : radius * .4;

        const angle =
            i *
            Math.PI /
            points -
            Math.PI / 2;

        const px =
            x +
            Math.cos(angle) *
            radius2;

        const py =
            y +
            Math.sin(angle) *
            radius2;

        if (i === 0)
            ctx.moveTo(
                px,
                py
            );
        else
            ctx.lineTo(
                px,
                py
            );
    }

    ctx.closePath();
    ctx.fill();
}


/* =====================================================
   ENEMY DRAW
===================================================== */

function drawEnemy(enemy) {

    const colours = {

        grunt: "#e44",
        runner: "#4af",
        shield: "#4c6",
        armour: "#fa3",
        mage: "#b65cff",
        brute: "#f66",
        siege: "#999",
        assassin: "#ff4",
        warlock: "#d35cff",
        destroyer: "#fff"

    };

    const colour =
        colours[
            enemy.type
        ];


    const size =
        enemy.type === "destroyer"
        ? 32
        : enemy.type === "brute"
        ? 28
        : enemy.type === "siege"
        ? 30
        : 21;


    ctx.fillStyle =
        colour;


    /*
       SHAPES
    */

    if (
        enemy.type === "runner"
    ) {

        ctx.beginPath();

        ctx.moveTo(
            enemy.x,
            enemy.y - size
        );

        ctx.lineTo(
            enemy.x + size,
            enemy.y
        );

        ctx.lineTo(
            enemy.x,
            enemy.y + size
        );

        ctx.lineTo(
            enemy.x - size,
            enemy.y
        );

        ctx.closePath();

        ctx.fill();

    }

    else if (
        enemy.type === "mage" ||
        enemy.type === "warlock"
    ) {

        drawStar(
            enemy.x,
            enemy.y,
            size,
            6
        );

    }

    else {

        ctx.fillRect(
            enemy.x -
                size / 2,

            enemy.y -
                size / 2,

            size,
            size
        );
    }


    /*
       EYES
    */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        enemy.x - 6,
        enemy.y - 4,
        4,
        4
    );

    ctx.fillRect(
        enemy.x + 2,
        enemy.y - 4,
        4,
        4
    );


    /*
       HP
    */

    const bar =
        size + 10;

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        enemy.x -
            bar / 2,

        enemy.y -
            size / 2 -
            9,

        bar,
        4
    );

    ctx.fillStyle =
        "#eee";

    ctx.fillRect(
        enemy.x -
            bar / 2,

        enemy.y -
            size / 2 -
            9,

        bar *
            Math.max(
                0,
                enemy.hp /
                enemy.maxHp
            ),

        4
    );
}


/* =====================================================
   BULLET DRAW
===================================================== */

function drawBullet(
    bullet
) {

    ctx.fillStyle =
        "#fff";

    ctx.fillRect(
        bullet.x - 3,
        bullet.y - 3,
        6,
        6
    );

    if (
        bullet.tower.type ===
        "laser"
    ) {

        ctx.fillStyle =
            "rgba(255,255,255,.3)";

        ctx.fillRect(
            bullet.x - 12,
            bullet.y - 2,
            8,
            4
        );
    }
}


/* =====================================================
   EFFECT DRAW
===================================================== */

function drawEffect(
    effect
) {

    if (
        effect.type ===
        "conquest"
    ) {

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 28px Courier New";

        ctx.fillText(
            "KINGDOM CONQUERED!",
            260,
            250
        );

        ctx.font =
            "16px Courier New";

        ctx.fillText(
            "CASTLE " +
            castles.length +
            " JOINED YOUR KINGDOM",
            260,
            280
        );

        return;
    }


    const progress =
        1 -
        effect.life /
        300;

    const size =
        10 +
        progress *
        35;

    ctx.strokeStyle =
        "rgba(255,255,255," +
        (1 - progress) +
        ")";

    ctx.strokeRect(
        effect.x -
            size / 2,

        effect.y -
            size / 2,

        size,
        size
    );
}

        };

        if (
            keys[key]
        ) {

            selectTower(
                keys[key]
            );

        if (
            key !== "r"
        )
            return;

        rCount++;

        clearTimeout(
            rTimer
        );

        rTimer =
            setTimeout(
                function() {

                    rCount = 0;

                },
                700
            );

        if (
            rCount === 3
        ) {

            window.location.href =

            rCount = 0;

);
