
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flashcard Creator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050505;
    color:#eee;
    font-family:"Courier New",monospace;
    text-align:center;
}

#top{
    width:1100px;
    max-width:96vw;
    margin:10px auto;
    display:flex;
    justify-content:space-between;
    font-size:14px;
    font-weight:bold;
}

canvas{
    width:1100px;
    max-width:96vw;
    height:auto;
    background:#101010;
    border:3px solid #555;
    image-rendering:pixelated;
}

#towerBar,
#controls,
#saves{
    width:1100px;
    max-width:96vw;
    margin:7px auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:5px;
}

button{
    background:#151515;
    color:#eee;
    border:2px solid #555;
    padding:9px 12px;
    font-family:"Courier New",monospace;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#292929;
}

.towerButton{
    min-width:120px;
    font-size:10px;
}

.towerButton.locked{
    color:#555;
    border-color:#292929;
    background:#090909;
    cursor:not-allowed;
}

.towerButton.selected{
    background:#ddd;
    color:#000;
    border-color:#fff;
}

#hint{
    color:#777;
    font-size:11px;
    margin:5px;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
}

#panel{
    width:min(90vw,550px);
    background:#111;
    border:3px solid #555;
    padding:35px;
}

#overlayTitle{
    font-size:42px;
    margin:0 0 20px;
}

#overlayText{
    color:#aaa;
    line-height:1.7;
}

.retry{
    color:#f33!important;
    border-color:#f33!important;
    background:#160000!important;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div id="top">
    <div>KINGDOM WAR</div>
    <div id="stats"></div>
</div>

<canvas id="game" width="1100" height="650"></canvas>

<div id="towerBar">

<button class="towerButton selected"
id="basicButton"
onclick="selectTower('basic')">
[1] CANNON $50
</button>

<button class="towerButton"
id="rapidButton"
onclick="selectTower('rapid')">
[2] RAPID $75
</button>

<button class="towerButton locked"
id="heavyButton"
onclick="selectTower('heavy')">
[3] 🔒 HEAVY
</button>

<button class="towerButton locked"
id="slowButton"
onclick="selectTower('slow')">
[4] 🔒 SLOW
</button>

<button class="towerButton locked"
id="splashButton"
onclick="selectTower('splash')">
[5] 🔒 SPLASH
</button>

<button class="towerButton locked"
id="laserButton"
onclick="selectTower('laser')">
[6] 🔒 LASER
</button>

<button class="towerButton locked"
id="freezeButton"
onclick="selectTower('freeze')">
[7] 🔒 FREEZE
</button>

<button class="towerButton locked"
id="sniperButton"
onclick="selectTower('sniper')">
[8] 🔒 SNIPER
</button>

<button class="towerButton locked"
id="teslaButton"
onclick="selectTower('tesla')">
[9] 🔒 TESLA
</button>

<button class="towerButton locked"
id="rocketButton"
onclick="selectTower('rocket')">
[0] 🔒 ROCKET
</button>

</div>

<div id="controls">
    <button onclick="startWave()">START WAVE</button>
    <button onclick="upgradeSelected()">UPGRADE</button>
    <button onclick="sellSelected()">DELETE / SELL</button>
</div>

<div id="saves">
    <button onclick="saveGame(1)">SAVE 1</button>
    <button onclick="loadGame(1)">LOAD 1</button>

    <button onclick="saveGame(2)">SAVE 2</button>
    <button onclick="loadGame(2)">LOAD 2</button>

    <button onclick="saveGame(3)">SAVE 3</button>
    <button onclick="loadGame(3)">LOAD 3</button>
</div>

<div id="hint">
    Click a tower to select it • Click empty ground to build • RRR = Home
</div>

<div id="overlay">

<div id="panel">

<h1 id="overlayTitle">
KINGDOM WAR
</h1>

<p id="overlayText">
Defend Castle 1.<br><br>

You begin with TWO towers.<br>
Defeat enemy castles to unlock new towers
and capture their armies.
</p>

<button id="mainButton" onclick="startGame()">
START
</button>

<button id="homeButton"
class="hidden"
onclick="goHome()">
HOME
</button>

</div>
</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const W=1100;
const H=650;


/* =====================================================
   GAME VARIABLES
===================================================== */

let running=false;
let waveRunning=false;

let money=300;

let wave=1;

let kingdom=1;

let castles=[];

let enemies=[];

let troops=[];

let towers=[];

let bullets=[];

let effects=[];

let selectedTowerType="basic";

let selectedTower=null;

let mouseX=500;
let mouseY=300;

let placementX=500;
let placementY=300;

let spawnLeft=0;
let spawnTimer=0;

let lastTime=0;

let rCount=0;
let rTimer;


/* =====================================================
   UNLOCKS
===================================================== */

/*
    START:
    Castle 1
    Cannon
    Rapid

    Each conquered castle unlocks ONE tower.
*/

let unlockedTowers=[
    "basic",
    "rapid"
];

const unlockOrder=[
    "heavy",
    "slow",
    "splash",
    "laser",
    "freeze",
    "sniper",
    "tesla",
    "rocket"
];


/* =====================================================
   TROOPS
===================================================== */

const troopTypes={

    Swordsmen:{
        hp:130,
        damage:13,
        speed:.045,
        color:"#ddd"
    },

    Archers:{
        hp:80,
        damage:19,
        speed:.038,
        color:"#4af"
    },

    Knights:{
        hp:240,
        damage:32,
        speed:.055,
        color:"#fa3"
    },

    Spearmen:{
        hp:170,
        damage:21,
        speed:.042,
        color:"#5c6"
    },

    Crossbowmen:{
        hp:110,
        damage:29,
        speed:.034,
        color:"#b65cff"
    },

    Guards:{
        hp:320,
        damage:40,
        speed:.026,
        color:"#f66"
    },

    Mages:{
        hp:130,
        damage:48,
        speed:.032,
        color:"#5ff"
    },

    Berserkers:{
        hp:200,
        damage:55,
        speed:.06,
        color:"#f90"
    }
};


/* =====================================================
   TOWERS
===================================================== */

const towerTypes={

basic:{
    cost:50,
    range:125,
    damage:15,
    fireRate:700
},

rapid:{
    cost:75,
    range:105,
    damage:7,
    fireRate:240
},

heavy:{
    cost:120,
    range:145,
    damage:45,
    fireRate:1100
},

slow:{
    cost:100,
    range:130,
    damage:10,
    fireRate:650
},

splash:{
    cost:150,
    range:130,
    damage:27,
    fireRate:950
},

laser:{
    cost:200,
    range:170,
    damage:14,
    fireRate:130
},

freeze:{
    cost:250,
    range:140,
    damage:9,
    fireRate:600
},

sniper:{
    cost:300,
    range:310,
    damage:125,
    fireRate:1800
},

tesla:{
    cost:400,
    range:160,
    damage:32,
    fireRate:700
},

rocket:{
    cost:500,
    range:210,
    damage:85,
    fireRate:1400
}
};


/* =====================================================
   START
===================================================== */

function startGame(){

    money=300;
    wave=1;
    kingdom=1;

    unlockedTowers=[
        "basic",
        "rapid"
    ];

    castles=[
        {
            id:1,
            x:90,
            y:300,
            laneY:300,

            hp:1000,
            maxHp:1000,

            alive:true,
            owner:"player",

            troop:"Swordsmen",

            troopColor:"#ddd"
        }
    ];

    enemies=[];
    troops=[];
    towers=[];
    bullets=[];
    effects=[];

    selectedTower=null;

    selectedTowerType="basic";

    running=true;
    waveRunning=false;

    updateTowerButtons();

    hideOverlay();

    lastTime=
        performance.now();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

    if(!running)
        return;

    const dt=
        Math.min(
            time-lastTime,
            50
        );

    lastTime=time;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

    updateSpawning(dt);

    updateEnemies(dt);

    updateTroops(dt);

    updateTowers(dt);

    updateBullets(dt);

    updateEffects(dt);

}


/* =====================================================
   WAVES
===================================================== */

function startWave(){

    if(!running)
        return;

    if(waveRunning)
        return;

    waveRunning=true;

    spawnLeft=
        Math.min(
            120,
            6+
            Math.floor(
                wave*.6
            )
        );

    spawnTimer=0;

}


/* =====================================================
   SPAWNING
===================================================== */

function updateSpawning(dt){

    if(!waveRunning)
        return;

    spawnTimer-=dt;

    if(
        spawnLeft>0 &&
        spawnTimer<=0
    ){

        spawnEnemy();

        spawnLeft--;

        spawnTimer=
            Math.max(
                350,
                950-
                wave*2
            );
    }

    if(
        spawnLeft<=0 &&
        enemies.length===0
    ){

        waveRunning=false;

        /*
            Every 40 waves:
            conquer next castle.
        */

        if(
            wave%40===0
        ){

            captureCastle();

        }else{

            wave++;
        }
    }
}


/* =====================================================
   ENEMY SPAWN
===================================================== */

function spawnEnemy(){

    let type;

    const roll=
        Math.random();

    if(wave<10){

        type="Spearmen";

    }else if(wave<20){

        type=
            roll<.55
            ?"Spearmen"
            :"Crossbowmen";

    }else if(wave<40){

        type=
            roll<.45
            ?"Crossbowmen"
            :"Guards";

    }else if(wave<80){

        const types=[
            "Crossbowmen",
            "Guards",
            "Mages"
        ];

        type=
            types[
                Math.floor(
                    Math.random()*
                    types.length
                )
            ];

    }else{

        const types=[
            "Guards",
            "Mages",
            "Berserkers"
        ];

        type=
            types[
                Math.floor(
                    Math.random()*
                    types.length
                )
            ];
    }


    const base=
        troopTypes[type];


    const scale=
        1+
        wave*.025+
        kingdom*.12;


    const aliveCastles=
        castles.filter(
            c=>c.alive
        );


    let targetCastle=
        aliveCastles[
            Math.floor(
                Math.random()*
                aliveCastles.length
            )
        ];


    enemies.push({

        type:type,

        x:1080,

        y:300,

        hp:
            base.hp*
            scale,

        maxHp:
            base.hp*
            scale,

        damage:
            base.damage*
            scale,

        speed:
            .035+
            Math.min(
                wave*.00015,
                .03
            ),

        targetCastle:
            targetCastle,

        slow:0
    });

}


/* =====================================================
   ENEMY MOVEMENT
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e=
            enemies[i];


        let speed=
            e.speed;


        if(e.slow>0){

            speed*=.45;

            e.slow-=dt;
        }


        /*
            Before merge:
            move toward target castle lane.
        */

        if(e.x>650){

            e.x-=
                speed*
                dt;

            const targetY=
                e.targetCastle
                ?e.targetCastle.laneY
                :300;

            e.y+=
                (targetY-e.y)*
                .0025*
                dt;

        }else{

            /*
                After merge:
                one giant battlefield.
            */

            e.x-=
                speed*
                dt;
        }


        /*
            Enemy reaches castles.
        */

        if(e.x<80){

            attackCastle(e);

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   CASTLE DAMAGE
===================================================== */

function attackCastle(enemy){

    let castle=
        enemy.targetCastle;


    if(
        !castle ||
        !castle.alive
    ){

        const alive=
            castles.filter(
                c=>c.alive
            );

        if(!alive.length){

            endGame();
            return;
        }

        castle=
            alive[
                Math.floor(
                    Math.random()*
                    alive.length
                )
            ];
    }


    castle.hp-=
        enemy.damage*.35;


    if(castle.hp<=0){

        castle.hp=0;

        castle.alive=false;


        effects.push({

            x:castle.x,

            y:castle.y,

            life:1500,

            type:"fallen"
        });


        if(
            castles.every(
                c=>!c.alive
            )
        ){

            endGame();
        }
    }
}


/* =====================================================
   TROOPS
===================================================== */

function spawnPlayerTroops(){

    for(
        const castle of castles
    ){

        if(!castle.alive)
            continue;


        const data=
            troopTypes[
                castle.troop
            ];


        /*
            Multiple troops per castle
            makes the armies feel alive.
        */

        for(
            let i=0;
            i<3;
            i++
        ){

            troops.push({

                castle:castle,

                x:
                    castle.x+
                    35+
                    i*12,

                y:
                    castle.laneY+
                    (i-1)*13,

                hp:data.hp,

                maxHp:data.hp,

                damage:data.damage,

                speed:data.speed,

                type:castle.troop,

                color:data.color,

                attackCooldown:0
            });
        }
    }
}


/* =====================================================
   TROOP UPDATE
===================================================== */

function updateTroops(dt){

    for(
        const troop of troops
    ){

        troop.attackCooldown-=dt;


        if(
            troop.x<650
        ){

            troop.x+=
                troop.speed*
                dt;

        }else{

            let target=null;

            let closest=Infinity;


            for(
                const enemy of enemies
            ){

                const d=
                    Math.hypot(
                        enemy.x-
                        troop.x,

                        enemy.y-
                        troop.y
                    );


                if(
                    d<45 &&
                    d<closest
                ){

                    closest=d;
                    target=enemy;
                }
            }


            if(target){

                if(
                    troop.attackCooldown<=0
                ){

                    target.hp-=
                        troop.damage;

                    troop.attackCooldown=
                        650;

                    effects.push({

                        x:target.x,

                        y:target.y,

                        life:120,

                        type:"hit"
                    });
                }

            }else{

                troop.x+=
                    troop.speed*
                    dt;
            }
        }
    }


    /*
        Remove dead troops.
    */

    for(
        let i=troops.length-1;
        i>=0;
        i--
    ){

        if(
            troops[i].hp<=0
        ){

            troops.splice(i,1);
        }
    }


    /*
        Remove dead enemies.
    */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        if(
            enemies[i].hp<=0
        ){

            money+=15;

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   SELECT TOWER
===================================================== */

function selectTower(type){

    if(
        !unlockedTowers.includes(
            type
        )
    ){

        return;
    }


    selectedTowerType=type;

    selectedTower=null;

    document
        .querySelectorAll(
            ".towerButton"
        )
        .forEach(
            b=>
            b.classList.remove(
                "selected"
            )
        );


    document
        .getElementById(
            type+"Button"
        )
        .classList.add(
            "selected"
        );
}


/* =====================================================
   UPDATE BUTTONS
===================================================== */

function updateTowerButtons(){

    const names=[
        "basic",
        "rapid",
        "heavy",
        "slow",
        "splash",
        "laser",
        "freeze",
        "sniper",
        "tesla",
        "rocket"
    ];


    names.forEach(
        type=>{

            const button=
                document.getElementById(
                    type+"Button"
                );


            if(
                unlockedTowers.includes(
                    type
                )
            ){

                button.classList.remove(
                    "locked"
                );

                const number=
                    {
                        basic:"[1]",
                        rapid:"[2]",
                        heavy:"[3]",
                        slow:"[4]",
                        splash:"[5]",
                        laser:"[6]",
                        freeze:"[7]",
                        sniper:"[8]",
                        tesla:"[9]",
                        rocket:"[0]"
                    }[type];


                const displayName=
                    type.toUpperCase();


                button.textContent=
                    number+
                    " "+
                    displayName+
                    " $"+
                    towerTypes[type].cost;

            }else{

                button.classList.add(
                    "locked"
                );

                const number=
                    {
                        basic:"[1]",
                        rapid:"[2]",
                        heavy:"[3]",
                        slow:"[4]",
                        splash:"[5]",
                        laser:"[6]",
                        freeze:"[7]",
                        sniper:"[8]",
                        tesla:"[9]",
                        rocket:"[0]"
                    }[type];


                button.textContent=
                    number+
                    " 🔒 "+
                    type.toUpperCase();
            }
        }
    );
}


/* =====================================================
   MOUSE POSITION
===================================================== */

canvas.addEventListener(
"mousemove",
function(e){

    const rect=
        canvas.getBoundingClientRect();


    mouseX=
        (e.clientX-
        rect.left)*
        W/
        rect.width;


    mouseY=
        (e.clientY-
        rect.top)*
        H/
        rect.height;


    placementX=
        Math.floor(
            mouseX/40
        )*
        40+
        20;


    placementY=
        Math.floor(
            mouseY/40
        )*
        40+
        20;
});


/* =====================================================
   CLICK
===================================================== */

canvas.addEventListener(
"click",
function(){

    if(!running)
        return;


    /*
        FIRST:
        select existing tower.
    */

    for(
        const tower of towers
    ){

        if(
            Math.hypot(
                mouseX-tower.x,
                mouseY-tower.y
            )<25
        ){

            selectedTower=tower;

            return;
        }
    }


    /*
        SECOND:
        build.
    */

    const type=
        towerTypes[
            selectedTowerType
        ];


    if(
        money<type.cost
    )
        return;


    if(
        !validPlacement(
            placementX,
            placementY
        )
    )
        return;


    money-=type.cost;


    selectedTower=null;


    towers.push({

        x:placementX,

        y:placementY,

        type:selectedTowerType,

        range:type.range,

        damage:type.damage,

        fireRate:type.fireRate,

        cooldown:0,

        angle:0,

        flash:0,

        level:1
    });

});


/* =====================================================
   VALID PLACEMENT
===================================================== */

function validPlacement(x,y){

    /*
        Don't build on castle lanes.
    */

    for(
        const castle of castles
    ){

        if(
            Math.abs(
                y-castle.laneY
            )<35 &&
            x<650
        )
            return false;


        if(
            Math.hypot(
                x-castle.x,
                y-castle.y
            )<65
        )
            return false;
    }


    /*
        Don't build on merged path.
    */

    if(
        y>265 &&
        y<335 &&
        x>620
    )
        return false;


    /*
        Tower overlap.
    */

    for(
        const tower of towers
    ){

        if(
            Math.hypot(
                x-tower.x,
                y-tower.y
            )<45
        )
            return false;
    }


    return true;
}


/* =====================================================
   TOWERS
===================================================== */

function updateTowers(dt){

    for(
        const tower of towers
    ){

        tower.cooldown-=dt;

        tower.flash=
            Math.max(
                0,
                tower.flash-dt
            );


        if(
            tower.cooldown>0
        )
            continue;


        let target=null;

        let closest=Infinity;


        for(
            const enemy of enemies
        ){

            const d=
                Math.hypot(
                    enemy.x-tower.x,
                    enemy.y-tower.y
                );


            if(
                d<tower.range &&
                d<closest
            ){

                closest=d;
                target=enemy;
            }
        }


        if(!target)
            continue;


        tower.angle=
            Math.atan2(
                target.y-tower.y,
                target.x-tower.x
            );


        tower.flash=100;


        bullets.push({

            x:tower.x,

            y:tower.y,

            target:target,

            damage:tower.damage,

            speed:
                tower.type==="laser"
                ?18
                :8,

            type:tower.type
        });


        tower.cooldown=
            tower.fireRate;
    }
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            bullets[i];


        if(
            !enemies.includes(
                bullet.target
            )
        ){

            bullets.splice(i,1);

            continue;
        }


        const dx=
            bullet.target.x-
            bullet.x;


        const dy=
            bullet.target.y-
            bullet.y;


        const d=
            Math.hypot(dx,dy);


        if(
            d<
            bullet.speed*dt+
            5
        ){

            /*
                Splash ability.
            */

            if(
                bullet.type==="splash"
            ){

                for(
                    const enemy of enemies
                ){

                    if(
                        Math.hypot(
                            enemy.x-
                            bullet.target.x,

                            enemy.y-
                            bullet.target.y
                        )<65
                    ){

                        enemy.hp-=
                            bullet.damage;
                    }
                }

            }else{

                bullet.target.hp-=
                    bullet.damage;
            }


            /*
                Slow tower.
            */

            if(
                bullet.type==="slow"
            ){

                bullet.target.slow=
                    1000;
            }


            /*
                Freeze tower.
            */

            if(
                bullet.type==="freeze"
            ){

                bullet.target.slow=
                    2200;
            }


            effects.push({

                x:bullet.target.x,

                y:bullet.target.y,

                life:170,

                type:"hit"
            });


            bullets.splice(i,1);

        }else{

            bullet.x+=
                dx/d*
                bullet.speed*
                dt;

            bullet.y+=
                dy/d*
                bullet.speed*
                dt;
        }
    }
}


/* =====================================================
   EFFECTS
===================================================== */

function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        effects[i].life-=dt;


        if(
            effects[i].life<=0
        ){

            effects.splice(i,1);
        }
    }
}


/* =====================================================
   CAPTURE CASTLE
===================================================== */

function captureCastle(){

    const id=
        castles.length+1;


    const laneList=[
        130,
        300,
        470,
        200,
        400,
        540
    ];


    const laneY=
        laneList[
            (id-2)%
            laneList.length
        ];


    const enemyTroops=[
        "Archers",
        "Knights",
        "Spearmen",
        "Crossbowmen",
        "Guards",
        "Mages",
        "Berserkers"
    ];


    const newTroop=
        enemyTroops[
            (id-2)%
            enemyTroops.length
        ];


    /*
        Add castle.
    */

    castles.push({

        id:id,

        x:90,

        y:laneY,

        laneY:laneY,

        hp:1000,

        maxHp:1000,

        alive:true,

        owner:"player",

        troop:newTroop,

        troopColor:
            troopTypes[
                newTroop
            ].color
    });


    kingdom++;


    /*
        Unlock ONE new tower.
    */

    const unlockIndex=
        castles.length-2;


    if(
        unlockIndex<
        unlockOrder.length
    ){

        const newTower=
            unlockOrder[
                unlockIndex
            ];


        if(
            !unlockedTowers.includes(
                newTower
            )
        ){

            unlockedTowers.push(
                newTower
            );


            effects.push({

                x:550,

                y:180,

                life:3500,

                type:"unlock",

                tower:newTower
            });
        }
    }


    /*
        Bigger reward.
    */

    money+=
        300+
        kingdom*100;


    /*
        Spawn army from
        ALL castles.
    */

    spawnPlayerTroops();


    effects.push({

        x:550,

        y:230,

        life:2500,

        type:"conquest"
    });


    wave++;
}


/* =====================================================
   UPGRADE
===================================================== */

function upgradeSelected(){

    if(!selectedTower)
        return;


    const cost=
        selectedTower.level*
        50;


    if(
        money<cost
    )
        return;


    money-=cost;


    selectedTower.level++;


    selectedTower.damage=
        Math.round(
            selectedTower.damage*
            1.35
        );


    selectedTower.range+=10;


    selectedTower.fireRate=
        Math.max(
            80,
            selectedTower.fireRate*.9
        );
}


/* =====================================================
   DELETE / SELL
===================================================== */

function sellSelected(){

    if(!selectedTower)
        return;


    const index=
        towers.indexOf(
            selectedTower
        );


    if(index<0)
        return;


    money+=
        Math.floor(
            selectedTower.level*
            25
        );


    towers.splice(
        index,
        1
    );


    selectedTower=null;
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.fillStyle="#101010";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        Grid.
    */

    ctx.strokeStyle="#181818";

    for(
        let x=0;
        x<W;
        x+=20
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    for(
        let y=0;
        y<H;
        y+=20
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }


    drawPaths();

    drawCastles();

    drawPlacement();

    drawTowers();

    drawTroops();

    drawEnemies();

    drawBullets();

    drawEffects();

    updateStats();
}


/* =====================================================
   PATHS
===================================================== */

function drawPaths(){

    /*
        Every castle has its own lane.
    */

    for(
        const castle of castles
    ){

        if(!castle.alive)
            continue;


        ctx.strokeStyle="#444";

        ctx.lineWidth=48;


        ctx.beginPath();

        ctx.moveTo(
            castle.x+30,
            castle.laneY
        );

        ctx.lineTo(
            650,
            castle.laneY
        );

        ctx.stroke();


        ctx.strokeStyle="#777";

        ctx.lineWidth=2;

        ctx.setLineDash([
            10,
            10
        ]);


        ctx.beginPath();

        ctx.moveTo(
            castle.x+30,
            castle.laneY
        );

        ctx.lineTo(
            650,
            castle.laneY
        );

        ctx.stroke();


        ctx.setLineDash([]);
    }


    /*
        Merge into one path.
    */

    ctx.strokeStyle="#444";

    ctx.lineWidth=48;


    ctx.beginPath();

    ctx.moveTo(
        650,
        300
    );

    ctx.lineTo(
        1100,
        300
    );

    ctx.stroke();


    ctx.strokeStyle="#777";

    ctx.lineWidth=2;

    ctx.setLineDash([
        10,
        10
    ]);


    ctx.beginPath();

    ctx.moveTo(
        650,
        300
    );

    ctx.lineTo(
        1100,
        300
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /*
        Merge box.
    */

    if(castles.length>1){

        ctx.fillStyle="#aaa";

        ctx.fillRect(
            635,
            275,
            30,
            50
        );


        ctx.fillStyle="#111";

        ctx.font=
            "bold 11px Courier New";

        ctx.fillText(
            "MERGE",
            628,
            350
        );
    }


    /*
        Enemy gate.
    */

    ctx.fillStyle="#600";

    ctx.fillRect(
        1050,
        260,
        45,
        80
    );


    ctx.fillStyle="#f33";

    ctx.font=
        "bold 12px Courier New";

    ctx.fillText(
        "ENEMY",
        1050,
        250
    );
}


/* =====================================================
   CASTLES
===================================================== */

function drawCastles(){

    for(
        const castle of castles
    ){

        if(!castle.alive){

            ctx.fillStyle="#222";

            ctx.fillRect(
                castle.x-32,

            );

            ctx.font=
                "bold 10px Courier New";

            ctx.fillText(

            );

        }


        /*

        ctx.fillStyle="#777";

            castle.x-32,

        );


        /*
            Towers.
        */

        ctx.fillStyle="#aaa";

        ctx.fillRect(
            castle.x-40,
            castle.y-43,
            15,
            25
        );

        ctx.fillRect(
            castle.x+25,
            castle.y-43,
            15,
            25
        );


        /*
            Flag.
        */

        ctx.fillStyle=
            castle.troopColor;

        ctx.fillRect(
            castle.x,
            castle.y-58,
            3,
            30
        );


        ctx.beginPath();

        ctx.moveTo(
            castle.x+3,
            castle.y-58
        );

        ctx.lineTo(
            castle.x+24,
            castle.y-50
        );

        ctx.lineTo(
            castle.x+3,
            castle.y-42
        );

        ctx.fill();


        /*
            Number.
        */

        ctx.fillStyle="#111";

        ctx.font=
            "bold 20px Courier New";

        ctx.fillText(
            castle.id,
            castle.x-6,

        );


        /*
            HP.
        */

        ctx.fillStyle="#222";

        ctx.fillRect(
            castle.x-40,
            castle.y+45,
            80,
            7
        );


        ctx.fillStyle="#ddd";

        ctx.fillRect(
            castle.x-40,
            castle.y+45,
            80*
            castle.hp/
            castle.maxHp,
            7
        );


        /*
            Troop type.
        */

        ctx.fillStyle=
            castle.troopColor;

        ctx.font=
            "9px Courier New";

        ctx.fillText(
            castle.troop,
            castle.x-35,

}


/* =====================================================
   PLACEMENT PREVIEW
===================================================== */

function drawPlacement(){

    if(!running)
        return;


    const type=
        towerTypes[
            selectedTowerType
        ];


    const valid=
        money>=type.cost &&
        validPlacement(
            placementX,
            placementY
        );


    ctx.strokeStyle=
        valid
        ?"rgba(255,255,255,.35)"
        :"rgba(255,0,0,.5)";


    ctx.lineWidth=2;


    ctx.beginPath();

    ctx.arc(
        placementX,
        placementY,
        type.range,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.fillStyle=
        valid
        ?"rgba(220,220,220,.25)"
        :"rgba(255,0,0,.25)";


    ctx.fillRect(
        placementX-20,
        placementY-20,
        40,
        40
    );


    ctx.strokeStyle=
        valid
        ?"white"
        :"red";


    ctx.strokeRect(
        placementX-20,
        placementY-20,
        40,
        40
    );
}


/* =====================================================
   TOWER DRAW
===================================================== */

function drawTowers(){

    const colours={

        basic:"#d44",

        rapid:"#4af",

        heavy:"#f5a623",

        slow:"#5c6",

        splash:"#b65cff",

        laser:"#4ff",

        freeze:"#8cf",

        sniper:"#eee",

        tesla:"#ff5",

        rocket:"#f66"
    };


    for(
        const tower of towers
    ){

        /*
            Selected range.
        */

        if(
            selectedTower===tower
        ){

            ctx.strokeStyle=
                "rgba(255,255,255,.35)";

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                tower.range,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        ctx.fillStyle=
            colours[
                tower.type
            ];


        /*
            Different tower bodies.
        */

        if(
            tower.type==="heavy"
        ){

            ctx.fillRect(
                tower.x-22,
                tower.y-22,
                44,
                44
            );

        }else if(
            tower.type==="sniper"
        ){

            ctx.beginPath();

            ctx.moveTo(
                tower.x,
                tower.y-24
            );

            ctx.lineTo(
                tower.x+24,
                tower.y+20
            );

            ctx.lineTo(
                tower.x-24,
                tower.y+20
            );

            ctx.closePath();

            ctx.fill();

        }else if(
            tower.type==="tesla"
        ){

            ctx.beginPath();

            for(
                let i=0;
                i<8;
                i++
            ){

                const a=
                    i*
                    Math.PI/4;

                const r=
                    i%2
                    ?12
                    :23;

                const x=
                    tower.x+
                    Math.cos(a)*r;

                const y=
                    tower.y+
                    Math.sin(a)*r;

                if(i===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);
            }

            ctx.closePath();

            ctx.fill();

        }else{

            ctx.fillRect(
                tower.x-18,
                tower.y-18,
                36,
                36
            );
        }


        /*
            Inner design.
        */

        ctx.fillStyle="#111";


        if(
            tower.type==="rapid"
        ){

            ctx.fillRect(
                tower.x-4,
                tower.y-23,
                8,
                46
            );

        }else if(
            tower.type==="laser"
        ){

            ctx.fillRect(
                tower.x-5,
                tower.y-25,
                10,
                50
            );

        }else{

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                8,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        /*
            Barrel.
        */

        ctx.save();

        ctx.translate(
            tower.x,
            tower.y
        );

        ctx.rotate(
            tower.angle
        );

        ctx.fillStyle="#111";

        ctx.fillRect(
            0,
            -4,
            25,
            8
        );

        ctx.restore();


        /*
            Shooting animation.
        */

        if(
            tower.flash>0
        ){

            ctx.fillStyle="#fff";

            ctx.beginPath();

            ctx.arc(
                tower.x+
                Math.cos(
                    tower.angle
                )*
                30,

                tower.y+
                Math.sin(
                    tower.angle
                )*
                30,

                9,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        /*
            Level.
        */

        ctx.fillStyle="#111";

        ctx.font=
            "bold 9px Courier New";

        ctx.fillText(
            tower.level,
            tower.x-3,
            tower.y+3
        );
    }
}


/* =====================================================
   TROOPS

function drawTroops(){

            );

            );

            );

            );

            );

                enemy.y+14
            );

            ctx.lineTo(

/* =====================================================
   SAVE
===================================================== */

function saveGame(slot){

    if(!running)
        return;


    const data={

        money:money,

        wave:wave,

        kingdom:kingdom,

        castles:castles,

        towers:towers,

        unlockedTowers:
            unlockedTowers
    };

        "kingdomWarSave"+
        slot,

        JSON.stringify(data)
    );


    alert(
        "GAME SAVED — SLOT "+

    );

/* =====================================================
   LOAD
===================================================== */

function loadGame(slot){

    const raw=
        localStorage.getItem(
            "kingdomWarSave"+
            slot
        );


    if(!raw){

        alert(
            "SAVE SLOT "+
            slot+
            " IS EMPTY"
        );

        return;
    }


    const data=
        JSON.parse(raw);


    money=data.money;

    wave=data.wave;

    kingdom=data.kingdom;

    castles=data.castles;

    towers=data.towers||[];

    unlockedTowers=
        data.unlockedTowers||
        [
            "basic",
            "rapid"
        ];


    enemies=[];

    troops=[];

    bullets=[];

    effects=[];


    running=true;

    waveRunning=false;

    selectedTower=null;


    updateTowerButtons();

    hideOverlay();


    lastTime=
        performance.now();


    requestAnimationFrame(
        gameLoop
    );
}

        }

});
