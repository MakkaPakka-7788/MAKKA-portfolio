<script>

/* =====================================================
   BASIC
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=1000;
const H=620;

let running=false;
let waveRunning=false;

let money=300;
let wave=1;
let kingdom=1;

let enemies=[];
let troops=[];
let towers=[];
let bullets=[];
let effects=[];

let selectedTowerType="basic";
let selectedTower=null;

let mouseX=500;
let mouseY=300;

let placementX=500;
let placementY=300;

let spawnLeft=0;
let spawnTimer=0;

let lastTime=0;

let rCount=0;
let rTimer;


/* =====================================================
   CASTLES
===================================================== */

/*
    IMPORTANT:

    Castle 1 starts alone.

    After defeating the first enemy:

    1 ──────────────┐
                    ├──────────── ENEMY
    2 ──────────────┘

    Every new castle gets its OWN lane.
*/

let castles=[
{
    id:1,
    x:85,
    y:300,
    hp:1000,
    maxHp:1000,
    alive:true,
    owner:"player",
    troop:"Swordsmen",
    troopColor:"#ddd",
    laneY:300
}
];


/* =====================================================
   TROOP TYPES
===================================================== */

const troopTypes={

    Swordsmen:{
        hp:120,
        damage:12,
        speed:.045,
        color:"#ddd"
    },

    Archers:{
        hp:70,
        damage:18,
        speed:.035,
        color:"#4af"
    },

    Knights:{
        hp:220,
        damage:30,
        speed:.055,
        color:"#fa3"
    },

    Spearmen:{
        hp:160,
        damage:20,
        speed:.04,
        color:"#5c6"
    },

    Crossbowmen:{
        hp:100,
        damage:28,
        speed:.032,
        color:"#b65cff"
    },

    Guards:{
        hp:300,
        damage:38,
        speed:.025,
        color:"#f66"
    },

    Mages:{
        hp:110,
        damage:45,
        speed:.03,
        color:"#5ff"
    }

};


/* =====================================================
   ENEMY TROOPS
===================================================== */

const enemyTroops=[
    "Spearmen",
    "Crossbowmen",
    "Guards",
    "Mages"
];


/* =====================================================
   TOWER TYPES
===================================================== */

const towerTypes={

basic:{cost:50,range:120,damage:15,fireRate:700},
rapid:{cost:75,range:100,damage:7,fireRate:240},
heavy:{cost:120,range:140,damage:42,fireRate:1100},
slow:{cost:100,range:120,damage:9,fireRate:650},
splash:{cost:150,range:125,damage:24,fireRate:950},
laser:{cost:200,range:165,damage:13,fireRate:130},
freeze:{cost:250,range:135,damage:8,fireRate:600},
sniper:{cost:300,range:300,damage:120,fireRate:1800},
tesla:{cost:400,range:155,damage:30,fireRate:700},
rocket:{cost:500,range:200,damage:80,fireRate:1400}

};


/* =====================================================
   START
===================================================== */

function startGame(){

    money=300;
    wave=1;
    kingdom=1;

    enemies=[];
    troops=[];
    towers=[];
    bullets=[];
    effects=[];

    castles=[
    {
        id:1,
        x:85,
        y:300,
        hp:1000,
        maxHp:1000,
        alive:true,
        owner:"player",
        troop:"Swordsmen",
        troopColor:"#ddd",
        laneY:300
    }
    ];

    selectedTower=null;

    running=true;
    waveRunning=false;

    hideOverlay();

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(time){

    if(!running)return;

    const dt=Math.min(time-lastTime,50);

    lastTime=time;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

    updateSpawning(dt);
    updateEnemies(dt);
    updateTroops(dt);
    updateTowers(dt);
    updateBullets(dt);
    updateEffects(dt);

}


/* =====================================================
   WAVES
===================================================== */

function startWave(){

    if(!running || waveRunning)return;

    waveRunning=true;

    spawnLeft=
        Math.min(
            100,
            5+Math.floor(wave*.55)
        );

    spawnTimer=0;
}


/* =====================================================
   ENEMY SPAWNING
===================================================== */

function updateSpawning(dt){

    if(!waveRunning)return;

    spawnTimer-=dt;

    if(
        spawnLeft>0 &&
        spawnTimer<=0
    ){

        spawnEnemy();

        spawnLeft--;

        spawnTimer=
            Math.max(
                400,
                1000-wave*2
            );
    }

    if(
        spawnLeft<=0 &&
        enemies.length===0
    ){

        waveRunning=false;

        /*
            Every 40 waves:
            defeat kingdom and gain castle.
        */

        if(wave%40===0){

            captureNextCastle();

        }else{

            wave++;
        }
    }
}


/* =====================================================
   ENEMY
===================================================== */

function spawnEnemy(){

    let type;

    if(wave<10)
        type="Spearmen";

    else if(wave<20)
        type=
            Math.random()<.5
            ?"Spearmen"
            :"Crossbowmen";

    else if(wave<40)
        type=
            Math.random()<.5
            ?"Crossbowmen"
            :"Guards";

    else
        type=
            enemyTroops[
                Math.floor(
                    Math.random()*
                    enemyTroops.length
                )
            ];

    const base=troopTypes[type];

    const scale=
        1+
        wave*.025+
        kingdom*.15;

    enemies.push({

        type:type,

        x:1030,
        y:300,

        hp:base.hp*scale,
        maxHp:base.hp*scale,

        damage:base.damage*scale,

        speed:.035+

            Math.min(
                wave*.0001,
                .025
            ),

        targetCastle:
            castles[
                Math.floor(
                    Math.random()*
                    castles.length
                )
            ],

        lane:300
    });
}


/* =====================================================
   ENEMY MOVEMENT
===================================================== */

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e=enemies[i];

        /*
            Move toward merge point.
        */

        const targetX=620;

        if(e.x>targetX){

            e.x-=e.speed*dt;

            /*
                Move toward the
                castle's lane.
            */

            const lane=
                e.targetCastle
                ?e.targetCastle.laneY
                :300;

            e.y +=
                (lane-e.y)*
                .002*
                dt;

        }else{

            /*
                After merge:
                move straight left.
            */

            e.x-=e.speed*dt;
        }

        /*
            Reached player side.
        */

        if(e.x<80){

            attackCastle(e);

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   ENEMY ATTACK
===================================================== */

function attackCastle(enemy){

    let alive=
        castles.filter(
            c=>c.alive
        );

    if(!alive.length){

        endGame();
        return;
    }

    let castle=
        enemy.targetCastle;

    if(
        !castle ||
        !castle.alive
    ){

        castle=
            alive[
                Math.floor(
                    Math.random()*
                    alive.length
                )
            ];
    }

    castle.hp-=enemy.damage*.35;

    if(castle.hp<=0){

        castle.hp=0;
        castle.alive=false;

        effects.push({
            x:castle.x,
            y:castle.y,
            life:1000,
            type:"fallen"
        });

        if(
            castles.every(
                c=>!c.alive
            )
        ){

            endGame();
        }
    }
}


/* =====================================================
   PLAYER TROOPS
===================================================== */

function spawnPlayerTroops(){

    for(
        const castle of castles
    ){

        if(!castle.alive)
            continue;

        const data=
            troopTypes[
                castle.troop
            ];

        /*
            Each castle creates
            its own army.
        */

        troops.push({

            castle:castle,

            x:castle.x+45,

            y:castle.laneY,

            hp:data.hp,

            maxHp:data.hp,

            damage:data.damage,

            speed:data.speed,

            type:castle.troop,

            color:data.color,

            attackCooldown:0
        });
    }
}


/* =====================================================
   TROOP UPDATE
===================================================== */

function updateTroops(dt){

    for(
        const troop of troops
    ){

        troop.attackCooldown-=dt;

        /*
            Move toward merge.
        */

        if(troop.x<620){

            troop.x+=
                troop.speed*dt;

        }else{

            /*
                After merge point,
                all troops share
                the same battlefield.
            */

            const enemy=
                enemies.find(
                    e=>
                    Math.hypot(
                        e.x-troop.x,
                        e.y-troop.y
                    )<35
                );

            if(enemy){

                if(
                    troop.attackCooldown<=0
                ){

                    enemy.hp-=troop.damage;

                    troop.attackCooldown=650;

                    effects.push({
                        x:enemy.x,
                        y:enemy.y,
                        life:120,
                        type:"hit"
                    });
                }

            }else{

                troop.x+=
                    troop.speed*dt;
            }
        }
    }


    /*
        Remove dead troops.
    */

    for(
        let i=troops.length-1;
        i>=0;
        i--
    ){

        if(
            troops[i].hp<=0
        ){

            troops.splice(i,1);
        }
    }


    /*
        Remove dead enemies.
    */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        if(
            enemies[i].hp<=0
        ){

            money+=15;

            enemies.splice(i,1);
        }
    }
}


/* =====================================================
   TOWER SELECT
===================================================== */

function selectTower(type){

    selectedTowerType=type;

    document
        .querySelectorAll(
            ".towerButton"
        )
        .forEach(
            b=>b.classList.remove(
                "selected"
            )
        );

    document
        .getElementById(
            type+"Button"
        )
        .classList.add(
            "selected"
        );
}


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
"mousemove",
function(e){

    const rect=
        canvas.getBoundingClientRect();

    mouseX=
        (e.clientX-rect.left)*
        W/rect.width;

    mouseY=
        (e.clientY-rect.top)*
        H/rect.height;

    placementX=
        Math.floor(
            mouseX/40
        )*40+20;

    placementY=
        Math.floor(
            mouseY/40
        )*40+20;

});


/* =====================================================
   BUILD
===================================================== */

canvas.addEventListener(
"click",
function(){

    if(!running)return;

    const type=
        towerTypes[
            selectedTowerType
        ];

    if(
        money<type.cost
    )
        return;

    if(
        !validPlacement(
            placementX,
            placementY
        )
    )
        return;

    money-=type.cost;

    towers.push({

        x:placementX,
        y:placementY,

        type:selectedTowerType,

        range:type.range,

        damage:type.damage,

        fireRate:type.fireRate,

        cooldown:0,

        angle:0,

        flash:0,

        level:1
    });

});


/* =====================================================
   VALID PLACEMENT
===================================================== */

function validPlacement(x,y){

    /*
        Don't build near
        castle lanes.
    */

    for(
        const castle of castles
    ){

        if(
            Math.abs(
                y-castle.laneY
            )<35 &&
            x<650
        )
            return false;

        if(
            Math.hypot(
                x-castle.x,
                y-castle.y
            )<55
        )
            return false;
    }


    /*
        Don't block merged path.
    */

    if(
        y>265 &&
        y<335 &&
        x>600
    )
        return false;


    /*
        Don't overlap towers.
    */

    for(
        const tower of towers
    ){

        if(
            Math.hypot(
                x-tower.x,
                y-tower.y
            )<42
        )
            return false;
    }

    return true;
}


/* =====================================================
   TOWERS
===================================================== */

function updateTowers(dt){

    for(
        const tower of towers
    ){

        tower.cooldown-=dt;

        tower.flash=
            Math.max(
                0,
                tower.flash-dt
            );

        if(
            tower.cooldown>0
        )
            continue;

        let target=null;
        let closest=Infinity;

        for(
            const enemy of enemies
        ){

            const d=
                Math.hypot(
                    enemy.x-tower.x,
                    enemy.y-tower.y
                );

            if(
                d<tower.range &&
                d<closest
            ){

                closest=d;
                target=enemy;
            }
        }

        if(!target)
            continue;

        tower.angle=
            Math.atan2(
                target.y-tower.y,
                target.x-tower.x
            );

        tower.flash=100;

        bullets.push({

            x:tower.x,
            y:tower.y,

            target:target,

            damage:tower.damage,

            speed:
                tower.type==="laser"
                ?18
                :8
        });

        tower.cooldown=
            tower.fireRate;
    }
}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=bullets[i];

        if(
            !enemies.includes(
                b.target
            )
        ){

            bullets.splice(i,1);
            continue;
        }

        const dx=
            b.target.x-b.x;

        const dy=
            b.target.y-b.y;

        const d=
            Math.hypot(dx,dy);

        if(
            d<b.speed*dt+5
        ){

            b.target.hp-=b.damage;

            effects.push({
                x:b.target.x,
                y:b.target.y,
                life:150,
                type:"hit"
            });

            bullets.splice(i,1);

        }else{

            b.x+=
                dx/d*
                b.speed*
                dt;

            b.y+=
                dy/d*
                b.speed*
                dt;
        }
    }
}


/* =====================================================
   EFFECTS
===================================================== */

function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        effects[i].life-=dt;

        if(
            effects[i].life<=0
        )
            effects.splice(i,1);
    }
}


/* =====================================================
   CAPTURE NEXT CASTLE
===================================================== */

function captureNextCastle(){

    const id=
        castles.length+1;

    const newTroop=
        enemyTroops[
            (id-2)%
            enemyTroops.length
        ];

    /*
        New castle is placed
        on another parallel lane.
    */

    const laneList=[
        150,
        300,
        450,
        540,
        210,
        390
    ];

    const laneY=
        laneList[
            (id-2)%
            laneList.length
        ];

    castles.push({

        id:id,

        x:85,

        y:laneY,

        laneY:laneY,

        hp:1000,

        maxHp:1000,

        alive:true,

        owner:"player",

        troop:newTroop,

        troopColor:
            troopTypes[
                newTroop
            ].color
    });


    kingdom++;

    money+=
        300+
        kingdom*100;


    /*
        Spawn troops
        from every castle.
    */

    spawnPlayerTroops();

    effects.push({

        x:500,
        y:220,

        life:2500,

        type:"conquest"
    });

    wave++;
}


/* =====================================================
   UPGRADE
===================================================== */

function upgradeSelected(){

    if(!selectedTower)
        return;

    const cost=
        selectedTower.level*
        50;

    if(
        money<cost
    )
        return;

    money-=cost;

    selectedTower.level++;

    selectedTower.damage=
        Math.round(
            selectedTower.damage*1.35
        );

    selectedTower.range+=10;

    selectedTower.fireRate=
        Math.max(
            80,
            selectedTower.fireRate*.9
        );
}


/* =====================================================
   SELL
===================================================== */

function sellSelected(){

    if(!selectedTower)
        return;

    const i=
        towers.indexOf(
            selectedTower
        );

    if(i<0)return;

    money+=
        Math.floor(
            selectedTower.level*
            25
        );

    towers.splice(i,1);

    selectedTower=null;
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.fillStyle="#101010";
    ctx.fillRect(0,0,W,H);


    /*
        GRID
    */

    ctx.strokeStyle="#181818";

    for(
        let x=0;
        x<W;
        x+=20
    ){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(
        let y=0;
        y<H;
        y+=20
    ){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }


    drawPaths();
    drawCastles();
    drawPlacement();
    drawTowers();
    drawTroops();
    drawEnemies();
    drawBullets();
    drawEffects();

    updateStats();
}


/* =====================================================
   PATHS
===================================================== */

function drawPaths(){

    /*
        Every castle gets
        its own horizontal lane.

        They merge at x=620.
    */

    for(
        const castle of castles
    ){

        if(!castle.alive)
            continue;

        ctx.strokeStyle="#444";
        ctx.lineWidth=48;

        ctx.beginPath();

        ctx.moveTo(
            castle.x+25,
            castle.laneY
        );

        ctx.lineTo(
            620,
            castle.laneY
        );

        ctx.stroke();

        ctx.strokeStyle="#777";
        ctx.lineWidth=2;

        ctx.setLineDash([
            10,10
        ]);

        ctx.beginPath();

        ctx.moveTo(
            castle.x+25,
            castle.laneY
        );

        ctx.lineTo(
            620,
            castle.laneY
        );

        ctx.stroke();

        ctx.setLineDash([]);
    }


    /*
        MERGED MAIN PATH
    */

    if(castles.length){

        ctx.strokeStyle="#444";
        ctx.lineWidth=48;

        ctx.beginPath();

        ctx.moveTo(
            620,
            300
        );

        ctx.lineTo(
            1030,
            300
        );

        ctx.stroke();

        ctx.strokeStyle="#777";
        ctx.lineWidth=2;

        ctx.setLineDash([
            10,10
        ]);

        ctx.beginPath();

        ctx.moveTo(
            620,
            300
        );

        ctx.lineTo(
            1030,
            300
        );

        ctx.stroke();

        ctx.setLineDash([]);
    }


    /*
        MERGE NODE
    */

    if(castles.length>1){

        ctx.fillStyle="#aaa";

        ctx.fillRect(
            605,
            280,
            30,
            40
        );

        ctx.fillStyle="#111";

        ctx.font=
            "bold 12px Courier New";

        ctx.fillText(
            "MERGE",
            600,
            345
        );
    }
}


/* =====================================================
   CASTLES
===================================================== */

function drawCastles(){

    for(
        const castle of castles
    ){

        if(!castle.alive){

            ctx.fillStyle="#222";

            ctx.fillRect(
                castle.x-32,
                castle.y-32,
                64,
                64
            );

            continue;
        }

        /*
            Castle body
        */

        ctx.fillStyle="#777";

        ctx.fillRect(
            castle.x-32,
            castle.y-32,
            64,
            64
        );


        /*
            Towers
        */

        ctx.fillStyle="#aaa";

        ctx.fillRect(
            castle.x-40,
            castle.y-42,
            15,
            25
        );

        ctx.fillRect(
            castle.x+25,
            castle.y-42,
            15,
            25
        );


        /*
            Flag
        */

        ctx.fillStyle=
            castle.troopColor;

        ctx.fillRect(
            castle.x,
            castle.y-55,
            3,
            25
        );

        ctx.beginPath();

        ctx.moveTo(
            castle.x+3,
            castle.y-55
        );

        ctx.lineTo(
            castle.x+23,
            castle.y-48
        );

        ctx.lineTo(
            castle.x+3,
            castle.y-40
        );

        ctx.fill();


        /*
            Castle number
        */

        ctx.fillStyle="#111";

        ctx.font=
            "bold 20px Courier New";

        ctx.fillText(
            castle.id,
            castle.x-6,
            castle.y+7
        );


        /*
            HP
        */

        ctx.fillStyle="#222";

        ctx.fillRect(
            castle.x-38,
            castle.y+45,
            76,
            6
        );

        ctx.fillStyle="#ddd";

        ctx.fillRect(
            castle.x-38,
            castle.y+45,
            76*
            castle.hp/
            castle.maxHp,
            6
        );


        /*
            Troop label
        */

        ctx.fillStyle=
            castle.troopColor;

        ctx.font=
            "9px Courier New";

        ctx.fillText(
            castle.troop,
            castle.x-35,
            castle.y+65
        );
    }
}


/* =====================================================
   PLACEMENT
===================================================== */

function drawPlacement(){

    if(!running)return;

    const type=
        towerTypes[
            selectedTowerType
        ];

    const valid=
        money>=type.cost &&
        validPlacement(
            placementX,
            placementY
        );

    ctx.strokeStyle=
        valid
        ?"rgba(255,255,255,.35)"
        :"rgba(255,0,0,.4)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        placementX,
        placementY,
        type.range,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.fillStyle=
        valid
        ?"rgba(210,210,210,.25)"
        :"rgba(255,0,0,.25)";

    ctx.fillRect(
        placementX-20,
        placementY-20,
        40,
        40
    );

    ctx.strokeStyle=
        valid
        ?"white"
        :"red";

    ctx.strokeRect(
        placementX-20,
        placementY-20,
        40,
        40
    );
}


/* =====================================================
   TOWERS DRAW
===================================================== */

function drawTowers(){

    const colours={
        basic:"#d44",
        rapid:"#4af",
        heavy:"#f5a623",
        slow:"#5c6",
        splash:"#b65cff",
        laser:"#4ff",
        freeze:"#8cf",
        sniper:"#eee",
        tesla:"#ff5",
        rocket:"#f66"
    };

    for(
        const tower of towers
    ){

        if(
            selectedTower===tower
        ){

            ctx.strokeStyle=
                "rgba(255,255,255,.3)";

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                tower.range,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }


        ctx.fillStyle=
            colours[tower.type];

        ctx.fillRect(
            tower.x-18,
            tower.y-18,
            36,
            36
        );


        /*
            Different tower shapes.
        */

        ctx.fillStyle="#111";

        if(
            tower.type==="basic"
        ){

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                10,
                0,
                Math.PI*2
            );

            ctx.fill();

        }else if(
            tower.type==="rapid"
        ){

            ctx.fillRect(
                tower.x-4,
                tower.y-22,
                8,
                44
            );

        }else if(
            tower.type==="heavy"
        ){

            ctx.fillRect(
                tower.x-12,
                tower.y-12,
                24,
                24
            );

        }else if(
            tower.type==="laser"
        ){

            ctx.fillRect(
                tower.x-4,
                tower.y-24,
                8,
                48
            );

        }else{

            ctx.beginPath();

            ctx.arc(
                tower.x,
                tower.y,
                7,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        /*
            Barrel
        */

        ctx.save();

        ctx.translate(
            tower.x,
            tower.y
        );

        ctx.rotate(
            tower.angle
        );

        ctx.fillStyle="#111";

        ctx.fillRect(
            0,
            -4,
            22,
            8
        );

        ctx.restore();


        /*
            Shooting flash
        */

        if(
            tower.flash>0
        ){

            ctx.fillStyle="white";

            ctx.beginPath();

            ctx.arc(
                tower.x+
                Math.cos(
                    tower.angle
                )*28,

                tower.y+
                Math.sin(
                    tower.angle
                )*28,

                8,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        ctx.fillStyle="#111";

        ctx.font=
            "bold 9px Courier New";

        ctx.fillText(
            tower.level,
            tower.x-3,
            tower.y+3
        );
    }
}


/* =====================================================
   TROOPS DRAW
===================================================== */

function drawTroops(){

    for(
        const troop of troops
    ){

        ctx.fillStyle=
            troop.color;

        /*
            Body
        */

        ctx.fillRect(
            troop.x-7,
            troop.y-9,
            14,
            18
        );


        /*
            Weapon
        */

        ctx.strokeStyle="#111";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            troop.x,
            troop.y
        );

        ctx.lineTo(
            troop.x+13,
            troop.y-12
        );

        ctx.stroke();


        /*
            HP
        */

        ctx.fillStyle="#222";

        ctx.fillRect(
            troop.x-10,
            troop.y-15,
            20,
            3
        );

        ctx.fillStyle="#ddd";

        ctx.fillRect(
            troop.x-10,
            troop.y-15,
            20*
            Math.max(
                0,
                troop.hp/
                troop.maxHp
            ),
            3
        );
    }
}


/* =====================================================
   ENEMIES DRAW
===================================================== */

function drawEnemies(){

    const colours={
        Spearmen:"#5c6",
        Crossbowmen:"#b65cff",
        Guards:"#f66",
        Mages:"#5ff"
    };

    for(
        const enemy of enemies
    ){

        ctx.fillStyle=
            colours[
                enemy.type
            ]||"#f33";


        /*
            Different enemy shapes.
        */

        if(
            enemy.type==="Spearmen"
        ){

            ctx.fillRect(
                enemy.x-9,
                enemy.y-9,
                18,
                18
            );

        }else if(
            enemy.type==="Crossbowmen"
        ){

            ctx.beginPath();

            ctx.moveTo(
                enemy.x,
                enemy.y-13
            );

            ctx.lineTo(
                enemy.x+13,
                enemy.y
            );

            ctx.lineTo(
                enemy.x,
                enemy.y+13
            );

            ctx.lineTo(
                enemy.x-13,
                enemy.y
            );

            ctx.closePath();

            ctx.fill();

        }else if(
            enemy.type==="Guards"
        ){

            ctx.fillRect(
                enemy.x-14,
                enemy.y-14,
                28,
                28
            );

        }else{

            ctx.beginPath();

            ctx.arc(
                enemy.x,
                enemy.y,
                14,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        /*
            HP
        */

        ctx.fillStyle="#222";

        ctx.fillRect(
            enemy.x-14,
            enemy.y-21,
            28,
            4
        );

        ctx.fillStyle="#eee";

        ctx.fillRect(
            enemy.x-14,
            enemy.y-21,
            28*
            Math.max(
                0,
                enemy.hp/
                enemy.maxHp
            ),
            4
        );
    }
}


/* =====================================================
   BULLETS
===================================================== */

function drawBullets(){

    for(
        const b of bullets
    ){

        ctx.fillStyle="white";

        ctx.fillRect(
            b.x-3,
            b.y-3,
            6,

        );
    }
}


/* =====================================================
   EFFECTS
===================================================== */

function drawEffects(){

/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const alive=
        castles.filter(
            c=>c.alive
        ).length;

    document.getElementById(
        "stats"
    ).textContent=
        "$"+money+
        " | Castles "+
        alive+
        "/"+
        castles.length+
        " | Kingdom "+
        kingdom+
        " | Wave "+
        wave;
}


/* =====================================================
   SAVE
===================================================== */

function saveGame(slot){

    if(!running)return;

    const data={
        money,
        wave,
        kingdom,
        castles,
        towers
    };

    localStorage.setItem(
        "kingdomTDsave"+slot,
        JSON.stringify(data)
    );

    alert(
        "GAME SAVED TO SLOT "+slot
    );
}


/* =====================================================
   LOAD
===================================================== */

function loadGame(slot){

    const raw=
        localStorage.getItem(
            "kingdomTDsave"+slot
        );

    if(!raw){

        alert(
            "SAVE SLOT "+slot+
            " IS EMPTY"
        );

        return;
    }

    const data=
        JSON.parse(raw);

    money=data.money;
    wave=data.wave;
    kingdom=data.kingdom;
    castles=data.castles;
    towers=data.towers||[];

    enemies=[];
    troops=[];
    bullets=[];
    effects=[];

    running=true;
    waveRunning=false;

    selectedTower=null;

    hideOverlay();

    lastTime=
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    running=false;
    waveRunning=false;

    const title=
        document.getElementById(
            "overlayTitle"
        );

    title.textContent="RETRY";
    title.className="retry";

    document.getElementById(
        "overlayText"
    ).innerHTML=
        "ALL YOUR CASTLES HAVE FALLEN"+
        "<br><br>"+
        "Kingdom: "+kingdom+
        "<br>"+
        "Wave: "+wave+
        "<br><br>"+
        "Your save slots are safe.";

    const button=
        document.getElementById(
            "mainButton"
        );

    button.textContent="RETRY";
    button.onclick=startGame;
    button.className="retry";

    document.getElementById(
        "homeButton"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "overlay"
    ).classList.remove(
        "hidden"
    );
}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    /*
        If your homepage has a different
        filename, change this to that file.
    */

    window.location.href="index.html";
}


/* =====================================================
   HIDE OVERLAY
===================================================== */

function hideOverlay(){

    document.getElementById(
        "overlay"
    ).classList.add(
        "hidden"
    );
}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
"keydown",
function(e){

    const key=
        e.key.toLowerCase();

    const keys={
        "1":"basic",
        "2":"rapid",
        "3":"heavy",
        "4":"slow",
        "5":"splash",
        "6":"laser",
        "7":"freeze",
        "8":"sniper",
        "9":"tesla",
        "0":"rocket"
    };

    if(keys[key]){
        selectTower(
            keys[key]
        );
    }


    /*
        RRR = HOME
    */

    if(key==="r"){

        rCount++;

        clearTimeout(
            rTimer
        );

        rTimer=
            setTimeout(
                ()=>{
                    rCount=0;
                },
                700
            );

        if(rCount===3){

            rCount=0;

            goHome();
        }
    }

});


/* =====================================================
   INITIAL
===================================================== */

updateStats();
draw();

</script>
