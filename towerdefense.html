<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KINGDOM WAR</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080808;
color:#eee;
font-family:"Courier New",monospace;
overflow-x:auto
}
#stats{
width:1150px;
margin:10px auto 5px;
background:#111;
border:2px solid #333;
padding:8px;
display:flex;
gap:18px;
font-size:14px;
font-weight:bold
}
#gameWrap{
width:1150px;
margin:auto;
background:#0d0d0d;
border:2px solid #333;
padding:7px
}
#mapBox{
width:1130px;
height:630px;
border:3px solid #444;
background:#050505;
overflow:hidden;
position:relative
}
#game{
display:block;
width:1124px;
height:624px;
cursor:grab;
user-select:none;
touch-action:none
}
#game.dragging{
cursor:grabbing
}
#towerInfo{
height:105px;
background:#111;
border:2px solid #333;
margin-top:7px;
padding:8px;
font-size:13px;
line-height:18px;
overflow:hidden
}
.toolbar{
background:#101010;
border:2px solid #333;
padding:6px;
margin-top:7px
}
#towerbar,#zonebar,#troopbar{
display:grid;
gap:4px
}
#towerbar{
grid-template-columns:repeat(10,1fr)
}
#zonebar{
grid-template-columns:repeat(8,1fr);
margin-top:5px
}
#troopbar{
grid-template-columns:repeat(7,1fr);
margin-top:5px
}
button{
background:#191919;
border:2px solid #444;
color:#eee;
font-family:"Courier New",monospace;
font-weight:bold;
font-size:11px;
padding:7px 3px;
cursor:pointer
}
button:hover{
background:#292929;
border-color:#777
}
button.active{
background:#333;
border-color:#fff
}
button.locked{
opacity:.35;
cursor:not-allowed
}
#controls{
display:flex;
gap:5px;
margin-top:7px
}
#controls button{
flex:1
}
.castlebar,.savebar{
display:flex;
gap:5px;
margin-top:7px
}
.castlebar button,.savebar button{
flex:1
}
.info{
font-size:11px;
color:#aaa;
padding:6px 2px
}
#overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
z-index:10
}
#overlayBox{
width:430px;
background:#111;
border:3px solid #555;
padding:30px;
text-align:center
}
#overlayBox h1{
margin:0 0 20px;
font-size:30px
}
#overlayBox button{
width:48%;
margin:1%
}
</style>
</head>
<body>

<div id="stats">
<div>GOLD: $<span id="gold">0</span></div>
<div>WAVE: <span id="wave">1</span></div>
<div>KINGDOM: <span id="kingdom">1</span></div>
<div>CASTLE HP: <span id="castleHp">1000</span></div>
<div>ENEMIES: <span id="enemyCount">0</span></div>
</div>

<div id="gameWrap">

<div id="mapBox">
<canvas id="game" width="1124" height="624"></canvas>

<div id="overlay">
<div id="overlayBox">
<h1>KINGDOM LOST</h1>
<button onclick="retryGame()">RETRY</button>
<button onclick="goHome()">HOME</button>
</div>
</div>
</div>

<div id="towerInfo">SELECT A TOWER, TROOP OR TERRAIN TYPE</div>

<div class="toolbar">
<div id="towerbar"></div>
<div id="zonebar"></div>
<div id="troopbar"></div>
</div>

<div id="controls">
<button onclick="upgradeSelected()">UPGRADE</button>
<button onclick="sellSelected()">DELETE / SELL</button>
<button onclick="buildRoad()">BUILD ROAD</button>
<button onclick="togglePause()">PAUSE</button>
</div>

<div class="castlebar">
<button onclick="selectTroop(0)">SWORDSMAN</button>
<button onclick="selectTroop(1)">ARCHER</button>
<button onclick="selectTroop(2)">KNIGHT</button>
<button onclick="selectTroop(3)">MAGE</button>
<button onclick="selectTroop(4)">GUARD</button>
<button onclick="selectTroop(5)">HEALER</button>
<button onclick="selectTroop(6)">GIANT</button>
</div>

<div class="savebar">
<button onclick="saveGame()">SAVE</button>
<button onclick="loadGame()">LOAD</button>
<button onclick="resetGame()">RESET</button>
</div>

<div class="info">
DRAG THE MAP TO LOOK AROUND • CLICK TO BUILD • SELECT TERRAIN THEN DRAG TO PAINT • RRR = HOME
</div>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const VIEW_W=1124;
const VIEW_H=624;
const WORLD_W=2200;
const WORLD_H=1200;
const TILE=50;
const ZONE_COST=150;

const towerTypes=[
{name:"Basic",cost:60,damage:22,range:125,rate:700,color:"#4da6ff",unlock:1},
{name:"Rapid",cost:90,damage:10,range:135,rate:220,color:"#ffcc33",unlock:1},
{name:"Heavy",cost:140,damage:65,range:145,rate:1100,color:"#ff7043",unlock:1},
{name:"Slow",cost:120,damage:12,range:150,rate:800,color:"#8e9eff",unlock:1},
{name:"Splash",cost:170,damage:35,range:135,rate:1000,color:"#ff4d88",unlock:1},
{name:"Laser",cost:230,damage:18,range:190,rate:170,color:"#ff3333",unlock:2},
{name:"Freeze",cost:250,damage:9,range:155,rate:700,color:"#66eaff",unlock:2},
{name:"Poison",cost:280,damage:14,range:160,rate:600,color:"#9cff33",unlock:2},
{name:"Sniper",cost:350,damage:150,range:300,rate:1900,color:"#d9d9d9",unlock:3},
{name:"Tesla",cost:420,damage:38,range:175,rate:850,color:"#b266ff",unlock:3},
{name:"Mortar",cost:480,damage:80,range:250,rate:1800,color:"#a87952",unlock:3},
{name:"Flame",cost:520,damage:17,range:105,rate:260,color:"#ff6600",unlock:4},
{name:"Ice",cost:580,damage:28,range:180,rate:650,color:"#99ffff",unlock:4},
{name:"Ballista",cost:650,damage:220,range:280,rate:2400,color:"#b58a5a",unlock:5},
{name:"Catapult",cost:700,damage:125,range:260,rate:2100,color:"#806040",unlock:5},
{name:"Void",cost:800,damage:100,range:220,rate:1000,color:"#7b4dff",unlock:6},
{name:"Meteor",cost:950,damage:250,range:290,rate:2600,color:"#ff452e",unlock:7},
{name:"Crystal",cost:1100,damage:70,range:240,rate:500,color:"#e8aaff",unlock:7},
{name:"Guardian",cost:1400,damage:120,range:200,rate:700,color:"#59d98e",unlock:8},
{name:"King",cost:2000,damage:300,range:350,rate:1800,color:"#ffd700",unlock:9}
];

const zoneTypes=[
{name:"FOREST",color:"#315c38",bonus:1.25,buffs:["Rapid","Poison","Flame"]},
{name:"HILLS",color:"#75633c",bonus:1.25,buffs:["Heavy","Sniper","Ballista"]},
{name:"CRYSTAL",color:"#704f91",bonus:1.30,buffs:["Crystal","Tesla","Laser"]},
{name:"MOUNTAIN",color:"#555962",bonus:1.25,buffs:["King","Mortar","Catapult"]},
{name:"SWAMP",color:"#3d6351",bonus:1.30,buffs:["Poison","Slow","Void"]},
{name:"ICE",color:"#507b88",bonus:1.30,buffs:["Ice","Freeze","Guardian"]},
{name:"DESERT",color:"#876b3f",bonus:1.25,buffs:["Flame","Meteor","Catapult"]},
{name:"PLAINS",color:"#66704a",bonus:1.20,buffs:["Basic","Splash","Guardian"]}
];

const troopTypes=[
{name:"SWORDSMAN",cost:80,damage:22,hp:180,speed:28,color:"#ddd"},
{name:"ARCHER",cost:100,damage:28,hp:100,speed:25,color:"#d8a05c"},
{name:"KNIGHT",cost:180,damage:55,hp:400,speed:22,color:"#aaa"},
{name:"MAGE",cost:250,damage:75,hp:150,speed:20,color:"#a96cff"},
{name:"GUARD",cost:300,damage:35,hp:650,speed:17,color:"#65d98b"},
{name:"HEALER",cost:350,damage:8,hp:180,speed:18,color:"#ffff9a"},
{name:"GIANT",cost:700,damage:140,hp:1500,speed:12,color:"#ff7043"}
];

let game;
let selectedTower=null;
let selectedZone=null;
let selectedTroop=null;
let placingType=null;

let cameraX=0;
let cameraY=0;

let pointerDown=false;
let isDragging=false;
let dragMoved=false;
let startX=0;
let startY=0;
let startCameraX=0;
let startCameraY=0;
let lastPaintX=0;
let lastPaintY=0;

let keyBuffer="";
let lastTime=performance.now();

function newGame(){
game={
gold:1500,
wave:1,
kingdom:1,
castleHp:1000,
towers:[],
enemies:[],
troops:[],
zones:[],
zoneLevels:Array(zoneTypes.length).fill(1),
road:[
{x:1740,y:475},
{x:1580,y:475},
{x:1460,y:560},
{x:1280,y:560},
{x:1120,y:440},
{x:950,y:440},
{x:790,y:580},
{x:620,y:580},
{x:500,y:475},
{x:250,y:475}
],
waveTimer:0,
spawnTimer:0,
spawned:0,
waveActive:false,
paused:false,
gameOver:false
};

selectedTower=null;
selectedZone=null;
selectedTroop=null;
placingType=null;

cameraX=0;
cameraY=0;

document.getElementById("overlay").style.display="none";
updateInfo();
}

function clamp(v,a,b){
return Math.max(a,Math.min(b,v));
}

function getMouse(e){
const rect=canvas.getBoundingClientRect();

return{
x:(e.clientX-rect.left)*(canvas.width/rect.width),
y:(e.clientY-rect.top)*(canvas.height/rect.height)
};
}

function screenToWorld(e){
const p=getMouse(e);

return{
x:p.x+cameraX,
y:p.y+cameraY
};
}

function clampCamera(){
cameraX=clamp(cameraX,0,WORLD_W-VIEW_W);
cameraY=clamp(cameraY,0,WORLD_H-VIEW_H);
}

function validTerrainTile(tx,ty){
const x=tx*TILE;
const y=ty*TILE;

if(x<0||y<0||x>=WORLD_W||y>=WORLD_H)return false;

if(Math.hypot(x+25-250,y+25-475)<120)return false;
if(Math.hypot(x+25-1740,y+25-475)<120)return false;

for(let i=0;i<game.road.length-1;i++){
const a=game.road[i];
const b=game.road[i+1];

const dx=b.x-a.x;
const dy=b.y-a.y;
const len=dx*dx+dy*dy;

let t=len?((x+25-a.x)*dx+(y+25-a.y)*dy)/len:0;
t=clamp(t,0,1);

const px=a.x+t*dx;
const py=a.y+t*dy;

if(Math.hypot(x+25-px,y+25-py)<38)return false;
}

return true;
}

function tileExists(type,tx,ty){
return game.zones.some(z=>z.type===type&&z.tx===tx&&z.ty===ty);
}

function addTile(type,tx,ty){
if(!validTerrainTile(tx,ty))return false;
if(game.zones.some(z=>z.tx===tx&&z.ty===ty))return false;
if(game.gold<ZONE_COST)return false;

game.gold-=ZONE_COST;
game.zones.push({type,tx,ty});

return true;
}

function paintTileAt(x,y){
if(selectedZone===null)return;

const tx=Math.floor(x/TILE);
const ty=Math.floor(y/TILE);

addTile(selectedZone,tx,ty);
}

function paintLine(x1,y1,x2,y2){
if(selectedZone===null)return;

const tx1=Math.floor(x1/TILE);
const ty1=Math.floor(y1/TILE);
const tx2=Math.floor(x2/TILE);
const ty2=Math.floor(y2/TILE);

const dx=tx2-tx1;
const dy=ty2-ty1;
const steps=Math.max(Math.abs(dx),Math.abs(dy),1);

for(let i=0;i<=steps;i++){
const tx=Math.round(tx1+dx*i/steps);
const ty=Math.round(ty1+dy*i/steps);
addTile(selectedZone,tx,ty);
}
}

function zoneTiles(index){
return game.zones.filter(z=>z.type===index);
}

function zoneUpgradeCost(index){
const tiles=zoneTiles(index).length;

if(!tiles)return 0;

return Math.floor(
(900+tiles*180)*
Math.pow(2.15,game.zoneLevels[index]-1)
);
}

function zoneBuff(t){
const tx=Math.floor(t.x/TILE);
const ty=Math.floor(t.y/TILE);

const z=game.zones.find(v=>v.tx===tx&&v.ty===ty);

if(!z)return{bonus:1,rate:1,name:""};

const type=zoneTypes[z.type];

if(!type.buffs.includes(towerTypes[t.type].name)){
return{bonus:1,rate:1,name:type.name};
}

const level=game.zoneLevels[z.type];

return{
bonus:1+(type.bonus-1)*level,
rate:Math.max(.55,1-.15*level),
name:type.name
};
}

function canPlaceTower(x,y){
if(x<20||y<20||x>WORLD_W-20||y>WORLD_H-20)return false;

if(Math.hypot(x-250,y-475)<100)return false;
if(Math.hypot(x-1740,y-475)<100)return false;

for(let i=0;i<game.road.length-1;i++){
const a=game.road[i];
const b=game.road[i+1];

const dx=b.x-a.x;
const dy=b.y-a.y;
const len=dx*dx+dy*dy;

let t=len?((x-a.x)*dx+(y-a.y)*dy)/len:0;
t=clamp(t,0,1);

const px=a.x+t*dx;
const py=a.y+t*dy;

if(Math.hypot(x-px,y-py)<38)return false;
}

return !game.towers.some(t=>Math.hypot(t.x-x,t.y-y)<35);
}

function placeTower(type,x,y){
const d=towerTypes[type];

if(game.wave<d.unlock)return;
if(game.gold<d.cost)return;
if(!canPlaceTower(x,y))return;

game.gold-=d.cost;

game.towers.push({
type,
x,
y,
level:1,
lastShot:0,
angle:0,
flash:0,
target:null
});
}

function towerUpgradeCost(t){
return Math.floor(
towerTypes[t.type].cost*
(.75+.55*t.level)
);
}

function upgradeTower(t){
if(!t)return;

const cost=towerUpgradeCost(t);

if(game.gold<cost)return;

game.gold-=cost;
t.level++;
}

function upgradeZone(){
if(selectedZone===null)return;

const tiles=zoneTiles(selectedZone);

if(!tiles.length)return;

const cost=zoneUpgradeCost(selectedZone);

if(game.gold<cost)return;

game.gold-=cost;
game.zoneLevels[selectedZone]++;
}

function upgradeSelected(){
if(selectedZone!==null){
upgradeZone();
}else if(selectedTower){
upgradeTower(selectedTower);
}

updateInfo();
}

function sellSelected(){
if(!selectedTower)return;

const d=towerTypes[selectedTower.type];

game.gold+=Math.floor(
d.cost*(.55+.15*(selectedTower.level-1))
);

const index=game.towers.indexOf(selectedTower);

if(index>=0){
game.towers.splice(index,1);
}

selectedTower=null;
updateInfo();
}

function selectTroop(index){
selectedTroop=index;
selectedTower=null;
selectedZone=null;
placingType=null;
updateInfo();
}

function spawnTroop(index){
const d=troopTypes[index];

if(game.gold<d.cost)return;

game.gold-=d.cost;

game.troops.push({
type:index,
x:270,
y:475,
hp:d.hp,
maxHp:d.hp,
attackTimer:0
});
}

function spawnEnemy(){
let type="normal";

if(game.wave>=20&&Math.random()<.035){
type="boss";
}else if(game.wave>=10&&Math.random()<.08){
type="tank";
}else if(Math.random()<.22){
type="fast";
}

let hp=160*(1+game.wave*.13);
let damage=20+game.wave*1.2;
let speed=11+Math.min(game.wave*.08,2);

if(type==="fast"){
hp=110*(1+game.wave*.12);
damage=18+game.wave;
speed*=1.2;
}

if(type==="tank"){
hp=650*(1+game.wave*.18);
damage=50+game.wave*2;
speed*=.65;
}

if(type==="boss"){
hp=2500*(1+game.wave*.22);
damage=120+game.wave*5;
speed*=.5;
}

game.enemies.push({
type,
hp,
maxHp:hp,
damage,
speed,
progress:0,
slow:0,
poison:0,
poisonTimer:0
});
}

function roadLength(){
let total=0;

for(let i=0;i<game.road.length-1;i++){
total+=Math.hypot(
game.road[i+1].x-game.road[i].x,
game.road[i+1].y-game.road[i].y
);
}

return total;
}

function roadPoint(progress){
const target=progress*roadLength();
let distance=0;

for(let i=0;i<game.road.length-1;i++){
const a=game.road[i];
const b=game.road[i+1];

const length=Math.hypot(b.x-a.x,b.y-a.y);

if(distance+length>=target){
const t=(target-distance)/length;

return{
x:a.x+(b.x-a.x)*t,
y:a.y+(b.y-a.y)*t
};
}

distance+=length;
}

return game.road[game.road.length-1];
}

function updateWaves(dt){
if(game.paused||game.gameOver)return;

if(!game.waveActive){
game.waveTimer+=dt;

if(game.waveTimer>=2500){
game.waveTimer=0;
game.waveActive=true;
game.spawned=0;
game.spawnTimer=0;
}

return;
}

const count=5+game.wave*2+Math.floor(game.wave/5);

game.spawnTimer+=dt;

if(game.spawned<count&&game.spawnTimer>=650){
game.spawnTimer=0;
spawnEnemy();
game.spawned++;
}

if(game.spawned>=count&&game.enemies.length===0){
game.waveActive=false;
game.wave++;
game.waveTimer=0;
}
}

function updateEnemies(dt){
if(game.paused||game.gameOver)return;

for(let i=game.enemies.length-1;i>=0;i--){
const e=game.enemies[i];

if(e.poison>0){
e.poisonTimer+=dt;

if(e.poisonTimer>=500){
e.poisonTimer=0;
e.hp-=e.poison;
}
}

if(e.slow>0)e.slow-=dt;

let speed=e.speed;

if(e.slow>0)speed*=.45;

e.progress+=speed*dt/200000;

if(e.progress>=1){
game.castleHp-=e.damage;
game.enemies.splice(i,1);

if(game.castleHp<=0){
game.castleHp=0;
endGame();
}
}
}
}

function updateTowers(dt){
if(game.paused||game.gameOver)return;

for(const t of game.towers){
const d=towerTypes[t.type];
const buff=zoneBuff(t);

const rate=d.rate*
buff.rate/
Math.pow(1.08,t.level-1);

t.lastShot+=dt;
t.flash=Math.max(0,t.flash-dt);

let best=null;
let bestProgress=-1;

for(const e of game.enemies){
const p=roadPoint(e.progress);
const distance=Math.hypot(p.x-t.x,p.y-t.y);

if(distance<=d.range&&e.progress>bestProgress){
best=e;
bestProgress=e.progress;
}
}

t.target=best;

if(!best)continue;

const p=roadPoint(best.progress);

t.angle=Math.atan2(
p.y-t.y,
p.x-t.x
);

if(t.lastShot<rate)continue;

t.lastShot=0;
t.flash=100;

const damage=
d.damage*
Math.pow(1.18,t.level-1)*
buff.bonus;

if(t.type===3)best.slow=1500;
if(t.type===6)best.slow=2200;
if(t.type===7)best.poison=Math.max(best.poison,damage*.25);

if(t.type===4){
for(const e of game.enemies){
const q=roadPoint(e.progress);

if(Math.hypot(q.x-p.x,q.y-p.y)<55){
e.hp-=damage*.65;
}
}
}else if(t.type===10){
for(const e of game.enemies){
const q=roadPoint(e.progress);

if(Math.hypot(q.x-t.x,q.y-t.y)<d.range*.7){
e.hp-=damage*.45;
}
}
}else{
best.hp-=damage;
}

if(
t.type===11||
t.type===14||
t.type===15||
t.type===16||
t.type===17
){
for(const e of game.enemies){
const q=roadPoint(e.progress);

if(Math.hypot(q.x-p.x,q.y-p.y)<50){
e.hp-=damage*.35;
}
}
}
}

for(let i=game.enemies.length-1;i>=0;i--){
if(game.enemies[i].hp<=0){
const e=game.enemies[i];

game.gold+=
e.type==="boss"?500:
e.type==="tank"?100:35;

game.enemies.splice(i,1);
}
}
}

function updateTroops(dt){
if(game.paused||game.gameOver)return;

for(let i=game.troops.length-1;i>=0;i--){
const tr=game.troops[i];
const d=troopTypes[tr.type];

let target=null;
let best=Infinity;

for(const e of game.enemies){
const p=roadPoint(e.progress);
const distance=Math.hypot(p.x-tr.x,p.y-tr.y);

if(distance<best){
best=distance;
target=e;
}
}

if(target){
const p=roadPoint(target.progress);
const distance=Math.hypot(p.x-tr.x,p.y-tr.y);

if(distance>30){
const dx=(p.x-tr.x)/distance;
const dy=(p.y-tr.y)/distance;

tr.x+=dx*d.speed*dt/1000;
tr.y+=dy*d.speed*dt/1000;
}else{
tr.attackTimer+=dt;

if(tr.attackTimer>=700){
tr.attackTimer=0;
target.hp-=d.damage;
}
}
}else{
tr.x+=d.speed*dt/1000;
}

if(d.name==="HEALER"){
game.castleHp=Math.min(
1000,
game.castleHp+dt*.003
);
}

if(tr.hp<=0||tr.x>1780){
game.troops.splice(i,1);
}
}
}

function togglePause(){
game.paused=!game.paused;
}

function buildRoad(){
game.road=[
{x:1740,y:475},
{x:1580,y:475},
{x:1460,y:560},
{x:1280,y:560},
{x:1120,y:440},
{x:950,y:440},
{x:790,y:580},
{x:620,y:580},
{x:500,y:475},
{x:250,y:475}
];
}

function drawWorld(){
ctx.fillStyle="#101010";
ctx.fillRect(0,0,WORLD_W,WORLD_H);

drawGrid();
drawZones();
drawRoad();
drawBase();
drawCastle();
drawTowers();
drawTroops();
drawEnemies();

if(selectedTower){
drawTowerRange(selectedTower);
}

if(selectedZone!==null){
for(const tile of game.zones){
if(tile.type!==selectedZone)continue;

ctx.fillStyle="rgba(255,255,255,.08)";
ctx.fillRect(
tile.tx*TILE,
tile.ty*TILE,
TILE,
TILE
);
}
}

ctx.strokeStyle="#555";
ctx.lineWidth=5;
ctx.strokeRect(
2,
2,
WORLD_W-4,
WORLD_H-4
);
}

function drawGrid(){
ctx.strokeStyle="#181818";
ctx.lineWidth=1;

for(let x=0;x<=WORLD_W;x+=TILE){
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,WORLD_H);
ctx.stroke();
}

for(let y=0;y<=WORLD_H;y+=TILE){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(WORLD_W,y);
ctx.stroke();
}
}

function seeded(x,y){
const n=Math.sin(x*12.9898+y*78.233)*43758.5453;
return n-Math.floor(n);
}

function drawZones(){
for(const z of game.zones){
const type=zoneTypes[z.type];
const x=z.tx*TILE;
const y=z.ty*TILE;
const level=game.zoneLevels[z.type];

ctx.fillStyle=type.color;
ctx.fillRect(x,y,TILE,TILE);

ctx.strokeStyle="rgba(0,0,0,.45)";
ctx.strokeRect(
x+.5,
y+.5,
TILE-1,
TILE-1
);

if(z.type===0){
for(let i=0;i<4;i++){
const tx=x+8+seeded(z.tx+i*3,z.ty+i)*34;
const ty=y+25+seeded(z.tx+i,z.ty+i*2)*17;

ctx.strokeStyle="#24472b";
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(tx,ty+12);
ctx.lineTo(tx,ty);
ctx.stroke();

ctx.fillStyle="#1f4328";
ctx.beginPath();
ctx.arc(
tx,
ty,
6+level,
0,
Math.PI*2
);
ctx.fill();
}
}

if(z.type===1){
ctx.fillStyle="#8b7549";
ctx.beginPath();
ctx.moveTo(x+4,y+42);
ctx.lineTo(x+16,y+24);
ctx.lineTo(x+28,y+33);
ctx.lineTo(x+45,y+12);
ctx.lineTo(x+50,y+45);
ctx.closePath();
ctx.fill();
}

if(z.type===2){
for(let i=0;i<3;i++){
const cx=x+10+i*16;
const cy=y+35-(i%2)*9;

ctx.fillStyle="#c69bdd";
ctx.beginPath();
ctx.moveTo(cx,cy+10);
ctx.lineTo(cx+6,cy-12-level*2);
ctx.lineTo(cx+12,cy+10);
ctx.closePath();
ctx.fill();
}
}

if(z.type===3){
ctx.fillStyle="#3e4249";
ctx.beginPath();
ctx.moveTo(x+2,y+48);
ctx.lineTo(x+13,y+22);
ctx.lineTo(x+22,y+30);
ctx.lineTo(x+34,y+8);
ctx.lineTo(x+48,y+48);
ctx.closePath();
ctx.fill();
}

if(z.type===4){
ctx.fillStyle="#557f63";
ctx.fillRect(x+5,y+10,14,7);
ctx.fillRect(x+28,y+30,16,7);

ctx.fillStyle="#284a38";

ctx.beginPath();
ctx.arc(x+15,y+36,6,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(x+40,y+17,5,0,Math.PI*2);
ctx.fill();
}

if(z.type===5){
ctx.strokeStyle="#8cc8d8";
ctx.lineWidth=2;

for(let i=0;i<3;i++){
ctx.beginPath();
ctx.moveTo(x+5,y+12+i*13);
ctx.lineTo(x+45,y+17+i*13);
ctx.stroke();
}
}

if(z.type===6){
ctx.strokeStyle="#b18b51";
ctx.lineWidth=2;

for(let i=0;i<4;i++){
ctx.beginPath();
ctx.arc(
x+15+i*9,
y+18+(i%2)*15,
10,
0,
Math.PI
);
ctx.stroke();
}

if(seeded(z.tx,z.ty)>.45){
ctx.fillStyle="#78935c";
ctx.fillRect(x+36,y+30,4,13);
ctx.fillRect(x+33,y+33,10,3);
}
}

if(z.type===7){
ctx.strokeStyle="#879664";
ctx.lineWidth=1;

for(let i=0;i<8;i++){
const gx=x+5+seeded(z.tx,i)*40;
const gy=y+8+seeded(z.ty,i*2)*35;

ctx.beginPath();
ctx.moveTo(gx,gy);
ctx.lineTo(gx+2,gy-5);
ctx.stroke();
}
}

if(level>1){
ctx.fillStyle="rgba(255,255,255,.55)";
ctx.font="9px Courier New";
ctx.fillText(
"L"+level,
x+3,
y+11
);
}
}
}

function drawRoad(){
ctx.lineCap="round";
ctx.lineJoin="round";

ctx.strokeStyle="#242424";
ctx.lineWidth=46;

ctx.beginPath();
ctx.moveTo(
game.road[0].x,
game.road[0].y
);

for(let i=1;i<game.road.length;i++){
ctx.lineTo(
game.road[i].x,
game.road[i].y
);
}

ctx.stroke();

ctx.strokeStyle="#3a3a3a";
ctx.lineWidth=34;

ctx.beginPath();
ctx.moveTo(
game.road[0].x,
game.road[0].y
);

for(let i=1;i<game.road.length;i++){
ctx.lineTo(
game.road[i].x,
game.road[i].y
);
}

ctx.stroke();

ctx.strokeStyle="#555";
ctx.lineWidth=2;
ctx.setLineDash([12,12]);

ctx.beginPath();
ctx.moveTo(
game.road[0].x,
game.road[0].y
);

for(let i=1;i<game.road.length;i++){
ctx.lineTo(
game.road[i].x,
game.road[i].y
);
}

ctx.stroke();
ctx.setLineDash([]);
}

function drawBase(){
ctx.fillStyle="#450d0d";
ctx.fillRect(1680,405,120,140);

ctx.fillStyle="#9e2020";
ctx.fillRect(1690,415,100,120);

ctx.fillStyle="#ddd";
ctx.font="bold 14px Courier New";
ctx.textAlign="center";
ctx.fillText("ENEMY BASE",1740,465);

ctx.fillStyle="#111";
ctx.fillRect(1705,485,70,10);

ctx.fillStyle="#e33";
ctx.fillRect(1705,485,70,10);

ctx.textAlign="left";
}

function drawCastle(){
ctx.fillStyle="#25344a";
ctx.fillRect(190,405,120,140);

ctx.fillStyle="#4d75a8";
ctx.fillRect(200,415,100,120);

ctx.fillStyle="#111";
ctx.fillRect(205,430,90,10);

ctx.fillStyle="#4caf50";
ctx.fillRect(
205,
430,
90*(game.castleHp/1000),
10
);

ctx.fillStyle="#ddd";
ctx.font="bold 14px Courier New";
ctx.textAlign="center";

ctx.fillText("KINGDOM",250,465);
ctx.fillText("CASTLE",250,483);

ctx.textAlign="left";
}

function drawTowerRange(t){
ctx.strokeStyle="rgba(255,255,255,.28)";
ctx.lineWidth=2;

ctx.beginPath();
ctx.arc(
t.x,
t.y,
towerTypes[t.type].range,
0,
Math.PI*2
);
ctx.stroke();
}

function drawTowers(){
for(const t of game.towers){
const d=towerTypes[t.type];
const buff=zoneBuff(t);

ctx.save();

if(buff.bonus>1){
ctx.strokeStyle="rgba(255,255,255,.5)";
ctx.lineWidth=2;

ctx.beginPath();
ctx.arc(t.x,t.y,18,0,Math.PI*2);
ctx.stroke();
}

ctx.translate(t.x,t.y);
ctx.rotate(t.angle);

ctx.fillStyle="#050505";
ctx.fillRect(5,-3,25,6);

if(
t.type===2||
t.type===10||
t.type===11||
t.type===14||
t.type===15
){
ctx.fillStyle="#111";
ctx.fillRect(7,-5,27,10);
}

ctx.restore();

ctx.fillStyle=d.color;

ctx.beginPath();
ctx.arc(t.x,t.y,14,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#050505";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle="#050505";
ctx.font="bold 10px Courier New";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(
t.level,
t.x,
t.y
);

if(t.flash>0){
ctx.strokeStyle="#fff";
ctx.lineWidth=3;

ctx.beginPath();

if(t.type===5||t.type===10){
ctx.arc(t.x,t.y,22,0,Math.PI*2);
}else if(t.target){
const p=roadPoint(t.target.progress);

ctx.moveTo(t.x,t.y);
ctx.lineTo(p.x,p.y);
}

ctx.stroke();
}

if(selectedTower===t){
ctx.strokeStyle="#fff";
ctx.lineWidth=2;

ctx.beginPath();
ctx.arc(t.x,t.y,21,0,Math.PI*2);
ctx.stroke();
}

ctx.textAlign="left";
ctx.textBaseline="alphabetic";
}
}

function drawTroops(){
for(const tr of game.troops){
const d=troopTypes[tr.type];

ctx.fillStyle=d.color;

ctx.beginPath();
ctx.arc(tr.x,tr.y,9,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle="#111";
ctx.fillRect(
tr.x-10,
tr.y-15,
20,
3
);

ctx.fillStyle="#54d66a";

ctx.fillRect(
tr.x-10,
tr.y-15,
20*Math.max(0,tr.hp/tr.maxHp),
3
);
}
}

function drawEnemies(){
for(const e of game.enemies){
const p=roadPoint(e.progress);

let color="#d33";
let size=11;

if(e.type==="fast"){
color="#ff9b32";
size=9;
}

if(e.type==="tank"){
color="#888";
size=15;
}

if(e.type==="boss"){
color="#9b39d4";
size=22;
}

ctx.fillStyle=color;

ctx.beginPath();
ctx.arc(p.x,p.y,size,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle="#111";

ctx.fillRect(
p.x-size,
p.y-size-7,
size*2,
4
);

ctx.fillStyle="#5ddd67";

ctx.fillRect(
p.x-size,
p.y-size-7,
size*2*Math.max(0,e.hp/e.maxHp),
4
);

if(e.slow>0){
ctx.strokeStyle="#8eeaff";

ctx.beginPath();
ctx.arc(
p.x,
p.y,
size+4,
0,
Math.PI*2
);
ctx.stroke();
}
}
}

function render(){
ctx.clearRect(0,0,VIEW_W,VIEW_H);

ctx.save();
ctx.translate(-cameraX,-cameraY);
drawWorld();
ctx.restore();

ctx.fillStyle="rgba(0,0,0,.7)";
ctx.fillRect(8,8,300,30);

ctx.fillStyle="#fff";
ctx.font="12px Courier New";

ctx.fillText(
selectedZone!==null
?"BUILDING "+zoneTypes[selectedZone].name+" | LEVEL "+game.zoneLevels[selectedZone]
:"DRAG MAP • CLICK TO BUILD",
18,
28
);

if(selectedZone!==null){
const cost=zoneUpgradeCost(selectedZone);

ctx.fillStyle="rgba(0,0,0,.8)";
ctx.fillRect(8,575,390,40);

ctx.fillStyle="#fff";
ctx.font="12px Courier New";

ctx.fillText(
"UPGRADE ALL "+zoneTiles(selectedZone).length+" TILES: $"+cost,
18,
600
);
}
}

function updateInfo(){
document.getElementById("gold").textContent=Math.floor(game.gold);
document.getElementById("wave").textContent=game.wave;
document.getElementById("kingdom").textContent=1;
document.getElementById("castleHp").textContent=Math.floor(game.castleHp);
document.getElementById("enemyCount").textContent=game.enemies.length;

const info=document.getElementById("towerInfo");

if(selectedZone!==null){
const z=zoneTypes[selectedZone];
const tiles=zoneTiles(selectedZone).length;
const level=game.zoneLevels[selectedZone];

info.innerHTML=
"<b>"+z.name+"</b> • LEVEL "+level+
" • "+tiles+" TILES<br>"+
"BUILD: $"+ZONE_COST+" PER TILE"+
" • BUFFS: "+z.buffs.join(", ")+"<br>"+
"CURRENT DAMAGE BONUS: +"+
Math.round((z.bonus-1)*level*100)+
"% • UPGRADE ALL: $"+
zoneUpgradeCost(selectedZone);

return;
}

if(selectedTower){
const d=towerTypes[selectedTower.type];
const b=zoneBuff(selectedTower);

const damage=
d.damage*
Math.pow(1.18,selectedTower.level-1)*
b.bonus;

info.innerHTML=
"<b>"+d.name+"</b> • LEVEL "+
selectedTower.level+
" • DAMAGE "+Math.floor(damage)+
" • RANGE "+d.range+
" • UPGRADE: $"+
towerUpgradeCost(selectedTower)+
"<br>BASE COST: $"+d.cost+
" • TERRAIN: "+(b.name||"NONE")+
" • TERRAIN BONUS: +"+
Math.round((b.bonus-1)*100)+"%";

return;
}

if(selectedTroop!==null){
const d=troopTypes[selectedTroop];

info.innerHTML=
"<b>"+d.name+"</b> • COST $"+
d.cost+
" • DAMAGE "+d.damage+
" • HP "+d.hp+
" • SPEED "+d.speed;

return;
}

info.textContent="SELECT A TOWER, TROOP OR TERRAIN TYPE";
}

function createButtons(){
const towerbar=document.getElementById("towerbar");
const zonebar=document.getElementById("zonebar");

towerbar.innerHTML="";
zonebar.innerHTML="";

towerTypes.forEach((t,i)=>{
const b=document.createElement("button");

b.textContent=(i+1)+". "+t.name;

b.onclick=()=>{
if(game.wave<t.unlock)return;

selectedTower=null;
selectedZone=null;
selectedTroop=null;
placingType=i;

updateInfo();
};

if(game.wave<t.unlock){
b.classList.add("locked");
}

towerbar.appendChild(b);
});

zoneTypes.forEach((z,i)=>{
const b=document.createElement("button");

b.textContent=z.name;

b.onclick=()=>{
selectedZone=i;
selectedTower=null;
selectedTroop=null;
placingType=null;
updateInfo();
};

zonebar.appendChild(b);
});
}

canvas.addEventListener("pointerdown",e=>{
if(game.gameOver)return;

pointerDown=true;
isDragging=false;
dragMoved=false;

const p=getMouse(e);

startX=p.x;
startY=p.y;

startCameraX=cameraX;
startCameraY=cameraY;

if(selectedZone!==null){
const world=screenToWorld(e);
lastPaintX=world.x;
lastPaintY=world.y;
}

canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
if(!pointerDown)return;

const p=getMouse(e);

const dx=p.x-startX;
const dy=p.y-startY;

if(Math.abs(dx)>5||Math.abs(dy)>5){
isDragging=true;
dragMoved=true;

cameraX=startCameraX-dx;
cameraY=startCameraY-dy;

clampCamera();

canvas.classList.add("dragging");

return;
}

if(selectedZone!==null&&!isDragging){
const world=screenToWorld(e);

paintLine(
lastPaintX,
lastPaintY,
world.x,
world.y
);

lastPaintX=world.x;
lastPaintY=world.y;
}
});

canvas.addEventListener("pointerup",e=>{
if(!pointerDown)return;

pointerDown=false;

canvas.classList.remove("dragging");

const world=screenToWorld(e);

if(!dragMoved){
if(selectedZone!==null){
paintTileAt(world.x,world.y);
}else if(placingType!==null){
placeTower(
placingType,
world.x,
world.y
);
placingType=null;
}else if(selectedTroop!==null){
spawnTroop(selectedTroop);
selectedTroop=null;
}else{
let found=null;

for(let i=game.towers.length-1;i>=0;i--){
const t=game.towers[i];

if(Math.hypot(
t.x-world.x,
t.y-world.y
)<22){
found=t;
break;
}
}

selectedTower=found;
}
}

isDragging=false;
dragMoved=false;

updateInfo();
});

canvas.addEventListener("pointercancel",e=>{
pointerDown=false;
isDragging=false;
dragMoved=false;
canvas.classList.remove("dragging");
});

canvas.addEventListener("contextmenu",e=>{
e.preventDefault();

selectedTower=null;
selectedZone=null;
selectedTroop=null;
placingType=null;

updateInfo();
});

document.addEventListener("keydown",e=>{
if(e.key.toLowerCase()==="r"){
keyBuffer+="r";

if(keyBuffer.length>3){
keyBuffer=keyBuffer.slice(-3);
}

if(keyBuffer==="rrr"){
window.location.href="index.html";
}
}else{
keyBuffer="";
}

if(e.key==="Escape"){
selectedTower=null;
selectedZone=null;
selectedTroop=null;
placingType=null;
updateInfo();
}
});

function saveGame(){
try{
localStorage.setItem(
"kingdomWarSave",
JSON.stringify(game)
);
}catch(e){}
}

function loadGame(){
try{
const raw=localStorage.getItem("kingdomWarSave");

if(!raw)return;

game=JSON.parse(raw);

game.kingdom=1;

if(!Array.isArray(game.zones)){
game.zones=[];
}

if(!Array.isArray(game.zoneLevels)){
game.zoneLevels=Array(zoneTypes.length).fill(1);
}

while(game.zoneLevels.length<zoneTypes.length){
game.zoneLevels.push(1);
}

game.road=[
{x:1740,y:475},
{x:1580,y:475},
{x:1460,y:560},
{x:1280,y:560},
{x:1120,y:440},
{x:950,y:440},
{x:790,y:580},
{x:620,y:580},
{x:500,y:475},
{x:250,y:475}
];

selectedTower=null;
selectedZone=null;
selectedTroop=null;
placingType=null;

document.getElementById("overlay").style.display=
game.gameOver?"flex":"none";

updateInfo();
}catch(e){}
}

function resetGame(){
if(confirm("RESET ALL KINGDOM WAR PROGRESS?")){
localStorage.removeItem("kingdomWarSave");
newGame();
}
}

function retryGame(){
newGame();
}

function endGame(){
game.gameOver=true;
document.getElementById("overlay").style.display="flex";
saveGame();
}

function goHome(){
window.location.href="index.html";
}

setInterval(saveGame,5000);

function gameLoop(now){
const dt=Math.min(50,now-lastTime);
lastTime=now;

updateWaves(dt);
updateEnemies(dt);
updateTowers(dt);
updateTroops(dt);

updateInfo();
render();

requestAnimationFrame(gameLoop);
}

createButtons();
newGame();
requestAnimationFrame(gameLoop);
</script>

</body>
