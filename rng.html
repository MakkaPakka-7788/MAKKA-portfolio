```html
<!DOCTYPE html>
<html lang="en">

<style>

body{
margin:0;

button{

}

.stats{

}

}

}

</head>

<body>

<header>

<div class="logo">
RNG
</div>

<main>

<div class="stats">

<b id="luck">0</b>
</div>

<b id="rolls">0</b>
</div>

<b id="storage">0/5</b>
</div>

Income
<b id="income">$0/s</b>
</div>

Discovered
<b id="discovered">0/1000</b>
</div>

</div>

<div class="rollArea">

<div class="rngDisplay">

<div class="rngName" id="rngName">
READY?
</div>

<div class="rarity" id="rarity">
Roll to generate an RNG
</div>

<div class="details" id="details">
The RNG itself generates your money.
</div>

</div>

<button

id="rollBtn"

>

</button>

<div class="actions">

<button
class="actionBtn"
id="keepBtn"
onclick="keepRNG()"
disabled
>

<button

id="sellBtn"
onclick="sellCurrent()"
disabled
>

</button>

</div>

</div>

<div class="panels">

<div class="panel">

<h2>
Active RNG
</h2>

<div id="activePanel">
No RNG selected.
</div>

</div>

<div class="panel">

<h2>
Upgrades
</h2>

<button
class="upgrade"
onclick="upgradeLuck()"
>
Upgrade Luck
</button>

<div
class="cost"
id="luckCost"
>
</div>

<button
class="upgrade"
onclick="upgradeStorage()"
>
Upgrade Storage
</button>

<div

id="storageCost"
>
</div>

<button
class="reset"
onclick="resetGame()"
>
RESET EVERYTHING
</button>

</div>

</div>

<div
class="panel"
style="margin-top:20px"
>

<h2>
Kept RNGs
</h2>

<div
class="inventory"
id="inventory"
>
</div>

</div>

<div
class="panel"
style="margin-top:20px"
>

<h2>
Collection
</h2>

<div
class="collection"
id="collection"
>
</div>

</div>

</main>

<script>

const rarityData=[

{
name:"Common",
chance:500000,
value:2,
income:0.1
},

{
name:"Uncommon",
chance:250000,
value:5,
income:0.25
},

{
name:"Rare",
chance:120000,
value:20,
income:1
},

{
name:"Super Rare",
chance:60000,
value:50,
income:3
},

{
name:"Epic",
chance:30000,
value:150,
income:8
},

{
name:"Ultra",
chance:15000,
value:400,
income:20
},

{
name:"Legendary",
chance:7000,
value:1200,
income:60
},

{
name:"Mythic",
chance:3000,
value:4000,
income:200
},

{
name:"Divine",
chance:1200,
value:15000,
income:750
},

{
name:"Celestial",
chance:500,
value:50000,
income:2500
},

{
name:"Eternal",
chance:200,
value:200000,
income:10000
},

{
name:"Cosmic",
chance:80,
value:800000,
income:40000
},

{
name:"Astral",
chance:30,
value:3000000,
income:150000
},

{
name:"Infinity",
chance:10,
value:10000000,
income:500000
},

{
name:"Glitched",
chance:4,
value:40000000,
income:2000000
},

{
name:"SECRET",
chance:1,
value:200000000,
income:10000000
}

];

const themes=[

"Orchestra",
"Galaxy",
"Thunder",
"Volcano",
"Dragon",
"Phantom",
"Ancient",
"Royal",
"Neon",
"Glitch",
"Timekeeper",
"Symphony",
"Grand Piano",
"Golden",
"Frozen",
"Solar",
"Lunar",
"Void",
"Storm",
"Crystal",
"Shadow",
"Quantum",
"Cyber",
"Retro",
"Cosmic",
"Ocean",
"Fire",
"Nature",
"Mechanical",
"Angel",
"Demon",
"Universe",
"Starfall",
"Infinity",
"Unknown",
"Rainbow",
"Clockwork",
"Titan",
"Music",
"Diamond",
"Dark Matter",
"Light",
"King",
"Pixel",
"Arcade",
"Meteor",
"Electric",
"Paper",
"Crown",
"Dream",
"Gravity",
"Galaxy Core",
"Moonlight",
"Sunflare",
"Nightmare",
"Ancient Rune",
"Magic",
"Portal",
"Champion",
"Warrior",
"Royal Gold",
"Frozen Heart",
"Solar Flare",
"Black Hole",
"Supernova",
"Deep Space",
"Crystal Core",
"Time Warp",
"Future",
"Past",
"Legend",
"Unknown Entity",
"Music Box",
"Violin",
"Drum",
"Trumpet",
"Piano",
"Cello",
"Conductor",
"Maestro",
"Symphony Hall",
"Golden Note",
"Silent Note",
"Final Note"

];

let rngs=[];

let game={
cash:100,
rolls:0,
luckLevel:0,
storageMax:5,
inventory:[],
activeId:null,
discovered:[]
};

let current=null;
let rolling=false;

function generateRNGs(){

let id=0;

for(
let r=0;
r<rarityData.length && id<1000;
r++
){

let amount;

if(r<4){

amount=100;

}else if(r<8){

amount=80;

}else if(r<12){

amount=60;

}else{

amount=40;

}

for(
let i=0;
i<amount && id<1000;
i++
){

let theme=
themes[(id+i+r)%themes.length];

rngs.push({

id:id,

name:theme+" RNG",

rarity:rarityData[r].name,

rarityIndex:r,

chance:rarityData[r].chance,

value:rarityData[r].value,

income:rarityData[r].income

});

id++;

}

}

}

function saveGame(){

localStorage.setItem(
"rngGameSave",
JSON.stringify(game)
);

}

function loadGame(){

let saved=
localStorage.getItem(
"rngGameSave"
);

if(!saved){
return;
}

try{

let data=
JSON.parse(saved);

game={

cash:
Number.isFinite(data.cash)
?data.cash
:100,

rolls:
Number.isFinite(data.rolls)
?data.rolls
:0,

luckLevel:
Number.isFinite(data.luckLevel)
?data.luckLevel
:0,

storageMax:
Number.isFinite(data.storageMax)
?data.storageMax
:5,

inventory:
Array.isArray(data.inventory)
?data.inventory
:[],

activeId:
data.activeId??null,

discovered:
Array.isArray(data.discovered)
?data.discovered
:[]

};

}catch(e){

resetVariables();

}

}

function resetVariables(){

game={

cash:100,

rolls:0,

luckLevel:0,

storageMax:5,

inventory:[],

activeId:null,

discovered:[]

};

current=null;

rolling=false;

}

function getLuck(){

return 1+
game.luckLevel*.25+
Math.pow(
game.luckLevel,
1.5
)*.04;

}

function getLuckCost(){

return Math.floor(
100*
Math.pow(
2.25,
game.luckLevel
)
);

}

function getStorageCost(){

return Math.floor(
250*
Math.pow(
2.05,
game.storageMax-5
)
);

}

function getRollCost(){

return Math.floor(
10*
Math.pow(
1.08,
game.rolls
)
);

}

function weightedRoll(){

let weights=
rngs.map(r=>{

let weight=
1/r.chance;

if(r.rarityIndex>=3){

weight*=getLuck();

}

return weight;

});

let total=
weights.reduce(
(a,b)=>a+b,
0
);

let pick=
Math.random()*total;

for(
let i=0;
i<rngs.length;
i++
){

pick-=weights[i];

if(pick<=0){

return rngs[i];

}

}

return rngs[0];

}

function formatMoney(n){

if(n>=1000000000){

return "$"+
(n/1000000000)
.toFixed(2)+
"B";

}

if(n>=1000000){

return "$"+
(n/1000000)
.toFixed(2)+
"M";

}

if(n>=1000){

return "$"+
(n/1000)
.toFixed(2)+
"K";

}

if(n<1){

return "$"+
n.toFixed(2);

}

return "$"+
Math.floor(n);

}

function roll(){

if(rolling){
return;
}

let cost=
getRollCost();

if(game.cash<cost){

alert(
"Not enough cash."
);

return;

}

game.cash-=cost;

game.rolls++;

saveGame();

update();

rolling=true;

document.getElementById(
"rollBtn"
).disabled=true;

document.getElementById(
"keepBtn"
).disabled=true;

document.getElementById(
"sellBtn"
).disabled=true;

let count=0;

let animation=
setInterval(()=>{

let fake=
rngs[
Math.floor(
Math.random()*
rngs.length
)
];

document.getElementById(
"rngName"
).textContent=
fake.name;

document.getElementById(
"rarity"
).textContent=
"ROLLING...";

document.getElementById(
"details"
).textContent=
"Generating...";

count++;

if(count>=24){

clearInterval(
animation
);

finishRoll();

}

},100);

}

function finishRoll(){

current=
weightedRoll();

if(
!game.discovered
.includes(
current.id
)
){

game.discovered.push(
current.id
);

}

document.getElementById(
"rngName"
).textContent=
current.name;

document.getElementById(
"rarity"
).textContent=
current.rarity;

document.getElementById(
"details"
).textContent=
"1 in "+
current.chance.toLocaleString()+
" • Sell: "+
formatMoney(current.value)+
" • Income: "+
formatMoney(current.income)+
"/s";

document.getElementById(
"keepBtn"
).disabled=
game.inventory.length>=
game.storageMax;

document.getElementById(
"sellBtn"
).disabled=false;

rolling=false;

saveGame();

update();

}

function keepRNG(){

if(!current){
return;
}

if(
game.inventory.length>=
game.storageMax
){

alert(
"Storage is full."
);

return;

}

game.inventory.push(
current
);

current=null;

document.getElementById(
"keepBtn"
).disabled=true;

document.getElementById(
"sellBtn"
).disabled=true;

document.getElementById(
"rngName"
).textContent=
"KEPT";

document.getElementById(
"rarity"
).textContent=
"";

document.getElementById(
"details"
).textContent=
"Choose an RNG from your storage to activate it.";

saveGame();

update();

}

function sellCurrent(){

if(!current){
return;
}

game.cash+=
current.value;

current=null;

document.getElementById(
"keepBtn"
).disabled=true;

document.getElementById(
"sellBtn"
).disabled=true;

document.getElementById(
"rngName"
).textContent=
"SOLD";

document.getElementById(
"rarity"
).textContent=
"";

document.getElementById(
"details"
).textContent=
"Cash added.";

saveGame();

update();

}

function activateRNG(index){

if(!game.inventory[index]){
return;
}

game.activeId=
game.inventory[index].id;

saveGame();

update();

}

function sellInventory(index){

let item=
game.inventory[index];

if(!item){
return;
}

game.cash+=
item.value;

if(
game.activeId===
item.id
){

game.activeId=null;

}

game.inventory.splice(
index,
1
);

saveGame();

update();

}

function upgradeLuck(){

let cost=
getLuckCost();

if(game.cash<cost){

alert(
"Not enough cash."
);

return;

}

game.cash-=cost;

game.luckLevel++;

saveGame();

update();

}

function upgradeStorage(){

let cost=
getStorageCost();

if(game.cash<cost){

alert(
"Not enough cash."
);

return;

}

game.cash-=cost;

game.storageMax++;

saveGame();

update();

}

function getActive(){

return game.inventory.find(
r=>r.id===game.activeId
)||null;

}

function update(){

document.getElementById(
"cash"
).textContent=
formatMoney(
game.cash
);

document.getElementById(
"luck"
).textContent=
game.luckLevel+
" ("+
getLuck().toFixed(2)+
"x)";

document.getElementById(
"rolls"
).textContent=
game.rolls;

document.getElementById(
"storage"
).textContent=
game.inventory.length+
"/"+
game.storageMax;

let active=
getActive();

document.getElementById(
"income"
).textContent=
active
?formatMoney(active.income)+"/s"
:"$0/s";

document.getElementById(
"discovered"
).textContent=
game.discovered.length+
"/1000";

document.getElementById(
"rollBtn"
).textContent=
"ROLL "+
formatMoney(
getRollCost()
);

document.getElementById(
"rollBtn"
).disabled=
rolling;

document.getElementById(
"luckCost"
).textContent=
"Cost: "+
formatMoney(
getLuckCost()
);

document.getElementById(
"storageCost"
).textContent=
"Cost: "+
formatMoney(
getStorageCost()
);

renderActive();

renderInventory();

renderCollection();

}

function renderActive(){

let panel=
document.getElementById(
"activePanel"
);

let active=
getActive();

if(!active){

panel.innerHTML=
"No RNG selected.";

return;

}

panel.innerHTML=`

<div class="card active">

<h3>
${active.name}
</h3>

<p>
${active.rarity}
</p>

<p>
Chance:
1/${active.chance.toLocaleString()}
</p>

<p>
Income:
${formatMoney(active.income)}/s
</p>

<p>
Sell value:
${formatMoney(active.value)}
</p>

</div>

`;

}

function renderInventory(){

let box=
document.getElementById(
"inventory"
);

if(
game.inventory.length===0
){

box.innerHTML=
"<div>No RNGs kept yet.</div>";

return;

}

box.innerHTML=
game.inventory.map(
(r,i)=>{

let isActive=
game.activeId===
r.id;

return`

<div class="card ${
isActive?"active":""
}">

<h3>
${r.name}
</h3>

<p>
${r.rarity}
</p>

<p>
1/${r.chance.toLocaleString()}
</p>

<p>
${formatMoney(r.income)}/s
</p>

<button
onclick="activateRNG(${i})"
>
${
isActive
?"ACTIVE"
:"SELECT RNG"
}
</button>

<button
onclick="sellInventory(${i})"
>
SELL FOR
${formatMoney(r.value)}
</button>

</div>

`;

}
).join("");

}

function renderCollection(){

let box=
document.getElementById(
"collection"
);

box.innerHTML=
rngs.map(r=>{

let found=
game.discovered.includes(
r.id
);

if(!found){

return`

<div class="collectionCard unknown">
???
</div>

`;

}

return`

<div class="collectionCard">

<strong>
${r.name}
</strong>

<br>

<small>
${r.rarity}
</small>

</div>

`;

}).join("");

}

function resetGame(){

if(
!confirm(
"RESET EVERYTHING? This will erase ALL RNG progress."
)
){

return;

}

localStorage.removeItem(
"rngGameSave"
);

game={

cash:100,

rolls:0,

luckLevel:0,

storageMax:5,

inventory:[],

activeId:null,

discovered:[]

};

current=null;

rolling=false;

document.getElementById(
"rngName"
).textContent=
"READY?";

document.getElementById(
"rarity"
).textContent=
"Roll to generate an RNG";

document.getElementById(
"details"
).textContent=
"The RNG itself generates your money.";

document.getElementById(
"keepBtn"
).disabled=true;

document.getElementById(
"sellBtn"
).disabled=true;

update();

}

setInterval(()=>{

let active=
getActive();

if(active){

game.cash+=
active.income;

update();

saveGame();

}

},1000);

let rCount=0;

let rTimer=null;

document.addEventListener(
"keydown",
e=>{

if(
e.key.toLowerCase()!=="r"
){

return;

}

rCount++;

clearTimeout(
rTimer
);

rTimer=
setTimeout(
()=>{
rCount=0;
},
500
);

if(rCount>=2){

window.location.href=
"flashcards.html";

}

});

generateRNGs();

loadGame();

update();

</script>

</body>
</html>
