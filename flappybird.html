<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flappy Bird</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    position: relative;
    width: min(100vw, 480px);
    height: 100vh;
    max-height: 800px;
    margin: auto;
    overflow: hidden;
    background: #70c5ce;
}

/* SKY */

#sky {
    position: absolute;
    inset: 0;
    background: #70c5ce;
}

/* CLOUDS */

.cloud {
    position: absolute;
    width: 100px;
    height: 28px;
    background: white;
    border-radius: 30px;
    opacity: .8;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 45px;
    height: 45px;
    left: 15px;
    bottom: 5px;
}

.cloud::after {
    width: 35px;
    height: 35px;
    right: 15px;
    bottom: 5px;
}

.cloud1 {
    top: 90px;
    left: 40px;
}

.cloud2 {
    top: 190px;
    left: 330px;
    transform: scale(.8);
}

.cloud3 {
    top: 310px;
    left: 160px;
    transform: scale(.65);
}

/* BACKGROUND HILLS */

.hill {
    position: absolute;
    bottom: 75px;
    width: 180px;
    height: 90px;
    background: #9bd45b;
    border-radius: 100% 100% 0 0;
}

.hill1 {
    left: -30px;
}

.hill2 {
    left: 150px;
    height: 120px;
}

.hill3 {
    left: 330px;
    height: 80px;
}

/* BIRD */

#bird {
    position: absolute;
    width: 42px;
    height: 32px;
    left: 105px;
    top: 300px;
    z-index: 10;
    transform-origin: center;
}

.bird-body {
    position: absolute;
    width: 38px;
    height: 30px;
    background: #f4c542;
    border: 3px solid #9b7115;
    border-radius: 55%;
}

.bird-wing {
    position: absolute;
    width: 20px;
    height: 13px;
    left: 4px;
    top: 13px;
    background: #e8ad28;
    border: 2px solid #9b7115;
    border-radius: 50%;
}

.bird-eye {
    position: absolute;
    width: 9px;
    height: 9px;
    background: white;
    border: 2px solid #333;
    border-radius: 50%;
    right: 7px;
    top: 5px;
}

.bird-eye::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    background: #111;
    border-radius: 50%;
    right: 0;
    top: 1px;
}

.bird-beak {
    position: absolute;
    width: 14px;
    height: 9px;
    background: #e87527;
    border: 2px solid #8e4315;
    right: -9px;
    top: 15px;
    clip-path: polygon(0 0, 100% 35%, 0 100%);
}

/* PIPES */

.pipe {
    position: absolute;
    width: 62px;
    background: #72b843;
    border: 3px solid #3d7826;
    z-index: 8;
}

.pipe::after {
    content: "";
    position: absolute;
    left: -6px;
    width: 68px;
    height: 25px;
    background: #79c34a;
    border: 3px solid #3d7826;
}

.pipe.top {
    top: 0;
}

.pipe.top::after {
    bottom: -3px;
}

.pipe.bottom {
    bottom: 75px;
}

.pipe.bottom::after {
    top: -3px;
}

/* GROUND */

#ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 75px;
    background:
        repeating-linear-gradient(
            135deg,
            #d9cf83 0px,
            #d9cf83 18px,
            #c7bd70 18px,
            #c7bd70 36px
        );
    border-top: 8px solid #8fbd42;
    z-index: 15;
}

/* SCORE */

#score {
    position: absolute;
    top: 25px;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 48px;
    font-weight: bold;
    text-shadow: 3px 3px #555;
    z-index: 20;
}

/* MENU */

#message {
    position: absolute;
    z-index: 30;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    padding: 25px;
    background: #fff;
    border: 4px solid #555;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px #777;
}

#message h1 {
    margin: 0 0 15px;
    color: #333;
}

#message p {
    color: #555;
    line-height: 1.6;
}

#message button {
    border: none;
    background: #e9b52f;
    color: #333;
    padding: 13px 25px;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-bottom: 4px solid #a87c13;
}

/* MEDAL */

#medal {
    width: 75px;
    height: 75px;
    margin: 10px auto 15px;
    border-radius: 50%;
    border: 6px solid #555;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    background: #ddd;
}

.bronze {
    background: #b87333 !important;
}

.silver {
    background: #c0c0c0 !important;
}

.gold {
    background: #ffd700 !important;
}

.platinum {
    background: #dff8ff !important;
}

.hidden {
    display: none;
}

/* MENU BUTTON */

#back {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 50;
    background: rgba(255,255,255,.85);
    border: 2px solid #555;
    border-radius: 6px;
    padding: 8px 12px;
    color: #333;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

</style>

</head>

<body>

<div id="game">

```
<div id="sky">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>

</div>

<a id="back" href="index.html">← Menu</a>

<div id="score">0</div>

<div id="bird">

    <div class="bird-body"></div>
    <div class="bird-wing"></div>
    <div class="bird-eye"></div>
    <div class="bird-beak"></div>

</div>

<div id="ground"></div>

<div id="message">

    <h1>FLAPPY BIRD</h1>

    <p>
        SPACE / CLICK / TAP<br>
        TO FLAP
    </p>

    <button onclick="startGame()">
        START GAME
    </button>

</div>
```

</div>

<script>

const game = document.getElementById("game");
const bird = document.getElementById("bird");
const scoreDisplay = document.getElementById("score");
const message = document.getElementById("message");
const ground = document.getElementById("ground");

let birdY = 300;
let velocity = 0;

const gravity = 0.45;
const flapPower = -7.5;

let pipes = [];
let score = 0;
let highScore = Number(localStorage.getItem("flappyHighScore")) || 0;

let gameRunning = false;
let gameOver = false;

let lastTime = 0;
let pipeTimer = 0;
let groundX = 0;

const groundHeight = 75;


/* START */

function startGame() {

    pipes.forEach(pipe => {
        pipe.top.remove();
        pipe.bottom.remove();
    });

    pipes = [];

    birdY = 300;
    velocity = 0;
    score = 0;
    pipeTimer = 0;

    gameRunning = true;
    gameOver = false;

    scoreDisplay.textContent = "0";

    message.classList.add("hidden");

    bird.style.top = birdY + "px";
    bird.style.transform = "rotate(0deg)";

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);

    flap();
}


/* FLAP */

function flap() {

    if (!gameRunning) {
        return;
    }

    velocity = flapPower;
}


/* CREATE PIPE */

function createPipe() {

    const gap = 155;

    const minTop = 80;

    const maxTop =
        game.clientHeight -
        groundHeight -
        gap -
        80;

    const topHeight =
        Math.floor(
            Math.random() *
            (maxTop - minTop)
        ) + minTop;

    const bottomHeight =
        game.clientHeight -
        groundHeight -
        topHeight -
        gap;

    const topPipe =
        document.createElement("div");

    topPipe.className = "pipe top";

    topPipe.style.height =
        topHeight + "px";

    topPipe.style.left =
        game.clientWidth + "px";

    const bottomPipe =
        document.createElement("div");

    bottomPipe.className = "pipe bottom";

    bottomPipe.style.height =
        bottomHeight + "px";

    bottomPipe.style.left =
        game.clientWidth + "px";

    game.appendChild(topPipe);
    game.appendChild(bottomPipe);

    pipes.push({

        x: game.clientWidth,

        topHeight: topHeight,

        top: topPipe,

        bottom: bottomPipe,

        passed: false

    });
}


/* GAME LOOP */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }

    const delta =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );

    lastTime = time;

    velocity += gravity * delta;

    birdY += velocity * delta;

    bird.style.top =
        birdY + "px";

    const rotation =
        Math.max(
            -25,
            Math.min(
                velocity * 5,
                90
            )
        );

    bird.style.transform =
        "rotate(" + rotation + "deg)";


    /* MOVING GROUND */

    groundX -= 1.5 * delta;

    if (groundX <= -36) {
        groundX = 0;
    }

    ground.style.backgroundPosition =
        groundX + "px 0";


    /* PIPES */

    pipeTimer += delta;

    if (pipeTimer > 95) {

        createPipe();

        pipeTimer = 0;

    }

    const speed = 2.6;

    pipes.forEach(pipe => {

        pipe.x -= speed * delta;

        pipe.top.style.left =
            pipe.x + "px";

        pipe.bottom.style.left =
            pipe.x + "px";


        if (
            !pipe.passed &&
            pipe.x + 62 < 105
        ) {

            pipe.passed = true;

            score++;

            scoreDisplay.textContent =
                score;

        }

    });


    /* REMOVE OLD PIPES */

    pipes = pipes.filter(pipe => {

        if (pipe.x < -80) {

            pipe.top.remove();
            pipe.bottom.remove();

            return false;

        }

        return true;

    });


    /* GROUND / CEILING */

    if (
        birdY < 0 ||
        birdY + 32 >
        game.clientHeight - groundHeight
    ) {

        endGame();

        return;

    }


    /* COLLISION */

    const birdLeft = 105;
    const birdRight = 147;
    const birdTop = birdY;
    const birdBottom = birdY + 32;


    for (const pipe of pipes) {

        const pipeLeft = pipe.x;
        const pipeRight = pipe.x + 62;

        if (
            birdRight > pipeLeft &&
            birdLeft < pipeRight
        ) {

            const gapTop =
                pipe.topHeight;

            const gapBottom =
                pipe.topHeight + 155;

            if (
                birdTop < gapTop ||
                birdBottom > gapBottom
            ) {

                endGame();

                return;

            }

        }

    }


    requestAnimationFrame(gameLoop);

}


/* MEDAL */

function getMedal(score) {

    if (score >= 40) {
        return {
            name: "PLATINUM",
            className: "platinum",
            icon: "💎"
        };
    }

    if (score >= 30) {
        return {
            name: "GOLD",
            className: "gold",
            icon: "🥇"
        };
    }

    if (score >= 20) {
        return {
            name: "SILVER",
            className: "silver",
            icon: "🥈"
        };
    }

    if (score >= 10) {
        return {
            name: "BRONZE",
            className: "bronze",
            icon: "🥉"
        };
    }

    return null;
}


/* GAME OVER */

function endGame() {

    gameRunning = false;
    gameOver = true;

    if (score > highScore) {

        highScore = score;

        localStorage.setItem(
            "flappyHighScore",
            highScore
        );

    }

    const medal =
        getMedal(score);

    let medalHTML = "";

    if (medal) {

        medalHTML = `
            <div id="medal" class="${medal.className}">
                ${medal.icon}
            </div>

            <strong>${medal.name} MEDAL!</strong>
        `;

    }

    message.classList.remove("hidden");

    message.innerHTML = `

        <h1>GAME OVER</h1>

        ${medalHTML}

        <p>
            Score: <strong>${score}</strong><br>
            Best: <strong>${highScore}</strong>
        </p>

        <button onclick="startGame()">
            PLAY AGAIN
        </button>

    `;
}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            if (!gameRunning && !gameOver) {

                startGame();

            } else {

                flap();

            }

        }

    }
);


/* MOUSE */

game.addEventListener(
    "mousedown",
    function(event) {

        if (
            event.target.tagName === "BUTTON" ||
            event.target.id === "back"
        ) {
            return;
        }

        if (!gameRunning && !gameOver) {

            startGame();

        } else {

            flap();

        }

    }
);


/* TOUCH */

game.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.target.tagName === "BUTTON" ||
            event.target.id === "back"
        ) {
            return;
        }

        event.preventDefault();

        if (!gameRunning && !gameOver) {

            startGame();

        } else {

            flap();

        }

    },
    { passive: false }
);

</script>

</body>
</html>
