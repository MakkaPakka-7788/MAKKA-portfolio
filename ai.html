<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard AI</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#f5f8fc;
color:#172033;
font-family:Arial,Helvetica,sans-serif;
height:100vh;
display:flex;
flex-direction:column;
}

header{
height:64px;
background:white;
border-bottom:1px solid #dce3ed;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
flex-shrink:0;
}

.logo{
font-size:22px;
font-weight:700;
color:#1769e0;
}

.actions{
display:flex;
gap:10px;
}

button{
border:0;
border-radius:8px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

.headerButton{
padding:10px 15px;
background:#eef4fc;
color:#1769e0;
}

.headerButton:hover{
background:#e1ecfa;
}

#statusBar{
height:42px;
background:#eef5ff;
border-bottom:1px solid #d8e6fa;
display:flex;
align-items:center;
padding:0 24px;
font-size:13px;
color:#41607f;
flex-shrink:0;
}

#statusDot{
width:8px;
height:8px;
border-radius:50%;
background:#f0a000;
margin-right:9px;
flex-shrink:0;
}

#chat{
flex:1;
overflow-y:auto;
padding:30px 20px 140px;
}

.chatInner{
max-width:850px;
margin:auto;
}

.welcome{
text-align:center;
padding:70px 20px 30px;
}

.welcome h1{
margin:0 0 12px;
font-size:34px;
color:#172033;
}

.welcome p{
margin:0 auto 28px;
max-width:600px;
color:#66758a;
line-height:1.6;
}

.examples{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
}

.example{
background:white;
border:1px solid #dce3ed;
padding:11px 15px;
border-radius:20px;
color:#3d4e66;
cursor:pointer;
transition:.15s;
}

.example:hover{
border-color:#8bb5eb;
background:#f8fbff;
}

.message{
display:flex;
margin:0 auto 20px;
max-width:850px;
}

.message.user{
justify-content:flex-end;
}

.bubble{
max-width:78%;
padding:13px 16px;
border-radius:15px;
line-height:1.55;
white-space:pre-wrap;
word-wrap:break-word;
}

.message.ai .bubble{
background:white;
border:1px solid #dce3ed;
color:#172033;
}

.message.user .bubble{
background:#1769e0;
color:white;
}

.composer{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(245,248,252,.96);
border-top:1px solid #dce3ed;
padding:15px 20px 18px;
}

.composerInner{
max-width:850px;
margin:auto;
display:flex;
gap:10px;
background:white;
border:1px solid #cfd9e7;
border-radius:13px;
padding:8px;
box-shadow:0 4px 18px rgba(30,60,100,.06);
}

textarea{
flex:1;
border:0;
outline:0;
resize:none;
font-family:Arial,Helvetica,sans-serif;
font-size:15px;
line-height:1.5;
padding:8px;
min-height:44px;
max-height:130px;
color:#172033;
}

#send{
width:82px;
background:#1769e0;
color:white;
}

#send:hover{
background:#125ac2;
}

#send:disabled{
background:#aebbd0;
cursor:not-allowed;
}

.loading{
display:flex;
align-items:center;
gap:8px;
color:#66758a;
font-size:14px;
}

.dots{
display:flex;
gap:4px;
}

.dot{
width:6px;
height:6px;
border-radius:50%;
background:#7f91a8;
animation:bounce 1s infinite;
}

.dot:nth-child(2){
animation-delay:.15s;
}

.dot:nth-child(3){
animation-delay:.3s;
}

@keyframes bounce{
0%,100%{
transform:translateY(0);
opacity:.4;
}
50%{
transform:translateY(-4px);
opacity:1;
}
}

.errorBox{
max-width:760px;
margin:45px auto;
background:#fff5f5;
border:1px solid #efcaca;
border-radius:12px;
padding:20px;
color:#8b2b2b;
line-height:1.6;
}

.errorTitle{
font-size:18px;
font-weight:700;
}

.errorLabel{
font-weight:700;
margin-top:16px;
margin-bottom:6px;
}

.errorCode{
white-space:pre-wrap;
word-break:break-word;
background:#fff;
border:1px solid #e5caca;
border-radius:8px;
padding:12px;
font-family:monospace;
font-size:12px;
color:#6b2020;
overflow:auto;
}

.retryButton{
margin-top:16px;
padding:10px 15px;
background:#1769e0;
color:white;
}

.retryButton:hover{
background:#125ac2;
}

@media(max-width:600px){

header{
padding:0 14px;
}

.logo{
font-size:18px;
}

.headerButton{
padding:8px 10px;
}

.welcome h1{
font-size:28px;
}

.bubble{
max-width:88%;
}

.errorBox{
margin:25px 10px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">
Flashcard AI
</div>

<div class="actions">

<button class="headerButton" onclick="goHome()">
HOME
</button>

<button class="headerButton" onclick="newChat()">
NEW CHAT
</button>

</div>

</header>

<div id="statusBar">

<div id="statusDot"></div>

<div id="status">
Starting AI...
</div>

</div>

<main id="chat">

<div class="chatInner" id="chatInner">

<div class="welcome" id="welcome">

<h1>
What can I help you with?
</h1>

<p>
Ask me questions, definitions, school topics, explanations, calculations, or just something you're curious about.
</p>

<div class="examples">

<div class="example" onclick="useExample('What is photosynthesis?')">
What is photosynthesis?
</div>

<div class="example" onclick="useExample('Explain gravity simply')">
Explain gravity simply
</div>

<div class="example" onclick="useExample('What caused World War 1?')">
What caused World War 1?
</div>

<div class="example" onclick="useExample('What is a prime number?')">
What is a prime number?
</div>

</div>

</div>

</div>

</main>

<div class="composer">

<div class="composerInner">

<textarea
id="input"
placeholder="Ask Flashcard AI..."
rows="1"
></textarea>

<button id="send" onclick="sendMessage()" disabled>
SEND
</button>

</div>

</div>

<script type="module">

import {
CreateMLCEngine
} from "https://esm.run/@mlc-ai/web-llm";

const MODEL =
"Qwen3-0.6B-q4f16_1-MLC";

const SYSTEM_PROMPT = `
You are Flashcard AI.

You are friendly, smart, natural and helpful.

Answer the user's question directly.

For definitions:
Give a clear definition first, then a simple explanation or example when useful.

For school questions:
Explain difficult ideas in a simple way appropriate for a student.

For calculations:
Show the important working and then give the answer.

For normal conversation:
Be natural and conversational.

Do not constantly say "Sure", "Of course", or "Absolutely".

Do not pretend to have searched the internet.

Do not invent sources, statistics, quotations or facts.

If you are uncertain, say that you are uncertain rather than making something up.

Keep answers reasonably concise unless the user asks for more detail.

Use headings, bullet points or short paragraphs when they make an answer easier to understand.
`;

let engine = null;
let conversation = [];
let ready = false;
let loading = false;
let rSequence = "";

const status =
document.getElementById("status");

const statusDot =
document.getElementById("statusDot");

const sendButton =
document.getElementById("send");

const input =
document.getElementById("input");

const chatInner =
document.getElementById("chatInner");

function setStatus(text, color){

status.textContent = text;

statusDot.style.background = color;

}

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function showError(title,error){

const message =
error?.message ||
String(error) ||
"Unknown error";

console.error(
"FLASHCARD AI ERROR:",
error
);

setStatus(
"AI FAILED TO LOAD",
"#d14b4b"
);

chatInner.innerHTML = `

<div class="errorBox">

<div class="errorTitle">
${escapeHTML(title)}
</div>

<div class="errorLabel">
Exact error:
</div>

<div class="errorCode">
${escapeHTML(message)}
</div>

<div class="errorLabel">
Model:
</div>

<div class="errorCode">
${escapeHTML(MODEL)}
</div>

<div class="errorLabel">
What happened:
</div>

<div>
The AI failed while starting the local WebLLM model.
The exact error above should tell us what needs fixing.
</div>

<button
class="retryButton"
onclick="location.reload()"
>
TRY AGAIN
</button>

</div>

`;

loading = false;

ready = false;

sendButton.disabled = true;

}

function addMessage(role,text){

const welcome =
document.getElementById("welcome");

if(welcome){
welcome.remove();
}

const message =
document.createElement("div");

message.className =
"message " + role;

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

message.appendChild(bubble);

chatInner.appendChild(message);

const chat =
document.getElementById("chat");

chat.scrollTop =
chat.scrollHeight;

}

function addLoading(){

const message =
document.createElement("div");

message.className =
"message ai";

message.id =
"loadingMessage";

message.innerHTML = `

<div class="bubble">

<div class="loading">

<div class="dots">

<div class="dot"></div>

<div class="dot"></div>

<div class="dot"></div>

</div>

Thinking...

</div>

</div>

`;

chatInner.appendChild(message);

const chat =
document.getElementById("chat");

chat.scrollTop =
chat.scrollHeight;

}

function removeLoading(){

const element =
document.getElementById("loadingMessage");

if(element){
element.remove();
}

}

async function startAI(){

loading = true;

ready = false;

sendButton.disabled = true;

try{

setStatus(
"STEP 1/5 — Checking browser...",
"#f0a000"
);

await new Promise(
resolve => setTimeout(resolve,300)
);

if(!window.isSecureContext){

throw new Error(
"WebGPU requires a secure HTTPS connection. Make sure you are opening your GitHub Pages website using https://."
);

}

setStatus(
"STEP 2/5 — Checking WebGPU...",
"#f0a000"
);

if(!navigator.gpu){

throw new Error(
"WebGPU is NOT available in this browser. Try the latest version of Google Chrome or Microsoft Edge."
);

}

setStatus(
"STEP 3/5 — Checking graphics adapter...",
"#f0a000"
);

const adapter =
await navigator.gpu.requestAdapter();

if(!adapter){

throw new Error(
"WebGPU exists, but no compatible graphics adapter was found."
);

}

console.log(
"WebGPU adapter:",
adapter
);

setStatus(
"STEP 4/5 — Starting WebLLM...",
"#f0a000"
);

await new Promise(
resolve => setTimeout(resolve,300)
);

console.log(
"WebLLM model:",
MODEL
);

setStatus(
"STEP 5/5 — Loading AI model...",
"#f0a000"
);

engine =
await CreateMLCEngine(
MODEL,
{

initProgressCallback:
(progress) => {

console.log(
"AI MODEL PROGRESS:",
progress
);

if(
progress.progress !== undefined
){

const percent =
Math.round(
progress.progress * 100
);

setStatus(
"Downloading AI model: " +
percent +
"%",
"#f0a000"
);

}

else if(progress.text){

setStatus(
progress.text,
"#f0a000"
);

}

}

}
);

ready = true;

loading = false;

setStatus(
"AI READY ✓",
"#2e9b62"
);

sendButton.disabled = false;

input.focus();

console.log(
"FLASHCARD AI READY"
);

}

catch(error){

showError(
"Flashcard AI could not start.",
error
);

}

}

async function sendMessage(){

if(!ready || loading){
return;
}

const text =
input.value.trim();

if(!text){
return;
}

input.value = "";

input.style.height =
"44px";

addMessage(
"user",
text
);

conversation.push({
role:"user",
content:text
});

addLoading();

sendButton.disabled = true;

try{

const response =
await engine.chat.completions.create({

messages:[
{
role:"system",
content:SYSTEM_PROMPT
},
...conversation
],

temperature:0.7,

top_p:0.9,

max_tokens:600

});

const answer =
response
.choices?.[0]
?.message
?.content
?.trim()
||
"I couldn't generate an answer.";

removeLoading();

addMessage(
"ai",
answer
);

conversation.push({
role:"assistant",
content:answer
});

}

catch(error){

console.error(
"AI RESPONSE ERROR:",
error
);

removeLoading();

addMessage(
"ai",
"Sorry, I couldn't generate an answer. Try asking again."
);

}

finally{

sendButton.disabled =
false;

input.focus();

}

}

function newChat(){

conversation = [];

chatInner.innerHTML = `

<div class="welcome" id="welcome">

<h1>
What can I help you with?
</h1>

<p>
Ask me questions, definitions, school topics, explanations, calculations, or just something you're curious about.
</p>

<div class="examples">

<div class="example" onclick="useExample('What is photosynthesis?')">
What is photosynthesis?
</div>

<div class="example" onclick="useExample('Explain gravity simply')">
Explain gravity simply
</div>

<div class="example" onclick="useExample('What caused World War 1?')">
What caused World War 1?
</div>

<div class="example" onclick="useExample('What is a prime number?')">
What is a prime number?
</div>

</div>

</div>

`;

input.value = "";

input.focus();

}

function useExample(text){

input.value =
text;

input.focus();

sendMessage();

}

function goHome(){

window.location.href =
"index.html?games=true";

}

input.addEventListener(
"input",
function(){

this.style.height =
"auto";

this.style.height =
Math.min(
this.scrollHeight,
130
) + "px";

}
);

input.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);

document.addEventListener(
"keydown",
function(event){

if(
event.target.tagName === "TEXTAREA" &&
event.key.toLowerCase() === "r"
){

rSequence += "r";

}else if(
event.key.toLowerCase() === "r"
){

rSequence += "r";

}else{

return;

}

if(
rSequence === "rrr"
){

rSequence = "";

window.location.href =
"index.html?games=true";

return;

}

clearTimeout(
window.rTimer
);

window.rTimer =
setTimeout(
() => {
rSequence = "";
},
700
);

}
);

window.sendMessage =
sendMessage;

window.newChat =
newChat;

window.useExample =
useExample;

window.goHome =
goHome;

startAI();

</script>

</body>
</html>
