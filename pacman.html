<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Creator</title>

<style>
* {
    box-sizing: border-box;
}

<body>

<div id="gameWrap">

    <div id="topBar">
        <div id="score">SCORE: 0</div>
        <div id="lives">LIVES: 3</div>
    </div>

    <canvas id="game"></canvas>

    <div id="message">READY!</div>

    <div id="retryScreen">
        <h1>RETRY</h1>
        <div id="finalScore">SCORE: 0</div>
        <button id="retryButton">RETRY</button>
    </div>

</div>

<script>

/* =========================================
   PAC-MAN
========================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const messageEl = document.getElementById("message");
const retryScreen = document.getElementById("retryScreen");
const retryButton = document.getElementById("retryButton");
const finalScore = document.getElementById("finalScore");


/* =========================================
   BIGGER MAP
========================================= */

const MAP = [
"###############################",
"#o.........................o#.#",
"#.#####.###########.#####.#.#",
"#.#####.###########.#####.#.#",
"#.............................#",
"#.#####.###.#########.###.####",
"#.......###...........###.....#",
"#####.###.###.#####.###.######",
"#####.###.###.....###.###.####",
"#.....###.###.....###.###.....#",
"#.###.###.###########.###.###.#",
"#.###.....................###.#",
"#.###.###.###########.###.###.#",
"#.....###.....###.....###.....#",
"#####.######.###.###.######.##",
"#####.######.###.###.######.##",
"#.........#...........#.......#",
"#.#######.#.#########.#.#####.#",
"#o.......#.....#.....#.......o#",
"#########.#####.#####.#########",
"#.............................#",
"#.#####.###.#########.###.####",
"#.......###.....###.....###...#",
"#.#####.###.###.###.###.#####.#",
"#.............................#",
"###############################"
];

/*
Fix the map to equal-width rows.
*/
const WIDTH = Math.max(...MAP.map(row => row.length));

const CLEAN_MAP = MAP.map(row => {
    return row.padEnd(WIDTH, "#");
});

const ROWS = CLEAN_MAP.length;
const COLS = WIDTH;

const TILE = 32;

canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;


/* =========================================
   DIRECTIONS
========================================= */

const DIR = {
    LEFT:  {x:-1, y:0},
    RIGHT: {x:1, y:0},
    UP:    {x:0, y:-1},
    DOWN:  {x:0, y:1},
    NONE:  {x:0, y:0}
};


/* =========================================
   GAME VARIABLES
========================================= */

let pacman;
let ghosts = [];

let pellets = [];
let powerPellets = [];

let score = 0;
let lives = 3;

let gameOver = false;
let ready = true;

let powerMode = false;
let powerTime = 0;
let ghostCombo = 200;

let pacmanAccumulator = 0;
let ghostAccumulator = 0;

let lastTime = performance.now();

let mouthOpen = true;
let mouthTimer = 0;

let rCount = 0;
let rTimer = null;


/* =========================================
   MAP HELPERS
========================================= */

function isWall(x, y) {

    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) {
        return true;
    }

    return CLEAN_MAP[y][x] === "#";
}


function canMove(entity, direction) {

    const nx = entity.x + direction.x;
    const ny = entity.y + direction.y;

    return !isWall(nx, ny);
}


/* =========================================
   PELLETS
========================================= */

function createPellets() {

    pellets = [];
    powerPellets = [];

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            const tile = CLEAN_MAP[y][x];

            if (tile === ".") {

                pellets.push({
                    x,
                    y,
                    eaten: false
                });
            }

            if (tile === "o") {

                powerPellets.push({
                    x,
                    y,
                    eaten: false
                });
            }
        }
    }
}


/* =========================================
   RESET POSITIONS
========================================= */

function resetPositions() {

    /*
    Find a safe open position near the
    lower-middle area.
    */

    let px = Math.floor(COLS / 2);
    let py = ROWS - 4;

    while (isWall(px, py) && py > 1) {
        py--;
    }

    pacman = {
        x: px,
        y: py,
        direction: DIR.LEFT,
        nextDirection: DIR.LEFT
    };


    ghosts = [];

    const ghostColors = [
        "#ff0000",
        "#ffb8ff",
        "#00ffff",
        "#ffb852"
    ];

    const positions = [
        {x:px - 2, y:py - 4},
        {x:px - 1, y:py - 4},
        {x:px + 1, y:py - 4},
        {x:px + 2, y:py - 4}
    ];

    for (let i = 0; i < 4; i++) {

        let gx = positions[i].x;
        let gy = positions[i].y;

        /*
        If position is a wall, search nearby.
        */

        if (isWall(gx, gy)) {

            for (let r = 1; r < 10; r++) {

                if (!isWall(gx + r, gy)) {
                    gx += r;
                    break;
                }

                if (!isWall(gx - r, gy)) {
                    gx -= r;
                    break;
                }
            }
        }

        ghosts.push({
            x: gx,
            y: gy,
            color: ghostColors[i],
            direction: i % 2 === 0 ? DIR.LEFT : DIR.RIGHT,
            eaten: false
        });
    }
}


/* =========================================
   START GAME
========================================= */

function startGame() {

    score = 0;
    lives = 3;

    gameOver = false;
    ready = true;

    powerMode = false;
    powerTime = 0;
    ghostCombo = 200;

    createPellets();
    resetPositions();

    updateUI();

    showMessage("READY!", 1200);

    setTimeout(() => {
        ready = false;
    }, 1200);
}


/* =========================================
   UI
========================================= */

function updateUI() {

    scoreEl.textContent = "SCORE: " + score;
    livesEl.textContent = "LIVES: " + lives;
}


function showMessage(text, time) {

    messageEl.textContent = text;
    messageEl.style.display = "block";

    setTimeout(() => {

        if (!gameOver) {
            messageEl.style.display = "none";
        }

    }, time);
}


/* =========================================
   PAC-MAN MOVEMENT
========================================= */

function movePacman() {

    if (canMove(pacman, pacman.nextDirection)) {
        pacman.direction = pacman.nextDirection;
    }

    if (!canMove(pacman, pacman.direction)) {
        return;
    }

    pacman.x += pacman.direction.x;
    pacman.y += pacman.direction.y;

    eatPellets();

    checkGhostCollisions();
}


/* =========================================
   EATING PELLETS
========================================= */

function eatPellets() {

    for (let i = 0; i < pellets.length; i++) {

        const p = pellets[i];

        if (
            !p.eaten &&
            p.x === pacman.x &&
            p.y === pacman.y
        ) {

            p.eaten = true;
            score += 10;
        }
    }


    for (let i = 0; i < powerPellets.length; i++) {

        const p = powerPellets[i];

        if (
            !p.eaten &&
            p.x === pacman.x &&
            p.y === pacman.y
        ) {

            p.eaten = true;

            score += 50;

            powerMode = true;
            powerTime = 8000;

            ghostCombo = 200;
        }
    }

    updateUI();


    let pelletsLeft = false;

    for (const p of pellets) {

        if (!p.eaten) {
            pelletsLeft = true;
            break;
        }
    }

    if (!pelletsLeft) {

        for (const p of powerPellets) {

            if (!p.eaten) {
                pelletsLeft = true;
                break;
            }
        }
    }


    if (!pelletsLeft) {

        ready = true;

        showMessage("YOU WIN!", 1500);

        setTimeout(() => {

            if (!gameOver) {

                createPellets();
                resetPositions();
                ready = false;
            }

        }, 1500);
    }
}


/* =========================================
   GHOST MOVEMENT
========================================= */

function moveGhosts() {

    for (const ghost of ghosts) {

        if (ghost.eaten) {

            moveEatenGhost(ghost);
            continue;
        }


        const possible = [];

        if (canMove(ghost, DIR.LEFT)) {
            possible.push(DIR.LEFT);
        }

        if (canMove(ghost, DIR.RIGHT)) {
            possible.push(DIR.RIGHT);
        }

        if (canMove(ghost, DIR.UP)) {
            possible.push(DIR.UP);
        }

        if (canMove(ghost, DIR.DOWN)) {
            possible.push(DIR.DOWN);
        }

        if (possible.length === 0) {
            continue;
        }


        /*
        Avoid immediately reversing.
        */

        const reverse = {
            x: -ghost.direction.x,
            y: -ghost.direction.y
        };

        let choices = possible.filter(d => {
            return !(
                d.x === reverse.x &&
                d.y === reverse.y
            );
        });

        if (choices.length === 0) {
            choices = possible;
        }


        if (powerMode) {

            /*
            Frightened ghosts choose randomly.
            */

            ghost.direction =
                choices[Math.floor(Math.random() * choices.length)];

        } else {

            /*
            Chase Pac-Man.
            */

            let best = choices[0];
            let bestDistance = Infinity;

            for (const d of choices) {

                const nx = ghost.x + d.x;
                const ny = ghost.y + d.y;

                const distance =
                    Math.abs(nx - pacman.x) +
                    Math.abs(ny - pacman.y);

                if (distance < bestDistance) {

                    bestDistance = distance;
                    best = d;
                }
            }

            /*
            Small random chance keeps them
            from all following the exact same path.
            */

            if (Math.random() < 0.18) {

                ghost.direction =
                    choices[Math.floor(Math.random() * choices.length)];

            } else {

                ghost.direction = best;
            }
        }


        ghost.x += ghost.direction.x;
        ghost.y += ghost.direction.y;

        checkGhostCollisions();
    }
}


/* =========================================
   EATEN GHOST MOVEMENT
========================================= */

function moveEatenGhost(ghost) {

    /*
    Return to the middle of the maze.
    */

    const targetX = Math.floor(COLS / 2);
    const targetY = Math.floor(ROWS / 2);


    const possible = [];

    if (canMove(ghost, DIR.LEFT)) {
        possible.push(DIR.LEFT);
    }

    if (canMove(ghost, DIR.RIGHT)) {
        possible.push(DIR.RIGHT);
    }

    if (canMove(ghost, DIR.UP)) {
        possible.push(DIR.UP);
    }

    if (canMove(ghost, DIR.DOWN)) {
        possible.push(DIR.DOWN);
    }

    if (!possible.length) {
        return;
    }


    let best = possible[0];
    let bestDistance = Infinity;

    for (const d of possible) {

        const nx = ghost.x + d.x;
        const ny = ghost.y + d.y;

        const distance =
            Math.abs(nx - targetX) +
            Math.abs(ny - targetY);

        if (distance < bestDistance) {

            bestDistance = distance;
            best = d;
        }
    }

    ghost.direction = best;

    ghost.x += best.x;
    ghost.y += best.y;


    if (
        Math.abs(ghost.x - targetX) <= 1 &&
        Math.abs(ghost.y - targetY) <= 1
    ) {

        ghost.eaten = false;
    }
}


/* =========================================
   GHOST COLLISION
========================================= */

function checkGhostCollisions() {

    for (const ghost of ghosts) {

        if (
            ghost.x === pacman.x &&
            ghost.y === pacman.y
        ) {

            /*
            THIS is the important fix:
            If power mode is active, Pac-Man
            eats the ghost.
            */

            if (powerMode && !ghost.eaten) {

                ghost.eaten = true;

                score += ghostCombo;

                showMessage("+" + ghostCombo, 500);

                ghostCombo *= 2;

                updateUI();

            } else if (!ghost.eaten) {

                loseLife();

                return;
            }
        }
    }
}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife() {

    lives--;

    updateUI();

    if (lives <= 0) {

        endGame();
        return;
    }

    powerMode = false;
    powerTime = 0;

    ready = true;

    resetPositions();

    showMessage("READY!", 900);

    setTimeout(() => {
        ready = false;
    }, 900);
}


/* =========================================
   GAME OVER
========================================= */

function endGame() {

    gameOver = true;

    finalScore.textContent =
        "SCORE: " + score;

    retryScreen.style.display = "flex";
}


/* =========================================
   DRAW MAZE
========================================= */

function drawMaze() {

    /*
    Grey outer background.
    */

    ctx.fillStyle = "#777";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    Black maze area.
    */

    ctx.fillStyle = "#000";

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            if (!isWall(x, y)) {

                ctx.fillRect(
                    x * TILE,
                    y * TILE,
                    TILE,
                    TILE
                );
            }
        }
    }


    /*
    Yellow walls with black outlines.
    */

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            if (!isWall(x, y)) {
                continue;
            }

            const px = x * TILE;
            const py = y * TILE;

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 7;

            ctx.strokeRect(
                px + 1,
                py + 1,
                TILE - 2,
                TILE - 2
            );

            ctx.strokeStyle = "#ffff00";
            ctx.lineWidth = 3;

            ctx.strokeRect(
                px + 5,
                py + 5,
                TILE - 10,
                TILE - 10
            );
        }
    }
}


/* =========================================
   DRAW PELLETS
========================================= */

function drawPellets() {

    ctx.fillStyle = "#fff";

    for (const p of pellets) {

        if (p.eaten) {
            continue;
        }

        const x = p.x * TILE + TILE / 2;
        const y = p.y * TILE + TILE / 2;

        ctx.fillRect(
            x - 2,
            y - 2,
            4,
            4
        );
    }


    /*
    Power pellets.
    */

    const pulse =
        7 + Math.sin(performance.now() / 120) * 2;

    for (const p of powerPellets) {

        if (p.eaten) {
            continue;
        }

        const x = p.x * TILE + TILE / 2;
        const y = p.y * TILE + TILE / 2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            pulse,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================
   DRAW PAC-MAN
========================================= */

function drawPacman() {

    const cx =
        pacman.x * TILE + TILE / 2;

    const cy =
        pacman.y * TILE + TILE / 2;


    let angle = 0;

    if (pacman.direction === DIR.RIGHT) {
        angle = 0;
    }

    if (pacman.direction === DIR.DOWN) {
        angle = Math.PI / 2;
    }

    if (pacman.direction === DIR.LEFT) {
        angle = Math.PI;
    }

    if (pacman.direction === DIR.UP) {
        angle = Math.PI * 1.5;
    }


    const mouth = mouthOpen ? 0.27 : 0.06;


    ctx.fillStyle = "yellow";

    ctx.beginPath();

    ctx.moveTo(cx, cy);

    ctx.arc(
        cx,
        cy,
        TILE * 0.42,
        angle + mouth,
        angle + Math.PI * 2 - mouth
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================
   DRAW GHOST
========================================= */

function drawGhost(ghost) {

    const cx =
        ghost.x * TILE + TILE / 2;

    const cy =
        ghost.y * TILE + TILE / 2;


    /*
    Eaten ghosts are just eyes.
    */

    if (ghost.eaten) {

        drawEyes(cx, cy);
        return;
    }


    let color = ghost.color;


    if (powerMode) {

        /*
        Flash white when power mode
        is about to end.
        */

        if (
            powerTime < 2000 &&
            Math.floor(powerTime / 150) % 2 === 0
        ) {
            color = "#fff";
        } else {
            color = "#183cff";
        }
    }


    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy - 2,
        TILE * 0.43,
        Math.PI,
        0
    );

    ctx.lineTo(
        cx + TILE * 0.43,
        cy + TILE * 0.42
    );

    ctx.lineTo(
        cx + TILE * 0.22,
        cy + TILE * 0.25
    );

    ctx.lineTo(
        cx,
        cy + TILE * 0.42
    );

    ctx.lineTo(
        cx - TILE * 0.22,
        cy + TILE * 0.25
    );

    ctx.lineTo(
        cx - TILE * 0.43,
        cy + TILE * 0.42
    );

    ctx.closePath();

    ctx.fill();


    drawEyes(cx, cy);
}


/* =========================================
   GHOST EYES
========================================= */

function drawEyes(cx, cy) {

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        cx - 6,
        cy - 4,
        5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 6,
        cy - 4,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        cx - 5,
        cy - 4,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 7,
        cy - 4,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================
   DRAW EVERYTHING
========================================= */

function draw() {

    drawMaze();
    drawPellets();

    for (const ghost of ghosts) {
        drawGhost(ghost);
    }

    drawPacman();
}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener("keydown", function(e) {

    if (
        e.key === "ArrowUp" ||
        e.key === "ArrowDown" ||
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ) {
        e.preventDefault();
    }


    if (e.key === "ArrowUp") {
        pacman.nextDirection = DIR.UP;
    }

    if (e.key === "ArrowDown") {
        pacman.nextDirection = DIR.DOWN;
    }

    if (e.key === "ArrowLeft") {
        pacman.nextDirection = DIR.LEFT;
    }

    if (e.key === "ArrowRight") {
        pacman.nextDirection = DIR.RIGHT;
    }


    /*
    RRR → Games home
    */

    if (e.key.toLowerCase() === "r") {

        const now = Date.now();

        rCount++;

        clearTimeout(rTimer);

        rTimer = setTimeout(() => {
            rCount = 0;
        }, 700);


        if (rCount >= 3) {

            rCount = 0;

            window.location.href =
                "index.html?games=true";
        }
    }
});


/* =========================================
   RETRY
========================================= */

retryButton.addEventListener("click", function() {

    retryScreen.style.display = "none";

    startGame();
});


/* =========================================
   OPTIMIZED GAME LOOP
========================================= */

function gameLoop(now) {

    const delta =
        Math.min(now - lastTime, 100);

    lastTime = now;


    if (!gameOver && !ready) {

        /*
        Pac-Man movement.
        */

        pacmanAccumulator += delta;

        while (pacmanAccumulator >= 125) {

            movePacman();

            pacmanAccumulator -= 125;
        }


        /*
        Ghost movement.
        Ghosts slow down during power mode.
        */

        ghostAccumulator += delta;

        const ghostSpeed =
            powerMode ? 250 : 185;

        while (ghostAccumulator >= ghostSpeed) {

            moveGhosts();

            ghostAccumulator -= ghostSpeed;
        }


        /*
        Power mode timer.
        */

        if (powerMode) {

            powerTime -= delta;

            if (powerTime <= 0) {

                powerMode = false;
                powerTime = 0;
                ghostCombo = 200;
            }
        }


        /*
        Pac-Man mouth.
        */

        mouthTimer += delta;

        if (mouthTimer >= 120) {

            mouthOpen = !mouthOpen;
            mouthTimer = 0;
        }
    }


    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================================
   START
========================================= */

startGame();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
