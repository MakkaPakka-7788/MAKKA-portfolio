```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard Creator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #777;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

#gameWrap {
    position: relative;
    text-align: center;
}

#topBar {
    width: 920px;
    max-width: 96vw;
    margin: auto;
    display: flex;
    justify-content: space-between;
    color: white;
    font-size: 20px;
    font-weight: bold;
    padding: 8px 4px;
}

canvas {
    display: block;
    background: #000;
    border: 5px solid #222;
    width: min(920px, 96vw);
    height: auto;
    image-rendering: pixelated;
}

#message {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: yellow;
    font-size: 30px;
    font-weight: bold;
    display: none;
    pointer-events: none;
}

#retryScreen {
    position: absolute;
    inset: 35px 0 0 0;
    background: rgba(0,0,0,0.96);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

#retryScreen h1 {
    margin: 0;
    color: red;
    font-size: clamp(65px, 12vw, 125px);
    letter-spacing: 7px;
    font-weight: 900;
}

#finalScore {
    color: white;
    font-size: 23px;
    margin: 15px 0 25px;
}

#retryButton {
    background: red;
    color: white;
    border: 4px solid white;
    padding: 15px 38px;
    font-family: inherit;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

#retryButton:hover {
    background: white;
    color: red;
}
</style>
</head>

<body>

<div id="gameWrap">

    <div id="topBar">
        <div id="score">SCORE: 0</div>
        <div id="lives">LIVES: 3</div>
    </div>

    <canvas id="game" width="920" height="840"></canvas>

    <div id="message">READY!</div>

    <div id="retryScreen">
        <h1>RETRY</h1>
        <div id="finalScore">SCORE: 0</div>
        <button id="retryButton">RETRY</button>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const message = document.getElementById("message");
const retryScreen = document.getElementById("retryScreen");
const finalScore = document.getElementById("finalScore");
const retryButton = document.getElementById("retryButton");

const TILE = 40;

const map = [
"#######################",
"#o...................o#",
"#.#####.#####.#####.#.#",
"#.#####.#####.#####.#.#",
"#.....................#",
"#.#####.##.#####.#####.",
"#.......##.............#",
"#####.#####.#####.######",
"#####.#####.#####.######",
"#.......#       #......#",
"#.#####.#       #.#####.",
"#.#####.#       #.#####.",
"#.........     ........#",
"#.#####.#########.#####.",
"#.....................o#",
"#.#####.#####.#####.###",
"#.#####.#####.#####.###",
"#o...................o#",
"#######################"
];

const ROWS = map.length;
const COLS = map[0].length;

canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;

const DIR = {
    left:  {x:-1, y:0},
    right: {x:1, y:0},
    up:    {x:0, y:-1},
    down:  {x:0, y:1}
};

let pacman;
let ghosts = [];
let pellets = [];
let powerPellets = [];

let score = 0;
let lives = 3;
let gameOver = false;

let powerMode = false;
let powerTimer = 0;
let ghostPoints = 200;

let pacMoveTimer = 0;
let ghostMoveTimer = 0;
let lastTime = 0;

let rCount = 0;
let rTimer = null;

let mouthOpen = true;
let mouthTimer = 0;


/* =========================
   GAME SETUP
========================= */

function createPellets() {

    pellets = [];
    powerPellets = [];

    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {

            if (map[y][x] === ".") {
                pellets.push({
                    x: x,
                    y: y,
                    eaten: false
                });
            }

            if (map[y][x] === "o") {
                powerPellets.push({
                    x: x,
                    y: y,
                    eaten: false
                });
            }
        }
    }
}


function resetPositions() {

    pacman = {
        x: 11,
        y: 14,
        direction: DIR.left,
        nextDirection: DIR.left
    };

    ghosts = [
        {
            x: 10,
            y: 9,
            color: "#ff0000",
            direction: DIR.left,
            eaten: false
        },
        {
            x: 11,
            y: 9,
            color: "#ffb8ff",
            direction: DIR.right,
            eaten: false
        },
        {
            x: 12,
            y: 9,
            color: "#00ffff",
            direction: DIR.left,
            eaten: false
        },
        {
            x: 13,
            y: 9,
            color: "#ffb852",
            direction: DIR.right,
            eaten: false
        }
    ];
}


function resetGame() {

    score = 0;
    lives = 3;
    gameOver = false;

    powerMode = false;
    powerTimer = 0;
    ghostPoints = 200;

    retryScreen.style.display = "none";

    createPellets();
    resetPositions();

    updateUI();

    showMessage("READY!", 1200);
}


/* =========================
   MAP
========================= */

function isWall(x, y) {

    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) {
        return true;
    }

    return map[y][x] === "#";
}


function canMove(entity, direction) {

    const nx = entity.x + direction.x;
    const ny = entity.y + direction.y;

    return !isWall(nx, ny);
}


/* =========================
   PAC-MAN
========================= */

function movePacman() {

    if (canMove(pacman, pacman.nextDirection)) {
        pacman.direction = pacman.nextDirection;
    }

    if (canMove(pacman, pacman.direction)) {

        pacman.x += pacman.direction.x;
        pacman.y += pacman.direction.y;

        /*
        Tunnel wrap
        */
        if (pacman.x < 0) {
            pacman.x = COLS - 1;
        }

        if (pacman.x >= COLS) {
            pacman.x = 0;
        }
    }

    eatThings();
    checkCollisions();
}


function eatThings() {

    for (const pellet of pellets) {

        if (
            !pellet.eaten &&
            pellet.x === pacman.x &&
            pellet.y === pacman.y
        ) {
            pellet.eaten = true;
            score += 10;
        }
    }


    for (const pellet of powerPellets) {

        if (
            !pellet.eaten &&
            pellet.x === pacman.x &&
            pellet.y === pacman.y
        ) {

            pellet.eaten = true;

            score += 50;

            powerMode = true;
            powerTimer = 7000;
            ghostPoints = 200;

            for (const ghost of ghosts) {
                ghost.eaten = false;
            }
        }
    }

    updateUI();

    const normalLeft = pellets.some(p => !p.eaten);
    const powerLeft = powerPellets.some(p => !p.eaten);

    if (!normalLeft && !powerLeft) {
        showMessage("YOU WIN!", 1600);

        setTimeout(() => {

            if (!gameOver) {
                createPellets();
            }

        }, 1600);
    }
}


/* =========================
   GHOSTS
========================= */

function moveGhosts() {

    for (const ghost of ghosts) {

        if (ghost.eaten) {

            /*
            Eaten ghosts head back toward the ghost area.
            */

            const targetX = 11;
            const targetY = 9;

            let best = ghost.direction;
            let bestDistance = Infinity;

            for (const direction of Object.values(DIR)) {

                if (!canMove(ghost, direction)) {
                    continue;
                }

                const nx = ghost.x + direction.x;
                const ny = ghost.y + direction.y;

                const distance =
                    Math.abs(nx - targetX) +
                    Math.abs(ny - targetY);

                if (distance < bestDistance) {
                    bestDistance = distance;
                    best = direction;
                }
            }

            ghost.direction = best;

        } else {

            const choices = [];

            for (const direction of Object.values(DIR)) {

                if (canMove(ghost, direction)) {
                    choices.push(direction);
                }
            }

            if (choices.length === 0) {
                continue;
            }

            const reverse = {
                x: -ghost.direction.x,
                y: -ghost.direction.y
            };

            let usable = choices.filter(d =>
                !(d.x === reverse.x && d.y === reverse.y)
            );

            if (usable.length === 0) {
                usable = choices;
            }


            /*
            Frightened ghosts move more randomly.
            Normal ghosts chase Pac-Man.
            */

            if (powerMode && Math.random() < 0.75) {

                ghost.direction =
                    usable[Math.floor(Math.random() * usable.length)];

            } else {

                let bestDirection = usable[0];
                let bestDistance = Infinity;

                for (const direction of usable) {

                    const nx = ghost.x + direction.x;
                    const ny = ghost.y + direction.y;

                    const distance =
                        Math.abs(nx - pacman.x) +
                        Math.abs(ny - pacman.y);

                    if (distance < bestDistance) {
                        bestDistance = distance;
                        bestDirection = direction;
                    }
                }

                if (Math.random() < 0.25) {
                    ghost.direction =
                        usable[Math.floor(Math.random() * usable.length)];
                } else {
                    ghost.direction = bestDirection;
                }
            }
        }


        ghost.x += ghost.direction.x;
        ghost.y += ghost.direction.y;

        if (ghost.x < 0) {
            ghost.x = COLS - 1;
        }

        if (ghost.x >= COLS) {
            ghost.x = 0;
        }


        /*
        Ghost returns to normal after reaching home.
        */

        if (
            ghost.eaten &&
            ghost.x === 11 &&
            ghost.y === 9
        ) {
            ghost.eaten = false;
        }
    }
}


/* =========================
   COLLISIONS
========================= */

function checkCollisions() {

    for (const ghost of ghosts) {

        if (
            ghost.x === pacman.x &&
            ghost.y === pacman.y
        ) {

            if (powerMode && !ghost.eaten) {

                ghost.eaten = true;

                score += ghostPoints;
                ghostPoints *= 2;

                showMessage("+" + (ghostPoints / 2), 600);

                updateUI();

            } else if (!ghost.eaten) {

                loseLife();
                return;
            }
        }
    }
}


function loseLife() {

    lives--;

    updateUI();

    if (lives <= 0) {
        endGame();
        return;
    }

    powerMode = false;
    powerTimer = 0;

    showMessage("OUCH!", 900);

    resetPositions();
}


function endGame() {

    gameOver = true;

    finalScore.textContent = "SCORE: " + score;

    retryScreen.style.display = "flex";
}


/* =========================
   DRAWING
========================= */

function drawMaze() {

    /*
    Grey outside background.
    Black maze.
    Yellow walls.
    */

    ctx.fillStyle = "#777";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#000";

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            if (map[y][x] !== "#") {

                ctx.fillRect(
                    x * TILE,
                    y * TILE,
                    TILE,
                    TILE
                );
            }
        }
    }


    /*
    Yellow walls with black outlines.
    */

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            if (map[y][x] !== "#") {
                continue;
            }

            const px = x * TILE;
            const py = y * TILE;

            ctx.strokeStyle = "#000";
            ctx.lineWidth = 7;

            ctx.strokeRect(
                px + 2,
                py + 2,
                TILE - 4,
                TILE - 4
            );

            ctx.strokeStyle = "#ffff00";
            ctx.lineWidth = 3;

            ctx.strokeRect(
                px + 5,
                py + 5,
                TILE - 10,
                TILE - 10
            );
        }
    }
}


function drawPellets() {

    ctx.fillStyle = "#fff";

    for (const pellet of pellets) {

        if (pellet.eaten) {
            continue;
        }

        const cx = pellet.x * TILE + TILE / 2;
        const cy = pellet.y * TILE + TILE / 2;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
    Big power pellets.
    */

    for (const pellet of powerPellets) {

        if (pellet.eaten) {
            continue;
        }

        const cx = pellet.x * TILE + TILE / 2;
        const cy = pellet.y * TILE + TILE / 2;

        const radius =
            Math.sin(Date.now() / 120) > 0
            ? 9
            : 7;

        ctx.fillStyle = "#fff";

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


function drawPacman() {

    const cx = pacman.x * TILE + TILE / 2;
    const cy = pacman.y * TILE + TILE / 2;

    let angle = 0;

    if (pacman.direction === DIR.right) {
        angle = 0;
    }

    if (pacman.direction === DIR.down) {
        angle = Math.PI / 2;
    }

    if (pacman.direction === DIR.left) {
        angle = Math.PI;
    }

    if (pacman.direction === DIR.up) {
        angle = Math.PI * 1.5;
    }

    const mouth = mouthOpen ? 0.25 : 0.06;

    ctx.fillStyle = "yellow";

    ctx.beginPath();

    ctx.moveTo(cx, cy);

    ctx.arc(
        cx,
        cy,
        16,
        angle + mouth,
        angle + Math.PI * 2 - mouth
    );

    ctx.closePath();

    ctx.fill();
}


function drawGhost(ghost) {

    const cx = ghost.x * TILE + TILE / 2;
    const cy = ghost.y * TILE + TILE / 2;

    let ghostColor = ghost.color;

    if (powerMode && !ghost.eaten) {

        /*
        Flash white near the end of power mode.
        */

        if (powerTimer < 2000 &&
            Math.floor(powerTimer / 150) % 2 === 0) {
            ghostColor = "white";
        } else {
            ghostColor = "#183cff";
        }
    }

    if (ghost.eaten) {
        drawGhostEyes(cx, cy);
        return;
    }

    ctx.fillStyle = ghostColor;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy - 2,
        16,
        Math.PI,
        0
    );

    ctx.lineTo(cx + 16, cy + 14);
    ctx.lineTo(cx + 10, cy + 9);
    ctx.lineTo(cx + 4, cy + 14);
    ctx.lineTo(cx - 2, cy + 9);
    ctx.lineTo(cx - 8, cy + 14);
    ctx.lineTo(cx - 16, cy + 9);

    ctx.closePath();

    ctx.fill();

    drawGhostEyes(cx, cy);
}


function drawGhostEyes(cx, cy) {

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        cx - 6,
        cy - 4,
        5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 6,
        cy - 4,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle = "#222";

    ctx.beginPath();

    ctx.arc(
        cx - 5,
        cy - 4,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 7,
        cy - 4,
        2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================
   UI
========================= */

function updateUI() {

    scoreElement.textContent =
        "SCORE: " + score;

    livesElement.textContent =
        "LIVES: " + lives;
}


function showMessage(text, duration) {

    message.textContent = text;
    message.style.display = "block";

    setTimeout(() => {

        if (!gameOver) {
            message.style.display = "none";
        }

    }, duration);
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(e) {

    if (
        e.key === "ArrowUp" ||
        e.key === "ArrowDown" ||
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ) {
        e.preventDefault();
    }


    if (e.key === "ArrowUp") {
        pacman.nextDirection = DIR.up;
    }

    if (e.key === "ArrowDown") {
        pacman.nextDirection = DIR.down;
    }

    if (e.key === "ArrowLeft") {
        pacman.nextDirection = DIR.left;
    }

    if (e.key === "ArrowRight") {
        pacman.nextDirection = DIR.right;
    }


    /*
    RRR shortcut.
    Pac-Man → Games home.
    */

    if (e.key.toLowerCase() === "r") {

        const now = Date.now();

        rCount++;

        clearTimeout(rTimer);

        rTimer = setTimeout(() => {
            rCount = 0;
        }, 700);

        if (rCount === 3) {

            rCount = 0;

            window.location.href =
                "index.html?games=true";
        }
    }
});


retryButton.addEventListener("click", function() {
    resetGame();
});


/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

    const delta = time - lastTime;

    lastTime = time;

    if (!gameOver) {

        pacMoveTimer += delta;
        ghostMoveTimer += delta;

        mouthTimer += delta;

        if (mouthTimer > 130) {
            mouthOpen = !mouthOpen;
            mouthTimer = 0;
        }


        if (pacMoveTimer >= 135) {

            movePacman();

            pacMoveTimer = 0;
        }


        const ghostSpeed =
            powerMode ? 235 : 190;

        if (ghostMoveTimer >= ghostSpeed) {

            moveGhosts();

            ghostMoveTimer = 0;
        }


        if (powerMode) {

            powerTimer -= delta;

            if (powerTimer <= 0) {

                powerMode = false;
                powerTimer = 0;
                ghostPoints = 200;
            }
        }
    }


    drawMaze();
    drawPellets();

    for (const ghost of ghosts) {
        drawGhost(ghost);
    }

    drawPacman();

    requestAnimationFrame(gameLoop);
}


resetGame();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
